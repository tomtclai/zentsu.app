{%- assign dial_guide_list = site.data.dial_guides[page.lang].links -%}
{%- if dial_guide_list.size > 0 %}
      <section class="dial-guide" aria-labelledby="guide-title">
        <div class="dial-wrap">
          <article class="dial-guide-card">
            <h2 id="guide-title">{{ site.data.i18n[page.lang].footer.learn | default: site.data.i18n.en.footer.learn }}</h2>
            <ul class="dial-guide-paper">
              {%- for guide in dial_guide_list %}
              <li><a href="{{ guide.url }}">{{ guide.title }}</a></li>
              {%- endfor %}
            </ul>
          </article>
        </div>
      </section>
{%- endif -%}
