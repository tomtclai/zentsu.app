            <article class="dial-grid-card dial-grid-card-paper">
              <span class="dial-pro-tag">Dial Pro</span>
              <div class="dial-grid-card-media dial-grid-card-media-navy">
                <figure class="dial-paper dial-paper-card">
                  {%- assign report_card_sizes = include.sizes | default: report_sizes -%}
                  {% include dial-shot.html image=copy.images.report sizes=report_card_sizes %}
                </figure>
              </div>
              <h3>
                {{ copy.report.card_title | default: site.data.dial.en.report.card_title }}
              </h3>
              <p>{{ copy.report.body | default: site.data.dial.en.report.body }}</p>
            </article>
