{%- if copy.boundary %}
      <section class="dial-boundary-section" aria-labelledby="boundary-title">
        <div class="dial-wrap">
          <p class="dial-kicker">{{ copy.boundary.kicker }}</p>
          <h2 id="boundary-title">{{ copy.boundary.heading }}</h2>
          <p>{{ copy.boundary.body }}</p>
        </div>
      </section>
{%- endif %}
