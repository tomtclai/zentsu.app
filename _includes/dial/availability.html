      <section class="dial-availability" aria-labelledby="availability-title">
        <div class="dial-wrap dial-availability-card">
          <div class="dial-availability-copy">
            <div class="dial-availability-brand">
              <picture class="dial-availability-icon">
                <source type="image/avif" srcset="/assets/dial-icon.avif" />
                <source type="image/webp" srcset="/assets/dial-icon.webp" />
                <img src="/assets/dial-icon@1x.png" width="128" height="128" alt="" loading="lazy" />
              </picture>
              <div>
                <p class="dial-kicker">{{ copy.availability.kicker }}</p>
                <h2 id="availability-title">{{ copy.availability.heading }}</h2>
              </div>
            </div>
            <p>{{ copy.availability.body }}</p>
            <a
              class="app-store-badge-link"
              href="{{ app_store_url_closer | strip }}"
              rel="noopener noreferrer"
              id="closer-primary-cta"
            >
              <img
                src="{{ app_store_badge }}"
                alt="{{ copy.app_store_badge_alt }}"
                width="{{ badge_dims.width }}"
                height="{{ badge_dims.height }}"
              />
            </a>
          </div>
        </div>
      </section>
