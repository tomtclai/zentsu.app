      <section class="dial-story dial-level" aria-labelledby="level-title">
        <div class="dial-wrap dial-story-grid">
          <div class="dial-story-copy">
            <p class="dial-kicker">{{ copy.level.kicker }}</p>
            <h2 id="level-title">{{ copy.level.heading }}</h2>
            <p>{{ copy.level.body }}</p>
            <div class="dial-boundary">
              <strong>{{ copy.level.boundary_lead }}</strong>
              {{ copy.level.boundary_body }}
            </div>
          </div>
          <div class="dial-product-stage dial-product-stage-blue">
            <figure class="dial-phone dial-phone-section">
              {% include dial-shot.html image=copy.images.level sizes=stage_sizes %}
            </figure>
          </div>
        </div>
      </section>
