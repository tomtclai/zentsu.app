    <meta name="apple-itunes-app" content="app-id=6789408903" />
    <meta name="theme-color" content="#fffaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dial",
        "description": "{{ copy.schema_description }}",
        "url": "{{ page.canonical }}",
        "inLanguage": "{{ page.lang }}",
        "operatingSystem": "iOS; watchOS",
        "applicationCategory": "HealthApplication",
        "featureList": [
          {{ copy.plans.free_features[0] | jsonify }},
          {{ copy.plans.pro_features[0] | jsonify }},
          {{ copy.plans.pro_features[2] | jsonify }}
        ],
        "image": "https://zentsu.app/assets/dial-icon@2x.png",
        "screenshot": [
          "https://zentsu.app/assets/{{ copy.images.today.base }}.png",
          "https://zentsu.app/assets/{{ copy.images.level.base }}.png",
          "https://zentsu.app/assets/{{ copy.images.report.base }}.png",
          "https://zentsu.app/assets/{{ copy.images.watch_glance.base }}.png"
        ],
        "downloadUrl": "{{ app_store_url }}",
        "installUrl": "{{ app_store_url }}",
        "sameAs": ["https://apps.apple.com/app/id6789408903"],
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "{{ prices.monthly }}",
          "highPrice": "{{ prices.lifetime }}",
          "priceCurrency": "{{ prices.currency }}",
          "offerCount": "3"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Zentsu LLC",
          "url": "https://zentsu.app/"
        }
      }
    </script>
