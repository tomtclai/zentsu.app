    <meta name="apple-itunes-app" content="app-id=6789408903" />
    <meta name="theme-color" content="#fffaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/assets/{{ copy.images.today.base }}-640.avif 640w, /assets/{{ copy.images.today.base }}.avif {{ copy.images.today.width }}w"
      imagesizes="{{ hero_sizes }}"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dial",
        "description": {{ copy.schema_description | jsonify | replace: "<", "\u003c" }},
        "url": {{ page.canonical | jsonify | replace: "<", "\u003c" }},
        "inLanguage": {{ page.lang | jsonify | replace: "<", "\u003c" }},
        "operatingSystem": "iOS; watchOS",
        "applicationCategory": "HealthApplication",
        "isAccessibleForFree": true,
        "featureList": [
          {{ copy.plans.free_features[0] | jsonify | replace: "<", "\u003c" }},
          {{ copy.plans.pro_features[0] | jsonify | replace: "<", "\u003c" }},
          {{ copy.plans.pro_features[2] | jsonify | replace: "<", "\u003c" }}
        ],
        "image": "https://zentsu.app/assets/dial-icon@2x.png",
        "screenshot": [
          {{ copy.images.today.base | prepend: "https://zentsu.app/assets/" | append: ".png" | jsonify | replace: "<", "\u003c" }},
          {{ copy.images.level.base | prepend: "https://zentsu.app/assets/" | append: ".png" | jsonify | replace: "<", "\u003c" }},
          {{ copy.images.report.base | prepend: "https://zentsu.app/assets/" | append: ".png" | jsonify | replace: "<", "\u003c" }},
          {{ copy.images.watch_glance.base | prepend: "https://zentsu.app/assets/" | append: ".png" | jsonify | replace: "<", "\u003c" }}
        ],
        "downloadUrl": {{ app_store_url | jsonify | replace: "<", "\u003c" }},
        "installUrl": {{ app_store_url | jsonify | replace: "<", "\u003c" }},
        "sameAs": ["https://apps.apple.com/app/id6789408903"],
        "offers": [
          {
            "@type": "Offer",
            "name": "Free download",
            "price": 0,
            "priceCurrency": {{ prices.currency | jsonify | replace: "<", "\u003c" }},
            "url": {{ app_store_url | jsonify | replace: "<", "\u003c" }}
          },
          {
            "@type": "Offer",
            "name": "Lifetime",
            "price": {{ prices.lifetime | jsonify | replace: "<", "\u003c" }},
            "priceCurrency": {{ prices.currency | jsonify | replace: "<", "\u003c" }},
            "url": {{ app_store_url | jsonify | replace: "<", "\u003c" }}
          },
          {
            "@type": "Offer",
            "name": "Annual",
            "price": {{ prices.annual | jsonify | replace: "<", "\u003c" }},
            "priceCurrency": {{ prices.currency | jsonify | replace: "<", "\u003c" }},
            "url": {{ app_store_url | jsonify | replace: "<", "\u003c" }}
          },
          {
            "@type": "Offer",
            "name": "Monthly",
            "price": {{ prices.monthly | jsonify | replace: "<", "\u003c" }},
            "priceCurrency": {{ prices.currency | jsonify | replace: "<", "\u003c" }},
            "url": {{ app_store_url | jsonify | replace: "<", "\u003c" }}
          }
        ]{%- if site.data.dial_rating and site.data.dial_rating.enabled -%},
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": {{ site.data.dial_rating.average | jsonify | replace: "<", "\u003c" }},
          "ratingCount": {{ site.data.dial_rating.count | jsonify | replace: "<", "\u003c" }}
        }{%- endif -%},
        "publisher": {
          "@type": "Organization",
          "name": "Zentsu LLC",
          "url": "https://zentsu.app/"
        }
      }
    </script>
