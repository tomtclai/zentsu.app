    {%- assign strings = site.data.i18n[page.lang] | default: site.data.i18n.en %}
    <script type="application/json" id="dial-price-data">
      {
        "lang": {{ page.lang | jsonify }},
        "defaultCurrency": {{ prices.currency | jsonify }},
        "defaultNote": {{ storefront.note | jsonify }},
        "overrideNote": {{ strings.price_shown_in | jsonify }},
        "prices": {{ site.data.dial_prices | jsonify }},
        "currencyPrices": {{ site.data.dial_currency_prices | jsonify }},
        "lifetimeChange": {% if site.data.dial_lifetime_change %}{
          "effectiveAt": {{ site.data.dial_lifetime_change.effective_at | jsonify }},
          "note": {{ site.data.dial_lifetime_change.notes[page.lang] | default: site.data.dial_lifetime_change.notes.en | jsonify }},
          "territories": {{ site.data.dial_lifetime_change.territories | jsonify }}
        }{% else %}null{% endif %}
      }
    </script>
    <script src="/dial-currency.js?v={{ site.time | date: '%s' }}"></script>
    <script src="/dial-sticky.js?v={{ site.time | date: '%s' }}" defer></script>
