  sv: /sv/dial/
  cs: /cs/dial/
  ca: /ca/dial/
  he: /he/dial/
  da: /da/dial/
  fi: /fi/dial/
  "no": /no/dial/
  hr: /hr/dial/
  sk: /sk/dial/

