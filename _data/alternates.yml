# Language picker and hreflang map. Order is total speakers, highest first
# (Ethnologue / common L1+L2 counts). Insert new locales by that rank, not
# at the top. `no` stays quoted so YAML does not read it as a boolean.

dial:
  en: /dial/
  zh: /zh/dial/
  hi: /hi/dial/
  es: /es/dial/
  ar: /ar/dial/
  fr: /fr/dial/
  pt: /pt/dial/
  ru: /ru/dial/
  id: /id/dial/
  de: /de/dial/
