  tr: /tr/dial/
  vi: /vi/dial/
  ko: /ko/dial/
  it: /it/dial/
  th: /th/dial/
  zh-hant: /zh-hant/dial/
  pl: /pl/dial/
  uk: /uk/dial/
  ms: /ms/dial/
  nl: /nl/dial/
  ro: /ro/dial/
  hu: /hu/dial/
