hero:
  availability: "Ara a l’App Store"
  headline_lead: "Un registre privat de cada dosi."
  headline_accent: ""
  category: "Dial és un registre de medicació GLP-1 per a iPhone i Apple Watch."
  detail: "Registra cada dosi amb l’hora i el lloc d’injecció, al telèfon o al canell. Dial Pro traça un nivell estimat entre dosis i prepara un PDF per a qui et prescriu. Els registres queden al dispositiu, o a la teva base de dades privada d’iCloud si l’actives."
  free_line: Descàrrega gratuïta, sense cap compte a crear. El registre de dosis no té límit.
  secondary_cta: "Mira com funciona Dial"
  qr_caption: "Escaneja per obrir Dial a l’App Store des del teu iPhone."
  platforms_label: "Plataformes i emmagatzematge de Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Centre de control i pantalla de bloqueig"
    - "Emmagatzematge privat opcional d’iCloud"
  legal: "Dial és un registre personal. No calcula dosis ni substitueix les indicacions de qui et prescriu. Dial Pro afegeix el gràfic de nivell estimat, l’historial complet, les exportacions i el registre ràpid que es descriuen més avall."

proof:
  label: "Per què Dial"
  points:
    - "Anell de cicle i proper recordatori a l’Apple Watch"
    - "S’obre sense cap compte Dial"
    - "Opció Lifetime, una sola compra"
    - "Nivell estimat entre dosis (Dial Pro)"

level:
  kicker: "Dial Pro · Nivell estimat"
  heading: "Mira un nivell estimat entre dosis, segons la semivida."
  body: "Dial traça un nivell estimat del medicament al llarg del temps a partir de les dosis registrades i de la semivida que mostra l’app. Canviï l’interval per revisar una setmana, un mes o sis mesos del seu historial."
  boundary_lead: "És una estimació, i ho deixem clar."
  boundary_body: "El gràfic modela una corba de disminució estàndard a partir de les dosis que ha registrat. Mostra els seus patrons entre dosis. No és un nivell mesurat a la sang ni un suggeriment del que cal prendre després. Dial no calcula dosis. L’app explica el mètode sencer."

logging:
  kicker: "Registre ràpid"
  heading: "Registra el medicament, la dosi i el lloc d’injecció en un sol formulari."
  body: "Anoti medicament, quantitat, data, hora, lloc d'injecció i notes. Els valors recents omplen l'entrada següent. Vostè confirma cada camp. Dial coneix semaglutida (Ozempic, Wegovy), tirzepatida (Mounjaro, Zepbound), liraglutida, dulaglutida i exenatida amb les marques i presentacions que s'utilitzen al seu país, i accepta un medicament personalitzat si la seva recepta no hi surt."
  checklist:
    - "Editi una entrada quan alguna cosa canvia"
    - "Anoti el lloc d’injecció a cada dosi"
    - "Mantingui les entrades de pes al costat de l’historial de dosis"

history:
  kicker: "Dial Pro · Historial i tendències"
  heading: "Gràfics de dosi, pes i efectes secundaris a partir de les seves entrades."
  body: "Les llistes de dosi, pes i efectes secundaris són de franc. Dial Pro afegeix els gràfics."
  history_card_title: "Historial de dosi i pes"
  history_card_note: "Revisi els canvis en l’interval que triï."
  side_effects_card_title: "Tendències d’efectes secundaris"
  side_effects_card_note: "Revisi la freqüència i la gravetat de l’historial existent o importat."

report:
  kicker: "Dial Pro · Informe PDF"
  heading: "Un PDF de les seves entrades per a la visita."
  card_title: "Informe PDF per a la visita"
  body: "Genera un PDF amb l’historial de dosis, els canvis de quantitat registrada, els llocs d’injecció, la tendència de pes i els patrons d’efectes secundaris. Dial el genera al dispositiu i el comparteixes només quan ho decideixes, per AirDrop, correu electrònic o impressió. El mateix historial s’exporta com a CSV."
  closing: "Queda privat la resta del temps. Només surt del telèfon quan ho necessita."
  smallprint: "L’informe resumeix les seves entrades. No és un historial clínic ni un pla de tractament."

watch:
  kicker: Apple Watch
  heading: "Registri la dosi des del canell."
  body: "L’app del rellotge mostra un anell de cicle que compta enrere fins a la propera dosi, i l’hora del proper recordatori. Amb Dial Pro pot registrar des d’aquesta pantalla. Ajusti la quantitat amb la Digital Crown, triï el lloc d’injecció i confirmi. L’entrada se sincronitza amb l’iPhone."
  checklist:
    - "Anell de cicle, estat de la dosi i proper recordatori d’un cop d’ull (gratuït)"
    - "Registri una dosi des del canell amb la Digital Crown (Dial Pro)"
    - "Ginys de nivell estimat i propera dosi a l’esfera, i registre ràpid a la Pila intel·ligent (Dial Pro)"
    - "A l’iPhone, Pro permet el registre amb un toc des del Centre de control, el botó d’acció, Siri o una Live Activity el dia del recordatori. Les accions gratuïtes obren el formulari."

supporting:
  kicker: "Tot al registre"
  heading: "Historial, informe, inventari, recordatoris i importacions, en un sol lloc."
  features:
    - title: "Inventari"
      body: "Faci el seguiment de plomes o vials amb concentració, farmàcia, data de caducitat i número de lot."
    - title: "Els seus recordatoris"
      body: "Creï notificacions diàries, setmanals o cada N dies amb l’horari que defineixi. El dia de la dosi, una acció de registre apareix a la notificació, i una Live Activity pot quedar a la pantalla de bloqueig fins que registri."
    - title: "Importi les entrades existents"
      body: "Obri amb Dial una exportació compatible d’un altre diari de medicació per importar-ne les entrades."

plans:
  kicker: "Gratuït i Dial Pro"
  heading: "Fes servir el registre bàsic de franc."
  body: "Dial Pro afegeix el gràfic de nivell estimat, els gràfics de l’historial, les exportacions i el registre ràpid a l’Apple Watch i a l’iPhone. Cada pla Dial Pro inclou les mateixes funcions."
  free_name: "Gratuït"
  free_summary: "De franc per a un medicament actiu, sense límit al registre de dosis."
  free_features:
    - "Registri dosis, llocs d’injecció, pes, efectes secundaris i fotos de progrés"
    - "Un medicament actiu i un recordatori"
    - "Llistes de dosi i pes, inventari, importació i la ullada a l’Apple Watch"
    - "Ginys de compte enrere i recordatoris que obren el formulari"
  pro_name: Dial Pro
  pro_summary: "Mira el nivell entre dosis, tot l’historial en gràfics i registra des del canell."
  cta_caption: "Baixa-la de franc i tria un pla dins de l’app."
  pro_features:
    - "Gràfic de nivell estimat i giny a la pantalla d’inici"
    - "Gràfics complets de dosi i pes, tendències d’efectes secundaris i comparació de fotos"
    - "Informe PDF, exportació CSV, diversos medicaments i diversos recordatoris"
    - "Registre ràpid i complicacions a l’Apple Watch, i registre amb un toc a l’iPhone"
  options_label: "Opcions del pla Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "un cop"
  annual_name: "Anual"
  annual_terms: "per any"
  monthly_name: "Mensual"
  monthly_terms: "per mes"

privacy:
  kicker: "Privadesa"
  heading: "Els registres queden al dispositiu."
  specs:
    - term: "Comptes"
      detail: "No cal cap compte Dial per començar a registrar."
    - term: "Anàlisi d’ús"
      detail: "Dial no recull anàlisi d’ús ni telemetria."
    - term: "Els nostres servidors"
      detail: "Zentsu no opera cap servidor que emmagatzemi o llegeixi els seus registres."
    - term: "Sincronització opcional"
      detail: "Amb iCloud activat, els registres principals fan servir la base CloudKit privada del teu compte d’Apple, no els nostres servidors."
  body: "Els registres principals queden al dispositiu. Les entrades de pes i les fotos de progrés fan servir un magatzem local a part."
  policy_link: "Llegeixi la política de privadesa de Dial"
  policy_url: /ca/dial/privacy/

availability:
  kicker: "Baixi Dial"
  heading: "Ara a l’App Store."
  body: "Dial es pot baixar de franc, sense cap compte a crear. Dial Pro afegeix el gràfic de nivell estimat, els gràfics de l’historial, l’exportació PDF i CSV, i el registre ràpid des de l’Apple Watch i l’iPhone."

trademarks: "Ozempic, Wegovy, Mounjaro, and Zepbound are trademarks of their respective owners. Zentsu is not affiliated with any pharmaceutical company."
