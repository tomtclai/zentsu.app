hero:
  availability: "Sekarang di App Store"
  headline_lead: "Catatan pribadi setiap dosis."
  headline_accent: ""
  category: "Dial adalah pelacak obat GLP-1 untuk iPhone dan Apple Watch."
  quick_answer: "Dial mencatat suntikan dan tablet GLP-1, termasuk Ozempic, Wegovy, Rybelsus, Mounjaro, dan Zepbound, serta semaglutide atau tirzepatide racikan dari resep. Setiap entri menyimpan dosis, waktu, lokasi suntikan, berat, dan efek samping. Pencatatan di ponsel gratis tanpa perlu akun. Dial Pro menambah grafik tingkat perkiraan, pencatatan dari Apple Watch, dan ekspor PDF atau CSV."
  detail: "Catat setiap dosis beserta waktu dan lokasi suntikan, di ponsel atau di pergelangan. Dial Pro menampilkan tingkat perkiraan antar dosis dan menyusun PDF untuk dokter Anda. Catatan tetap di perangkat, atau di basis data iCloud pribadi Anda jika opsi itu dinyalakan."
  free_line: Unduh gratis, tanpa perlu membuat akun. Catatan dosis tidak dibatasi.
  secondary_cta: "Cara kerja Dial"
  qr_caption: "Pindai untuk membuka Dial di App Store di iPhone Anda."
  platforms_label: "Platform dan penyimpanan Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Pusat Kontrol, dan Layar Terkunci"
    - "Penyimpanan iCloud pribadi opsional"
  legal: "Catatan pribadi, bukan nasihat medis. Dial Pro menambah pencatatan dari Watch, grafik, dan ekspor."

proof:
  label: "Mengapa Dial"
  points:
    - "Cincin siklus dan pengingat berikutnya di Apple Watch"
    - "Buka tanpa akun Dial"
    - "Opsi Lifetime, sekali beli"
    - "Tingkat perkiraan antar dosis (Dial Pro)"

level:
  kicker: "Dial Pro · Tingkat perkiraan"
  heading: "Lihat tingkat perkiraan antar dosis, berdasarkan waktu paruh."
  body: "Dial menampilkan tingkat perkiraan dari dosis tercatat dan waktu paruh di aplikasi, untuk obat suntik yang didukung seperti Ozempic, Wegovy, Mounjaro, dan Zepbound. Tablet seperti Rybelsus tidak punya grafik tingkat: penyerapan oral terlalu berbeda antarorang. Tinjau riwayat suntikan satu minggu, satu bulan, atau enam bulan."
  boundary_lead: "Ini perkiraan. Kami sampaikan itu."
  boundary_body: "Grafik memodelkan kurva peluruhan standar dari dosis semaglutide atau tirzepatide yang Anda catat. Yang tampil adalah pola Anda sendiri antar dosis. Ini perkiraan, bukan kadar darah terukur. Aplikasi menjelaskan metodenya secara lengkap."

boundary:
  kicker: "Yang tidak dilakukan Dial"
  heading: "Dial menyimpan catatannya. Dosis ditentukan dokter Anda."
  body: "Dial tidak menghitung dosis, tidak menyarankan perubahan dosis, dan tidak mengatakan apa yang harus dilakukan setelah dosis terlewat. Tingkat perkiraan adalah estimasi dari model populasi berdasarkan dosis yang Anda catat, bukan pengukuran. Konverter satuan untuk vial racikan hanya melakukan perhitungan aritmetika atas mg dan mg/mL yang Anda masukkan dan tidak menyarankan jumlah apa pun. Tanyakan keputusan soal obat kepada dokter atau apoteker Anda."

logging:
  kicker: "Pencatatan cepat"
  heading: "Catat obat, dosis, dan lokasi suntikan dalam satu formulir."
  body: "Catat obat, jumlah, tanggal, waktu, dan catatan. Suntikan seperti Ozempic, Wegovy, Mounjaro, dan Zepbound menyertakan lokasi. Tablet seperti Rybelsus dicatat tanpa lokasi. Dial mencantumkan semaglutide, tirzepatide, orforglipron, liraglutide, dulaglutide, dan exenatide dengan nama merek di wilayah Anda, plus semaglutide atau tirzepatide racikan dari resep dalam vial. Tambahkan obat kustom jika milik Anda hilang."
  checklist:
    - "Sunting entri ketika sesuatu berubah"
    - "Simpan lokasi suntikan di setiap dosis"
    - "Simpan entri berat di samping garis waktu dosis"

history:
  kicker: "Dial Pro · Riwayat dan tren"
  heading: "Grafik dosis, berat, dan efek samping dari entri Anda."
  body: "Daftar dosis, berat, dan efek samping tetap gratis. Dial Pro menambah grafiknya."
  history_card_title: "Riwayat dosis dan berat"
  history_card_note: "Tinjau perubahan pada rentang yang Anda pilih."
  side_effects_card_title: "Tren efek samping"
  side_effects_card_note: "Tinjau frekuensi dan keparahan dari riwayat yang ada atau diimpor."

report:
  kicker: "Dial Pro · Laporan PDF"
  heading: "PDF dari entri Anda untuk kunjungan dokter."
  card_title: "Laporan PDF untuk kunjungan klinik"
  body: "Buat PDF berisi riwayat dosis, perubahan jumlah tercatat, lokasi suntikan, tren berat, dan pola efek samping. Dial menyusunnya di perangkat. Anda membagikannya hanya ketika memutuskan, lewat AirDrop, email, atau cetak. Riwayat yang sama juga diekspor sebagai CSV."
  closing: "Selebihnya tetap pribadi. Berguna saat catatan perlu dibagikan dari ponsel."
  smallprint: "Laporan merangkum entri Anda. Bukan rekam medis atau rencana pengobatan."

watch:
  kicker: Apple Watch
  heading: "Catat dosis dari pergelangan tangan."
  body: "Aplikasi jam menampilkan cincin siklus yang menghitung mundur ke dosis berikutnya, dan kapan pengingat berikutnya muncul. Dial Pro mencatat dari layar itu. Atur jumlah dengan Digital Crown, pilih lokasi suntikan, lalu konfirmasi. Entri tersinkron ke iPhone."
  checklist:
    - "Cincin siklus, status dosis, dan pengingat berikutnya sekilas (gratis)"
    - "Catat dosis dari pergelangan tangan dengan Digital Crown (Dial Pro)"
    - "Widget tingkat perkiraan dan dosis berikutnya di muka jam, serta pencatatan cepat di Smart Stack (Dial Pro)"
    - "Di iPhone, Pro mengaktifkan pencatatan satu ketuk dari Pusat Kontrol, tombol aksi, Siri, atau Live Activity pada hari pengingat. Tindakan gratis membuka formulir."

supporting:
  kicker: "Semua dalam catatan"
  heading: "Riwayat, laporan, stok, pengingat, dan impor di satu tempat."
  features:
    - title: "Stok"
      body: "Lacak pena atau vial dengan konsentrasi, apotek, tanggal kedaluwarsa, dan nomor lot."
    - title: "Pengingat Anda"
      body: "Buat notifikasi harian, mingguan, atau setiap N hari di sekitar jadwal yang Anda tetapkan. Pada hari dosis, tindakan catat ada di notifikasi, dan Live Activity dapat tetap di Layar Terkunci sampai Anda mencatat."
    - title: "Impor entri yang ada"
      body: "Impor berkas ekspor dari buku harian obat yang kompatibel dengan Dial untuk memasukkan entri yang sudah ada."

plans:
  kicker: "Gratis dan Dial Pro"
  heading: "Pakai pelacak inti secara gratis."
  body: "Dial Pro menambah grafik tingkat perkiraan, grafik riwayat lengkap, ekspor, dan pencatatan cepat di Apple Watch dan iPhone. Setiap paket Dial Pro mencakup fitur yang sama."
  free_name: "Gratis"
  free_summary: "Gratis untuk satu obat aktif, catatan dosis tidak dibatasi."
  free_features:
    - "Catat dosis, lokasi suntikan, berat, efek samping, dan foto perkembangan"
    - "Satu obat aktif dan satu pengingat"
    - "Daftar dosis dan berat, persediaan, impor, dan tinjauan Apple Watch"
    - "Widget hitung mundur dan pengingat yang membuka formulir"
  pro_name: Dial Pro
  pro_summary: "Lihat tingkat antar dosis, lihat riwayat lengkap dalam grafik, dan catat dari pergelangan."
  cta_caption: "Unduh gratis, lalu pilih paket di dalam aplikasi."
  pro_features:
    - "Grafik tingkat perkiraan dan widget Layar Utama"
    - "Grafik dosis dan berat lengkap, tren efek samping, dan perbandingan foto"
    - "Laporan PDF, ekspor CSV, beberapa obat, dan beberapa pengingat"
    - "Pencatatan cepat dan komplikasi di Apple Watch, serta pencatatan satu ketuk di iPhone"
  options_label: "Pilihan paket Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "sekali"
  annual_name: "Tahunan"
  annual_terms: "per tahun"
  monthly_name: "Bulanan"
  monthly_terms: "per bulan"

privacy:
  kicker: "Privasi"
  heading: "Catatan tetap di perangkat Anda."
  specs:
    - term: "Akun"
      detail: "Tidak perlu akun Dial untuk mulai mencatat."
    - term: "Analitik penggunaan"
      detail: "Dial tidak mengumpulkan analitik penggunaan atau telemetri."
    - term: "Server kami"
      detail: "Zentsu tidak mengoperasikan server yang menyimpan atau membaca catatan Anda."
    - term: "Sinkronisasi opsional"
      detail: "Dengan iCloud menyala, catatan inti memakai basis data CloudKit pribadi pada Akun Apple Anda, bukan server kami."
  body: "Catatan obat, dosis, pengingat, dan stok dapat disinkronkan lewat iCloud Anda sendiri jika diaktifkan. Berat tetap di penyimpanan lokal terpisah, dengan integrasi Apple Health opsional. Berkas foto perkembangan tetap di perangkat."
  policy_link: "Baca kebijakan privasi Dial"
  policy_url: /id/dial/privacy/

availability:
  kicker: "Unduh Dial"
  heading: "Sekarang di App Store."
  body: "Dial gratis diunduh, tanpa perlu membuat akun. Dial Pro menambah grafik tingkat perkiraan, grafik riwayat lengkap, ekspor PDF dan CSV, dan pencatatan cepat dari Apple Watch dan iPhone."

