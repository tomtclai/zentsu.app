hero:
  availability: "Sekarang di App Store"
  headline_lead: "Catat dosis GLP-1."
  headline_accent: ""
  category: "Dial adalah buku harian obat GLP-1 pribadi untuk iPhone dan Apple Watch."
  detail: "Catat dosis di iPhone atau Apple Watch. Dial menampilkan tingkat perkiraan dari entri itu. Catatan inti tetap di perangkat, atau di basis data iCloud pribadi Anda jika opsi itu dinyalakan."
  secondary_cta: "Cara kerja Dial"
  platforms_label: "Platform dan penyimpanan Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Pusat Kontrol, dan Layar Terkunci"
    - "Penyimpanan iCloud pribadi opsional"
  legal: "Buku harian inti gratis. Dial Pro menambah grafik, ekspor, lebih banyak obat dan pengingat, serta pencatatan satu ketuk di perangkat Apple. Dial adalah catatan pribadi. Dial tidak menghitung dosis dan tidak menggantikan nasihat dokter."

proof:
  label: "Mengapa Dial"
  points:
    - "iPhone dan Apple Watch"
    - "Tidak perlu akun Dial"
    - "Opsi Lifetime"
    - "Tingkat perkiraan dari dosis Anda"

level:
  kicker: "Dial Pro · Tingkat perkiraan"
  heading: "Grafik memakai dosis yang sudah Anda catat."
  body: "Dial menampilkan tingkat obat perkiraan seiring waktu dari dosis tercatat dan waktu paruh yang tertera di aplikasi. Ubah rentang untuk melihat riwayat Anda selama seminggu, sebulan, atau enam bulan."
  boundary_lead: "Ini perkiraan. Kami sampaikan itu."
  boundary_body: "Grafik memodelkan kurva peluruhan standar dari dosis yang Anda catat. Yang tampil adalah pola Anda sendiri antar dosis. Ini perkiraan, bukan kadar darah terukur, dan bukan saran dosis berikutnya. Dial tidak menghitung dosis. Aplikasi menjelaskan metodenya secara lengkap."

logging:
  kicker: "Pencatatan cepat"
  heading: "Obat, jumlah, lokasi, dan catatan dalam satu formulir."
  body: "Tuliskan obat, jumlah, tanggal, waktu, lokasi suntikan, dan catatan. Nilai terbaru mengisi entri berikutnya. Setiap bidang tetap Anda konfirmasi. Dial bekerja dengan Ozempic, Wegovy, Mounjaro, dan Zepbound."
  checklist:
    - "Sunting entri ketika sesuatu berubah"
    - "Simpan lokasi suntikan di setiap dosis"
    - "Simpan entri berat di samping garis waktu dosis"

history:
  kicker: "Dial Pro · Riwayat dan tren"
  heading: "Grafik dosis, berat, dan efek samping dari entri Anda."
  body: "Daftar dosis, berat, dan efek samping tetap gratis. Dial Pro menambah grafik dosis dan berat lengkap serta tren dari entri efek samping yang sudah ada di catatan."
  history_card_title: "Riwayat dosis dan berat"
  history_card_note: "Tinjau perubahan pada rentang yang Anda pilih."
  side_effects_card_title: "Tren efek samping"
  side_effects_card_note: "Tinjau frekuensi dan keparahan dari riwayat yang ada atau diimpor."

report:
  kicker: "Dial Pro · Laporan PDF"
  heading: "PDF dari entri Anda untuk kunjungan dokter."
  body: "Buat PDF berisi riwayat dosis, perubahan jumlah tercatat, lokasi suntikan, tren berat, dan pola efek samping. Dial menyusunnya di perangkat. Anda membagikannya hanya ketika memutuskan, lewat AirDrop, email, atau cetak."
  closing: "Selebihnya tetap pribadi. Berguna saat catatan perlu dibagikan dari ponsel."
  smallprint: "Laporan merangkum entri Anda. Bukan rekam medis atau rencana pengobatan."

watch:
  kicker: Apple Watch
  heading: "Catat dosis dari pergelangan tangan."
  body: "Aplikasi jam menampilkan cincin siklus yang menghitung mundur ke dosis berikutnya, dan kapan pengingat berikutnya muncul. Dial Pro mencatat dari layar itu. Atur jumlah dengan Digital Crown, pilih lokasi suntikan, lalu konfirmasi. Entri tersinkron ke iPhone."
  checklist:
    - "Cincin siklus, status dosis, dan pengingat berikutnya sekilas (gratis)"
    - "Catat dosis dari pergelangan tangan dengan Digital Crown (Dial Pro)"
    - "Widget tingkat perkiraan dan dosis berikutnya di muka jam, serta pencatatan cepat di Smart Stack (Dial Pro)"
    - "Di iPhone, Pro mengaktifkan pencatatan satu ketuk dari Pusat Kontrol, tombol aksi, Siri, atau Live Activity pada hari pengingat. Tindakan gratis membuka formulir."

supporting:
  kicker: "Ikut jadwal Anda"
  heading: "Stok, pengingat, dan impor ada di catatan yang sama."
  features:
    - title: "Stok"
      body: "Lacak pena atau vial dengan konsentrasi, apotek, tanggal kedaluwarsa, dan nomor lot."
    - title: "Pengingat Anda"
      body: "Buat notifikasi harian, mingguan, atau setiap N hari di sekitar jadwal yang Anda tetapkan. Pada hari dosis, tindakan catat ada di notifikasi, dan Live Activity dapat tetap di Layar Terkunci sampai Anda mencatat."
    - title: "Impor entri yang ada"
      body: "Impor berkas ekspor dari buku harian obat yang kompatibel dengan Dial untuk memasukkan entri yang sudah ada."

plans:
  kicker: "Gratis dan Dial Pro"
  heading: "Gunakan buku harian inti secara gratis."
  body: "Pilih Pro untuk grafik tingkat perkiraan, ekspor, atau pencatatan satu ketuk di Apple Watch dan iPhone. Setiap paket Dial Pro mencakup fitur yang sama."
  free_name: "Gratis"
  free_summary: "Catatan lengkap untuk satu obat aktif."
  free_features:
    - "Catat dosis, lokasi suntikan, berat, efek samping, dan foto perkembangan"
    - "Satu obat aktif dan satu pengingat"
    - "Daftar dosis dan berat, persediaan, impor, dan tinjauan Apple Watch"
    - "Widget hitung mundur dan pengingat yang membuka formulir"
  pro_name: Dial Pro
  pro_summary: "Tingkat perkiraan, grafik lengkap, ekspor, dan pencatatan satu ketuk."
  pro_features:
    - "Grafik tingkat perkiraan dan widget Layar Utama"
    - "Grafik dosis dan berat lengkap, tren efek samping, dan perbandingan foto"
    - "Laporan PDF, ekspor CSV, beberapa obat, dan beberapa pengingat"
    - "Pencatatan cepat dan komplikasi di Apple Watch, serta pencatatan satu ketuk di iPhone"
  options_label: "Pilihan paket Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "sekali"
  annual_name: "Tahunan"
  annual_terms: "per tahun"
  monthly_name: "Bulanan"
  monthly_terms: "per bulan"

privacy:
  kicker: "Privasi"
  heading: "Catatan tetap di perangkat Anda."
  specs:
    - term: "Akun"
      detail: "Tidak ada akun Dial. Buka aplikasi dan mulai mencatat."
    - term: "Analitik penggunaan"
      detail: "Dial tidak menjalankan analitik penggunaan atau telemetri. Kami tidak mengukur cara Anda menggunakannya."
    - term: "Server kami"
      detail: "Zentsu tidak mengoperasikan server yang menyimpan atau membaca catatan Anda."
    - term: "Sinkronisasi opsional"
      detail: "Nyalakan iCloud di aplikasi, lalu catatan disinkronkan lewat basis data CloudKit pribadi pada Akun Apple Anda sendiri, bukan kepada kami."
  body: "Catatan obat, dosis, pengingat, dan persediaan tetap di perangkat. Entri berat memakai penyimpanan lokal terpisah, dan akses ke Kesehatan bersifat opsional serta hanya mencakup berat tubuh ketika Anda memberi izin."
  policy_link: "Baca kebijakan privasi Dial"
  policy_url: /id/dial/privacy/

availability:
  kicker: "Unduh Dial"
  heading: "Sekarang di App Store."
  body: "Dial gratis diunduh. Buku harian inti bekerja dari catatan pertama. Dial Pro menambah grafik tingkat perkiraan, grafik lengkap, ekspor PDF, dan pencatatan cepat dari Apple Watch dan iPhone."
