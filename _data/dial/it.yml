hero:
  availability: Disponibile ora sull'App Store
  headline_lead: "Le dosi annotate."
  headline_accent: ""
  category: Dial è un registro privato di farmaci GLP-1 per iPhone e Apple Watch.
  detail:
    Registri una dose su iPhone o Apple Watch. Dial traccia un livello stimato da
    quelle voci. I dati principali restano sul dispositivo o nel suo iCloud privato.
  secondary_cta: Scopra come funziona Dial
  platforms_label: Piattaforme e archiviazione Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Centro di Controllo e schermata di blocco
    - Archiviazione iCloud privata facoltativa
  legal:
    Il registro di base è gratuito. Dial Pro aggiunge grafici, esportazioni, altri farmaci
    e altri promemoria, e la registrazione con un tocco sui dispositivi Apple. Dial è un registro
    personale. Non calcola le dosi e non sostituisce le indicazioni di chi prescrive.

proof:
  label: Perché Dial
  points:
    - iPhone e Apple Watch
    - Si apre senza un account Dial
    - Acquisto a vita
    - Livello modellato dalle sue dosi

level:
  kicker: Dial Pro · Livello stimato
  heading: Il grafico usa le dosi che ha già registrato.
  body:
    Dial traccia un livello stimato del farmaco nel tempo dalle dosi registrate e dal
    valore di emivita mostrato nell'app. Cambi l'intervallo per rivedere una settimana,
    un mese o sei mesi della sua cronologia.
  boundary_lead: È una stima. Lo diciamo chiaro.
  boundary_body:
    Il grafico modella una curva di decadimento standard dalle dosi che ha registrato.
    Serve a notare i suoi andamenti tra una dose e l'altra, non a sostituire un livello
    ematico misurato né a suggerire cosa assumere dopo. Dial non calcola le dosi. L'app
    spiega il metodo per intero.

logging:
  kicker: Registrazione rapida
  heading: Farmaco, quantità, sito di iniezione e note nello stesso modulo.
  body:
    Annoti farmaco, quantità, data, ora, sito di iniezione e note. I valori recenti
    precompilano la voce successiva. Confermi comunque ogni campo. Dial funziona con
    Ozempic, Wegovy, Mounjaro o Zepbound.
  checklist:
    - Modifichi una voce quando qualcosa cambia
    - Tenga i siti di iniezione collegati a ogni dose
    - Tenga le voci di peso accanto alla linea temporale delle dosi

history:
  kicker: Dial Pro · Cronologia e tendenze
  heading: Grafici di dosi, peso ed effetti collaterali.
  body:
    Le liste di dosi, peso ed effetti collaterali restano gratuite. Dial Pro aggiunge
    i grafici completi di dosi e peso, più le tendenze dagli effetti collaterali già
    nel registro.
  history_card_title: Cronologia di dosi e peso
  history_card_note: Riveda i cambiamenti nell'intervallo che sceglie.
  side_effects_card_title: Tendenze degli effetti collaterali
  side_effects_card_note: Riveda frequenza e gravità dalla cronologia esistente o importata.

report:
  kicker: Dial Pro · Riepilogo PDF
  heading: Un PDF delle sue voci per la visita.
  body:
    Generi un PDF con cronologia delle dosi, variazioni della quantità registrata, siti
    di iniezione, andamento del peso e andamenti degli effetti collaterali. Dial lo crea sul
    dispositivo. Lo condivida solo se lo decide, via AirDrop, e-mail o stampa.
  closing:
    Resta privato. Le serve quando il registro deve uscire dal telefono.
  smallprint: Il riepilogo riassume le sue voci. Non è una cartella clinica né un piano di trattamento.

watch:
  kicker: Apple Watch
  heading: Registri la dose dal polso.
  body: >-
    L'app Apple Watch mostra un anello di ciclo con i giorni alla prossima dose e
    l'orario del prossimo promemoria. Dial Pro registra da quella schermata. Imposti la
    quantità con la Digital Crown, scelga un sito di iniezione e confermi. La voce si
    sincronizza con l'iPhone.
  checklist:
    - Anello di ciclo, stato della dose e prossimo promemoria a colpo d'occhio (gratis)
    - Registri una dose dal polso con la Digital Crown (Dial Pro)
    - Widget di livello stimato e di prossima dose sul quadrante, più registrazione
      rapida nello Smart Stack (Dial Pro)
    - Su iPhone, Pro abilita la registrazione con un tocco da Centro di Controllo,
      pulsante Azione, Siri o una Live Activity nel giorno del promemoria. Le
      azioni gratuite aprono il modulo.

supporting:
  kicker: Nella routine
  heading: Scorte, promemoria e importazione nello stesso registro.
  features:
    - title: Inventario delle scorte
      body: Tenga penne o flaconi con concentrazione, farmacia, data di scadenza e numero di lotto.
    - title: I suoi promemoria
      body:
        Crei notifiche giornaliere, settimanali o ogni N giorni secondo l'orario che
        imposta. Nel giorno della dose, la notifica include l'azione Registra dose, e
        una Live Activity può restare sulla schermata di blocco fino alla
        registrazione.
    - title: Importi le voci esistenti
      body: Importi in Dial un registro di farmaci in formato compatibile per recuperare le voci già esistenti.

plans:
  kicker: Gratis e Dial Pro
  heading: Usi il registro di base gratis.
  body:
    Passi a Pro per il grafico del livello stimato, le esportazioni o la registrazione
    con un tocco su Apple Watch e iPhone. Ogni piano Dial Pro include le stesse funzioni.
  free_name: Gratis
  free_summary: Un registro completo per un farmaco attivo.
  free_features:
    - Registri dosi, siti di iniezione, peso, effetti collaterali e foto dei progressi
    - Un farmaco attivo e un promemoria
    - Elenchi di dosi e peso, inventario, importazioni e il colpo d'occhio su Apple Watch
    - Widget conto alla rovescia e promemoria che aprono il modulo
  pro_name: Dial Pro
  pro_summary: Il livello stimato, i grafici completi, le esportazioni e la registrazione rapida.
  pro_features:
    - Grafico del livello stimato e widget di livello sulla schermata Home
    - Grafici completi di dosi e peso, tendenze degli effetti collaterali e confronto foto
    - Riepilogo PDF, esportazione CSV, più farmaci e più promemoria
    - Registrazione rapida e complicazioni Apple Watch, più registrazione con un tocco su iPhone
  options_label: Scelte del piano Dial Pro
  lifetime_name: A vita
  lifetime_terms: una tantum
  annual_name: Annuale
  annual_terms: all'anno
  monthly_name: Mensile
  monthly_terms: al mese

privacy:
  kicker: Privacy
  heading: I dati restano sul dispositivo.
  specs:
    - term: Account
      detail: Non esiste un account Dial. Apra l'app e inizi a registrare.
    - term: Analisi
      detail: Dial non esegue analisi d'uso né telemetria. Non misuriamo nulla su come la usa.
    - term: I nostri server
      detail: Zentsu non gestisce alcun server che memorizza o legge i suoi dati.
    - term: Sincronizzazione facoltativa
      detail:
        Attivi iCloud nell'app e i dati si sincronizzano tramite il database CloudKit
        privato del suo Account Apple, non verso di noi.
  body:
    Farmaco, dose, promemoria e scorte restano sul dispositivo. Le voci di peso usano
    un archivio locale separato, e l'accesso a Salute è facoltativo, limitato al peso
    corporeo quando concede il permesso.
  policy_link: Legga l'informativa sulla privacy di Dial
  policy_url: /it/dial/privacy/

availability:
  kicker: Scarichi Dial
  heading: Disponibile ora sull'App Store.
  body:
    Dial si scarica gratis. Il registro di base funziona già dalla prima voce. Dial Pro
    aggiunge il grafico del livello stimato, i grafici completi, l'esportazione PDF e la
    registrazione rapida da Apple Watch e iPhone.
