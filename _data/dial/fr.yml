hero:
  availability: Disponible dès maintenant sur l'App Store
  headline_lead: "Le journal de vos GLP-1."
  headline_accent: ""
  category: Dial est un suivi privé de médicaments GLP-1 pour iPhone et Apple Watch.
  detail:
    Notez une dose sur iPhone ou Apple Watch. Dial en déduit un niveau estimé.
    Vos données restent sur l'appareil ou dans votre
    iCloud, si vous l'activez.
  free_line: Téléchargement gratuit. Le carnet d'injections n'a pas de limite.
  secondary_cta: Voir comment Dial fonctionne
  platforms_label: Plateformes et stockage Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Centre de contrôle et écran de verrouillage
    - Stockage iCloud privé facultatif
  legal:
    Dial Pro ajoute les graphiques, les exports, plusieurs médicaments et rappels, et
    l'enregistrement en un geste sur les appareils Apple. Dial est un dossier personnel.
    Il ne calcule pas les doses et ne remplace pas les indications de votre prescripteur.

proof:
  label: Pourquoi Dial
  points:
    - iPhone et Apple Watch
    - L'app s'ouvre sans compte Dial
    - Achat à vie
    - Niveau modélisé à partir de vos doses

level:
  kicker: Dial Pro · Niveau estimé
  heading: Le graphique utilise les doses déjà notées.
  body:
    Dial représente un niveau estimé du médicament dans le temps, à partir des doses enregistrées
    et de la demi-vie affichée dans l'app. Changez la plage pour revoir une semaine, un
    mois ou six mois de votre propre historique.
  boundary_lead: C'est une estimation, et nous le disons clairement.
  boundary_body:
    Le graphique modélise une courbe de décroissance standard à partir des doses que vous
    avez enregistrées. Il sert à repérer vos propres habitudes entre les doses, pas à
    remplacer un taux sanguin mesuré ni à suggérer la prochaine prise. Dial ne calcule
    pas les doses. L'app explique toute la méthode.

logging:
  kicker: Enregistrement rapide
  heading: Médicament, quantité, site d'injection et notes.
  body:
    Notez le médicament, la quantité, la date, l'heure, le site d'injection et les
    notes. Les valeurs récentes préremplissent l'entrée suivante. Vous confirmez
    chaque champ. Dial connaît le sémaglutide (Ozempic, Wegovy, Rybelsus), le
    tirzépatide (Mounjaro), le liraglutide (Saxenda, Victoza), le dulaglutide
    (Trulicity) et l'exénatide sous les noms de marque et de boîte utilisés en
    France, et accepte un médicament personnalisé si le vôtre n'y figure pas.
  checklist:
    - Modifier une entrée quand quelque chose change
    - Garder le site d'injection associé à chaque dose
    - Garder les entrées de poids à côté de l'historique des doses

history:
  kicker: Dial Pro · Historique et tendances
  heading: Graphiques de doses, de poids et d'effets indésirables.
  body:
    Les listes de doses, de poids et d'effets indésirables restent gratuites. Dial Pro
    ajoute les graphiques complets de doses et de poids, plus les tendances des effets
    indésirables déjà présents dans votre dossier.
  history_card_title: Historique des doses et du poids
  history_card_note: Revoir les changements sur la plage que vous choisissez.
  side_effects_card_title: Tendances des effets indésirables
  side_effects_card_note: Revoir la fréquence et l'intensité à partir de l'historique existant ou importé.

report:
  kicker: Dial Pro · Rapport PDF
  heading: Un PDF pour la consultation.
  body:
    Générez un PDF avec l'historique des doses, les changements de quantité enregistrée,
    les sites d'injection, la tendance du poids et les tendances des effets indésirables. Dial
    le construit sur l'appareil, et vous le partagez seulement si vous le décidez, par
    AirDrop, e-mail ou impression.
  closing:
    Privé au quotidien. Utile le jour où votre dossier doit quitter le téléphone.
  smallprint: Le rapport résume vos entrées. Ce n'est pas un dossier médical ni un plan de traitement.

watch:
  kicker: Apple Watch
  heading: Enregistrer la dose depuis le poignet.
  body: >-
    L'app Apple Watch montre un anneau de cycle qui fait le compte à rebours jusqu'à la
    prochaine dose, et l'heure du prochain rappel. Dial Pro enregistre depuis cet écran. Réglez la
    quantité avec la Digital Crown, choisissez un site d'injection, confirmez. L'entrée
    se synchronise avec l'iPhone.
  checklist:
    - Anneau de cycle, état de la dose et prochain rappel d'un coup d'œil (gratuit)
    - Enregistrer une dose depuis le poignet avec la Digital Crown (Dial Pro)
    - Widgets de niveau estimé et de prochaine dose sur le cadran, plus enregistrement
      rapide dans la pile intelligente (Dial Pro)
    - Sur iPhone, Pro active l'enregistrement en un geste depuis le Centre de contrôle,
      le bouton d'action, Siri ou une Live Activity le jour du rappel. Les actions
      gratuites ouvrent le formulaire.

supporting:
  kicker: Autour de la routine
  heading: Stocks, rappels et importation.
  features:
    - title: Inventaire des stocks
      body: "Suivre les stylos ou les flacons : concentration, pharmacie, date de péremption et numéro de lot."
    - title: Vos rappels
      body:
        Créez des notifications quotidiennes, hebdomadaires ou tous les N jours selon
        le calendrier que vous définissez. Le jour de la dose, la notification propose
        une action Enregistrer une dose, et une Live Activity peut rester sur
        l'écran de verrouillage jusqu'à l'enregistrement.
    - title: Importer des saisies existantes
      body: Ouvrez dans Dial l'export d'un suivi de médicaments compatible pour importer les entrées existantes.

plans:
  kicker: Gratuit et Dial Pro
  heading: Utiliser le suivi de base gratuitement.
  body:
    Passez à Pro pour le graphique de niveau estimé, les exports ou l'enregistrement
    en un geste sur Apple Watch et iPhone. Chaque formule Dial Pro inclut les mêmes
    fonctions.
  free_name: Gratuit
  free_summary: Un dossier complet pour un médicament actif.
  free_features:
    - Enregistrer les doses, les sites d'injection, le poids, les effets indésirables et les photos d'évolution
    - Un médicament actif et un rappel
    - Listes de doses et de poids, inventaire, importations et aperçu Apple Watch
    - Widgets de compte à rebours et rappels qui ouvrent le formulaire
  pro_name: Dial Pro
  pro_summary: Le niveau estimé, les graphiques complets, les exports et l'enregistrement rapide.
  pro_features:
    - Graphique de niveau estimé et widget de niveau sur l'écran d'accueil
    - Graphiques complets de doses et de poids, tendances d'effets indésirables et comparaison de photos
    - Rapport PDF, export CSV, plusieurs médicaments et plusieurs rappels
    - Enregistrement rapide et complications Apple Watch, plus l'enregistrement en un geste sur iPhone
  options_label: Choix de formules Dial Pro
  lifetime_name: À vie
  lifetime_terms: une fois
  annual_name: Annuel
  annual_terms: par an
  monthly_name: Mensuel
  monthly_terms: par mois

privacy:
  kicker: Confidentialité
  heading: Les dossiers restent sur l'appareil.
  specs:
    - term: Comptes
      detail: Il n'existe pas de compte Dial. Ouvrez l'app et commencez à enregistrer.
    - term: Analyses
      detail: Dial n'effectue aucune statistique d'utilisation ni télémétrie. Nous ne mesurons rien sur la façon dont vous l'utilisez.
    - term: Nos serveurs
      detail: Zentsu n'exploite aucun serveur qui stocke ou lit vos dossiers.
    - term: Synchronisation facultative
      detail:
        Activez iCloud dans l'app et les dossiers se synchronisent via la base de données
        CloudKit privée de votre propre compte Apple, pas par nos serveurs.
  body:
    Médicament, dose, rappel et stock restent sur l'appareil. Les entrées de poids
    utilisent un stockage local séparé, et l'accès à Santé est facultatif, limité au
    poids corporel lorsque vous accordez l'autorisation.
  policy_link: Lire la politique de confidentialité de Dial
  policy_url: /fr/dial/privacy/

availability:
  kicker: Obtenir Dial
  heading: Disponible dès maintenant sur l'App Store.
  body:
    Dial se télécharge gratuitement. Le suivi de base fonctionne dès le premier
    enregistrement. Dial Pro ajoute le graphique de niveau estimé, les graphiques complets,
    l'export PDF et l'enregistrement rapide depuis Apple Watch et iPhone.
