hero:
  availability: עכשיו ב-App Store
  headline_lead: 'GLP-1 שלכם,'
  headline_accent: על הכתב.
  category: Dial הוא יומן תרופות GLP-1 פרטי ל-iPhone ול-Apple Watch.
  detail:
    רשמו מנות ב-iPhone או ב-Apple Watch, ראו רמה משוערת שנבנית מהמנות שאתם רושמים, והשאירו את הרישומים העיקריים במכשיר או במסד הנתונים הפרטי ב-iCloud שלכם.
  secondary_cta: כך Dial עובד
  platforms_label: פלטפורמות Dial ואחסון
  platforms:
    - iPhone
    - Apple Watch
    - Siri, מרכז הבקרה ומסך הנעילה
    - אחסון iCloud פרטי אופציונלי
  legal:
    כלי הרישום הבסיסי חינמי. Dial Pro מוסיף תרשימים, ייצוא, תרופות ותזכורות נוספות, ורישום בנגיעה אחת במכשירי Apple. Dial הוא רישום אישי. הוא לא מחשב מנות ולא מחליף הנחיות ממי שרשם לכם.

proof:
  label: למה Dial
  points:
    - iPhone ו-Apple Watch
    - אין חשבון Dial
    - אפשרות Lifetime
    - רמה ממודלת מהמנות שלכם

level:
  kicker: Dial Pro · רמה משוערת
  heading: מבט ברור יותר על המנות שרשמתם.
  body:
    Dial משרטט רמה משוערת לאורך זמן מהמנות שרשמתם ומהערך של מחצית החיים שמוצג באפליקציה.
    אפשר לשנות את הטווח כדי לעיין בשבוע, בחודש או בשישה חודשים מההיסטוריה שלכם.
  boundary_lead: הערכה, ומסומנת כך.
  boundary_body:
    התרשים משרטט עקומת דעיכה תקנית מהמנות שרשמתם. הוא מראה את הדפוסים שלכם בין מנות. זו הערכה, לא רמת דם מדודה ולא הצעה מה לקחת אחר כך. Dial לא מחשב מנות. האפליקציה מסבירה את השיטה במלואה.

logging:
  kicker: רישום מהיר
  heading: רשמו את המנה ואת כל מה שמצטרף אליה.
  body:
    רשמו תרופה, כמות, תאריך, שעה, אתר הזרקה והערות בטופס ממוקד. הערכים האחרונים מזרזים את הרישום הבא, וכל שדה נשאר לאישור שלכם. Dial עובד בין אם מי שרשם לכם קורא לזה Ozempic, Wegovy, Mounjaro או Zepbound.
  checklist:
    - ערכו רשומה כשמשהו משתנה
    - שייכו אתר הזרקה לכל מנה
    - שמרו רשומות משקל לצד ציר הזמן של המנות

history:
  kicker: Dial Pro · היסטוריה ומגמות
  heading: עיינו בדפוס לאורך הרישום.
  body:
    רשימות מנה, משקל ותופעות לוואי נשארות בחינם. Dial Pro מוסיף תרשימי מנה ומשקל מלאים, וגם מגמות מרשומות תופעות הלוואי שכבר אצלכם.
  history_card_title: היסטוריית מנות ומשקל
  history_card_note: עיינו בשינויים בטווח שתבחרו.
  side_effects_card_title: מגמות תופעות לוואי
  side_effects_card_note: עיינו בתדירות ובחומרה מההיסטוריה הקיימת או המיובאת.

report:
  kicker: Dial Pro · דוח PDF
  heading: הביאו את התמונה המלאה לביקור הבא.
  body:
    צרו PDF עם היסטוריית המנות, שינויים בכמות שנרשמה, אתרי הזרקה, מגמת משקל ודפוסי תופעות לוואי. Dial בונה אותו במכשיר, ואתם משתפים רק כשאתם מחליטים, ב-AirDrop, בדוא״ל או בהדפסה.
  closing:
    פרטי בשאר הזמן, ושימושי ברגע שהרישום צריך לצאת מהטלפון.
  smallprint: הדוח מסכם את הרשומות שלכם. זה לא תיק רפואי ולא תוכנית טיפול.

watch:
  kicker: Apple Watch
  heading: רשמו את המנה מפרק כף היד.
  body: >-
    אפליקציית השעון מציגה טבעת מחזור שסופרת לאחור עד המנה הבאה ומתי חלה התזכורת הבאה. Dial Pro הופך את המבט לרישום מלא: מגדירים כמות עם Digital Crown, בוחרים אתר הזרקה ומאשרים. הרשומה מסונכרנת ל-iPhone ונשארת בין שני המכשירים.
  checklist:
    - טבעת מחזור, מצב מנה ותזכורת הבאה במבט (חינם)
    - רישום מנה מפרק כף היד עם Digital Crown (Dial Pro)
    - ווידג'טים של רמה משוערת ומנה הבאה על לוח השעון, ורישום מהיר ב-Smart Stack (Dial Pro)
    - ב-iPhone, Pro מאפשר רישום בנגיעה ממרכז הבקרה, מכפתור הפעולה, מ-Siri או מפעילות בזמן אמת ביום תזכורת. פעולות חינמיות פותחות את טופס הרישום.

supporting:
  kicker: סביב השגרה
  heading: הפרטים המעשיים נשארים קרובים.
  features:
    - title: מלאי אספקה
      body: עקבו אחרי עטים או בקבוקונים עם ריכוז, בית מרקחת, תאריך תפוגה ומספר אצווה.
    - title: התזכורות שלכם
      body:
        צרו התראות יומיות, שבועיות או כל N ימים לפי לוח הזמנים שהגדרתם. ביום מנה, פעולת רישום מנה יושבת על ההתראה, ופעילות בזמן אמת יכולה להישאר במסך הנעילה עד שתרשמו.
    - title: הביאו את ההיסטוריה
      body: פתחו ייצוא תואם ממעקב תרופות אחר עם Dial כדי לייבא רשומות קיימות.

plans:
  kicker: חינם ו-Dial Pro
  heading: השתמשו בכלי הרישום הבסיסי בחינם.
  body:
    שדרגו כשאתם רוצים תרשימים מפורטים יותר, ייצוא או רישום מהיר יותר במכשירי Apple. כל תוכנית Dial Pro כוללת את אותן היכולות.
  free_name: חינם
  free_summary: רישום מלא לתרופה פעילה אחת.
  free_features:
    - רישום מנות, אתרי הזרקה, משקל, תופעות לוואי ותמונות התקדמות
    - תרופה פעילה אחת ותזכורת אחת
    - רשימות מנה ומשקל, מלאי, ייבוא ומבט Apple Watch
    - ווידג'טי ספירה לאחור ותזכורות שפותחות את טופס הרישום
  pro_name: Dial Pro
  pro_summary: הרמה המשוערת, תרשימים מלאים, ייצוא ורישום מהיר.
  pro_features:
    - תרשים רמה משוערת וווידג'ט רמה במסך הבית
    - תרשימי מנה ומשקל מלאים, מגמות תופעות לוואי והשוואת תמונות
    - דוח PDF, ייצוא CSV, כמה תרופות וכמה תזכורות
    - רישום מהיר וסיבוכים ב-Apple Watch, ורישום בנגיעה ב-iPhone
  options_label: אפשרויות תוכנית Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: חד-פעמי
  annual_name: שנתי
  annual_terms: לשנה
  monthly_name: חודשי
  monthly_terms: לחודש


privacy:
  kicker: פרטיות
  heading: ברור מה נשאר במכשיר.
  specs:
    - term: חשבונות
      detail: אין חשבון Dial. פתחו את האפליקציה והתחילו לרשום.
    - term: ניתוח שימוש
      detail: Dial לא מריץ ניתוח שימוש ולא טלמטריה. אנחנו לא מודדים איך אתם משתמשים בו.
    - term: השרתים שלנו
      detail: Zentsu לא מפעילה שרת ששומר או קורא את הרשומות שלכם.
    - term: סנכרון אופציונלי
      detail:
        הפעילו iCloud באפליקציה והרשומות מסונכרנות דרך מסד הנתונים הפרטי של CloudKit בחשבון Apple שלכם, לא אלינו.
  body:
    רשומות תרופה, מנה, תזכורת ואספקה נשארות במכשיר. רשומות משקל נשמרות במאגר מקומי נפרד, וגישה לבריאות היא אופציונלית ומכסה משקל גוף רק כשאתם נותנים הרשאה.
  policy_link: מדיניות הפרטיות של Dial
  policy_url: /he/dial/privacy/

availability:
  kicker: הורידו את Dial
  heading: עכשיו ב-App Store.
  body:
    Dial להורדה בחינם. כלי הרישום הבסיסי עובד מהרישום הראשון. Dial Pro מוסיף את תרשים הרמה המשוערת, תרשימים מלאים, ייצוא PDF ורישום מהיר מ-Apple Watch ומ-iPhone.
  email_label: כתובת דוא״ל
  email_placeholder: shem@email.com
  submit: קבלו עדכוני גרסה
  signup_note:
    אופציונלי. הערות גרסה לגרסאות חדשות, לא יותר מזה. בלי מעקב פתיחה או קישורים. ביטול בכל עת.
  signup_privacy_link: פרטי פרטיות
  signup_privacy_url: /privacy
  signup_help: צריכים עזרה?
