hero:
  availability: עכשיו ב-App Store
  headline_lead: "יומן GLP-1 שלכם."
  headline_accent: ""
  category: "Dial הוא יומן תרופות GLP-1 פרטי ל-iPhone ול-Apple Watch."
  detail:
    רשמו מנה ב-iPhone או ב-Apple Watch. Dial משרטט רמה משוערת מהרשומות האלה. הרשומות נשארות במכשיר, או במסד הנתונים הפרטי ב-iCloud אם תפעילו אותו.
  secondary_cta: כך Dial עובד
  platforms_label: פלטפורמות Dial ואחסון
  platforms:
    - iPhone
    - Apple Watch
    - Siri, מרכז הבקרה ומסך הנעילה
    - אחסון iCloud פרטי אופציונלי
  legal:
    הרישום הבסיסי חינמי. Dial Pro מוסיף תרשימים, ייצוא, תרופות ותזכורות נוספות, ורישום בהקשה אחת במכשירי Apple. Dial הוא יומן אישי. הוא לא מחשב מנות ולא מחליף הנחיות מהרופא שלכם.

proof:
  label: למה Dial
  points:
    - iPhone ו-Apple Watch
    - מתחילים בלי חשבון Dial
    - אפשרות Lifetime
    - רמה משוערת מהמנות שלכם

level:
  kicker: Dial Pro · רמה משוערת
  heading: התרשים משתמש במנות שכבר רשמתם.
  body:
    Dial משרטט רמה משוערת לאורך זמן. הבסיס הוא המנות שרשמתם והערך של מחצית החיים שמוצג באפליקציה.
    אפשר לשנות את הטווח ולעיין בשבוע, בחודש או בשישה חודשים מההיסטוריה שלכם.
  boundary_lead: הערכה, ומסומנת כך.
  boundary_body:
    התרשים משרטט עקומת דעיכה תקנית מהמנות שרשמתם. הוא מראה את הדפוסים שלכם בין מנות. זו הערכה, לא רמת דם מדודה ולא הצעה מה לקחת אחר כך. Dial לא מחשב מנות. האפליקציה מסבירה את השיטה במלואה.

logging:
  kicker: רישום מהיר
  heading: תרופה, כמות, אתר הזרקה והערות בטופס אחד.
  body:
    רשמו תרופה, כמות, תאריך, שעה, אתר הזרקה והערות. הערכים האחרונים ממלאים את הרישום הבא. כל שדה עדיין דורש אישור שלכם. Dial עובד עם Ozempic, Wegovy, Mounjaro ו-Zepbound.
  checklist:
    - ערכו רשומה כשמשהו משתנה
    - שייכו אתר הזרקה לכל מנה
    - שמרו רשומות משקל לצד ציר הזמן של המנות

history:
  kicker: Dial Pro · היסטוריה ומגמות
  heading: תרשימי מנה, משקל ותופעות לוואי מהרשומות שלכם.
  body:
    רשימות מנה, משקל ותופעות לוואי נשארות בחינם. Dial Pro מוסיף תרשימי מנה ומשקל מלאים, וגם מגמות מרשומות תופעות הלוואי שכבר יש לכם.
  history_card_title: היסטוריית מנות ומשקל
  history_card_note: עיינו בשינויים בטווח שתבחרו.
  side_effects_card_title: מגמות תופעות לוואי
  side_effects_card_note: עיינו בתדירות ובחומרה מההיסטוריה הקיימת או המיובאת.

report:
  kicker: Dial Pro · דוח PDF
  heading: PDF של הרשומות לביקור במרפאה.
  body:
    צרו PDF עם היסטוריית המנות, שינויים בכמות שנרשמה, אתרי הזרקה, מגמת משקל ודפוסי תופעות לוואי. Dial בונה אותו במכשיר, ואתם משתפים רק כשאתם מחליטים, ב-AirDrop, בדוא״ל או בהדפסה.
  closing:
    בשאר הזמן זה נשאר אצלכם. זה שימושי כשהרישום צריך לצאת מהטלפון.
  smallprint: הדוח מסכם את הרשומות שלכם. זה לא תיק רפואי ולא תוכנית טיפול.

watch:
  kicker: Apple Watch
  heading: רשמו את המנה מפרק כף היד.
  body: >-
    אפליקציית השעון מציגה טבעת שסופרת לאחור עד המנה הבאה, ומתי התזכורת הבאה. Dial Pro רושם מאותו מסך. מגדירים כמות עם Digital Crown, בוחרים אתר הזרקה ומאשרים. הרשומה מסונכרנת ל-iPhone.
  checklist:
    - טבעת ספירה לאחור, מצב מנה והתזכורת הבאה במבט אחד (חינם)
    - רישום מנה מפרק כף היד עם Digital Crown (Dial Pro)
    - ווידג'טים של רמה משוערת ומנה הבאה על לוח השעון, ורישום מהיר ב-Smart Stack (Dial Pro)
    - ב-iPhone, Dial Pro מאפשר רישום בהקשה אחת ממרכז הבקרה, מכפתור הפעולה, מ-Siri או מ-Live Activity ביום תזכורת. פעולות חינמיות פותחות את טופס הרישום.

supporting:
  kicker: סביב השגרה
  heading: מלאי, תזכורות וייבוא באותו רישום.
  features:
    - title: מלאי אספקה
      body: עקבו אחרי עטים או בקבוקונים עם ריכוז, בית מרקחת, תאריך תפוגה ומספר אצווה.
    - title: התזכורות שלכם
      body:
        צרו התראות יומיות, שבועיות או כל N ימים לפי לוח הזמנים שהגדרתם. ביום מנה מופיעה בהתראה פעולת רישום מנה, ו-Live Activity יכולה להישאר במסך הנעילה עד שתרשמו.
    - title: ייבוא רשומות קיימות
      body: ייבאו ל-Dial קובץ תואם ממעקב תרופות אחר.

plans:
  kicker: חינם ו-Dial Pro
  heading: השתמשו ברישום הבסיסי בחינם.
  body:
    שדרגו לתרשים הרמה המשוערת, לייצוא או לרישום בהקשה אחת ב-Apple Watch וב-iPhone. כל תוכנית Dial Pro כוללת את אותן היכולות.
  free_name: חינם
  free_summary: רישום מלא לתרופה פעילה אחת.
  free_features:
    - רישום מנות, אתרי הזרקה, משקל, תופעות לוואי ותמונות התקדמות
    - תרופה פעילה אחת ותזכורת אחת
    - רשימות מנה ומשקל, מלאי, ייבוא ומבט Apple Watch
    - ווידג'טי ספירה לאחור ותזכורות שפותחות את טופס הרישום
  pro_name: Dial Pro
  pro_summary: הרמה המשוערת, תרשימים מלאים, ייצוא ורישום מהיר.
  pro_features:
    - תרשים רמה משוערת וווידג'ט רמה במסך הבית
    - תרשימי מנה ומשקל מלאים, מגמות תופעות לוואי והשוואת תמונות
    - דוח PDF, ייצוא CSV, כמה תרופות וכמה תזכורות
    - רישום מהיר ו-Complications ב-Apple Watch, ורישום בהקשה ב-iPhone
  options_label: אפשרויות תוכנית Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: חד-פעמי
  annual_name: שנתי
  annual_terms: לשנה
  monthly_name: חודשי
  monthly_terms: לחודש

privacy:
  kicker: פרטיות
  heading: הרשומות נשארות במכשיר.
  specs:
    - term: חשבונות
      detail: אין חשבון Dial. פתחו את האפליקציה והתחילו לרשום.
    - term: ניתוח שימוש
      detail: Dial לא מריץ ניתוח שימוש ולא טלמטריה. אנחנו לא מודדים איך אתם משתמשים בו.
    - term: השרתים שלנו
      detail: Zentsu לא מפעילה שרת ששומר או קורא את הרשומות שלכם.
    - term: סנכרון אופציונלי
      detail:
        הפעילו iCloud באפליקציה והרשומות מסונכרנות דרך מסד הנתונים הפרטי של CloudKit בחשבון Apple שלכם, לא אלינו.
  body:
    רשומות תרופה, מנה, תזכורת ואספקה נשארות במכשיר. רשומות משקל נשמרות במאגר מקומי נפרד. גישה לבריאות היא לבחירתכם, ורק למשקל גוף כשאתם נותנים הרשאה.
  policy_link: מדיניות הפרטיות של Dial
  policy_url: /he/dial/privacy/

availability:
  kicker: הורידו את Dial
  heading: עכשיו ב-App Store.
  body:
    אפשר להוריד את Dial בחינם. הרישום הבסיסי עובד מהרישום הראשון. Dial Pro מוסיף את תרשים הרמה המשוערת, תרשימים מלאים, ייצוא PDF ורישום מהיר מ-Apple Watch ומ-iPhone.
