hero:
  availability: עכשיו ב-App Store
  headline_lead: "רשומה פרטית של כל מנה."
  headline_accent: ""
  category: "Dial הוא מעקב אחר תרופות GLP-1 ל-iPhone ול-Apple Watch."
  detail:
    רשמו כל מנה עם השעה ואתר ההזרקה, בטלפון או בפרק כף היד. Dial Pro משרטט רמה משוערת בין המנות ומכין PDF לרופא שלכם. הרשומות נשארות במכשיר, או במסד הנתונים הפרטי שלכם ב-iCloud אם תפעילו אותו.
  free_line: הורדה בחינם, בלי חשבון לפתוח. ליומן המנות אין תקרה.
  secondary_cta: כך Dial עובד
  qr_caption: סרקו כדי לפתוח את Dial ב-App Store ב-iPhone שלכם.
  platforms_label: פלטפורמות Dial ואחסון
  platforms:
    - iPhone
    - Apple Watch
    - Siri, מרכז הבקרה ומסך הנעילה
    - אחסון iCloud פרטי אופציונלי
  legal:
    Dial הוא רישום אישי. הוא לא מחשב מנות ולא מחליף הנחיות מהרופא שלכם. Dial Pro מוסיף את תרשים הרמה המשוערת, ההיסטוריה המלאה, הייצוא והרישום המהיר שמתוארים למטה.

proof:
  label: למה Dial
  points:
    - טבעת ספירה לאחור והתזכורת הבאה ב-Apple Watch
    - נפתח בלי חשבון Dial
    - אפשרות לכל החיים, רכישה אחת
    - רמה משוערת בין מנות (Dial Pro)

level:
  kicker: Dial Pro · רמה משוערת
  heading: ראו רמה משוערת בין המנות, לפי מחצית חיים.
  body:
    Dial משרטט רמה משוערת לאורך זמן. הבסיס הוא המנות שרשמתם והערך של מחצית החיים שמוצג באפליקציה.
    אפשר לשנות את הטווח ולעיין בשבוע, בחודש או בשישה חודשים מההיסטוריה שלכם.
  boundary_lead: הערכה, ומסומנת כך.
  boundary_body:
    התרשים משרטט עקומת דעיכה תקנית מהמנות שרשמתם. הוא מראה את הדפוסים שלכם בין מנות. זו הערכה, לא רמת דם מדודה ולא הצעה מה לקחת אחר כך. Dial לא מחשב מנות. האפליקציה מסבירה את השיטה במלואה.

logging:
  kicker: רישום מהיר
  heading: רשמו תרופה, מנה ואתר הזרקה בטופס אחד.
  body:
    רשמו תרופה, כמות, תאריך, שעה, אתר הזרקה והערות. הערכים האחרונים ממלאים את הרישום
    הבא. כל שדה עדיין דורש אישור שלכם. Dial מכיר Semaglutide (Ozempic וWegovy),
    tirzepatide (Mounjaro וZepbound), liraglutide, dulaglutide וexenatide לפי שמות
    המותג והאריזה הנהוגים במדינה שלכם, ומקבל תרופה מותאמת אישית אם התרופה שלכם לא
    ברשימה.
  checklist:
    - ערכו רשומה כשמשהו משתנה
    - שייכו אתר הזרקה לכל מנה
    - שמרו רשומות משקל לצד ציר הזמן של המנות

history:
  kicker: Dial Pro · היסטוריה ומגמות
  heading: תרשימי מנה, משקל ותופעות לוואי מהרשומות שלכם.
  body:
    רשימות מנה, משקל ותופעות לוואי נשארות בחינם. Dial Pro מוסיף את התרשימים.
  history_card_title: היסטוריית מנות ומשקל
  history_card_note: עיינו בשינויים בטווח שתבחרו.
  side_effects_card_title: מגמות תופעות לוואי
  side_effects_card_note: עיינו בתדירות ובחומרה מההיסטוריה הקיימת או המיובאת.

report:
  kicker: Dial Pro · דוח PDF
  heading: PDF של הרשומות לביקור במרפאה.
  card_title: דוח PDF לביקור במרפאה
  body:
    צרו PDF עם היסטוריית המנות, שינויים בכמות שנרשמה, אתרי הזרקה, מגמת משקל ודפוסי תופעות לוואי. Dial בונה אותו במכשיר, ואתם משתפים רק כשאתם מחליטים, ב-AirDrop, בדוא״ל או בהדפסה. אותה היסטוריה מיוצאת גם כ-CSV.
  closing:
    בשאר הזמן זה נשאר אצלכם. זה שימושי כשהרישום צריך לצאת מהטלפון.
  smallprint: הדוח מסכם את הרשומות שלכם. זה לא תיק רפואי ולא תוכנית טיפול.

watch:
  kicker: Apple Watch
  heading: רשמו את המנה מפרק כף היד.
  body: >-
    אפליקציית השעון מציגה טבעת שסופרת לאחור עד המנה הבאה, ומתי התזכורת הבאה. Dial Pro רושם מאותו מסך. מגדירים כמות עם Digital Crown, בוחרים אתר הזרקה ומאשרים. הרשומה מסונכרנת ל-iPhone.
  checklist:
    - טבעת ספירה לאחור, מצב מנה והתזכורת הבאה במבט אחד (חינם)
    - רישום מנה מפרק כף היד עם Digital Crown (Dial Pro)
    - ווידג'טים של רמה משוערת ומנה הבאה על לוח השעון, ורישום מהיר ב-Smart Stack (Dial Pro)
    - ב-iPhone, Dial Pro מאפשר רישום בהקשה אחת ממרכז הבקרה, מכפתור הפעולה, מ-Siri או מ-Live Activity ביום תזכורת. פעולות חינמיות פותחות את טופס הרישום.

supporting:
  kicker: הכול ברשומה
  heading: היסטוריה, דוח, מלאי, תזכורות וייבוא במקום אחד.
  features:
    - title: מלאי אספקה
      body: עקבו אחרי עטים או בקבוקונים עם ריכוז, בית מרקחת, תאריך תפוגה ומספר אצווה.
    - title: התזכורות שלכם
      body:
        צרו התראות יומיות, שבועיות או כל N ימים לפי לוח הזמנים שהגדרתם. ביום מנה מופיעה בהתראה פעולת רישום מנה, ו-Live Activity יכולה להישאר במסך הנעילה עד שתרשמו.
    - title: ייבוא רשומות קיימות
      body: ייבאו ל-Dial קובץ תואם ממעקב תרופות אחר.

plans:
  kicker: חינם ו-Dial Pro
  heading: השתמשו ברישום הבסיסי בחינם.
  body:
    Dial Pro מוסיף את תרשים הרמה המשוערת, תרשימי ההיסטוריה המלאה, ייצוא ורישום מהיר ב-Apple Watch וב-iPhone. כל תוכנית Dial Pro כוללת את אותן היכולות.
  free_name: חינם
  free_summary: חינם לתרופה פעילה אחת, בלי תקרה על יומן המנות.
  free_features:
    - רישום מנות, אתרי הזרקה, משקל, תופעות לוואי ותמונות התקדמות
    - תרופה פעילה אחת ותזכורת אחת
    - רשימות מנה ומשקל, מלאי, ייבוא ומבט Apple Watch
    - ווידג'טי ספירה לאחור ותזכורות שפותחות את טופס הרישום
  pro_name: Dial Pro
  pro_summary: ראו את הרמה בין המנות, שרטטו את כל ההיסטוריה, ורשמו מפרק כף היד.
  cta_caption: הורידו בחינם, ואחר כך בחרו תוכנית באפליקציה.
  pro_features:
    - תרשים רמה משוערת וווידג'ט רמה במסך הבית
    - תרשימי מנה ומשקל מלאים, מגמות תופעות לוואי והשוואת תמונות
    - דוח PDF, ייצוא CSV, כמה תרופות וכמה תזכורות
    - רישום מהיר ו-Complications ב-Apple Watch, ורישום בהקשה ב-iPhone
  options_label: אפשרויות תוכנית Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: חד-פעמי
  annual_name: שנתי
  annual_terms: לשנה
  monthly_name: חודשי
  monthly_terms: לחודש

privacy:
  kicker: פרטיות
  heading: הרשומות נשארות במכשיר.
  specs:
    - term: חשבונות
      detail: אין צורך בחשבון Dial כדי להתחיל לרשום.
    - term: ניתוח שימוש
      detail: Dial לא אוסף ניתוח שימוש ולא טלמטריה.
    - term: השרתים שלנו
      detail: Zentsu לא מפעילה שרת ששומר או קורא את הרשומות שלכם.
    - term: סנכרון אופציונלי
      detail:
        כש-iCloud פעיל, הרשומות העיקריות משתמשות במסד CloudKit הפרטי בחשבון Apple שלכם, לא בשרתים שלנו.
  body:
    הרשומות העיקריות נשארות במכשיר. רשומות משקל ותמונות התקדמות משתמשות באחסון מקומי נפרד.
  policy_link: מדיניות הפרטיות של Dial
  policy_url: /he/dial/privacy/

availability:
  kicker: הורידו את Dial
  heading: עכשיו ב-App Store.
  body:
    אפשר להוריד את Dial בחינם, בלי חשבון לפתוח. Dial Pro מוסיף את תרשים הרמה המשוערת, תרשימי ההיסטוריה המלאה, ייצוא PDF ו-CSV, ורישום מהיר מ-Apple Watch ומ-iPhone.

