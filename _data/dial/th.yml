hero:
  availability: "มีใน App Store แล้ว"
  headline_lead: "จดขนาดยา GLP-1"
  headline_accent: ""
  category: "Dial เป็นสมุดบันทึกยา GLP-1 ส่วนตัวสำหรับ iPhone และ Apple Watch"
  detail: "บันทึกขนาดยาบน iPhone หรือ Apple Watch ดูระดับโดยประมาณจากขนาดยาที่คุณเก็บ และเก็บบันทึกหลักไว้บนอุปกรณ์หรือในฐานข้อมูล iCloud ส่วนตัว"
  secondary_cta: "Dial ทำงานอย่างไร"
  platforms_label: "แพลตฟอร์มและการจัดเก็บของ Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, ศูนย์ควบคุม และหน้าจอล็อก"
    - "ที่เก็บ iCloud ส่วนตัวแบบเลือกได้"
  legal: "สมุดบันทึกหลักใช้ฟรี Dial Pro เพิ่มกราฟ การส่งออก ยาและการเตือนเพิ่ม และการบันทึกด้วยการแตะครั้งเดียวบนอุปกรณ์ Apple. Dial เป็นบันทึกส่วนตัว ไม่คำนวณขนาดยาและไม่ทดแทนคำแนะนำจากผู้สั่งยา"

proof:
  label: "ทำไมต้อง Dial"
  points:
    - "iPhone และ Apple Watch"
    - "ไม่มีบัญชี ไม่มีการวิเคราะห์การใช้งาน"
    - "ตัวเลือก Lifetime"
    - "ระดับโดยประมาณจากขนาดยาของคุณ"

level:
  kicker: "Dial Pro · ระดับโดยประมาณ"
  heading: "ภาพที่ชัดขึ้นของขนาดยาที่คุณบันทึก"
  body: "Dial วาดระดับยาโดยประมาณตามเวลาจากขนาดยาที่บันทึกและค่าครึ่งชีวิตที่แสดงในแอป เปลี่ยนช่วงเพื่อดูหนึ่งสัปดาห์ หนึ่งเดือน หรือหกเดือนของประวัติคุณเอง"
  boundary_lead: "เป็นค่าประมาณ และเรากล่าวเช่นนั้น"
  boundary_body: "กราฟวาดเส้นโค้งการลดลงมาตรฐานจากขนาดยาที่คุณบันทึก แสดงรูปแบบของคุณเองระหว่างขนาดยา ไม่ใช่ระดับในเลือดที่วัดได้ และไม่ใช่ข้อเสนอว่าควรฉีดอะไรต่อไป Dial ไม่คำนวณขนาดยา แอปอธิบายวิธีทั้งหมด"

logging:
  kicker: "บันทึกเร็ว"
  heading: "บันทึกขนาดยาและทุกอย่างที่มากับมัน"
  body: "จดยา ปริมาณ วันที่ เวลา จุดฉีด และบันทึกย่อในแบบฟอร์มที่โฟกัส ค่าล่าสุดทำให้รายการถัดไปเร็วขึ้น และทุกช่องยังต้องให้คุณยืนยัน Dial ใช้ได้ ไม่ว่าผู้สั่งยาจะเรียก Ozempic, Wegovy, Mounjaro หรือ Zepbound"
  checklist:
    - "แก้ไขรายการเมื่อมีอะไรเปลี่ยน"
    - "ผูกจุดฉีดกับแต่ละขนาดยา"
    - "เก็บรายการน้ำหนักไว้ข้างเส้นเวลาขนาดยา"

history:
  kicker: "Dial Pro · ประวัติและแนวโน้ม"
  heading: "ดูรูปแบบทั้งบันทึก"
  body: "รายการขนาดยา น้ำหนัก และผลข้างเคียงยังฟรี Dial Pro เพิ่มกราฟขนาดยาและน้ำหนักเต็ม รวมถึงแนวโน้มจากรายการผลข้างเคียงที่มีอยู่แล้วในบันทึก"
  history_card_title: "ประวัติขนาดยาและน้ำหนัก"
  history_card_note: "ดูการเปลี่ยนแปลงในช่วงที่คุณเลือก"
  side_effects_card_title: "แนวโน้มผลข้างเคียง"
  side_effects_card_note: "ดูความถี่และความรุนแรงจากประวัติที่มีหรือที่นำเข้า"

report:
  kicker: "Dial Pro · รายงาน PDF"
  heading: "นำภาพรวมไปพบครั้งถัดไป"
  body: "สร้าง PDF พร้อมประวัติขนาดยา การเปลี่ยนแปลงปริมาณที่บันทึก จุดฉีด แนวโน้มน้ำหนัก และรูปแบบผลข้างเคียง Dial สร้างบนอุปกรณ์ และคุณแชร์เมื่อตัดสินใจเท่านั้น ผ่าน AirDrop อีเมล หรือพิมพ์"
  closing: "เป็นส่วนตัวในเวลาที่เหลือ และมีประโยชน์ตอนที่บันทึกต้องออกจากโทรศัพท์"
  smallprint: "รายงานสรุปรายการของคุณ ไม่ใช่เวชระเบียนหรือแผนการรักษา"

watch:
  kicker: Apple Watch
  heading: "บันทึกขนาดยาจากข้อมือ"
  body: "แอปนาฬิกาแสดงวงจรนับถอยหลังถึงขนาดยาถัดไป และว่าการเตือนถัดไปตกเมื่อใด Dial Pro เปลี่ยนภาพนั้นเป็นการบันทึกเต็ม ตั้งปริมาณด้วย Digital Crown เลือกจุดฉีด แล้วยืนยัน รายการซิงค์ไปยัง iPhone และอยู่ระหว่างอุปกรณ์ทั้งสอง"
  checklist:
    - "วงจร สถานะขนาดยา และการเตือนถัดไปในพริบตา (ฟรี)"
    - "บันทึกขนาดยาจากข้อมือด้วย Digital Crown (Dial Pro)"
    - "วิดเจ็ตระดับโดยประมาณและขนาดยาถัดไปบนหน้าปัด รวมถึงบันทึกเร็วใน Smart Stack (Dial Pro)"
    - "บน iPhone รุ่น Pro เปิดการบันทึกแตะครั้งเดียวจากศูนย์ควบคุม ปุ่มการทำงาน Siri หรือ Live Activity ในวันเตือน การทำงานฟรีเปิดแบบฟอร์ม"

supporting:
  kicker: "รอบกิจวัตร"
  heading: "รายละเอียดที่ใช้จริงอยู่ใกล้ ๆ"
  features:
    - title: "คลังยา"
      body: "ติดตามปากกาหรือไวอัลพร้อมความเข้มข้น ร้านยา วันหมดอายุ และเลขล็อต"
    - title: "การเตือนของคุณ"
      body: "สร้างการแจ้งเตือนรายวัน รายสัปดาห์ หรือทุก N วันตามตารางที่ตั้ง ในวันขนาดยามีการบันทึกบนการแจ้งเตือน และ Live Activity อาจอยู่บนหน้าจอล็อกจนกว่าจะบันทึก"
    - title: "นำประวัติมาด้วย"
      body: "เปิดไฟล์ส่งออกสมุดบันทึกยาที่เข้ากันได้กับ Dial เพื่อนำเข้ารายการที่มีอยู่"

plans:
  kicker: "ฟรีและ Dial Pro"
  heading: "ใช้สมุดบันทึกหลักฟรี"
  body: "ย้ายไป Pro เมื่อต้องการกราฟละเอียดขึ้น การส่งออก หรือการบันทึกที่เร็วขึ้นบนอุปกรณ์ Apple ทุกแผน Dial Pro มีคุณสมบัติเดียวกัน"
  free_name: "ฟรี"
  free_summary: "บันทึกครบสำหรับยาที่ใช้อยู่หนึ่งชนิด"
  free_features:
    - "บันทึกขนาดยา จุดฉีด น้ำหนัก ผลข้างเคียง และรูปความคืบหน้า"
    - "ยาที่ใช้อยู่หนึ่งชนิดและการเตือนหนึ่งรายการ"
    - "รายการขนาดยาและน้ำหนัก คลัง การนำเข้า และภาพรวมบน Apple Watch"
    - "วิดเจ็ตนับถอยหลังและการเตือนที่เปิดแบบฟอร์ม"
  pro_name: Dial Pro
  pro_summary: "ระดับโดยประมาณ กราฟเต็ม การส่งออก และการบันทึกเร็ว"
  pro_features:
    - "กราฟระดับโดยประมาณและวิดเจ็ตหน้าจอโฮม"
    - "กราฟขนาดยาและน้ำหนักเต็ม แนวโน้มผลข้างเคียง และการเปรียบเทียบรูป"
    - "รายงาน PDF ส่งออก CSV ยาหลายชนิด และการเตือนหลายรายการ"
    - "บันทึกเร็วและคอมพลิเคชันบน Apple Watch รวมถึงบันทึกแตะครั้งเดียวบน iPhone"
  options_label: "ตัวเลือกแผน Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "ครั้งเดียว"
  annual_name: "รายปี"
  annual_terms: "ต่อปี"
  monthly_name: "รายเดือน"
  monthly_terms: "ต่อเดือน"


privacy:
  kicker: "ความเป็นส่วนตัว"
  heading: "ชัดเจนว่าอะไรอยู่บนอุปกรณ์"
  specs:
    - term: "บัญชี"
      detail: "ไม่มีบัญชี Dial เปิดแอปแล้วเริ่มบันทึก"
    - term: "การวิเคราะห์การใช้งาน"
      detail: "Dial ไม่รันการวิเคราะห์การใช้งานหรือเทเลเมทรี เราไม่วัดว่าคุณใช้แอปอย่างไร"
    - term: "เซิร์ฟเวอร์ของเรา"
      detail: "Zentsu ไม่ดำเนินเซิร์ฟเวอร์ที่เก็บหรืออ่านบันทึกของคุณ"
    - term: "การซิงค์แบบเลือกได้"
      detail: "เปิด iCloud ในแอป แล้วบันทึกจะซิงค์ผ่านฐาน CloudKit ส่วนตัวบนบัญชี Apple ของคุณ ไม่ใช่มาหาเรา"
  body: "บันทึกยา ขนาดยา การเตือน และคลังอยู่บนอุปกรณ์ รายการน้ำหนักใช้ที่เก็บในเครื่องแยก และการเข้าถึงสุขภาพเป็นทางเลือก ครอบคลุมเฉพาะน้ำหนักตัวเมื่อคุณอนุญาต เปลี่ยนสิทธิ์ได้ที่ตั้งค่า &gt; สุขภาพ"
  policy_link: "อ่านนโยบายความเป็นส่วนตัวของ Dial"
  policy_url: /th/dial/privacy/

