hero:
  availability: "มีใน App Store แล้ว"
  headline_lead: "จดขนาดยา GLP-1."
  headline_accent: ""
  category: "Dial เป็นสมุดบันทึกยา GLP-1 ส่วนตัวสำหรับ iPhone และ Apple Watch."
  detail: "บันทึกขนาดยาบน iPhone หรือ Apple Watch. Dial สร้างระดับโดยประมาณจากที่คุณบันทึก. บันทึกหลักอยู่บนเครื่อง หรือใน iCloud ส่วนตัวถ้าคุณเปิดไว้."
  free_line: ดาวน์โหลดฟรี บันทึกการฉีดยาไม่จำกัดจำนวน
  secondary_cta: "Dial ทำงานอย่างไร"
  platforms_label: "แพลตฟอร์มและการจัดเก็บของ Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, ศูนย์ควบคุม และหน้าจอล็อก"
    - "iCloud ส่วนตัว เปิดเองได้"
  legal: "Dial Pro เพิ่มกราฟ การส่งออก ยาหลายชนิดกับการเตือนหลายรายการ และบันทึกแค่แตะครั้งเดียวบนอุปกรณ์ Apple. Dial เป็นบันทึกส่วนตัว. ไม่คำนวณขนาดยา และไม่ทดแทนคำแนะนำจากผู้สั่งยา."

proof:
  label: "ทำไมต้อง Dial"
  points:
    - "iPhone และ Apple Watch"
    - "เปิดได้โดยไม่ต้องมีบัญชี Dial"
    - "ตัวเลือก Lifetime"
    - "ระดับโดยประมาณจากขนาดยาของคุณ"

level:
  kicker: "Dial Pro · ระดับโดยประมาณ"
  heading: "กราฟใช้ขนาดยาที่คุณบันทึกไว้แล้ว"
  body: "Dial สร้างระดับโดยประมาณตามเวลา จากขนาดยาที่บันทึกและค่าครึ่งชีวิตที่แสดงในแอป เปลี่ยนช่วงเพื่อดูประวัติของคุณเองเป็นหนึ่งสัปดาห์ หนึ่งเดือน หรือหกเดือน"
  boundary_lead: "เป็นค่าประมาณ และเราบอกไว้ชัด"
  boundary_body: "กราฟวาดเส้นโค้งการลดลงมาตรฐานจากขนาดยาที่คุณบันทึก แสดงรูปแบบของคุณเองระหว่างขนาดยา ไม่ใช่ระดับในเลือดที่วัดได้ และไม่ได้บอกว่าควรฉีดอะไรต่อ Dial ไม่คำนวณขนาดยา วิธีที่ใช้มีคำอธิบายในแอป"

logging:
  kicker: "บันทึกเร็ว"
  heading: "ยา ปริมาณ จุดฉีด และบันทึกย่อในแบบฟอร์มเดียว"
  body: "จดยา ปริมาณ วันที่ เวลา จุดฉีด และบันทึกย่อ ค่าล่าสุดทำให้รายการถัดไปเร็วขึ้น และทุกช่องยังต้องให้คุณยืนยัน Dial รู้จัก Semaglutide (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound), liraglutide, dulaglutide และ exenatide ตามชื่อยี่ห้อและชื่อกล่องที่ใช้ในประเทศของคุณ และรับชื่อยาที่คุณพิมพ์เองเมื่อใบสั่งยาของคุณไม่อยู่ในรายการ"
  checklist:
    - "แก้ไขรายการเมื่อมีอะไรเปลี่ยน"
    - "ผูกจุดฉีดกับแต่ละขนาดยา"
    - "เก็บรายการน้ำหนักไว้ข้างเส้นเวลาขนาดยา"

history:
  kicker: "Dial Pro · ประวัติและแนวโน้ม"
  heading: "กราฟขนาดยา น้ำหนัก และผลข้างเคียงจากรายการของคุณ"
  body: "รายการขนาดยา น้ำหนัก และผลข้างเคียงยังฟรี Dial Pro เพิ่มกราฟขนาดยาและน้ำหนักเต็ม รวมถึงแนวโน้มจากรายการผลข้างเคียงที่มีอยู่แล้วในบันทึก"
  history_card_title: "ประวัติขนาดยาและน้ำหนัก"
  history_card_note: "ดูการเปลี่ยนแปลงในช่วงที่คุณเลือก"
  side_effects_card_title: "แนวโน้มผลข้างเคียง"
  side_effects_card_note: "ดูความถี่และความรุนแรงจากประวัติที่มีหรือที่นำเข้า"

report:
  kicker: "Dial Pro · รายงาน PDF"
  heading: "PDF จากรายการของคุณ สำหรับนัดคลินิก"
  body: "สร้าง PDF พร้อมประวัติขนาดยา การเปลี่ยนแปลงปริมาณที่บันทึก จุดฉีด แนวโน้มน้ำหนัก และรูปแบบผลข้างเคียง Dial สร้างบนเครื่อง และแชร์เมื่อคุณเลือกเองเท่านั้น ผ่าน AirDrop อีเมล หรือพิมพ์"
  closing: "ส่วนตัวในวันปกติ มีประโยชน์ตอนที่ต้องเอาบันทึกออกจากโทรศัพท์"
  smallprint: "รายงานสรุปรายการของคุณ ไม่ใช่เวชระเบียนหรือแผนการรักษา"

watch:
  kicker: Apple Watch
  heading: "บันทึกขนาดยาจากข้อมือ"
  body: "แอปนาฬิกาแสดงวงจรนับถอยหลังถึงขนาดยาถัดไป และบอกว่าการเตือนครั้งถัดไปถึงเมื่อใด Dial Pro บันทึกจากหน้าจอนั้น ตั้งปริมาณด้วย Digital Crown เลือกจุดฉีด แล้วยืนยัน รายการซิงค์ไปยัง iPhone"
  checklist:
    - "วงจร สถานะขนาดยา และการเตือนถัดไปในพริบตา (ฟรี)"
    - "บันทึกขนาดยาจากข้อมือด้วย Digital Crown (Dial Pro)"
    - "วิดเจ็ตระดับโดยประมาณและขนาดยาถัดไปบนหน้าปัด รวมถึงบันทึกเร็วใน Smart Stack (Dial Pro)"
    - "บน iPhone Dial Pro ให้บันทึกแค่แตะครั้งเดียวจากศูนย์ควบคุม ปุ่มการทำงาน Siri หรือ Live Activity ในวันเตือน แผนฟรีเปิดแบบฟอร์มให้กรอก"

supporting:
  kicker: "คลังยาและการเตือน"
  heading: "คลังยา การเตือน และการนำเข้าอยู่ในบันทึกเดียวกัน"
  features:
    - title: "คลังยา"
      body: "ติดตามปากกาหรือไวอัลพร้อมความเข้มข้น ร้านยา วันหมดอายุ และเลขล็อต"
    - title: "การเตือนของคุณ"
      body: "สร้างการแจ้งเตือนรายวัน รายสัปดาห์ หรือทุก N วันตามตารางที่คุณตั้งไว้ ในวันขนาดยา บันทึกได้จากการแจ้งเตือน และ Live Activity อาจอยู่บนหน้าจอล็อกจนกว่าจะบันทึก"
    - title: "นำประวัติมาด้วย"
      body: "เปิดไฟล์ที่ส่งออกจากสมุดบันทึกยาอื่นที่ Dial รองรับ เพื่อนำเข้ารายการที่มีอยู่"

plans:
  kicker: "ฟรีและ Dial Pro"
  heading: "ใช้สมุดบันทึกหลักฟรี"
  body: "ย้ายไป Pro เมื่อต้องการกราฟระดับโดยประมาณ การส่งออก หรือบันทึกแค่แตะครั้งเดียวบน Apple Watch และ iPhone. ทุกแผน Dial Pro มีคุณสมบัติเดียวกัน"
  free_name: "ฟรี"
  free_summary: "บันทึกครบสำหรับยาที่ใช้อยู่หนึ่งชนิด"
  free_features:
    - "บันทึกขนาดยา จุดฉีด น้ำหนัก ผลข้างเคียง และรูปความคืบหน้า"
    - "ยาที่ใช้อยู่หนึ่งชนิดและการเตือนหนึ่งรายการ"
    - "รายการขนาดยาและน้ำหนัก คลัง การนำเข้า และภาพรวมบน Apple Watch"
    - "วิดเจ็ตนับถอยหลังและการเตือนที่เปิดแบบฟอร์ม"
  pro_name: Dial Pro
  pro_summary: "ระดับโดยประมาณ กราฟเต็ม การส่งออก และการบันทึกเร็ว"
  pro_features:
    - "กราฟระดับโดยประมาณและวิดเจ็ตหน้าจอโฮม"
    - "กราฟขนาดยาและน้ำหนักเต็ม แนวโน้มผลข้างเคียง และการเปรียบเทียบรูป"
    - "รายงาน PDF ส่งออก CSV ยาหลายชนิด และการเตือนหลายรายการ"
    - "บันทึกเร็วและ Complications บน Apple Watch รวมถึงบันทึกแค่แตะครั้งเดียวบน iPhone"
  options_label: "ตัวเลือกแผน Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "ครั้งเดียว"
  annual_name: "รายปี"
  annual_terms: "ต่อปี"
  monthly_name: "รายเดือน"
  monthly_terms: "ต่อเดือน"

privacy:
  kicker: "ความเป็นส่วนตัว"
  heading: "บันทึกอยู่บนเครื่อง"
  specs:
    - term: "บัญชี"
      detail: "ไม่มีบัญชี Dial เปิดแอปแล้วเริ่มบันทึก"
    - term: "การวิเคราะห์การใช้งาน"
      detail: "Dial ไม่รันการวิเคราะห์การใช้งานหรือเทเลเมทรี เราไม่วัดว่าคุณใช้แอปอย่างไร"
    - term: "เซิร์ฟเวอร์ของเรา"
      detail: "Zentsu ไม่มีเซิร์ฟเวอร์ที่เก็บหรืออ่านบันทึกของคุณ"
    - term: "การซิงค์แบบเลือกได้"
      detail: "เปิด iCloud ในแอป แล้วบันทึกจะซิงค์ผ่านฐาน CloudKit ส่วนตัวบนบัญชี Apple ของคุณ ไม่ได้ส่งมาหาเรา"
  body: "บันทึกยา ขนาดยา การเตือน และคลังอยู่บนเครื่อง รายการน้ำหนักเก็บแยกบนเครื่อง และการเข้าถึงสุขภาพเป็นทางเลือก ครอบคลุมเฉพาะน้ำหนักตัวเมื่อคุณอนุญาต เปลี่ยนสิทธิ์ได้ที่ตั้งค่า &gt; สุขภาพ"
  policy_link: "อ่านนโยบายความเป็นส่วนตัวของ Dial"
  policy_url: /th/dial/privacy/

availability:
  kicker: "ดาวน์โหลด Dial"
  heading: "มีใน App Store แล้ว"
  body: "Dial ดาวน์โหลดฟรี สมุดบันทึกหลักใช้ได้ตั้งแต่รายการแรก Dial Pro เพิ่มกราฟระดับโดยประมาณ กราฟเต็ม การส่งออก PDF และการบันทึกเร็วจาก Apple Watch และ iPhone"
