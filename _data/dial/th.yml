  heading: "ใช้ตัวติดตามหลักได้ฟรี"
  body: "Dial Pro เพิ่มกราฟระดับโดยประมาณ กราฟประวัติเต็ม การส่งออก และการบันทึกเร็วบน Apple Watch และ iPhone ทุกแผน Dial Pro มีคุณสมบัติเดียวกัน"
  free_name: "ฟรี"
  free_summary: "ฟรีสำหรับยาที่ใช้หนึ่งชนิด บันทึกขนาดยาไม่จำกัดจำนวน"
  free_features:
    - "บันทึกขนาดยา จุดฉีด น้ำหนัก ผลข้างเคียง และรูปความคืบหน้า"
    - "ยาที่ใช้อยู่หนึ่งชนิดและการเตือนหนึ่งรายการ"
    - "รายการขนาดยาและน้ำหนัก คลัง การนำเข้า และภาพรวมบน Apple Watch"
    - "วิดเจ็ตนับถอยหลังและการเตือนที่เปิดแบบฟอร์ม"
  pro_name: Dial Pro
