    - "Jeden aktívny liek a jedna pripomienka"
    - "Zoznamy dávok a hmotnosti, zásoby, importy a prehľad na Apple Watch"
    - "Widgety odpočtu a pripomienky, ktoré otvoria formulár záznamu"
  pro_name: Dial Pro
  pro_summary: "Odhadovaná hladina, úplné grafy, export a rýchly záznam."
  pro_features:
    - "Graf odhadovanej hladiny a widget na ploche"
    - "Úplné grafy dávok a hmotnosti, trendy nežiaducich účinkov a porovnanie fotiek"
    - "PDF správa, export CSV, viac liekov a viac pripomienok"
    - "Rýchly záznam a komplikácie na Apple Watch plus záznam jedným klepnutím na iPhone"
  options_label: "Voľby tarify Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "raz"
