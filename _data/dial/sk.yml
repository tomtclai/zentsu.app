hero:
  availability: "Teraz v App Store"
  headline_lead: "Súkromný záznam každej dávky."
  headline_accent: ""
  category: "Dial je záznam liekov GLP-1 pre iPhone a Apple Watch."
  detail: "Zapíš každú dávku s časom a miestom vpichu, na telefóne alebo na zápästí. Dial Pro vykreslí odhadovanú hladinu medzi dávkami a zloží PDF pre lekára. Záznamy ostanú v zariadení, alebo v tvojej súkromnej databáze iCloud, keď ju zapneš."
  free_line: Na stiahnutie zadarmo, účet zakladať nemusíš. Záznam dávok môžeš viesť bez limitu.
  secondary_cta: "Ako Dial funguje"
  qr_caption: "Naskenuj a otvor Dial v App Store na iPhone."
  platforms_label: "Platformy Dial a úložisko"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Ovládacie centrum a uzamknutá obrazovka"
    - "Voliteľné súkromné úložisko iCloud"
  legal: "Dial je osobný záznam. Nepočíta dávky a nenahrádza pokyny lekára. Dial Pro pridáva graf odhadovanej hladiny, úplnú históriu, export a rýchly záznam, popísané nižšie."

proof:
  label: "Prečo Dial"
  points:
    - "Krúžok cyklu a ďalšia pripomienka na Apple Watch"
    - "Otvorí sa bez účtu Dial"
    - "Možnosť Lifetime, jednorazový nákup"
    - "Odhadovaná hladina medzi dávkami (Dial Pro)"

level:
  kicker: "Dial Pro · Odhadovaná hladina"
  heading: "Odhadovaná hladina medzi dávkami podľa polčasu."
  body: "Dial vykreslí odhadovanú hladinu lieku v čase zo zaznamenaných dávok a hodnoty polčasu v aplikácii. Zmeňte rozsah a prezrite si týždeň, mesiac alebo šesť mesiacov vlastnej histórie."
  boundary_lead: "Je to odhad. Tak ho aj označujeme."
  boundary_body: "Graf modeluje štandardnú krivku poklesu z dávok, ktoré ste zaznamenali. Ukazuje, ako u vás dávky v čase prebiehajú. Nie je to nameraná hladina v krvi ani návrh, čo užiť ďalej. Dial nepočíta dávky. Metódu vysvetľuje priamo v aplikácii."

logging:
  kicker: "Rýchly záznam"
  heading: "Zapíš liek, dávku a miesto vpichu v jednom formulári."
  body: "Zapíšte liek, množstvo, dátum, čas, miesto vpichu a poznámky. Nedávne hodnoty predvyplnia ďalší záznam. Každé pole potvrdzujete sami. Dial pozná semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid, dulaglutid a exenatid pod obchodnými názvami a názvami balení používanými na Slovensku a prijme vlastný liek, ak predpísaný na zozname nie je."
  checklist:
    - "Upraviť záznam, keď sa niečo zmení"
    - "Miesto vpichu pri každej dávke"
    - "Záznamy hmotnosti vedľa časovej osi dávok"

history:
  kicker: "Dial Pro · História a trendy"
  heading: "Grafy dávok, hmotnosti a nežiaducich účinkov z vašich záznamov."
  body: "Zoznamy dávok, hmotnosti a nežiaducich účinkov ostávajú zadarmo. Dial Pro pridáva grafy."
  history_card_title: "História dávok a hmotnosti"
  history_card_note: "Prezrite si zmeny v rozsahu, ktorý zvolíte."
  side_effects_card_title: "Trendy nežiaducich účinkov"
  side_effects_card_note: "Prezrite si početnosť a závažnosť z existujúcej alebo importovanej histórie."

report:
  kicker: "Dial Pro · PDF správa"
  heading: "PDF zo záznamov na návštevu u lekára."
  card_title: "PDF správa na návštevu u lekára"
  body: "Vytvor PDF s históriou dávok, zmenami zaznamenaného množstva, miestami vpichu, vývojom hmotnosti a priebehom nežiaducich účinkov. Dial ho zostaví na zariadení. Zdieľaš ho, až sa rozhodneš: AirDrop, e-mail alebo tlač. Tú istú históriu exportuješ ako CSV."
  closing: "Inak ostane v telefóne. Hodí sa v chvíli, keď záznam musíte vziať so sebou."
  smallprint: "Správa zhŕňa vaše záznamy. Nie je to zdravotnícka dokumentácia ani liečebný plán."

watch:
  kicker: Apple Watch
  heading: "Zaznamenajte dávku zo zápästia."
  body: "Aplikácia na hodinkách ukazuje krúžok cyklu, ktorý odpočítava dni do ďalšej dávky, a kedy príde ďalšia pripomienka. Z tej obrazovky v Dial Pro dávku zapíšete. Množstvo nastavíte pomocou Digital Crown, zvolíte miesto vpichu a potvrdíte. Záznam sa prenesie na iPhone."
  checklist:
    - "Krúžok cyklu, stav dávky a ďalšia pripomienka na prvý pohľad (zadarmo)"
    - "Záznam dávky zo zápästia s Digital Crown (Dial Pro)"
    - "Widgety odhadovanej hladiny a ďalšej dávky na ciferníku plus rýchly záznam v Smart Stack (Dial Pro)"
    - "Na iPhone Dial Pro zapne záznam jedným klepnutím z Ovládacieho centra, akčného tlačidla, Siri alebo Live Activity v deň pripomienky. Vo verzii zadarmo sa otvorí formulár záznamu."

supporting:
  kicker: "Všetko v zázname"
  heading: "História, správa, zásoby, pripomienky a import na jednom mieste."
  features:
    - title: "Zásoby"
      body: "Sledujte perá alebo liekovky s koncentráciou, lekárňou, dátumom exspirácie a číslom šarže."
    - title: "Vaše pripomienky"
      body: "Vytvorte denné, týždenné alebo každých N dní oznámenia podľa plánu, ktorý nastavíte. V deň dávky je na oznámení akcia na záznam a Live Activity môže ostať na uzamknutej obrazovke, kým nezaznamenáte."
    - title: "Importujte existujúce záznamy"
      body: "Otvorte v Dial kompatibilný export z iného denníka liekov a naimportujte existujúce záznamy."

