  heading: "Základný denník používajte zadarmo."
  body: "Do Pro prejdete kvôli grafu odhadovanej hladiny, exportu alebo záznamu jedným klepnutím na Apple Watch a iPhone. Každá tarifa Dial Pro obsahuje rovnaké funkcie."
