privacy:
  kicker: "Súkromie"
  heading: "Jasné, čo ostane na zariadení."
  specs:
    - term: "Účty"
      detail: "Účet Dial neexistuje. Otvorte aplikáciu a začnite zaznamenávať."
    - term: "Analytika"
      detail: "Dial nespúšťa analytiku používania ani telemetriu. Nemeriame, ako aplikáciu používate."
    - term: "Naše servery"
      detail: "Zentsu neprevádzkuje žiadny server, ktorý by ukladal alebo čítal vaše záznamy."
    - term: "Voliteľná synchronizácia"
      detail: "Zapnite iCloud v aplikácii a záznamy sa synchronizujú cez súkromnú databázu CloudKit na vašom Apple Account, nie k nám."
  body: "Záznamy lieku, dávky, pripomienky a zásob ostávajú na zariadení. Záznamy hmotnosti používajú samostatné miestne úložisko a prístup k Zdraviu je voliteľný a týka sa len telesnej hmotnosti, keď udelíte oprávnenie."
  policy_link: "Prečítať zásady ochrany osobných údajov Dial"
  policy_url: /sk/dial/privacy/

availability:
  kicker: "Stiahnuť Dial"
  heading: "Teraz v App Store."
  body: "Dial je na stiahnutie zadarmo. Základný denník funguje od prvého záznamu. Dial Pro pridáva graf odhadovanej hladiny, úplné grafy, export PDF a rýchly záznam z Apple Watch a iPhonu."

