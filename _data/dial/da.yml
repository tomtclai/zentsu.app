hero:
  availability: "Nu i App Store"
  headline_lead: "Privat notat over hver dosis."
  headline_accent: ""
  category: "Dial er et GLP-1-medicinoverblik til iPhone og Apple Watch."
  detail: "Registrer hver dosis med tid og injektionssted, på telefonen eller håndleddet. Dial Pro tegner et estimeret niveau mellem doserne og laver en PDF til din læge. Posterne bliver på enheden, eller i din egen private iCloud-database, hvis du slår det til."
  free_line: Gratis at hente, uden konto. Dosislogget har intet loft.
  secondary_cta: "Sådan virker Dial"
  qr_caption: "Scan for at åbne Dial i App Store på din iPhone."
  platforms_label: "Dial-platforme og lagring"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Kontrolcenter og låseskærm"
    - "Valgfri privat iCloud-lagring"
  legal: "Dial er et personligt notat. Den beregner ikke doser og erstatter ikke vejledning fra din læge. Dial Pro tilføjer grafen for estimeret niveau, den fulde historik, eksport og hurtig registrering, som beskrevet nedenfor."

proof:
  label: "Hvorfor Dial"
  points:
    - "Cyklusring og næste påmindelse på Apple Watch"
    - "Åbner uden en Dial-konto"
    - "Livstidsvalg, ét køb"
    - "Estimeret niveau mellem doser (Dial Pro)"

level:
  kicker: "Dial Pro · Estimeret niveau"
  heading: "Se et estimeret niveau mellem doserne, ud fra halveringstiden."
  body: "Dial tegner et estimeret medicinniveau over tid ud fra dine registrerede doser og den halveringstid, appen viser. Skift intervallet for at se en uge, en måned eller seks måneder af din egen historik."
  boundary_lead: "Vi kalder det et skøn."
  boundary_body: "Grafen modellerer en standard eliminationskurve fra de doser, du har registreret. Den viser dine egne mønstre mellem doser. Det er et skøn, ikke en målt blodkoncentration, og ikke et forslag til, hvad du skal tage næste gang. Dial beregner ikke doser. Appen forklarer metoden fuldt ud."

logging:
  kicker: "Hurtig registrering"
  heading: "Registrer lægemiddel, dosis og injektionssted i én formular."
  body: "Notér lægemiddel, mængde, dato, tid, injektionssted og noter. De seneste værdier udfylder den næste post. Du skal stadig bekræfte hvert felt. Dial kender semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid (Saxenda, Victoza), dulaglutid og exenatid under de mærke- og pakningsnavne, der bruges i Danmark, og tager et eget lægemiddel, hvis dit ikke står på listen."
  checklist:
    - "Rediger en post, når noget ændrer sig"
    - "Behold injektionssteder knyttet til hver dosis"
    - "Behold vægtposter ved siden af dosishistorikken"

history:
  kicker: "Dial Pro · Historik og tendenser"
  heading: "Grafer for dosis, vægt og bivirkninger fra dine poster."
  body: "Lister over dosis, vægt og bivirkninger forbliver gratis. Dial Pro tilføjer graferne."
  history_card_title: "Dosis- og vægthistorik"
  history_card_note: "Gennemgå ændringer i det interval, du vælger."
  side_effects_card_title: "Bivirkningstendenser"
  side_effects_card_note: "Gennemgå hyppighed og alvorlighed fra eksisterende eller importeret historik."

report:
  kicker: "Dial Pro · PDF-rapport"
  heading: "En PDF af dine poster til et lægebesøg."
  card_title: "PDF-rapport til lægebesøget"
  body: "Lav en PDF med dosishistorik, ændringer i registreret mængde, injektionssteder, vægtudvikling og bivirkningsmønstre. Dial bygger den på din enhed, og du deler den kun, når du selv beslutter det, via AirDrop, e-mail eller udskrivning. Den samme historik eksporteres som CSV."
  closing: "Privat til hverdag. Nyttig i det øjeblik journalen skal væk fra telefonen."
  smallprint: "Rapporten sammenfatter dine poster. Den er ikke en patientjournal eller en behandlingsplan."

watch:
  kicker: Apple Watch
  heading: "Registrer dosen fra håndleddet."
  body: "Apple Watch-appen viser en cyklusring, der tæller ned til næste dosis, og hvornår næste påmindelse kommer. Dial Pro registrerer fra den skærm. Sæt mængden med Digital Crown, vælg injektionssted, og bekræft. Posten synkroniseres til iPhone."
  checklist:
    - "Cyklusring, dosisstatus og næste påmindelse med et blik (gratis)"
    - "Registrer en dosis fra håndleddet med Digital Crown (Dial Pro)"
    - "Widgets til estimeret niveau og næste dosis på urskiven, plus hurtig registrering i Smart Stack (Dial Pro)"
    - "På iPhone giver Pro registrering med ét tryk fra Kontrolcenter, handlingsknappen, Siri eller en Live Activity på påmindelsesdagen. Gratis handlinger åbner registreringsformularen."

supporting:
  kicker: "Alt i oversigten"
  heading: "Historik, rapport, lager, påmindelser og import samlet ét sted."
  features:
    - title: "Lagerbeholdning"
      body: "Hold styr på penne eller hætteglas med koncentration, apotek, udløbsdato og batchnummer."
    - title: "Dine påmindelser"
      body: "Opret påmindelser hver dag, hver uge eller hver N. dag efter den plan, du lægger. På dosisdagen kan du registrere fra notifikationen, og en Live Activity kan blive på låseskærmen, indtil du registrerer."
    - title: "Importér eksisterende poster"
      body: "Åbn en kompatibel eksport fra en medicinjournal i Dial for at importere eksisterende poster."

plans:
  kicker: "Gratis og Dial Pro"
  heading: "Brug kerneoverblikket gratis."
  body: "Dial Pro tilføjer grafen for estimeret niveau, de fulde historikgrafer, eksport og hurtig registrering på Apple Watch og iPhone. Hver Dial Pro-plan har de samme funktioner."
  free_name: "Gratis"
  free_summary: "Gratis til ét aktivt lægemiddel, uden loft over dosislogget."
  free_features:
    - "Registrer doser, injektionssteder, vægt, bivirkninger og fremgangsfotos"
    - "Ét aktivt lægemiddel og én påmindelse"
    - "Dosis- og vægtlister, lager, import og Apple Watch-overblikket"
    - "Nedtællingswidgets og påmindelser, der åbner registreringsformularen"
  pro_name: Dial Pro
  pro_summary: "Se niveauet mellem doserne, sæt hele historikken i grafer, og registrer fra håndleddet."
  cta_caption: "Hent gratis, og vælg en plan inde i appen."
  pro_features:
    - "Diagram for estimeret niveau og widget på hjemmeskærmen"
    - "Fulde dosis- og vægtdiagrammer, bivirkningstendenser og fotosammenligning"
    - "PDF-rapport, CSV-eksport, flere lægemidler og flere påmindelser"
    - "Hurtig registrering og komplikationer på Apple Watch, plus registrering med ét tryk på iPhone"
  options_label: "Dial Pro-planvalg"
  lifetime_name: "Lifetime"
  lifetime_terms: "én gang"
  annual_name: "Årlig"
  annual_terms: "pr. år"
  monthly_name: "Månedlig"
  monthly_terms: "pr. måned"

privacy:
  kicker: "Privatliv"
  heading: "Posterne bliver på din enhed."
  specs:
    - term: "Konti"
      detail: "Du behøver ingen Dial-konto for at begynde at registrere."
    - term: "Brugsanalyse"
      detail: "Dial indsamler ingen brugsanalyse eller telemetri."
    - term: "Vores servere"
      detail: "Zentsu driver ingen server, der gemmer eller læser dine poster."
    - term: "Valgfri synkronisering"
      detail: "Med iCloud bruger kerneposterne den private CloudKit-database på din Apple-konto, ikke vores servere."
  body: "Kerneposterne bliver på din enhed. Vægtposter og fremgangsfotos bruger et separat, kun lokalt lager."
  policy_link: "Læs Dial-privatlivspolitikken"
  policy_url: /da/dial/privacy/

availability:
  kicker: "Hent Dial"
  heading: "Nu i App Store."
  body: "Dial er gratis at hente, uden konto. Dial Pro tilføjer grafen for estimeret niveau, de fulde historikgrafer, PDF- og CSV-eksport og hurtig registrering fra Apple Watch og iPhone."

