hero:
  availability: "Şimdi App Store'da"
  headline_lead: "GLP-1 dozlarınız kayıtta."
  headline_accent: ""
  category: "Dial, iPhone ve Apple Watch için özel bir GLP-1 ilaç günlüğüdür."
  detail: "iPhone veya Apple Watch'ta doz kaydedin. Dial, kaydettiğiniz dozlardan tahmini düzeyi çizer. Kayıtlar cihazda kalır. iCloud'u açarsanız özel iCloud veritabanınızda da durur."
  secondary_cta: "Dial nasıl çalışır"
  platforms_label: "Dial platformları ve depolama"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Denetim Merkezi ve Kilit Ekranı"
    - "İsteğe bağlı özel iCloud depolama"
  legal: "Temel günlük ücretsizdir. Dial Pro grafik, dışa aktarma, birden fazla ilaç, anımsatıcı ve Apple cihazlarında tek dokunuşla kayıt ekler. Dial kişisel bir kayıttır. Doz hesaplamaz ve hekiminizin yönlendirmesinin yerini almaz."

proof:
  label: "Neden Dial"
  points:
    - "iPhone ve Apple Watch"
    - "Dial hesabı olmadan açılır"
    - "Lifetime seçeneği"
    - "Dozlarınızdan tahmini düzey"

level:
  kicker: "Dial Pro · Tahmini düzey"
  heading: "Grafik, kaydettiğiniz dozları kullanır."
  body: "Dial, kaydettiğiniz dozlardan ve uygulamada gösterilen yarı ömürden zaman içinde tahmini bir ilaç düzeyi çizer. Aralığı değiştirerek kendi geçmişinizin bir haftasını, bir ayını veya altı ayını incelersiniz."
  boundary_lead: "Bu bir tahmin. Bunu açıkça söylüyoruz."
  boundary_body: "Grafik, kaydettiğiniz dozlardan standart bir azalma eğrisi çizer. Dozlar arasındaki kendi örüntülerinizi gösterir. Ölçülmüş bir kan düzeyi değildir. Sonra ne alınacağına dair bir öneri de değildir. Dial doz hesaplamaz. Uygulama yöntemi baştan sona açıklar."

logging:
  kicker: "Hızlı kayıt"
  heading: "İlaç, miktar, yer ve not alanları tek formda."
  body: "İlaç, miktar, tarih, saat, enjeksiyon yeri ve notları yazın. Son değerler bir sonraki kaydı doldurur. Her alanı siz onaylarsınız. Dial, Ozempic, Wegovy, Mounjaro ve Zepbound ile çalışır."
  checklist:
    - "Bir şey değişince kaydı düzenleyin"
    - "Her dozun enjeksiyon yerini kaydedin"
    - "Kilo kayıtlarını doz geçmişinin yanında tutun"

history:
  kicker: "Dial Pro · Geçmiş ve eğilimler"
  heading: "Doz, kilo ve yan etki grafikleri kayıtlardan gelir."
  body: "Doz, kilo ve yan etki listeleri ücretsiz kalır. Dial Pro tam doz ve kilo grafikleri ekler. Yan etki eğilimleri, zaten kayıttaki yan etki kayıtlarından çıkar."
  history_card_title: "Doz ve kilo geçmişi"
  history_card_note: "Seçtiğiniz aralıktaki değişiklikleri inceleyin."
  side_effects_card_title: "Yan etki eğilimleri"
  side_effects_card_note: "Mevcut veya içe aktarılan geçmişten sıklık ve şiddeti inceleyin."

report:
  kicker: "Dial Pro · PDF raporu"
  heading: "Muayene için kayıtlarınızın PDF'i."
  body: "Doz geçmişi, kaydedilen miktardaki değişiklikler, enjeksiyon yerleri, kilo eğilimi ve yan etki örüntüleriyle bir PDF oluşturun. Dial bunu cihazda oluşturur. Paylaşmaya yalnızca siz karar verince AirDrop, e-posta veya yazıcıyı kullanırsınız."
  closing: "Başka zamanlarda özel kalır. Kaydı telefondan çıkarmanız gerektiğinde işe yarar."
  smallprint: "Rapor kayıtlarınızı özetler. Tıbbi kayıt veya tedavi planı değildir."

watch:
  kicker: Apple Watch
  heading: "Dozu bilekten kaydedin."
  body: "Saat uygulaması sonraki doza geri sayan bir döngü halkası ve sonraki anımsatıcının ne zaman geleceğini gösterir. Dial Pro o ekrandan kaydeder. Digital Crown ile miktarı ayarlayın, enjeksiyon yeri seçin, onaylayın. Kayıt iPhone'a gelir."
  checklist:
    - "Döngü halkası, doz durumu ve sonraki anımsatıcı bir bakışta (ücretsiz)"
    - "Digital Crown ile bilekten doz kaydı (Dial Pro)"
    - "Saat yüzünde tahmini düzey ve sonraki doz widget'ları, Smart Stack'te hızlı kayıt (Dial Pro)"
    - "iPhone'da Dial Pro; Denetim Merkezi, eylem düğmesi, Siri veya anımsatıcı günü Live Activity'den tek dokunuşla kaydı açar. Ücretsiz eylemler formu açar."

supporting:
  kicker: "Rutinin yanında"
  heading: "Stok, anımsatıcılar ve içe aktarma aynı kayıtta durur."
  features:
    - title: "Stok"
      body: "Kalem veya flakonları konsantrasyon, eczane, son kullanma tarihi ve parti numarasıyla izleyin."
    - title: "Anımsatıcılarınız"
      body: "Koyduğunuz programa göre günlük, haftalık veya her N günde bir bildirimler oluşturun. Doz günü bildiriminde kaydetme eylemi vardır ve Live Activity siz kaydedene dek Kilit Ekranı'nda kalabilir."
    - title: "Mevcut kayıtları içe aktarın"
      body: "Mevcut kayıtları aktarmak için Dial ile uyumlu bir ilaç günlüğü dışa aktarımını açın."

