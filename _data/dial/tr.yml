hero:
  availability: "Şimdi App Store'da"
  headline_lead: "Her dozun özel kaydı."
  headline_accent: ""
  category: "Dial, iPhone ve Apple Watch için bir GLP-1 ilaç kaydıdır."
  detail: "Her dozu saat ve enjeksiyon yeriyle kaydet, telefonda veya bilekte. Dial Pro dozlar arasındaki tahmini düzeyi çizer ve hekimin için bir PDF hazırlar. Kayıtlar cihazda kalır. iCloud'u açarsan kendi özel iCloud veritabanında da durur."
  free_line: Ücretsiz indir, hesap açmana gerek yok. Doz kaydının sınırı yok.
  secondary_cta: "Dial nasıl çalışır"
  qr_caption: "iPhone'unda App Store'da Dial'i açmak için tara."
  platforms_label: "Dial platformları ve depolama"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Denetim Merkezi ve Kilit Ekranı"
    - "İsteğe bağlı özel iCloud depolama"
  legal: "Dial kişisel bir kayıttır. Doz hesaplamaz ve hekiminin yönlendirmesinin yerini almaz. Dial Pro aşağıda anlatılan tahmini düzey grafiğini, tam geçmişi, dışa aktarmayı ve hızlı kaydı ekler."

proof:
  label: "Neden Dial"
  points:
    - "Apple Watch'ta döngü halkası ve sonraki anımsatıcı"
    - "Dial hesabı olmadan açılır"
    - "Ömür boyu seçenek, tek satın alma"
    - "Dozlar arasında tahmini düzey (Dial Pro)"

level:
  kicker: "Dial Pro · Tahmini düzey"
  heading: "Dozlar arasında tahmini düzeyi gör, yarı ömre göre."
  body: "Dial, kaydettiğiniz dozlardan ve uygulamada gösterilen yarı ömürden zaman içinde tahmini bir ilaç düzeyi çizer. Aralığı değiştirerek kendi geçmişinizin bir haftasını, bir ayını veya altı ayını incelersiniz."
  boundary_lead: "Bu bir tahmin. Bunu açıkça söylüyoruz."
  boundary_body: "Grafik, kaydettiğiniz dozlardan standart bir azalma eğrisi çizer. Dozlar arasındaki kendi örüntülerinizi gösterir. Ölçülmüş bir kan düzeyi değildir. Sonra ne alınacağına dair bir öneri de değildir. Dial doz hesaplamaz. Uygulama yöntemi baştan sona açıklar."

logging:
  kicker: "Hızlı kayıt"
  heading: "İlacı, dozu ve enjeksiyon yerini tek formda kaydet."
  body: "İlaç, miktar, tarih, saat, enjeksiyon yeri ve notları yazın. Son değerler bir sonraki kaydı doldurur. Her alanı siz onaylarsınız. Dial, semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro, Zepbound), liraglutid, dulaglutid ve eksenatidi ülkenizde kullanılan kutu adlarıyla tanır ve ilacınız listede yoksa adını kendiniz yazabilirsiniz."
  checklist:
    - "Bir şey değişince kaydı düzenleyin"
    - "Her dozun enjeksiyon yerini kaydedin"
    - "Kilo kayıtlarını doz geçmişinin yanında tutun"

history:
  kicker: "Dial Pro · Geçmiş ve eğilimler"
  heading: "Doz, kilo ve yan etki grafikleri kayıtlardan gelir."
  body: "Doz, kilo ve yan etki listeleri ücretsiz kalır. Dial Pro grafikleri ekler."
  history_card_title: "Doz ve kilo geçmişi"
  history_card_note: "Seçtiğiniz aralıktaki değişiklikleri inceleyin."
  side_effects_card_title: "Yan etki eğilimleri"
  side_effects_card_note: "Mevcut veya içe aktarılan geçmişten sıklık ve şiddeti inceleyin."

report:
  kicker: "Dial Pro · PDF raporu"
  heading: "Muayene için kayıtlarınızın PDF'i."
  card_title: "Muayene için PDF raporu"
  body: "Doz geçmişi, kaydedilen miktardaki değişiklikler, enjeksiyon yerleri, kilo eğilimi ve yan etki örüntüleriyle bir PDF oluştur. Dial bunu cihazda oluşturur. Paylaşmaya yalnızca sen karar verince AirDrop, e-posta veya yazıcıyı kullanırsın. Aynı geçmiş CSV olarak da dışa aktarılır."
  closing: "Başka zamanlarda özel kalır. Kaydı telefondan çıkarmanız gerektiğinde işe yarar."
  smallprint: "Rapor kayıtlarınızı özetler. Tıbbi kayıt veya tedavi planı değildir."

watch:
  kicker: Apple Watch
  heading: "Dozu bilekten kaydedin."
  body: "Saat uygulaması sonraki doza geri sayan bir döngü halkası ve sonraki anımsatıcının ne zaman geleceğini gösterir. Dial Pro o ekrandan kaydeder. Digital Crown ile miktarı ayarlayın, enjeksiyon yeri seçin, onaylayın. Kayıt iPhone'a gelir."
  checklist:
    - "Döngü halkası, doz durumu ve sonraki anımsatıcı bir bakışta (ücretsiz)"
    - "Digital Crown ile bilekten doz kaydı (Dial Pro)"
    - "Saat yüzünde tahmini düzey ve sonraki doz widget'ları, Smart Stack'te hızlı kayıt (Dial Pro)"
    - "iPhone'da Dial Pro; Denetim Merkezi, eylem düğmesi, Siri veya anımsatıcı günü Live Activity'den tek dokunuşla kaydı açar. Ücretsiz eylemler formu açar."

supporting:
  kicker: "Kaydın içindeki her şey"
  heading: "Geçmiş, rapor, stok, anımsatıcılar ve içe aktarma aynı yerde."
  features:
    - title: "Stok"
      body: "Kalem veya flakonları konsantrasyon, eczane, son kullanma tarihi ve parti numarasıyla izleyin."
    - title: "Anımsatıcılarınız"
      body: "Koyduğunuz programa göre günlük, haftalık veya her N günde bir bildirimler oluşturun. Doz günü bildiriminde kaydetme eylemi vardır ve Live Activity siz kaydedene dek Kilit Ekranı'nda kalabilir."
    - title: "Mevcut kayıtları içe aktarın"
      body: "Mevcut kayıtları aktarmak için Dial ile uyumlu bir ilaç günlüğü dışa aktarımını açın."

plans:
  kicker: "Ücretsiz ve Dial Pro"
  heading: "Temel kaydı ücretsiz kullan."
  body: "Dial Pro tahmini düzey grafiğini, tam geçmiş grafiklerini, dışa aktarmayı ve Apple Watch ile iPhone'da hızlı kaydı ekler. Her Dial Pro planı aynı özellikleri içerir."
  free_name: "Ücretsiz"
  free_summary: "Tek aktif ilaç için ücretsiz, doz kaydında sınır yok."
  free_features:
    - "Doz, enjeksiyon yeri, kilo, yan etki ve ilerleme fotoğraflarını kaydedin"
    - "Bir aktif ilaç ve bir anımsatıcı"
    - "Doz ve kilo listeleri, stok, içe aktarma ve Apple Watch bakışı"
    - "Geri sayım widget'ları ve formu açan anımsatıcılar"
  pro_name: Dial Pro
  pro_summary: "Dozlar arasındaki düzeyini gör, tüm geçmişini grafikleştir, bilekten kaydet."
  cta_caption: "Ücretsiz indir, sonra uygulamadan plan seç."
  pro_features:
    - "Tahmini düzey grafiği ve Ana Ekran widget'ı"
    - "Tam doz ve kilo grafikleri, yan etki eğilimleri ve fotoğraf karşılaştırması"
    - "PDF raporu, CSV dışa aktarma, birden fazla ilaç ve anımsatıcı"
    - "Apple Watch'ta hızlı kayıt ve Complications, iPhone'da tek dokunuşla kayıt"
  options_label: "Dial Pro plan seçenekleri"
  lifetime_name: "Lifetime"
  lifetime_terms: "bir kez"
  annual_name: "Yıllık"
  annual_terms: "yılda"
  monthly_name: "Aylık"
  monthly_terms: "ayda"

privacy:
  kicker: "Gizlilik"
  heading: "Kayıtlar cihazda kalır."
  specs:
    - term: "Hesaplar"
      detail: "Kayda başlamak için Dial hesabı gerekmez."
    - term: "Kullanım analizi"
      detail: "Dial kullanım analizi veya telemetri toplamaz."
    - term: "Sunucularımız"
      detail: "Zentsu senin kayıtlarını saklayan veya okuyan bir sunucu işletmez."
    - term: "İsteğe bağlı senkronizasyon"
      detail: "iCloud açıkken temel kayıtlar senin Apple hesabındaki özel CloudKit veritabanını kullanır, bizim sunucularımızı değil."
  body: "Temel kayıtlar cihazda kalır. Kilo girdileri ve ilerleme fotoğrafları ayrı yerel depolama kullanır."
  policy_link: "Dial gizlilik politikasını okuyun"
  policy_url: /tr/dial/privacy/

availability:
  kicker: "Dial'i indirin"
  heading: "Şimdi App Store'da."
  body: "Dial indirmesi ücretsizdir, hesap açmana gerek yok. Dial Pro tahmini düzey grafiği, tam geçmiş grafikleri, PDF ve CSV dışa aktarma ve Apple Watch ile iPhone'dan hızlı kayıt ekler."

