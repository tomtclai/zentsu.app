privacy:
  kicker: "Gizlilik"
  heading: "Kayıtlar cihazda kalır."
  specs:
    - term: "Hesaplar"
      detail: "Dial hesabı yoktur. Uygulamayı açın ve kaydetmeye başlayın."
    - term: "Kullanım analizi"
      detail: "Dial kullanım analizi veya telemetri toplamaz. Nasıl kullandığınızı ölçmeyiz."
    - term: "Sunucularımız"
      detail: "Zentsu kayıtlarınızı saklayan veya okuyan bir sunucu işletmez."
    - term: "İsteğe bağlı senkronizasyon"
      detail: "Uygulamada iCloud'u açın, kayıtlar kendi Apple hesabınızdaki özel CloudKit veritabanı üzerinden senkronize olur, bize değil."
  body: "İlaç, doz, anımsatıcı ve stok kayıtları cihazda kalır. Kilo girdileri ayrı yerel depolama kullanır ve Sağlık erişimi isteğe bağlıdır, izin verdiğinizde yalnızca vücut ağırlığını kapsar."
  policy_link: "Dial gizlilik politikasını okuyun"
  policy_url: /tr/dial/privacy/

availability:
  kicker: "Dial'i indirin"
  heading: "Şimdi App Store'da."
  body: "Dial indirmesi ücretsizdir. Temel günlük ilk kayıttan çalışır. Dial Pro tahmini düzey grafiği, tam grafikler, PDF dışa aktarma ve Apple Watch ile iPhone'dan hızlı kayıt ekler."
