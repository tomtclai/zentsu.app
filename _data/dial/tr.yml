  heading: "Temel günlüğü ücretsiz kullanın."
  body: "Daha ayrıntılı grafikler, dışa aktarma veya Apple aygıtlarında daha hızlı kayıt istediğinizde Pro'ya geçin. Her Dial Pro planı aynı özellikleri içerir."
  free_name: "Ücretsiz"
  free_summary: "Tek aktif ilaç için tam kayıt."
  free_features:
