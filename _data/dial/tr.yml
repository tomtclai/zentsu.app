hero:
  availability: "Şimdi App Store'da"
  headline_lead: "GLP-1 dozlarınız yazılı."
  headline_accent: ""
  category: "Dial, iPhone ve Apple Watch için özel bir GLP-1 ilaç günlüğüdür."
  detail: "iPhone veya Apple Watch'ta doz kaydedin, tuttuğunuz dozlardan oluşan tahmini düzeyi görün ve temel kayıtları cihazda veya özel iCloud veritabanınızda tutun."
  secondary_cta: "Dial nasıl çalışır"
  platforms_label: "Dial platformları ve depolama"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Denetim Merkezi ve kilit ekranı"
    - "İsteğe bağlı özel iCloud depolama"
  legal: "Temel günlük ücretsizdir. Dial Pro grafik, dışa aktarma, ek ilaç ve anımsatıcı ile Apple aygıtlarında tek dokunuşla kaydı ekler. Dial kişisel bir kayıttır. Doz hesaplamaz ve hekiminizin yönlendirmesinin yerini almaz."

proof:
  label: "Neden Dial"
  points:
    - "iPhone ve Apple Watch"
    - "Hesap yok, kullanım analizi yok"
    - "Lifetime seçeneği"
    - "Dozlarınızdan modellenen düzey"

level:
  kicker: "Dial Pro · Tahmini düzey"
  heading: "Kaydettiğiniz dozların daha net görünümü."
  body: "Dial, kaydedilen dozlardan ve uygulamada gösterilen yarı ömürden zaman içinde tahmini bir ilaç düzeyi çizer. Kendi geçmişinizin bir haftasını, bir ayını veya altı ayını incelemek için aralığı değiştirin."
  boundary_lead: "Bir tahmin, ve bunu söylüyoruz."
  boundary_body: "Grafik, kaydettiğiniz dozlardan standart bir azalma eğrisi modeller. Dozlar arasındaki kendi örüntülerinizi gösterir. Ölçülmüş bir kan düzeyi değildir ve sonra ne alınacağına dair bir öneri değildir. Dial doz hesaplamaz. Uygulama yöntemi tam açıklar."

logging:
  kicker: "Hızlı kayıt"
  heading: "Dozu ve onunla gelen her şeyi kaydedin."
  body: "Odaklı bir formda ilaç, miktar, tarih, saat, enjeksiyon yeri ve notları yazın. Son değerler sonraki girdiyi hızlandırır ve her alan sizin onayınıza kalır. Dial, hekiminiz Ozempic, Wegovy, Mounjaro veya Zepbound desin çalışır."
  checklist:
    - "Bir şey değişince girdiyi düzenleyin"
    - "Enjeksiyon yerlerini her doza bağlı tutun"
    - "Kilo girdilerini doz zaman çizelgesinin yanında tutun"

history:
  kicker: "Dial Pro · Geçmiş ve eğilimler"
  heading: "Kaydın tamamındaki örüntüyü inceleyin."
  body: "Doz, kilo ve yan etki listeleri ücretsiz kalır. Dial Pro tam doz ve kilo grafikleri ile zaten kayıttaki yan etki girdilerinden eğilimler ekler."
  history_card_title: "Doz ve kilo geçmişi"
  history_card_note: "Seçtiğiniz aralıktaki değişiklikleri inceleyin."
  side_effects_card_title: "Yan etki eğilimleri"
  side_effects_card_note: "Mevcut veya içe aktarılan geçmişten sıklık ve şiddeti inceleyin."

report:
  kicker: "Dial Pro · PDF raporu"
  heading: "Sonraki ziyarete tüm resmi götürün."
  body: "Doz geçmişi, kaydedilen miktardaki değişiklikler, enjeksiyon yerleri, kilo eğilimi ve yan etki örüntüleriyle bir PDF oluşturun. Dial bunu cihazda kurar ve AirDrop, e-posta veya yazdırma ile yalnızca siz karar verince paylaşırsınız."
  closing: "Geri kalan zamanda özel, kaydın telefondan çıkması gereken anda işe yarar."
  smallprint: "Rapor girdilerinizi özetler. Tıbbi kayıt veya tedavi planı değildir."

watch:
  kicker: Apple Watch
  heading: "Dozu bilekten kaydedin."
  body: "Saat uygulaması sonraki doza geri sayan bir döngü halkası ve sonraki anımsatıcının ne zaman düşeceğini gösterir. Dial Pro o bakışı tam kayda çevirir: Digital Crown ile miktarı ayarlayın, enjeksiyon yeri seçin, onaylayın. Girdi iPhone'a senkronize olur ve iki aygıtınız arasında kalır."
  checklist:
    - "Döngü halkası, doz durumu ve sonraki anımsatıcı bir bakışta (ücretsiz)"
    - "Digital Crown ile bilekten doz kaydı (Dial Pro)"
    - "Saat yüzünde tahmini düzey ve sonraki doz widget'ları, Smart Stack'te hızlı kayıt (Dial Pro)"
    - "iPhone'da Pro, Denetim Merkezi, eylem düğmesi, Siri veya anımsatıcı günü Live Activity'den tek dokunuşla kaydı açar. Ücretsiz eylemler formu açar."

supporting:
  kicker: "Rutinin çevresinde"
  heading: "Pratik ayrıntılar yakın durur."
  features:
    - title: "Stok"
      body: "Kalem veya flakonları konsantrasyon, eczane, son kullanma tarihi ve parti numarasıyla izleyin."
    - title: "Anımsatıcılarınız"
      body: "Koyduğunuz programın çevresinde günlük, haftalık veya her N günde bir bildirimler oluşturun. Doz gününde bildirimde kaydetme eylemi vardır ve Live Activity siz kaydedene dek kilit ekranında kalabilir."
    - title: "Geçmişi getirin"
      body: "Mevcut girdileri içe aktarmak için Dial ile uyumlu bir ilaç günlüğü dışa aktarmasını açın."

