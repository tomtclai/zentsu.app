  heading: "Temel günlüğü ücretsiz kullanın."
  body: "Tahmini düzey grafiği, dışa aktarma ve Apple Watch ile iPhone'da tek dokunuşla kayıt için Pro'ya geçin. Her Dial Pro planı aynı özellikleri içerir."
  free_name: "Ücretsiz"
  free_summary: "Tek aktif ilaç için tam kayıt."
  free_features:
