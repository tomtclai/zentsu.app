schema_description: "私人 GLP-1 用药日记，用来记录剂量、注射部位、体重、提醒和历史。"
app_store_badge_alt: "从 App Store 下载 Dial"

images:
  today:
    base: dial-web-today
    width: 1290
    height: 2160
