hero:
  availability: Nu beschikbaar in de App Store
  headline_lead: "GLP-1 privé bijhouden."
  headline_accent: ""
  category: Dial is een privé GLP-1-medicijndagboek voor iPhone en Apple Watch.
  detail:
    Leg een dosis vast op iPhone of Apple Watch. De geschatte spiegel is gebaseerd op die invoer.
    De gegevens blijven op het apparaat of in uw privé-iCloud.
  free_line: Gratis te downloaden. Aan het logboek zelf zit geen limiet.
  secondary_cta: Zo werkt Dial
  platforms_label: Dial-platforms en opslag
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Bedieningspaneel en toegangsscherm
    - Optionele privé-iCloud-opslag
  legal:
    Dial Pro voegt grafieken, export, meerdere medicijnen en herinneringen toe, plus
    vastleggen met één tik op Apple-apparaten. Dial is een persoonlijk logboek. Het
    berekent geen doses en vervangt geen aanwijzingen van uw voorschrijver.

proof:
  label: Waarom Dial
  points:
    - iPhone en Apple Watch
    - Opent zonder Dial-account
    - Lifetime-optie
    - Geschatte spiegel uit uw doses

level:
  kicker: Dial Pro · Geschatte spiegel
  heading: De grafiek gebruikt de doses die u al vastlegde.
  body:
    Dial toont een geschatte spiegel in de tijd op basis van de doses die u vastlegde
    en de halfwaardetijd in de app. Wijzig het bereik om een week, maand of zes maanden
    van uw eigen historie te bekijken.
  boundary_lead: Het blijft een schatting.
  boundary_body:
    De grafiek modelleert een standaard afnamecurve uit de doses die u vastlegde.
    U ziet uw eigen patronen tussen doses. Het is een schatting, geen vervanging van een gemeten bloedspiegel en geen suggestie van wat u daarna moet nemen. Dial berekent geen doses.
    De app legt de methode volledig uit.

logging:
  kicker: Snel vastleggen
  heading: Medicijn, hoeveelheid, injectieplaats en notities.
  body:
    Noteer medicijn, hoeveelheid, datum, tijd, injectieplaats en notities. Recente
    waarden vullen de volgende invoer. U bevestigt elk veld. Dial kent semaglutide
    (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound), liraglutide, dulaglutide en
    exenatide onder de merk- en verpakkingsnamen die in uw land gangbaar zijn, en
    neemt een eigen medicijn op als het uwe er niet bij staat.
  checklist:
    - Een invoer bewerken als iets verandert
    - Injectieplaatsen koppelen aan elke dosis
    - Gewicht naast de dosistijdlijn zetten

history:
  kicker: Dial Pro · Historie en trends
  heading: Grafieken van dosis, gewicht en bijwerkingen.
  body:
    Lijsten van dosis, gewicht en bijwerkingen blijven gratis. Dial Pro voegt volledige
    dosis- en gewichtsgrafieken toe, plus trends uit de bijwerkingen die al in uw
    logboek staan.
  history_card_title: Dosis- en gewichtshistorie
  history_card_note: Wijzigingen bekijken in het bereik dat u kiest.
  side_effects_card_title: Bijwerkingstrends
  side_effects_card_note: Frequentie en ernst bekijken uit bestaande of geïmporteerde historie.

report:
  kicker: Dial Pro · PDF-verslag
  heading: Een PDF voor het spreekuur.
  body:
    Maak een PDF met dosishistorie, wijzigingen in de vastgelegde hoeveelheid,
    injectieplaatsen, gewichtstrend en bijwerkingspatronen. Dial maakt het op uw apparaat,
    en u deelt het alleen als u dat wilt, via AirDrop, e-mail of afdrukken.
  closing:
    De rest van de tijd blijft het privé. U deelt het alleen als het logboek de telefoon moet
    verlaten.
  smallprint: Het verslag vat uw invoer samen. Het is geen medisch dossier en geen behandelplan.

watch:
  kicker: Apple Watch
  heading: De dosis vanaf de pols vastleggen.
  body: >-
    De Watch-app toont een cyclusring die aftelt tot de volgende dosis, en wanneer de
    volgende herinnering valt. Met Dial Pro legt u op dat scherm vast. Stel de hoeveelheid in
    met de Digital Crown, kies een injectieplaats en bevestig. De invoer synchroniseert
    met de iPhone.
  checklist:
    - Cyclusring, dosisstatus en volgende herinnering in één oogopslag (gratis)
    - Een dosis vanaf de pols vastleggen met de Digital Crown (Dial Pro)
    - Widgets voor geschatte spiegel en volgende dosis op de wijzerplaat, plus snel
      vastleggen in de slimme stapel (Dial Pro)
    - Op iPhone maakt Pro vastleggen met één tik mogelijk vanuit Bedieningspaneel,
      de Actieknop, Siri of een Live Activity op herinneringsdag. Gratis acties openen
      het formulier.

supporting:
  kicker: Bij de routine
  heading: Voorraad, herinneringen en import.
  features:
    - title: Voorraad
      body: Noteer pennen of flacons met concentratie, apotheek, houdbaarheidsdatum en lotnummer.
    - title: Uw herinneringen
      body:
        Maak dagelijkse of wekelijkse meldingen, of meldingen die elke N dagen herhalen,
        rond het schema dat u instelt. Op dosisdag heeft de melding een actie Dosis vastleggen, en een
        Live Activity kan op het toegangsscherm blijven tot u vastlegt.
    - title: Bestaande invoer importeren
      body: Importeer bestaande invoer uit een compatibele export van een medicijndagboek.

plans:
  kicker: Gratis en Dial Pro
  heading: Het dagboek zelf gratis gebruiken.
  body:
    Stap over op Pro voor de grafiek van de geschatte spiegel, export of vastleggen
    met één tik. Alle Dial Pro-opties bevatten dezelfde functies.
  free_name: Gratis
  free_summary: Een volledig logboek voor één actief medicijn.
  free_features:
    - Doses, injectieplaatsen, gewicht, bijwerkingen en voortgangsfoto's vastleggen
    - Eén actief medicijn en één herinnering
    - Dosis- en gewichtslijsten, voorraad, import en het overzicht op Apple Watch
    - Aftelwidgets en herinneringen die het formulier openen
  pro_name: Dial Pro
  pro_summary: De geschatte spiegel, volledige grafieken, export en snel vastleggen.
  pro_features:
    - Grafiek van de geschatte spiegel en beginschermwidget
    - Volledige dosis- en gewichtsgrafieken, bijwerkingstrends en fotovergelijking
    - PDF-verslag, CSV-export, meerdere medicijnen en meerdere herinneringen
    - Snel vastleggen en complicaties op Apple Watch, plus vastleggen met één tik op iPhone
  options_label: Dial Pro-keuzes
  lifetime_name: Lifetime
  lifetime_terms: eenmalig
  annual_name: Jaarlijks
  annual_terms: per jaar
  monthly_name: Maandelijks
  monthly_terms: per maand

privacy:
  kicker: Privacy
  heading: Gegevens blijven op het apparaat.
  specs:
    - term: Accounts
      detail: Er is geen Dial-account. Open de app en begin vast te leggen.
    - term: Analyses
      detail: Dial voert geen gebruiksanalyses of telemetrie uit. We meten niets over hoe u de app gebruikt.
    - term: Onze servers
      detail: Zentsu draait geen server die uw gegevens opslaat of leest.
    - term: Optionele synchronisatie
      detail:
        Zet iCloud in de app aan en gegevens synchroniseren via de privé-CloudKit-database
        van uw eigen Apple Account, niet naar ons.
  body:
    Medicijn, dosis, herinnering en voorraad blijven op het apparaat.     Gewicht
    staat in een aparte lokale opslag, en toegang tot Gezondheid is optioneel, alleen
    lichaamsgewicht wanneer u toestemming geeft.
  policy_link: Het Dial-privacybeleid lezen
  policy_url: /nl/dial/privacy/

availability:
  kicker: Dial downloaden
  heading: Nu beschikbaar in de App Store.
  body:
    Dial is gratis te downloaden. Het dagboek zelf werkt vanaf de eerste invoer.
    Dial Pro voegt de grafiek van de geschatte spiegel, volledige grafieken, PDF-export
    en snel vastleggen vanaf Apple Watch en iPhone toe.
