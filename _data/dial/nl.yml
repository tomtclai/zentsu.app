hero:
  availability: Nu beschikbaar in de App Store
  headline_lead: "Privérecord van elke dosis."
  headline_accent: ""
  category: Dial is een GLP-1-medicijntracker voor iPhone en Apple Watch.
  quick_answer: "Dial legt GLP-1-injecties en tabletten vast, waaronder Ozempic, Wegovy, Rybelsus, Mounjaro en voorgeschreven, door de apotheek bereide semaglutide of tirzepatide. Elke invoer bewaart de dosis, het tijdstip, de prikplek, je gewicht en de bijwerkingen. Het logboek op de telefoon is gratis, zonder account. Dial Pro voegt de grafiek van het geschatte niveau, vastleggen op de Apple Watch en export als PDF of CSV toe."
  detail: "Medicatiegegevens kunnen via je eigen iCloud synchroniseren. Gewicht en voortgangsfoto's blijven op je apparaat."
  free_line: Gratis te downloaden, zonder account. Het dosislog heeft geen limiet.
  secondary_cta: Zo werkt Dial
  qr_caption: Scan om Dial in de App Store op je iPhone te openen.
  platforms_label: Dial-platforms en opslag
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Bedieningspaneel en toegangsscherm
    - Optionele privé-iCloud-opslag
  legal: "Dial is een persoonlijk logboek, geen medisch advies."

proof:
  label: Waarom Dial
  points:
    - Cyclusring en volgende herinnering op Apple Watch
    - Opent zonder Dial-account
    - Lifetime-optie, één aankoop
    - Geschatte spiegel tussen doses (Dial Pro)

level:
  kicker: Dial Pro · Geschatte spiegel
  heading: Bekijk een geschatte spiegel tussen doses, op basis van de halfwaardetijd.
  body: "Dial tekent een geschatte spiegel op basis van de doses die je vastlegde en de halfwaardetijd in de app, voor injecteerbare medicijnen zoals Ozempic, Wegovy en Mounjaro. Tabletten zoals Rybelsus krijgen geen spiegelgrafiek: orale opname verschilt te sterk tussen mensen. Bekijk een week, een maand of zes maanden injectiegeschiedenis."
  boundary_lead: Het blijft een schatting.
  boundary_body:
    De grafiek modelleert opname en uitscheiding van elke semaglutide- of tirzepatide-dosis die je vastlegde, met de halfwaardetijd uit de bijsluiter. Je ziet je eigen patronen tussen doses. Het is een schatting, geen
    vervanging van een gemeten bloedspiegel. De app legt de methode volledig uit.

boundary:
  kicker: Wat Dial niet doet
  heading: Dial houdt het logboek bij. Je voorschrijver stelt de dosis vast.
  body: "Dial berekent geen doses, beveelt geen dosiswijziging aan en zegt niet wat je na een vergeten dosis moet doen. Het geschatte niveau is een schatting uit een eencompartimentmodel voor opname en uitscheiding van elke vastgelegde dosis, geen meting. De eenhedenomzetter voor door de apotheek bereide flacons rekent alleen met de mg en mg/ml die je invoert en stelt niets voor. Bespreek beslissingen over je medicatie met je voorschrijver of apotheker."

logging:
  kicker: Snel vastleggen
  heading: Leg medicijn, dosis en injectieplaats vast in één formulier.
  body: "Noteer medicijn, hoeveelheid, datum, tijdstip en notities. Bij injecties zoals Ozempic, Wegovy en Mounjaro leg je ook de prikplek vast. Tabletten zoals Rybelsus leg je vast zonder plek. Dial kent semaglutide, tirzepatide, liraglutide en dulaglutide onder de merknamen die in jouw land gangbaar zijn. Exenatide en voorgeschreven, door de apotheek bereide semaglutide of tirzepatide uit een flacon leg je ook vast. Staat jouw medicijn er niet bij, voeg het dan zelf toe."
  checklist:
    - Een invoer bewerken als iets verandert
    - Injectieplaatsen koppelen aan elke dosis
    - Gewicht naast de dosistijdlijn zetten

history:
  kicker: Dial Pro · Historie en trends
  heading: Grafieken van dosis, gewicht en bijwerkingen.
  body: Lijsten van dosis, gewicht en bijwerkingen blijven gratis. Dial Pro voegt de grafieken toe.
  history_card_title: Dosis- en gewichtshistorie
  history_card_note: Wijzigingen bekijken in het bereik dat je kiest.
  side_effects_card_title: Bijwerkingstrends
  side_effects_card_note: Frequentie en ernst bekijken uit bestaande of geïmporteerde historie.

report:
  kicker: Dial Pro · PDF-verslag
  heading: Een PDF voor het spreekuur.
  card_title: PDF-verslag voor het spreekuur
  body:
    Maak een PDF met dosishistorie, wijzigingen in de vastgelegde hoeveelheid,
    injectieplaatsen, gewichtstrend en bijwerkingspatronen. Dial maakt het op je apparaat,
    en je deelt het alleen als je dat wilt, via AirDrop, e-mail of afdrukken. Dezelfde
    historie exporteer je als CSV.
  closing:
    De rest van de tijd blijft het privé. Je deelt het alleen als het logboek de telefoon moet
    verlaten.
  smallprint: Het verslag vat je invoer samen. Het is geen medisch dossier en geen behandelplan.

watch:
  kicker: Apple Watch
  heading: De dosis vanaf de pols vastleggen.
  body: >-
    De Watch-app toont een cyclusring die aftelt tot de volgende dosis, en wanneer de
    volgende herinnering valt. Met Dial Pro leg je op dat scherm vast. Stel de hoeveelheid in
    met de Digital Crown, kies een injectieplaats en bevestig. De invoer synchroniseert
    met de iPhone.
  checklist:
    - Cyclusring, dosisstatus en volgende herinnering in één oogopslag (gratis)
    - Een dosis vanaf de pols vastleggen met de Digital Crown (Dial Pro)
    - Widgets voor geschatte spiegel en volgende dosis op de wijzerplaat, plus snel
      vastleggen in de slimme stapel (Dial Pro)
    - Op iPhone maakt Pro vastleggen met één tik mogelijk vanuit Bedieningspaneel,
      de Actieknop, Siri of een Live Activity op herinneringsdag. Gratis acties openen
      het formulier.

supporting:
  kicker: Alles in het overzicht
  heading: Historie, verslag, voorraad, herinneringen en import op één plek.
  features:
    - title: Voorraad
      body: Noteer pennen of flacons met concentratie, apotheek, houdbaarheidsdatum en lotnummer.
    - title: Je herinneringen
      body:
        Maak dagelijkse of wekelijkse meldingen, of meldingen die elke N dagen herhalen,
        rond het schema dat je instelt. Op dosisdag heeft de melding een actie Dosis vastleggen, en een
        Live Activity blijft op het toegangsscherm tot je vastlegt, maximaal 12 uur.
    - title: Bestaande invoer importeren
      body: Importeer bestaande invoer uit een compatibele export van een medicijndagboek.

plans:
  kicker: Gratis en Dial Pro
  heading: Gebruik de basis gratis.
  body:
    Dial Pro voegt de grafiek van de geschatte spiegel, de volledige historiegrafieken,
    export en snel vastleggen op Apple Watch en iPhone toe. Elk Dial Pro-plan heeft
    dezelfde functies.
  free_name: Gratis
  free_summary: Gratis voor één actief medicijn, zonder limiet op het dosislog.
  free_features:
    - Doses, injectieplaatsen, gewicht, bijwerkingen en voortgangsfoto's vastleggen
    - Eén actief medicijn en één herinnering
    - Dosis- en gewichtslijsten, voorraad, import en het overzicht op Apple Watch
    - Aftelwidgets en herinneringen die het formulier openen
  pro_name: Dial Pro
  pro_summary: Zie je spiegel tussen doses, zet je hele historie in grafieken en leg vast vanaf je pols.
  cta_caption: Download gratis, kies daarna een plan in de app.
  pro_features:
    - Grafiek van de geschatte spiegel en beginschermwidget
    - Volledige dosis- en gewichtsgrafieken, bijwerkingstrends en fotovergelijking
    - PDF-verslag, CSV-export, meerdere medicijnen en meerdere herinneringen
    - Snel vastleggen en complicaties op Apple Watch, plus vastleggen met één tik op iPhone
  options_label: Dial Pro-keuzes
  lifetime_name: Lifetime
  lifetime_terms: eenmalig
  annual_name: Jaarlijks
  annual_terms: per jaar
  annual_trial: "1 maand gratis, daarna {price} per jaar"
  monthly_name: Maandelijks
  monthly_terms: per maand

privacy:
  kicker: Privacy
  heading: Gegevens blijven op het apparaat.
  specs:
    - term: Accounts
      detail: Je hebt geen Dial-account nodig om te beginnen.
    - term: Analyses
      detail: Dial verzamelt geen gebruiksanalyses of telemetrie.
    - term: Onze servers
      detail: Zentsu draait geen server die je gegevens opslaat of leest.
    - term: Optionele synchronisatie
      detail:
        Met iCloud gebruiken de kerndata de privé-CloudKit-database op je Apple Account,
        niet onze servers.
  body: "Medicatie-, dosis-, herinnerings- en voorraadgegevens kunnen via je eigen iCloud synchroniseren als je dat aanzet. Gewicht blijft in een aparte lokale opslag, met optionele koppeling met de Gezondheid-app. Voortgangsfoto's blijven op je apparaat."
  policy_link: Het Dial-privacybeleid lezen
  policy_url: /nl/dial/privacy/

availability:
  kicker: Dial downloaden
  heading: Nu beschikbaar in de App Store.
  body:
    Dial is gratis te downloaden, zonder account. Dial Pro voegt de grafiek van de
    geschatte spiegel, de volledige historiegrafieken, PDF- en CSV-export en snel
    vastleggen vanaf Apple Watch en iPhone toe.

trademarks: "Ozempic, Wegovy, Rybelsus, Mounjaro, Byetta en Bydureon zijn handelsmerken van hun respectieve eigenaren. Zentsu is niet verbonden aan een farmaceutisch bedrijf."
