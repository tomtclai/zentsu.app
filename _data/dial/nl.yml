hero:
  availability: Nu beschikbaar in de App Store
  headline_lead: 'Uw GLP-1-routine,'
  headline_accent: op schrift.
  category: Dial is een privé GLP-1-medicijndagboek voor iPhone en Apple Watch.
  detail:
    Leg doses vast op iPhone of Apple Watch, zie een geschat niveau op basis van de doses
    die u vastlegt, en houd de kerngegevens op het apparaat of in uw privé-iCloud-database.
  secondary_cta: Zo werkt Dial
  platforms_label: Dial-platforms en opslag
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Bedieningspaneel en toegangsscherm
    - Optionele privé-iCloud-opslag
  legal:
    Het kerndagboek is gratis. Dial Pro voegt grafieken, export, meerdere medicijnen en
    herinneringen toe, plus vastleggen met één tik op Apple-apparaten. Dial is een
    persoonlijk logboek. Het berekent geen doses en vervangt geen aanwijzingen van uw
    voorschrijver.

proof:
  label: Waarom Dial
  points:
    - iPhone en Apple Watch
    - Geen accounts, geen analyses
    - Lifetime-optie
    - Gemodelleerde spiegel uit uw doses

level:
  kicker: Dial Pro · Geschatte spiegel
  heading: Een duidelijker beeld van de doses die u vastlegde.
  body:
    Dial maakt een geschatte medicijnspiegel in de tijd op basis van de doses die u vastlegde
    en de halfwaardetijd in de app. Wijzig het bereik om een week, maand of zes maanden
    van uw eigen historie te bekijken.
  boundary_lead: Een schatting, en dat zeggen we.
  boundary_body:
    De grafiek modelleert een standaard afnamecurve uit de doses die u vastlegde.
    U ziet uw eigen patronen tussen doses. Het is een schatting, geen vervanging van een gemeten bloedspiegel en geen suggestie van wat u daarna moet nemen. Dial berekent geen doses.
    De app legt de methode volledig uit.

logging:
  kicker: Snel vastleggen
  heading: Leg de dosis vast en alles wat erbij hoort.
  body:
    Noteer medicijn, hoeveelheid, datum, tijd, injectieplaats en notities in een gericht
    formulier. Uw recente waarden maken de volgende invoer sneller, en u bevestigt elk veld zelf. Dial werkt ongeacht of uw voorschrijver het Ozempic, Wegovy, Mounjaro
    of Zepbound noemt.
  checklist:
    - Een invoer bewerken als iets verandert
    - Prikplekken koppelen aan elke dosis
    - Gewichten naast de dosistijdlijn zetten

history:
  kicker: Dial Pro · Historie en trends
  heading: Bekijk het verloop over uw hele logboek.
  body:
    Lijsten van dosis, gewicht en bijwerkingen blijven gratis. Dial Pro voegt volledige
    dosis- en gewichtsdiagrammen toe, plus trends uit de bijwerkingen die al in uw
    logboek staan.
  history_card_title: Dosis- en gewichtshistorie
  history_card_note: Wijzigingen bekijken in het bereik dat u kiest.
  side_effects_card_title: Bijwerkingstrends
  side_effects_card_note: Frequentie en ernst bekijken uit bestaande of geïmporteerde historie.

report:
  kicker: Dial Pro · PDF-verslag
  heading: Het hele beeld meenemen naar uw volgende bezoek.
  body:
    Maak een pdf met dosishistorie, wijzigingen in de vastgelegde hoeveelheid,
    injectieplaatsen, gewichtstrend en bijwerkingspatronen. Dial maakt het op uw apparaat,
    en u deelt het alleen als u dat wilt, via AirDrop, e-mail of afdrukken.
  closing:
    Privé de rest van de tijd, en nuttig op het moment dat uw logboek de telefoon moet
    verlaten.
  smallprint: Het verslag vat uw invoer samen. Het is geen medisch dossier en geen behandelplan.

watch:
  kicker: Apple Watch
  heading: De dosis vanaf de pols vastleggen.
  body: >-
    De Watch-app toont een cyclusring die aftelt tot de volgende dosis en wanneer de
    volgende herinnering valt. Dial Pro maakt van die blik een volledig logboek: stel
    de hoeveelheid in met de Digital Crown, kies een injectieplaats, bevestig. De invoer
    synchroniseert met de iPhone en blijft op iPhone en Apple Watch staan.
  checklist:
    - Cyclusring, dosisstatus en volgende herinnering in één oogopslag (gratis)
    - Een dosis vanaf de pols vastleggen met de Digital Crown (Dial Pro)
    - Widgets voor geschatte spiegel en volgende dosis op de wijzerplaat, plus snel
      vastleggen in de Smart Stack (Dial Pro)
    - Op iPhone maakt Pro vastleggen met één tik mogelijk vanuit Bedieningspaneel,
      de Actieknop, Siri of een Live-activiteit op herinneringsdag. Gratis acties openen
      het formulier.

supporting:
  kicker: Rond de routine
  heading: De praktische details blijven dichtbij.
  features:
    - title: Voorraad
      body: Noteer pennen of flacons met concentratie, apotheek, houdbaarheidsdatum en lotnummer.
    - title: Uw herinneringen
      body:
        Maak dagelijkse of wekelijkse meldingen, of meldingen die elke N dagen herhalen,
        rond het schema dat u instelt. Op dosisdag zit een actie Dosis vastleggen op de melding, en een
        Live-activiteit kan op het toegangsscherm blijven tot u vastlegt.
    - title: Historie meenemen
      body: Open een compatibele export van een medicijndagboek met Dial om bestaande invoer te importeren.

plans:
  kicker: Gratis en Dial Pro
  heading: Het kerndagboek gratis gebruiken.
  body:
    Stap over op Pro voor uitgebreidere grafieken, export of sneller vastleggen op Apple-apparaten.
    Elk Dial Pro-abonnement bevat dezelfde functies.
  free_name: Gratis
  free_summary: Een volledig logboek voor één actief medicijn.
  free_features:
    - Doses, injectieplaatsen, gewicht, bijwerkingen en voortgangsfoto's vastleggen
    - Eén actief medicijn en één herinnering
    - Dosis- en gewichtslijsten, voorraad, import en de blik op Apple Watch
    - Aftelwidgets en herinneringen die het formulier openen
  pro_name: Dial Pro
  pro_summary: De geschatte spiegel, volledige diagrammen, export en snel vastleggen.
  pro_features:
    - Grafiek van de geschatte spiegel en beginschermwidget
    - Volledige dosis- en gewichtsdiagrammen, bijwerkingstrends en fotovergelijking
    - PDF-verslag, CSV-export, meerdere medicijnen en meerdere herinneringen
    - Snel vastleggen en complicaties op Apple Watch, plus vastleggen met één tik op iPhone
  options_label: Dial Pro-keuzes
  lifetime_name: Lifetime
  lifetime_terms: eenmalig
  annual_name: Jaarlijks
  annual_terms: per jaar
  monthly_name: Maandelijks
  monthly_terms: per maand
  price_note:
    Abonnementen verlengen tot u opzegt. Getoonde prijzen zijn Amerikaanse prijzen.
    De App Store toont uw lokale prijs vóór aankoop.

privacy:
  kicker: Privacy
  heading: Duidelijk over wat op het apparaat blijft.
  specs:
    - term: Accounts
      detail: Er is geen Dial-account. Open de app en begin vast te leggen.
    - term: Analyses
      detail: Dial voert geen gebruiksanalyses of telemetrie uit. We meten niets over hoe u de app gebruikt.
    - term: Onze servers
      detail: Zentsu draait geen server die uw gegevens opslaat of leest.
    - term: Optionele synchronisatie
      detail:
        Zet iCloud in de app aan en gegevens synchroniseren via de privé-CloudKit-database
        van uw eigen Apple Account, niet naar ons.
  body:
    Medicijn, dosis, herinnering en voorraad blijven op het apparaat. Gewichten
    gebruiken een aparte lokale opslag, en toegang tot Gezondheid is optioneel, alleen
    lichaamsgewicht wanneer u toestemming geeft.
  policy_link: Het Dial-privacybeleid lezen
  policy_url: /nl/dial/privacy/

availability:
  kicker: Dial downloaden
  heading: Nu beschikbaar in de App Store.
  body:
    Dial is gratis te downloaden. Het kerndagboek werkt vanaf de eerste invoer.
    Dial Pro voegt de grafiek van de geschatte spiegel, volledige diagrammen, pdf-export
    en snel vastleggen vanaf Apple Watch en iPhone toe.
  email_label: E-mailadres
  email_placeholder: uw@email.com
  submit: Versienotities ontvangen
  signup_note:
    Optioneel. Alleen nieuws over nieuwe versies. Geen open- of linktracking. Altijd uitschrijven.
  signup_privacy_link: Privacydetails
  signup_privacy_url: /privacy
  signup_help: Hulp nodig?
  signup_support_link: Dial-ondersteuning
  signup_support_url: /nl/dial/support/
