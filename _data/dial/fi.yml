privacy:
  kicker: "Tietosuoja"
  heading: "Kerromme suoraan, mikä jää laitteelle."
  specs:
    - term: "Tilit"
      detail: "Dial-tiliä ei ole. Avaa sovellus ja ala kirjata."
    - term: "Käyttöanalytiikka"
      detail: "Dial ei aja käyttöanalytiikkaa eikä telemetriaa. Emme mittaa, miten käytät sitä."
    - term: "Palvelimemme"
      detail: "Zentsu ei ylläpidä palvelinta, joka tallentaa tai lukee merkintäsi."
    - term: "Valinnainen synkronointi"
      detail: "Ota iCloud käyttöön sovelluksessa, niin merkinnät synkronoituvat yksityisen CloudKit-tietokannan kautta omalla Apple-tililläsi, ei meille."
  body: "Lääke, annos, muistutus ja varasto jäävät laitteelle. Painomerkinnät käyttävät erillistä paikallista tallennusta, ja pääsy Terveyteen on valinnainen ja kattaa vain kehonpainon, kun annat luvan."
  policy_link: "Lue Dialin tietosuojakäytäntö"
