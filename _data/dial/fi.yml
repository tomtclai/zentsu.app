hero:
  availability: "Nyt App Storessa"
  headline_lead: "GLP-1 rutiinisi,"
  headline_accent: "kirjattu."
  category: "Dial on yksityinen GLP-1-lääkepäiväkirja iPhonelle ja Apple Watchille."
  detail: "Kirjaa annokset iPhonella tai Apple Watchilla, katso arvioitu taso kirjaamistasi annoksista ja pidä ydintiedot laitteella tai yksityisessä iCloud-tietokannassa."
  secondary_cta: "Näin Dial toimii"
  platforms_label: "Dial-alustat ja tallennus"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Ohjauskeskus ja lukitusnäyttö"
    - "Valinnainen yksityinen iCloud-tallennus"
  legal: "Ydinpäiväkirja on ilmainen. Dial Pro lisää kaaviot, viennin, useita lääkkeitä ja muistutuksia sekä kirjauksen yhdellä napautuksella Apple-laitteilla. Dial on henkilökohtainen päiväkirja. Se ei laske annoksia eikä korvaa määrääjän ohjeita."

proof:
  label: "Miksi Dial"
  points:
    - "iPhone ja Apple Watch"
    - "Ei tilejä, ei käyttöanalytiikkaa"
    - "Elinikäinen vaihtoehto"
    - "Mallinnettu taso annoksistasi"

level:
  kicker: "Dial Pro · Arvioitu taso"
  heading: "Selkeämpi kuva kirjaamistasi annoksista."
  body: "Dial piirtää arvioidun lääketason ajan mittaan kirjaamistasi annoksista ja sovelluksessa näytetystä puoliintumisajasta. Vaihda väliä nähdäksesi viikon, kuukauden tai kuusi kuukautta omasta historiastasi."
  boundary_lead: "Arvio, ja sanomme sen."
  boundary_body: "Kaavio mallintaa tavanomaisen hajoamiskäyrän kirjaamistasi annoksista. Se auttaa huomaamaan omia kuvioitasi annosten välillä. Se ei ole mitattu veripitoisuus eikä ehdotus seuraavasta annoksesta. Dial ei laske annoksia. Sovellus selittää menetelmän kokonaan."

logging:
  kicker: "Nopea kirjaus"
  heading: "Kirjaa annos ja kaikki siihen kuuluva."
  body: "Kirjaa lääke, määrä, päivä, aika, pistoskohta ja muistiinpanot keskittyneessä lomakkeessa. Viimeisimmät arvot nopeuttavat seuraavaa merkintää, ja jokainen kenttä jää sinun vahvistettavaksesi. Dial toimii, kutsuipa määrääjä sitä Ozempiciksi, Wegovyksi, Mounjaroksi tai Zepboundiksi."
  checklist:
    - "Muokkaa merkintää, kun jokin muuttuu"
    - "Pidä pistoskohdat kunkin annoksen yhteydessä"
    - "Pidä painomerkinnät annosaikajanan rinnalla"

history:
  kicker: "Dial Pro · Historia ja trendit"
  heading: "Katso kuvio koko päiväkirjasta."
  body: "Annos-, paino- ja haittavaikutusluettelot pysyvät ilmaisina. Dial Pro lisää täydet annos- ja painokaaviot sekä trendit haittavaikutusmerkinnöistä, jotka ovat jo päiväkirjassa."
  history_card_title: "Annos- ja painohistoria"
  history_card_note: "Tarkastele muutoksia valitsemallasi välillä."
  side_effects_card_title: "Haittavaikutustrendit"
  side_effects_card_note: "Tarkastele esiintymistiheyttä ja vakavuutta olemassa olevasta tai tuodusta historiasta."

report:
  kicker: "Dial Pro · PDF-raportti"
  heading: "Ota koko kuva mukaan seuraavalle käynnille."
  body: "Luo PDF, jossa on annoshistoria, kirjatun määrän muutokset, pistoskohdat, painokehitys ja haittavaikutuskuvioita. Dial kokoaa sen laitteella, ja jaat sen vain kun päätät, AirDropilla, sähköpostilla tai tulostamalla."
  closing: "Yksityinen muun ajan, ja hyödyllinen sillä hetkellä kun päiväkirjan pitää poistua puhelimesta."
  smallprint: "Raportti tiivistää merkintäsi. Se ei ole potilaskertomus eikä hoitosuunnitelma."

watch:
  kicker: Apple Watch
  heading: "Kirjaa annos ranteesta."
  body: "Kellosovellus näyttää syklirenkaan, joka laskee seuraavaan annokseen, ja milloin seuraava muistutus osuu. Dial Pro tekee vilkaisusta täyden kirjauksen: aseta määrä Digital Crownilla, valitse pistoskohta ja vahvista. Merkintä synkronoituu iPhoneen ja jää kahden laitteesi väliin."
  checklist:
    - "Syklirengas, annostila ja seuraava muistutus yhdellä silmäyksellä (ilmainen)"
    - "Kirjaa annos ranteesta Digital Crownilla (Dial Pro)"
    - "Arvioidun tason ja seuraavan annoksen widgetit kellotaulussa sekä nopea kirjaus Smart Stackissa (Dial Pro)"
    - "iPhonessa Pro mahdollistaa kirjauksen yhdellä napautuksella Ohjauskeskuksesta, toimintopainikkeesta, Siristä tai muistutuspäivän Live-toiminnosta. Ilmaiset toiminnot avaavat kirjauslomakkeen."

supporting:
  kicker: "Rutiinin ympärillä"
  heading: "Käytännön tiedot pysyvät lähellä."
  features:
    - title: "Varasto"
      body: "Seuraa kyniä tai injektiopulloja pitoisuuden, apteekin, viimeisen käyttöpäivän ja eränumeron kanssa."
    - title: "Muistutuksesi"
      body: "Luo päivittäisiä, viikoittaisia tai N päivän välein toistuvia ilmoituksia asettamasi aikataulun ympärille. Annospäivänä ilmoituksessa on Kirjaa annos -toiminto, ja Live-toiminto voi jäädä lukitusnäyttöön, kunnes kirjaat."
    - title: "Ota historia mukaan"
      body: "Avaa yhteensopiva vienti lääkepäiväkirjasta Dialilla tuodaksesi olemassa olevat merkinnät."

