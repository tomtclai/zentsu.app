hero:
  availability: "Nyt App Storessa"
  headline_lead: "Pidä kirjaa GLP-1:stä."
  headline_accent: ""
  category: "Dial on yksityinen GLP-1-lääkepäiväkirja iPhonelle ja Apple Watchille."
  detail: "Kirjaa annos iPhonella tai Apple Watchilla. Dial piirtää arvioidun tason näiden merkintöjen perusteella. Tiedot jäävät laitteelle tai yksityiseen iCloud-tietokantaasi, jos otat sen käyttöön."
  free_line: Ilmainen lataus. Annoslokiin ei ole kattoa.
  secondary_cta: "Näin Dial toimii"
  platforms_label: "Dialin laitteet ja tallennus"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Ohjauskeskus ja lukitusnäyttö"
    - "Valinnainen yksityinen iCloud-tallennus"
  legal: "Dial Pro lisää kaaviot, viennin, useita lääkkeitä ja muistutuksia sekä mahdollisuuden kirjata yhdellä napautuksella Apple-laitteilla. Dial on henkilökohtainen päiväkirja. Se ei laske annoksia eikä korvaa määrääjän ohjeita."

proof:
  label: "Miksi Dial"
  points:
    - "iPhone ja Apple Watch"
    - "Aukeaa ilman Dial-tiliä"
    - "Kertamaksu"
    - "Taso mallinnetaan annoksistasi"

level:
  kicker: "Dial Pro · Arvioitu taso"
  heading: "Kaavio käyttää jo kirjaamiasi annoksia."
  body: "Dial piirtää arvioidun lääketason ajan mittaan kirjaamistasi annoksista ja sovelluksessa näytetystä puoliintumisajasta. Vaihda aikaväliä, niin näet viikon, kuukauden tai kuusi kuukautta omasta historiastasi."
  boundary_lead: "Se on arvio, ja kerromme sen suoraan."
  boundary_body: "Kaavio mallintaa tavanomaisen hajoamiskäyrän kirjaamistasi annoksista. Se näyttää omat kuviosi annosten välillä. Se ei ole mitattu veripitoisuus eikä ehdotus seuraavasta annoksesta. Dial ei laske annoksia. Sovellus selittää menetelmän kokonaan."

logging:
  kicker: "Nopea kirjaus"
  heading: "Lääke, määrä, pistoskohta ja muistiinpanot yhdessä lomakkeessa."
  body: "Kirjaa lääke, määrä, päivä, aika, pistoskohta ja muistiinpanot. Edelliset arvot esitäytetään seuraavaan merkintään. Vahvistat jokaisen kentän itse. Dial tunnistaa semaglutidin (Ozempic, Wegovy), tirtsepatidin (Mounjaro), liraglutidin (Saxenda, Victoza), dulaglutidin ja eksenatidin Suomessa käytetyillä kauppa- ja pakkausnimillä, ja ottaa oman lääkkeen, jos reseptissäsi oleva lääke ei ole listalla."
  checklist:
    - "Muokkaa merkintää, kun jokin muuttuu"
    - "Pistoskohta tallentuu jokaiseen annokseen"
    - "Painomerkinnät pysyvät annosaikajanan rinnalla"

history:
  kicker: "Dial Pro · Historia ja trendit"
  heading: "Annos-, paino- ja haittavaikutuskaaviot merkinnöistäsi."
  body: "Annos-, paino- ja haittavaikutusluettelot pysyvät ilmaisina. Dial Pro lisää täydet annos- ja painokaaviot sekä trendit haittavaikutusmerkinnöistä, jotka ovat jo päiväkirjassa."
  history_card_title: "Annos- ja painohistoria"
  history_card_note: "Tarkastele muutoksia valitsemallasi aikavälillä."
  side_effects_card_title: "Haittavaikutustrendit"
  side_effects_card_note: "Tarkastele esiintymistiheyttä ja vakavuutta jo kirjatuista tai tuoduista merkinnöistä."

report:
  kicker: "Dial Pro · PDF-raportti"
  heading: "PDF merkinnöistäsi vastaanotolle."
  body: "Luo PDF, jossa on annoshistoria, kirjatun määrän muutokset, pistoskohdat, painokehitys ja haittavaikutuskuviot. Dial kokoaa sen laitteella. Jaat sen vain, kun päätät: AirDropilla, sähköpostilla tai tulostamalla."
  closing: "Muuten se pysyy yksityisenä. Hyödyllinen juuri silloin, kun päiväkirja täytyy saada pois puhelimesta."
  smallprint: "Raportti tiivistää merkintäsi. Se ei ole potilaskertomus eikä hoitosuunnitelma."

watch:
  kicker: Apple Watch
  heading: "Kirjaa annos ranteesta."
  body: "Kellosovellus näyttää syklirenkaan, joka laskee päiviä seuraavaan annokseen, ja milloin seuraava muistutus tulee. Dial Prolla kirjaat suoraan tuolta näytöltä. Aseta määrä Digital Crownilla, valitse pistoskohta ja vahvista. Merkintä synkronoituu iPhoneen."
  checklist:
    - "Syklirengas, annoksen tila ja seuraava muistutus yhdellä silmäyksellä (ilmainen)"
    - "Kirjaa annos ranteesta Digital Crownilla (Dial Pro)"
    - "Arvioidun tason ja seuraavan annoksen widgetit kellotaulussa sekä nopea kirjaus Smart Stackissa (Dial Pro)"
    - "iPhonessa Prolla kirjaat yhdellä napautuksella Ohjauskeskuksesta, toimintopainikkeesta, Siristä tai muistutuspäivän Live Activity -näkymästä. Ilmaisessa versiossa toiminnot avaavat kirjauslomakkeen."

supporting:
  kicker: "Rutiinin tueksi"
  heading: "Varasto, muistutukset ja tuonti samassa päiväkirjassa."
  features:
    - title: "Varasto"
      body: "Seuraa kyniä tai injektiopulloja: pitoisuus, apteekki, viimeinen käyttöpäivä ja eränumero."
    - title: "Muistutuksesi"
      body: "Luo päivittäisiä, viikoittaisia tai N päivän välein toistuvia ilmoituksia asettamasi aikataulun mukaan. Annospäivänä ilmoituksessa on Kirjaa annos -toiminto, ja Live Activity voi jäädä lukitusnäyttöön, kunnes kirjaat."
    - title: "Tuo olemassa olevat merkinnät"
      body: "Tuo olemassa olevat merkinnät avaamalla yhteensopiva vienti toisesta lääkepäiväkirjasta."

