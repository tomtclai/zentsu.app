    - "Yksi aktiivinen lääke ja yksi muistutus"
    - "Annos- ja painoluettelot, varasto, tuonti ja yleisnäkymä Apple Watchissa"
    - "Lähtölaskentawidgetit ja muistutukset, jotka avaavat kirjauslomakkeen"
  pro_name: Dial Pro
