privacy:
  kicker: "Tietosuoja"
  heading: "Merkinnät jäävät laitteelle."
  specs:
    - term: "Tilit"
      detail: "Dial-tiliä ei ole. Avaa sovellus ja ala kirjata."
    - term: "Käyttöanalytiikka"
      detail: "Dial ei kerää käyttöanalytiikkaa eikä telemetriaa. Emme mittaa, miten käytät sitä."
    - term: "Palvelimemme"
      detail: "Zentsu ei ylläpidä palvelinta, joka tallentaa tai lukee merkintäsi."
    - term: "Valinnainen synkronointi"
      detail: "Ota iCloud käyttöön sovelluksessa, niin merkinnät synkronoituvat yksityisen CloudKit-tietokannan kautta omalla Apple-tililläsi, eivätkä ne tule meille."
  body: "Lääke, annos, muistutus ja varasto jäävät laitteelle. Painomerkinnät käyttävät erillistä paikallista tallennusta, ja pääsy Terveyteen on valinnainen ja kattaa vain kehonpainon, kun annat luvan."
  policy_link: "Lue Dialin tietosuojakäytäntö"
  policy_url: /fi/dial/privacy/

availability:
  kicker: "Lataa Dial"
  heading: "Nyt App Storessa."
  body: "Dialin lataaminen on ilmaista. Päiväkirjaa voi käyttää heti ensimmäisestä kirjauksesta. Dial Pro lisää arvioidun tason kaavion, täydet kaaviot, PDF-viennin ja nopean kirjauksen Apple Watchista ja iPhonesta."

