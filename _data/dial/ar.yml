hero:
  availability: "الآن في App Store"
  headline_lead: "جرعات GLP-1 في سجل خاص."
  headline_accent: ""
  category: "Dial دفتر جرعات GLP-1 على iPhone وApple Watch."
  detail: "سجّلوا الجرعة على iPhone أو Apple Watch. يرسم Dial مستوى مقدّراً من تلك السجلات. تبقى السجلات الأساسية على الجهاز، أو في قاعدة بيانات iCloud الخاصة بكم إن فعّلتموها."
  secondary_cta: "كيف يعمل Dial"
  platforms_label: "منصات Dial والتخزين"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri ومركز التحكم وشاشة القفل"
    - "تخزين iCloud خاص اختياري"
  legal: "السجل الأساسي مجاني. يضيف Dial Pro المخططات والتصدير وأدوية وتذكيرات إضافية والتسجيل بلمسة واحدة على أجهزة Apple. Dial سجل شخصي. لا يحسب الجرعات ولا يحل محل توجيه من وصف لكم الدواء."

proof:
  label: "لماذا Dial"
  points:
    - "iPhone وApple Watch"
    - "بلا حساب Dial"
    - "خيار مدى الحياة"
