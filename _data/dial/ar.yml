level:
  kicker: "Dial Pro · مستوى مقدّر"
  heading: "يستخدم المخطط الجرعات المسجّلة."
  body: "يرسم Dial مستوى دواء مقدّراً عبر الزمن من الجرعات المسجّلة وعمر النصف المعروض في التطبيق. غيّروا النطاق لمراجعة أسبوع أو شهر أو ستة أشهر من سجلكم."
  boundary_lead: "هذا تقدير، ونصرّح بذلك."
  boundary_body: "يرسم المخطط منحنى انخفاض قياسياً من الجرعات التي سجّلتموها. يظهر أنماطكم بين الجرعات. ليس مستوى دم مقاساً، وليس اقتراحاً لما تتناولون لاحقاً. Dial لا يحسب الجرعات. يشرح التطبيق الطريقة بالكامل."

logging:
  kicker: "تسجيل سريع"
  heading: "الدواء والكمية وموضع الحقن والملاحظات في نموذج واحد."
  body: "سجّلوا الدواء والكمية والتاريخ والوقت وموضع الحقن والملاحظات. تملأ القيم الأخيرة الإدخال التالي. تؤكّدون كل حقل. يعمل Dial مع Ozempic وWegovy وMounjaro وZepbound."
  checklist:
    - "عدّلوا إدخالاً عندما يتغيّر شيء"
    - "احفظوا موضع الحقن مع كل جرعة"
    - "أبقوا إدخالات الوزن بجانب الجدول الزمني للجرعات"

history:
  kicker: "Dial Pro · السجل والاتجاهات"
  heading: "مخططات الجرعة والوزن والآثار الجانبية."
  body: "قوائم الجرعة والوزن والآثار الجانبية تبقى مجانية. يضيف Dial Pro مخططات جرعة ووزن كاملة واتجاهات من إدخالات الآثار الجانبية الموجودة أصلاً في سجلكم."
  history_card_title: "سجل الجرعة والوزن"
  history_card_note: "راجعوا التغييرات في النطاق الذي تختارونه."
  side_effects_card_title: "اتجاهات الآثار الجانبية"
  side_effects_card_note: "راجعوا التكرار والشدة من السجل الحالي أو المستورد."

report:
  kicker: "Dial Pro · تقرير PDF"
  heading: "PDF من إدخالاتكم لزيارة العيادة."
  body: "أنشئوا PDF بسجل الجرعات وتغيّر الكمية المسجّلة ومواضع الحقن واتجاه الوزن وأنماط الآثار الجانبية. يبنيه Dial على جهازكم، وتشاركونه فقط عندما تقررون، عبر AirDrop أو البريد أو الطباعة."
  closing: "يبقى خاصاً في سائر الأيام، ويُفيد حين يحتاج السجل إلى مغادرة الهاتف."
  smallprint: "يلخص التقرير إدخالاتكم. ليس سجلاً طبياً ولا خطة علاج."

watch:
  kicker: Apple Watch
  heading: "سجّلوا الجرعة من المعصم."
  body: "يعرض تطبيق الساعة حلقة الدورة وهي تعدّ تنازلياً حتى الجرعة التالية وموعد التذكير التالي. يسجّل Dial Pro من تلك الشاشة. اضبطوا الكمية بـ Digital Crown، واختاروا موضع الحقن، ثم أكّدوا. يُزامَن الإدخال مع iPhone."
  checklist:
    - "حلقة الدورة وحالة الجرعة والتذكير التالي بنظرة (مجاني)"
    - "تسجيل جرعة من المعصم بـ Digital Crown (Dial Pro)"
    - "ودجات المستوى المقدّر والجرعة التالية على وجه الساعة، وتسجيل سريع في Smart Stack (Dial Pro)"
    - "على iPhone يتيح Pro التسجيل بلمسة من مركز التحكم أو زر الإجراء أو Siri أو Live Activity في يوم التذكير. الإجراءات المجانية تفتح نموذج التسجيل."

supporting:
  kicker: "مع الروتين"
  heading: "المخزون والتذكيرات والاستيراد في السجل نفسه."
  features:
    - title: "مخزون الدواء"
      body: "تتبّعوا الأقلام أو القوارير مع التركيز والصيدلية وتاريخ الانتهاء ورقم الدفعة."
    - title: "تذكيراتكم"
      body: "أنشئوا إشعارات يومية أو أسبوعية أو كل N أيام حول الجدول الذي تضعونه. في يوم الجرعة يوجد إجراء تسجيل على الإشعار، ويمكن أن يبقى Live Activity على شاشة القفل حتى تسجّلوا."
    - title: "استيراد سجلات موجودة"
      body: "افتحوا في Dial ملفاً مصدَّراً متوافقاً لاستيراد الإدخالات الحالية."

