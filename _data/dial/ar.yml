hero:
  availability: "الآن في App Store"
  headline_lead: "جرعات GLP-1 في سجل خاص."
  headline_accent: ""
  category: "Dial دفتر جرعات GLP-1 على iPhone وApple Watch."
  detail: "سجّلوا الجرعات على iPhone أو Apple Watch، واطلعوا على مستوى مقدّر يُبنى من الجرعات التي تسجّلونها، وأبقوا السجلات الأساسية على الجهاز أو في قاعدة iCloud الخاصة بكم."
  secondary_cta: "كيف يعمل Dial"
  platforms_label: "منصات Dial والتخزين"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri ومركز التحكم وشاشة القفل"
    - "تخزين iCloud خاص اختياري"
  legal: "سجل التتبع الأساسي مجاني. يضيف Dial Pro الرسوم والتصدير وأدوية وتذكيرات إضافية والتسجيل بلمسة واحدة على أجهزة Apple. Dial سجل شخصي. لا يحسب الجرعات ولا يحل محل توجيه من وصف الدواء."

proof:
  label: "لماذا Dial"
  points:
    - "iPhone وApple Watch"
    - "بدون حسابات، بدون تحليل استخدام"
    - "خيار مدى الحياة"
    - "مستوى مُنمذَج من جرعاتكم"

level:
  kicker: "Dial Pro · مستوى مقدّر"
  heading: "صورة أوضح للجرعات التي سجّلتموها."
  body: "يرسم Dial مستوى دواء مقدّراً عبر الزمن من الجرعات المسجّلة وعمر النصف المعروض في التطبيق. غيّروا النطاق لمراجعة أسبوع أو شهر أو ستة أشهر من سجلكم."
  boundary_lead: "تقدير، ونحن نقول ذلك."
  boundary_body: "ينمذج المخطط منحنى اضمحلال قياسياً من الجرعات التي سجّلتموها. يظهر أنماطكم بين الجرعات. ليس مستوى دم مقاساً وليس اقتراحاً لما تتناولون لاحقاً. Dial لا يحسب الجرعات. يشرح التطبيق الطريقة كاملة."

logging:
  kicker: "تسجيل سريع"
  heading: "سجّلوا الجرعة وكل ما معها."
  body: "سجّلوا الدواء والكمية والتاريخ والوقت وموضع الحقن والملاحظات في نموذج مركّز. القيم الأخيرة تسرّع الإدخال التالي، ويبقى كل حقل لتأكيدكم. يعمل Dial سواء سمّاه من وصف الدواء Ozempic أو Wegovy أو Mounjaro أو Zepbound."
  checklist:
    - "عدّلوا إدخالاً عندما يتغيّر شيء"
    - "أبقوا مواضع الحقن مربوطة بكل جرعة"
    - "أبقوا إدخالات الوزن بجانب خط زمن الجرعات"

history:
  kicker: "Dial Pro · السجل والاتجاهات"
  heading: "راجعوا النمط عبر السجل."
  body: "قوائم الجرعة والوزن والآثار الجانبية تبقى مجانية. يضيف Dial Pro مخططات جرعة ووزن كاملة واتجاهات من إدخالات الآثار الجانبية الموجودة أصلاً في سجلكم."
  history_card_title: "سجل الجرعة والوزن"
  history_card_note: "راجعوا التغييرات في النطاق الذي تختارونه."
  side_effects_card_title: "اتجاهات الآثار الجانبية"
  side_effects_card_note: "راجعوا التكرار والشدة من السجل الحالي أو المستورد."

report:
  kicker: "Dial Pro · تقرير PDF"
  heading: "خذوا الصورة كاملة إلى الزيارة التالية."
  body: "أنشئوا PDF بسجل الجرعات وتغيّر الكمية المسجّلة ومواضع الحقن واتجاه الوزن وأنماط الآثار الجانبية. يبنيه Dial على جهازكم، وتشاركونه فقط عندما تقررون، عبر AirDrop أو البريد أو الطباعة."
  closing: "خاص في بقية الوقت، ومفيد في اللحظة التي يحتاج فيها السجل إلى مغادرة الهاتف."
  smallprint: "يلخص التقرير إدخالاتكم. ليس سجلاً طبياً ولا خطة علاج."

watch:
  kicker: Apple Watch
  heading: "سجّلوا الجرعة من المعصم."
  body: "يعرض تطبيق الساعة حلقة دورة تعدّ تنازلياً حتى الجرعة التالية وموعد التذكير التالي. يحوّل Dial Pro تلك النظرة إلى تسجيل كامل: اضبطوا الكمية بـ Digital Crown، واختاروا موضع الحقن، وأكّدوا. يُزامَن الإدخال إلى iPhone ويبقى بين الجهازين."
  checklist:
    - "حلقة الدورة وحالة الجرعة والتذكير التالي بنظرة (مجاني)"
    - "تسجيل جرعة من المعصم بـ Digital Crown (Dial Pro)"
    - "ودجات المستوى المقدّر والجرعة التالية على وجه الساعة، وتسجيل سريع في Smart Stack (Dial Pro)"
    - "على iPhone يتيح Pro التسجيل بلمسة من مركز التحكم أو زر الإجراء أو Siri أو نشاط حي في يوم التذكير. الإجراءات المجانية تفتح نموذج التسجيل."

supporting:
  kicker: "حول الروتين"
  heading: "التفاصيل العملية تبقى قريبة."
  features:
    - title: "مخزون الإمداد"
      body: "تتبّعوا الأقلام أو القوارير مع التركيز والصيدلية وتاريخ الانتهاء ورقم الدفعة."
    - title: "تذكيراتكم"
      body: "أنشئوا إشعارات يومية أو أسبوعية أو كل N أيام حول الجدول الذي تضعونه. في يوم الجرعة يوجد إجراء تسجيل على الإشعار، ويمكن أن يبقى نشاط حي على شاشة القفل حتى تسجّلوا."
    - title: "أحضروا السجل"
      body: "افتحوا تصديراً متوافقاً من سجل أدوية مع Dial لاستيراد الإدخالات الحالية."

plans:
  kicker: "مجاني وDial Pro"
  heading: "استخدموا السجل الأساسي مجاناً."
  body: "انتقلوا إلى Pro عندما تريدون رسوماً أعمق أو تصديراً أو تسجيلاً أسرع على أجهزة Apple. كل خطة Dial Pro تتضمن الميزات نفسها."
  free_name: "مجاني"
  free_summary: "سجل كامل لدواء نشط واحد."
  free_features:
    - "تسجيل الجرعات ومواضع الحقن والوزن والآثار الجانبية وصور التقدّم"
    - "دواء نشط واحد وتذكير واحد"
    - "قوائم الجرعة والوزن والمخزون والاستيراد ونظرة Apple Watch"
    - "ودجات العد التنازلي وتذكيرات تفتح نموذج التسجيل"
  pro_name: Dial Pro
  pro_summary: "المستوى المقدّر والرسوم الكاملة والتصدير والتسجيل السريع."
  pro_features:
    - "مخطط المستوى المقدّر وودجة على الشاشة الرئيسية"
    - "مخططات جرعة ووزن كاملة واتجاهات آثار جانبية ومقارنة صور"
    - "تقرير PDF وتصدير CSV وأدوية متعددة وتذكيرات متعددة"
    - "تسجيل سريع وتعقيدات على Apple Watch، وتسجيل بلمسة على iPhone"
  options_label: "خيارات خطة Dial Pro"
  lifetime_name: "مدى الحياة"
  lifetime_terms: "مرة واحدة"
  annual_name: "سنوي"
  annual_terms: "في السنة"
  monthly_name: "شهري"
  monthly_terms: "في الشهر"

privacy:
  kicker: "الخصوصية"
  heading: "واضح ما يبقى على جهازكم."
  specs:
    - term: "حسابات"
      detail: "لا يوجد حساب Dial. افتحوا التطبيق وابدأوا التسجيل."
    - term: "تحليل الاستخدام"
      detail: "لا يشغّل Dial تحليل استخدام ولا قياساً عن بُعد. لا نقيس كيف تستخدمونه."
    - term: "خوادمنا"
      detail: "لا تشغّل Zentsu أي خادم يخزّن أو يقرأ سجلاتكم."
    - term: "مزامنة اختيارية"
      detail: "فعّلوا iCloud في التطبيق فتُزامَن السجلات عبر قاعدة CloudKit الخاصة على حساب Apple لديكم، لا إلينا."
  body: "سجلات الدواء والجرعة والتذكير والإمداد تبقى على الجهاز. إدخالات الوزن تستخدم مخزناً محلياً منفصلاً، والوصول إلى صحتي اختياري ويغطي وزن الجسم فقط عندما تمنحون الإذن."
  policy_link: "اقرأوا سياسة خصوصية Dial"
  policy_url: /ar/dial/privacy/

availability:
  kicker: "حمّلوا Dial"
  heading: "الآن في App Store."
  body: "Dial مجاني للتنزيل. يعمل السجل الأساسي من أول تسجيل. يضيف Dial Pro مخطط المستوى المقدّر والرسوم الكاملة وتصدير PDF والتسجيل السريع من Apple Watch وiPhone."

