privacy:
  kicker: "الخصوصية"
  heading: "تبقى السجلات على الجهاز."
  specs:
    - term: "حسابات"
      detail: "لا يوجد حساب Dial. افتحوا التطبيق وابدأوا التسجيل."
    - term: "تحليل الاستخدام"
      detail: "لا يشغّل Dial تحليل استخدام ولا قياساً عن بُعد. لا نقيس كيف تستخدمونه."
    - term: "خوادمنا"
      detail: "لا تشغّل Zentsu أي خادم يخزّن أو يقرأ سجلاتكم."
    - term: "مزامنة اختيارية"
      detail: "فعّلوا iCloud في التطبيق فتُزامَن السجلات عبر قاعدة بيانات CloudKit الخاصة على حساب Apple لديكم، لا إلينا."
  body: "سجلات الدواء والجرعة والتذكير والمخزون تبقى على الجهاز. إدخالات الوزن تستخدم مخزناً محلياً منفصلاً، والوصول إلى صحتي اختياري ويغطي وزن الجسم فقط عندما تمنحون الإذن."
  policy_link: "اقرأوا سياسة خصوصية Dial"
  policy_url: /ar/dial/privacy/

availability:
  kicker: "حمّلوا Dial"
  heading: "الآن في App Store."
  body: "Dial مجاني للتنزيل. يعمل السجل الأساسي من أول تسجيل. يضيف Dial Pro مخطط المستوى المقدّر والمخططات الكاملة وتصدير PDF والتسجيل السريع من Apple Watch وiPhone."

