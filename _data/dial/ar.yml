  heading: "استخدموا السجل الأساسي مجاناً."
  body: "انتقلوا إلى Pro من أجل مخطط المستوى المقدّر أو التصدير أو التسجيل بلمسة على Apple Watch وiPhone. كل خطة Dial Pro تتضمن الميزات نفسها."
