hero:
  availability: Jetzt im App Store
  headline_lead: "Ihr GLP-1-Tagebuch."
  headline_accent: ""
  category: "Für iPhone und Apple Watch. Die Einträge bleiben bei Ihnen."
  detail:
    Erfassen Sie eine Dosis auf iPhone oder Apple Watch. Der geschätzte Spiegel ergibt
    sich aus diesen Einträgen. Ihre Einträge bleiben auf dem Gerät oder, wenn Sie das
    einschalten, in Ihrer privaten iCloud-Datenbank.
  free_line: Kostenlos laden. Das Spritzenprotokoll hat kein Limit.
  secondary_cta: So funktioniert Dial
  platforms_label: Dial-Plattformen und Speicher
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Kontrollzentrum und Sperrbildschirm
    - Optionaler privater iCloud-Speicher
  legal:
    Dial Pro ergänzt Diagramme, Exporte, mehrere Medikamente und Erinnerungen sowie
    das Erfassen mit einem Tipp auf Apple-Geräten. Dial ist ein persönliches
    Protokoll. Es berechnet keine Dosen und ersetzt keine Hinweise Ihrer
    verschreibenden Person.

proof:
  label: Warum Dial
  points:
    - iPhone und Apple Watch
    - Ohne Dial-Konto starten
    - Einmalkauf auf Lebenszeit
    - Geschätzter Spiegel aus Ihren Dosen

level:
  kicker: Dial Pro · Geschätzter Spiegel
  heading: Das Diagramm nutzt die Dosen, die Sie bereits erfasst haben.
  body:
    Dial zeigt einen geschätzten Medikamentenspiegel über die Zeit. Grundlage sind Ihre
    erfassten Dosen und der in der App gezeigte Halbwertszeitwert. Ändern Sie den Zeitraum,
    um eine Woche, einen Monat oder sechs Monate Ihres eigenen Verlaufs anzusehen.
  boundary_lead: Es ist eine Schätzung. Das sagen wir auch so.
  boundary_body:
    Das Diagramm modelliert eine Standard-Abklingkurve aus den Dosen, die Sie erfasst haben.
    Es zeigt Ihre eigenen Muster zwischen den Dosen. Es ist eine Schätzung, kein Ersatz für
    einen gemessenen Blutspiegel und kein Vorschlag, was Sie als Nächstes nehmen. Dial berechnet
    keine Dosen. Die App erklärt die Methode vollständig.

logging:
  kicker: Schnelles Erfassen
  heading: Medikament, Menge, Injektionsstelle und Notizen in einem Formular.
  body:
    Halten Sie Medikament, Menge, Datum, Uhrzeit, Injektionsstelle und Notizen fest.
    Für den nächsten Eintrag sind die letzten Werte vorausgefüllt. Jedes Feld
    bestätigen Sie selbst. Dial kennt Semaglutid (Ozempic, Wegovy), Tirzepatid
    (Mounjaro, Zepbound), Liraglutid, Dulaglutid und Exenatid unter den in Ihrem
    Land gebräuchlichen Marken- und Packungsnamen und nimmt ein individuelles
    Medikament auf, wenn Ihres nicht gelistet ist.
  checklist:
    - Einen Eintrag bearbeiten, wenn sich etwas ändert
    - Injektionsstellen je Dosis speichern
    - Gewichtseinträge neben der Dosiszeitleiste behalten

history:
  kicker: Dial Pro · Verlauf und Trends
  heading: Dosis-, Gewichts- und Nebenwirkungsdiagramme aus Ihren Einträgen.
  body:
    Dosis-, Gewichts- und Nebenwirkungslisten bleiben kostenlos. Dial Pro ergänzt vollständige
    Dosis- und Gewichtsdiagramme sowie Trends aus den Nebenwirkungseinträgen, die schon
    in Ihrem Protokoll stehen.
  history_card_title: Dosis- und Gewichtsverlauf
  history_card_note: Änderungen in dem Zeitraum ansehen, den Sie wählen.
  side_effects_card_title: Nebenwirkungstrends
  side_effects_card_note: Häufigkeit und Schwere aus vorhandenem oder importiertem Verlauf ansehen.

report:
  kicker: Dial Pro · PDF-Bericht
  heading: Ein PDF Ihrer Einträge für den Arztbesuch.
  body: >-
    Erzeugen Sie ein PDF mit Dosisverlauf, Änderungen der erfassten Menge, Injektionsstellen,
    Gewichtstrend und Nebenwirkungsmustern. Dial erstellt es auf Ihrem Gerät, und Sie teilen
    es nur, wenn Sie das wollen: per AirDrop, per E-Mail oder als Ausdruck.
  closing:
    Sonst bleibt es privat. Nützlich wird es in dem Moment, in dem Ihr Protokoll das
    Telefon verlassen muss.
  smallprint: Der Bericht fasst Ihre Einträge zusammen. Er ist kein Krankenblatt und kein Behandlungsplan.

watch:
  kicker: Apple Watch
  heading: Die Dosis vom Handgelenk erfassen.
  body: >-
    Die Watch-App zeigt einen Zyklusring, der die Tage bis zur nächsten Dosis zählt, und wann die
    nächste Erinnerung fällig ist. Mit Dial Pro erfassen Sie die Dosis auf diesem Bildschirm. Die Menge
    stellen Sie mit der Digital Crown ein, wählen die Injektionsstelle und bestätigen.
    Der Eintrag wird mit dem iPhone synchronisiert.
  checklist:
    - Zyklusring, Dosisstatus und nächste Erinnerung auf einen Blick (kostenlos)
    - Eine Dosis vom Handgelenk mit der Digital Crown erfassen (Dial Pro)
    - Widgets zum geschätzten Spiegel und zur nächsten Dosis auf dem Zifferblatt, plus
      schnelles Erfassen im Smart Stack (Dial Pro)
    - Auf dem iPhone ermöglicht Pro das Erfassen mit einem Tipp aus Kontrollzentrum,
      Aktionstaste, Siri oder einer Live Activity am Erinnerungstag. Kostenlose Aktionen
      öffnen das Erfassungsformular.

supporting:
  kicker: Zur Routine
  heading: Bestand, Erinnerungen und Import im selben Protokoll.
  features:
    - title: Bestandsführung
      body: Pens oder Durchstechflaschen mit Konzentration, Apotheke, Ablaufdatum und Chargennummer führen.
    - title: Ihre Erinnerungen
      body:
        Legen Sie tägliche, wöchentliche oder alle N Tage Mitteilungen nach dem Plan an, den Sie festlegen.
        Am Dosistag hat die Mitteilung eine Aktion zum Erfassen, und eine Live Activity
        kann auf dem Sperrbildschirm bleiben, bis Sie erfassen.
    - title: Bestehende Einträge importieren
      body: Öffnen Sie einen kompatiblen Export eines Medikamententagebuchs mit Dial, um vorhandene Einträge zu importieren.

plans:
  kicker: Kostenlos und Dial Pro
  heading: Das Tagebuch kostenlos nutzen.
  body:
    Mit Pro kommen das Diagramm zum geschätzten Spiegel, Exporte und das Erfassen mit
    einem Tipp auf Apple Watch und iPhone dazu. Jeder Dial-Pro-Plan enthält dieselben
    Funktionen.
  free_name: Kostenlos
  free_summary: Ein vollständiges Protokoll für ein aktives Medikament.
  free_features:
    - Dosen, Injektionsstellen, Gewicht, Nebenwirkungen und Fortschrittsfotos erfassen
    - Ein aktives Medikament und eine Erinnerung
    - Dosis- und Gewichtslisten, Bestand, Importe und der Blick auf der Apple Watch
    - Countdown-Widgets und Erinnerungen, die das Erfassungsformular öffnen
  pro_name: Dial Pro
  pro_summary: Der geschätzte Spiegel, vollständige Diagramme, Exporte und schnelles Erfassen.
  pro_features:
    - Diagramm zum geschätzten Spiegel und Home-Bildschirm-Widget
    - Vollständige Dosis- und Gewichtsdiagramme, Nebenwirkungstrends und Fotovergleich
    - PDF-Bericht, CSV-Export, mehrere Medikamente und mehrere Erinnerungen
    - Schnelles Erfassen und Komplikationen auf der Apple Watch, plus Erfassen mit einem Tipp auf dem iPhone
  options_label: Dial-Pro-Planoptionen
  lifetime_name: Lebenszeit
  lifetime_terms: einmal
  annual_name: Jährlich
  annual_terms: pro Jahr
  monthly_name: Monatlich
  monthly_terms: pro Monat

privacy:
  kicker: Datenschutz
  heading: Einträge bleiben auf dem Gerät.
  specs:
    - term: Konten
      detail: Es gibt kein Dial-Konto. Öffnen Sie die App und beginnen Sie zu erfassen.
    - term: Analysen
      detail: Dial führt keine Nutzungsanalysen und keine Telemetrie. Wir messen nichts darüber, wie Sie die App nutzen.
    - term: Unsere Server
      detail: Zentsu betreibt keinen Server, der Ihre Einträge speichert oder liest.
    - term: Optionale Synchronisierung
      detail:
        Schalten Sie iCloud in der App ein, und Ihre Einträge synchronisieren sich über die
        private CloudKit-Datenbank Ihres eigenen Apple-Accounts, nicht zu uns.
  body:
    Medikament, Dosis, Erinnerung und Bestand bleiben auf Ihrem Gerät. Gewichtseinträge
    nutzen einen getrennten lokalen Speicher, und der Zugriff auf Gesundheit ist optional
    und umfasst nur das Körpergewicht, wenn Sie die Erlaubnis geben.
  policy_link: Die Dial-Datenschutzerklärung lesen
  policy_url: /de/dial/privacy/

availability:
  kicker: Dial holen
  heading: Jetzt im App Store.
  body:
    Dial können Sie kostenlos laden. Das Tagebuch funktioniert ab dem ersten Eintrag. Dial
    Pro ergänzt das Diagramm zum geschätzten Spiegel, vollständige Diagramme, PDF-Export und
    schnelles Erfassen von Apple Watch und iPhone.
