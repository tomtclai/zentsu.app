hero:
  availability: Jetzt im App Store
  headline_lead: "Dein Tagebuch für die Abnehmspritze."
  headline_accent: ""
  category: "Dial hält Dosen und Injektionsstellen deiner GLP-1-Medikamente auf dem iPhone fest."
  quick_answer: "Dial erfasst GLP-1-Injektionen und -Tabletten, darunter Ozempic, Wegovy, Rybelsus, Mounjaro und ärztlich verordnetes Semaglutid oder Tirzepatid aus der Rezeptur. Jeder Eintrag hält Dosis, Uhrzeit, Injektionsstelle, Gewicht und Nebenwirkungen fest. Das Tagebuch auf dem iPhone ist kostenlos und braucht kein Konto. Dial Pro ergänzt das Diagramm zum geschätzten Spiegel, das Erfassen auf der Apple Watch und den Export als PDF oder CSV."
  detail: "Erfasse Dosen kostenlos auf dem iPhone. Dial Pro ergänzt Einträge auf der Apple Watch, Diagramme und PDF-Exporte für die Praxis. Medikamenteneinträge können über deine eigene iCloud synchronisiert werden. Gewicht und Fortschrittsfotos bleiben lokal."
  free_line: "Kostenlos laden, ohne Konto. Die Anzahl deiner Dosiseinträge ist unbegrenzt."
  secondary_cta: So funktioniert Dial
  qr_caption: Scanne, um Dial im App Store auf deinem iPhone zu öffnen.
  platforms_label: Dial-Plattformen und Speicher
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Kontrollzentrum und Sperrbildschirm
    - Optionaler privater iCloud-Speicher
  legal:
    Dial ist ein persönliches Protokoll, kein medizinischer Rat. Dial Pro ergänzt das
    Erfassen auf der Watch, Diagramme und Exporte.

proof:
  label: Warum Dial
  points:
    - Zyklusring und nächste Erinnerung auf der Apple Watch
    - Öffnet ohne Dial-Konto
    - Lebenszeitoption, ein einmaliger Kauf
    - Geschätzter Spiegel zwischen den Dosen (Dial Pro)

level:
  kicker: Dial Pro · Geschätzter Spiegel
  heading: Den geschätzten Spiegel zwischen den Dosen sehen, anhand der Halbwertszeit.
  body: "Dial zeichnet den geschätzten Spiegel aus deinen Einträgen und der in der App angegebenen Halbwertszeit, für unterstützte Injektionspräparate wie Ozempic, Wegovy und Mounjaro. Für Tabletten wie Rybelsus gibt es keine Kurve: Die Aufnahme ins Blut unterscheidet sich zu stark zwischen Menschen. Wähle eine Woche, einen Monat oder sechs Monate Injektionsverlauf."
  boundary_lead: Es ist eine Schätzung. Das sagen wir auch so.
  boundary_body:
    Das Diagramm modelliert eine Standard-Abklingkurve aus den Semaglutid- oder Tirzepatid-Dosen,
    die du erfasst hast. Es zeigt deine eigenen Muster zwischen den Dosen. Es ist eine Schätzung,
    kein Ersatz für einen gemessenen Blutspiegel. Die App erklärt die Methode vollständig.

boundary:
  kicker: Was Dial nicht tut
  heading: Dial führt das Protokoll. Die Dosis legt deine verschreibende Person fest.
  body: "Dial berechnet keine Dosen, empfiehlt keine Dosisänderung und sagt dir nicht, was du nach einer vergessenen Dosis tun sollst. Der geschätzte Spiegel ist eine Schätzung aus einem Populationsmodell auf Basis deiner erfassten Dosen, keine Messung. Der Einheitenumrechner für Durchstechflaschen aus der Rezeptur rechnet nur mit den mg und mg/ml, die du eingibst, und schlägt keine Menge vor. Entscheidungen zur Medikation besprichst du mit deiner Praxis oder Apotheke."

logging:
  kicker: Schnelles Erfassen
  heading: Medikament, Dosis und Injektionsstelle in einem Formular erfassen.
  body: "Erfasse Medikament, Menge, Datum, Uhrzeit und Notizen. Bei Injektionen wie Ozempic, Wegovy und Mounjaro kommt die Stelle dazu. Tabletten wie Rybelsus erfasst du ohne Injektionsstelle. Dial kennt Semaglutid, Tirzepatid, Orforglipron, Liraglutid, Dulaglutid und Exenatid mit regionalen Markennamen, dazu ärztlich verordnetes Semaglutid oder Tirzepatid aus der Durchstechflasche. Fehlende Medikamente kannst du selbst anlegen."
  checklist:
    - Einen Eintrag bearbeiten, wenn sich etwas ändert
    - Injektionsstellen je Dosis speichern
    - Gewichtseinträge neben der Dosiszeitleiste behalten

history:
  kicker: Dial Pro · Verlauf und Trends
  heading: Dosis-, Gewichts- und Nebenwirkungsdiagramme aus Ihren Einträgen.
  body: Dosis-, Gewichts- und Nebenwirkungslisten bleiben kostenlos. Dial Pro ergänzt die Diagramme.
  history_card_title: Dosis- und Gewichtsverlauf
  history_card_note: Änderungen in dem Zeitraum ansehen, den Sie wählen.
  side_effects_card_title: Nebenwirkungstrends
  side_effects_card_note: Häufigkeit und Schwere aus vorhandenem oder importiertem Verlauf ansehen.

report:
  kicker: Dial Pro · PDF-Bericht
  heading: Ein PDF Ihrer Einträge für den Arztbesuch.
  card_title: PDF-Bericht für den Praxisbesuch
  body: >-
    Erzeuge ein PDF mit Dosisverlauf, Änderungen der erfassten Menge, Injektionsstellen,
    Gewichtstrend und Nebenwirkungsmustern. Dial erstellt es auf deinem Gerät, und du teilst
    es nur, wenn du das willst: per AirDrop, per E-Mail oder als Ausdruck. Denselben Verlauf
    exportierst du als CSV.
  closing:
    Sonst bleibt es privat. Nützlich wird es in dem Moment, in dem Ihr Protokoll das
    Telefon verlassen muss.
  smallprint: Der Bericht fasst Ihre Einträge zusammen. Er ist kein Krankenblatt und kein Behandlungsplan.

watch:
  kicker: Apple Watch
  heading: Die Dosis vom Handgelenk erfassen.
  body: >-
    Die Watch-App zeigt einen Zyklusring, der die Tage bis zur nächsten Dosis zählt, und wann die
    nächste Erinnerung fällig ist. Mit Dial Pro erfassen Sie die Dosis auf diesem Bildschirm. Die Menge
    stellen Sie mit der Digital Crown ein, wählen die Injektionsstelle und bestätigen.
    Der Eintrag wird mit dem iPhone synchronisiert.
  checklist:
    - Zyklusring, Dosisstatus und nächste Erinnerung auf einen Blick (kostenlos)
    - Eine Dosis vom Handgelenk mit der Digital Crown erfassen (Dial Pro)
    - Widgets zum geschätzten Spiegel und zur nächsten Dosis auf dem Zifferblatt, plus
      schnelles Erfassen im Smart Stack (Dial Pro)
    - Auf dem iPhone ermöglicht Pro das Erfassen mit einem Tipp aus Kontrollzentrum,
      Aktionstaste, Siri oder einer Live Activity am Erinnerungstag. Kostenlose Aktionen
      öffnen das Erfassungsformular.

supporting:
  kicker: Alles im Protokoll
  heading: Verlauf, Bericht, Bestand, Erinnerungen und Importe an einem Ort.
  features:
    - title: Bestandsführung
      body: "Behalte Pens, Durchstechflaschen und Tablettenbehälter mit Ablaufdatum im Blick. Scanne das Packungsetikett und prüfe die Angaben vor dem Speichern."
    - title: Ihre Erinnerungen
      body:
        Legen Sie tägliche, wöchentliche oder alle N Tage Mitteilungen nach dem Plan an, den Sie festlegen.
        Am Dosistag hat die Mitteilung eine Aktion zum Erfassen, und eine Live Activity
        kann auf dem Sperrbildschirm bleiben, bis Sie erfassen.
    - title: Bestehende Einträge importieren
      body: Öffnen Sie einen kompatiblen Export eines Medikamententagebuchs mit Dial, um vorhandene Einträge zu importieren.

plans:
  kicker: Kostenlos und Dial Pro
  heading: Die Basis kostenlos nutzen.
  body:
    Dial Pro ergänzt das Diagramm zum geschätzten Spiegel, die vollständigen
    Verlaufsdiagramme, Exporte und das schnelle Erfassen auf Apple Watch und iPhone.
    Jeder Dial-Pro-Plan enthält dieselben Funktionen.
  free_name: Kostenlos
  free_summary: Kostenlos für ein aktives Medikament, ohne Limit beim Dosiprotokoll.
  free_features:
    - Dosen, Injektionsstellen, Gewicht, Nebenwirkungen und Fortschrittsfotos erfassen
    - Ein aktives Medikament und eine Erinnerung
    - Dosis- und Gewichtslisten, Bestand, Importe und der Blick auf der Apple Watch
    - Countdown-Widgets und Erinnerungen, die das Erfassungsformular öffnen
  pro_name: Dial Pro
  pro_summary: Den Spiegel zwischen den Dosen sehen, den ganzen Verlauf als Diagramm und vom Handgelenk erfassen.
  cta_caption: Kostenlos laden, den Plan dann in der App wählen.
  pro_features:
    - Diagramm zum geschätzten Spiegel und Home-Bildschirm-Widget
    - Vollständige Dosis- und Gewichtsdiagramme, Nebenwirkungstrends und Fotovergleich
    - PDF-Bericht, CSV-Export, mehrere Medikamente und mehrere Erinnerungen
    - Schnelles Erfassen und Komplikationen auf der Apple Watch, plus Erfassen mit einem Tipp auf dem iPhone
  options_label: Dial-Pro-Planoptionen
  lifetime_name: Lebenszeit
  lifetime_terms: einmal
  annual_name: Jährlich
  annual_terms: pro Jahr
  monthly_name: Monatlich
  monthly_terms: pro Monat

privacy:
  kicker: Datenschutz
  heading: Einträge bleiben auf dem Gerät.
  specs:
    - term: Konten
      detail: Zum Erfassen brauchst du kein Dial-Konto.
    - term: Analysen
      detail: Dial erhebt keine Nutzungsanalysen und keine Telemetrie.
    - term: Unsere Server
      detail: Zentsu betreibt keinen Server, der Ihre Einträge speichert oder liest.
    - term: Optionale Synchronisierung
      detail:
        Mit iCloud nutzen die zentralen Einträge die private CloudKit-Datenbank auf deinem
        Apple-Account, nicht unsere Server.
  body: "Medikamente, Dosen, Erinnerungen und Vorräte können über deine eigene iCloud synchronisiert werden. Gewichtseinträge bleiben in einem separaten lokalen Speicher, mit optionaler Anbindung an Apple Health. Fortschrittsfotos bleiben auf deinem Gerät."
  policy_link: Die Dial-Datenschutzerklärung lesen
  policy_url: /de/dial/privacy/

availability:
  kicker: Dial holen
  heading: Jetzt im App Store.
  body:
    Dial kannst du kostenlos laden, ohne Konto. Dial Pro ergänzt das Diagramm zum
    geschätzten Spiegel, die vollständigen Verlaufsdiagramme, PDF- und CSV-Export und
    das schnelle Erfassen von Apple Watch und iPhone.

