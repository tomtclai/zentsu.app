  monthly_terms: "ανά μήνα"

privacy:
  kicker: "Απόρρητο"
  heading: "Οι εγγραφές μένουν στη συσκευή σας."
  specs:
    - term: "Λογαριασμοί"
      detail: "Δεν χρειάζεται λογαριασμός Dial για να αρχίσεις να καταγράφεις."
    - term: "Ανάλυση χρήσης"
      detail: "Το Dial δεν συλλέγει ανάλυση χρήσης ούτε τηλεμετρία."
    - term: "Οι διακομιστές μας"
      detail: "Η Zentsu δεν λειτουργεί διακομιστή που αποθηκεύει ή διαβάζει τις εγγραφές σου."
    - term: "Προαιρετικός συγχρονισμός"
      detail: "Με το iCloud ενεργό, οι βασικές εγγραφές χρησιμοποιούν την ιδιωτική βάση CloudKit στον λογαριασμό Apple σου, όχι τους διακομιστές μας."
  body: "Οι βασικές εγγραφές μένουν στη συσκευή σου. Οι εγγραφές βάρους και οι φωτογραφίες προόδου χρησιμοποιούν ξεχωριστή τοπική αποθήκευση."
  policy_link: "Διαβάστε την πολιτική απορρήτου του Dial"
  policy_url: /el/dial/privacy/

availability:
  kicker: "Λήψη Dial"
  heading: "Τώρα στο App Store."
  body: "Το Dial είναι δωρεάν στη λήψη, χωρίς λογαριασμό. Το Dial Pro προσθέτει το γράφημα εκτιμώμενου επιπέδου, τα γραφήματα πλήρους ιστορικού, εξαγωγή PDF και CSV, και γρήγορη καταγραφή από Apple Watch και iPhone."

