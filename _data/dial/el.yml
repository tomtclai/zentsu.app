schema_description: "Ιδιωτικό ημερολόγιο φαρμάκου GLP-1 για δόσεις, σημεία ένεσης, βάρος, υπενθυμίσεις και ιστορικό."
app_store_badge_alt: "Λήψη του Dial από το App Store"

images:
  today:
    base: dial-web-today-el
    width: 1290
    height: 2160
    alt: "Οθόνη Σήμερα του Dial με την επόμενη υπενθύμιση, το εκτιμώμενο επίπεδο φαρμάκου και κουμπί καταγραφής δόσης"
  level:
    base: dial-web-level-el
    width: 1290
    height: 1620
    alt: "Οθόνη εκτιμώμενου επιπέδου του Dial με χρονοδιάγραμμα από καταγεγραμμένες δόσεις"
  log_dose:
    base: dial-web-log-dose-el
    width: 1290
    height: 1800
    alt: "Φόρμα δόσης Dial με πεδία φαρμάκου, ποσότητας, ώρας και σημείου ένεσης"
  history:
    base: dial-web-history-el
    width: 1290
    height: 2640
    alt: "Ιστορικό Dial με γραφήματα δόσης και βάρους στο πέρασμα του χρόνου"
  side_effects:
    base: dial-web-side-effects-el
    width: 1290
    height: 2100
    alt: "Οθόνη τάσεων ανεπιθύμητων ενεργειών Dial Pro με εβδομαδιαία συχνότητα και σοβαρότητα από υπάρχουσες εγγραφές"
  report:
    base: dial-web-report-el
    width: 1836
    height: 2376
    alt: "Σελίδα της αναφοράς PDF του Dial Pro με ιστορικό δόσεων, εξέλιξη βάρους και ανεπιθύμητες ενέργειες για τον γιατρό σας"
  watch_glance:
    base: dial-web-watch-glance-el
    width: 792
    height: 968
    alt: "Το Dial στο Apple Watch με δακτύλιο που μετρά τις ημέρες έως την επόμενη δόση, την επόμενη υπενθύμιση και κουμπί καταγραφής"
  watch_logged:
    base: dial-web-watch-logged-el
    width: 792
    height: 968
    alt: "Το Dial στο Apple Watch επιβεβαιώνει καταγεγραμμένη δόση με σύμβολο επιβεβαίωσης και δείχνει ποσότητα και σημείο ένεσης"

hero:
  availability: "Τώρα στο App Store"
  headline_lead: "Ιδιωτικό αρχείο κάθε δόσης."
  headline_accent: ""
  category: "Το Dial είναι καταγραφή φαρμάκων GLP-1 για iPhone και Apple Watch."
  detail: "Καταγράφεις κάθε δόση με την ώρα και το σημείο ένεσης, στο τηλέφωνο ή στον καρπό. Το Dial Pro σχεδιάζει εκτιμώμενο επίπεδο ανάμεσα στις δόσεις και φτιάχνει PDF για τον γιατρό σου. Οι εγγραφές μένουν στη συσκευή, ή στην ιδιωτική βάση iCloud σου αν την ενεργοποιήσεις."
  free_line: Δωρεάν λήψη, χωρίς λογαριασμό. Το αρχείο δόσεων δεν έχει όριο.
  secondary_cta: "Δες πώς δουλεύει το Dial"
  qr_caption: "Σκανάρισε για να ανοίξεις το Dial στο App Store στο iPhone σου."
  platforms_label: "Πλατφόρμες και αποθήκευση Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Κέντρο ελέγχου και οθόνη κλειδώματος"
    - "Προαιρετική ιδιωτική αποθήκευση iCloud"
  legal: "Το Dial είναι προσωπικό αρχείο. Δεν υπολογίζει δόσεις και δεν αντικαθιστά την καθοδήγηση του γιατρού σου. Το Dial Pro προσθέτει το γράφημα εκτιμώμενου επιπέδου, το πλήρες ιστορικό, τις εξαγωγές και τη γρήγορη καταγραφή που περιγράφονται παρακάτω."

proof:
  label: "Γιατί Dial"
  points:
    - "Δακτύλιος αντίστροφης μέτρησης και επόμενη υπενθύμιση στο Apple Watch"
    - "Ανοίγει χωρίς λογαριασμό Dial"
    - "Επιλογή εφ' όρου ζωής, μία αγορά"
    - "Εκτιμώμενο επίπεδο ανάμεσα στις δόσεις (Dial Pro)"

level:
  kicker: "Dial Pro · Εκτιμώμενο επίπεδο"
  heading: "Δες εκτιμώμενο επίπεδο ανάμεσα στις δόσεις, με βάση τον χρόνο ημιζωής."
  body: "Το Dial σχεδιάζει εκτιμώμενο επίπεδο φαρμάκου στο πέρασμα του χρόνου από τις καταγεγραμμένες δόσεις και τον χρόνο ημίσειας ζωής που δείχνει η εφαρμογή. Αλλάξτε το εύρος για να δείτε μία εβδομάδα, έναν μήνα ή έξι μήνες του δικού σας ιστορικού."
  boundary_lead: "Εκτίμηση, και το λέμε."
  boundary_body: "Το γράφημα σχεδιάζει μια τυπική καμπύλη μείωσης από τις δόσεις που καταγράψατε. Δείχνει τα δικά σας μοτίβα ανάμεσα στις δόσεις. Είναι εκτίμηση, όχι μετρημένο επίπεδο αίματος ούτε πρόταση για την επόμενη δόση. Το Dial δεν υπολογίζει δόσεις. Η εφαρμογή εξηγεί ολόκληρη τη μέθοδο."

logging:
  kicker: "Γρήγορη καταγραφή"
  heading: "Καταγράφεις φάρμακο, δόση και σημείο ένεσης σε μία φόρμα."
  body: "Σημειώστε φάρμακο, ποσότητα, ημερομηνία, ώρα, σημείο ένεσης και σημειώσεις. Οι πρόσφατες τιμές προσυμπληρώνουν την επόμενη καταχώριση. Επιβεβαιώνετε κάθε πεδίο. Το Dial αναγνωρίζει σεμαγλουτίδη (Ozempic, Wegovy), τιρζεπατίδη (Mounjaro, Zepbound), λιραγλουτίδη, ντουλαγλουτίδη και εξενατίδη με τις ονομασίες συσκευασίας που ισχύουν στη χώρα σας, και δέχεται προσαρμοσμένο φάρμακο αν το δικό σας δεν είναι στη λίστα."
  checklist:
    - "Επεξεργαστείτε εγγραφή όταν κάτι αλλάζει"
    - "Κρατήστε το σημείο ένεσης μαζί με κάθε δόση"
    - "Κρατήστε τις εγγραφές βάρους δίπλα στο ιστορικό δόσεων"

history:
  kicker: "Dial Pro · Ιστορικό και τάσεις"
  heading: "Γραφήματα δόσης, βάρους και ανεπιθύμητων ενεργειών από τις εγγραφές σας."
  body: "Οι λίστες δόσης, βάρους και ανεπιθύμητων ενεργειών μένουν δωρεάν. Το Dial Pro προσθέτει τα γραφήματα."
  history_card_title: "Ιστορικό δόσης και βάρους"
  history_card_note: "Δείτε τις αλλαγές στο εύρος που επιλέγετε."
  side_effects_card_title: "Τάσεις ανεπιθύμητων ενεργειών"
  side_effects_card_note: "Δείτε συχνότητα και σοβαρότητα από υπάρχον ή εισαγμένο ιστορικό."

report:
  kicker: "Dial Pro · Αναφορά PDF"
  heading: "Ένα PDF των εγγραφών σας για την επίσκεψη."
  card_title: "Αναφορά PDF για την επίσκεψη"
  body: "Φτιάξε PDF με ιστορικό δόσεων, αλλαγές καταγεγραμμένης ποσότητας, σημεία ένεσης, τάση βάρους και μοτίβα ανεπιθύμητων ενεργειών. Το Dial το φτιάχνει στη συσκευή και το μοιράζεσαι μόνο όταν αποφασίσεις, μέσω AirDrop, email ή εκτύπωσης. Το ίδιο ιστορικό εξάγεται ως CSV."
  closing: "Τον υπόλοιπο χρόνο μένει ιδιωτικό. Χρήσιμο τη στιγμή που το αρχείο πρέπει να φύγει από το τηλέφωνο."
  smallprint: "Η αναφορά συνοψίζει τις εγγραφές σας. Δεν είναι ιατρικός φάκελος ούτε σχέδιο θεραπείας."

watch:
  kicker: Apple Watch
  heading: "Καταγράψτε τη δόση από τον καρπό."
  body: "Η εφαρμογή ρολογιού δείχνει δακτύλιο που μετρά αντίστροφα έως την επόμενη δόση και πότε πέφτει η επόμενη υπενθύμιση. Το Dial Pro καταγράφει από εκείνη την οθόνη. Ρυθμίστε την ποσότητα με Digital Crown, επιλέξτε σημείο ένεσης και επιβεβαιώστε. Η εγγραφή συγχρονίζεται στο iPhone."
  checklist:
    - "Δακτύλιος αντίστροφης μέτρησης, κατάσταση δόσης και επόμενη υπενθύμιση με μια ματιά (δωρεάν)"
    - "Καταγραφή δόσης από τον καρπό με Digital Crown (Dial Pro)"
    - "Γραφικά στοιχεία εκτιμώμενου επιπέδου και επόμενης δόσης στο καντράν, και γρήγορη καταγραφή στο Smart Stack (Dial Pro)"
    - "Στο iPhone το Pro επιτρέπει καταγραφή με ένα πάτημα από το Κέντρο ελέγχου, το κουμπί ενέργειας, το Siri ή μία Live Activity την ημέρα υπενθύμισης. Οι δωρεάν ενέργειες ανοίγουν τη φόρμα."

supporting:
  kicker: "Όλα στο αρχείο"
  heading: "Ιστορικό, αναφορά, απόθεμα, υπενθυμίσεις και εισαγωγές σε ένα μέρος."
  features:
    - title: "Απόθεμα"
      body: "Παρακολουθήστε πένες ή φιαλίδια με συγκέντρωση, φαρμακείο, ημερομηνία λήξης και αριθμό παρτίδας."
    - title: "Οι υπενθυμίσεις σας"
      body: "Δημιουργήστε ειδοποιήσεις ημερήσιες, εβδομαδιαίες ή κάθε N ημέρες, στο πρόγραμμα που ορίζετε. Την ημέρα δόσης υπάρχει ενέργεια καταγραφής στην ειδοποίηση, και μία Live Activity μπορεί να μείνει στην οθόνη κλειδώματος μέχρι να καταγράψετε."
    - title: "Εισαγωγή υπαρχουσών εγγραφών"
      body: "Ανοίξτε στο Dial μια συμβατή εξαγωγή από ημερολόγιο φαρμάκου για να εισαγάγετε υπάρχουσες εγγραφές."

plans:
  kicker: "Δωρεάν και Dial Pro"
  heading: "Χρησιμοποίησε τη βασική καταγραφή δωρεάν."
  body: "Το Dial Pro προσθέτει το γράφημα εκτιμώμενου επιπέδου, τα γραφήματα πλήρους ιστορικού, τις εξαγωγές και τη γρήγορη καταγραφή σε Apple Watch και iPhone. Κάθε πλάνο Dial Pro περιλαμβάνει τις ίδιες λειτουργίες."
  free_name: "Δωρεάν"
  free_summary: "Δωρεάν για ένα ενεργό φάρμακο, χωρίς όριο στο αρχείο δόσεων."
  free_features:
    - "Καταγραφή δόσεων, σημείων ένεσης, βάρους, ανεπιθύμητων ενεργειών και φωτογραφιών προόδου"
    - "Ένα ενεργό φάρμακο και μία υπενθύμιση"
    - "Λίστες δόσης και βάρους, απόθεμα, εισαγωγή και επισκόπηση στο Apple Watch"
    - "Γραφικά στοιχεία αντίστροφης μέτρησης και υπενθυμίσεις που ανοίγουν τη φόρμα"
  pro_name: Dial Pro
  pro_summary: "Δες το επίπεδό σου ανάμεσα στις δόσεις, όλο το ιστορικό σε γραφήματα, και καταγραφή από τον καρπό."
  cta_caption: "Κατέβασέ το δωρεάν, και διάλεξε πλάνο μέσα στην εφαρμογή."
  pro_features:
    - "Γράφημα εκτιμώμενου επιπέδου και γραφικό στοιχείο στην αρχική οθόνη"
    - "Πλήρη γραφήματα δόσης και βάρους, τάσεις ανεπιθύμητων ενεργειών και σύγκριση φωτογραφιών"
    - "Αναφορά PDF, εξαγωγή CSV, περισσότερα φάρμακα και περισσότερες υπενθυμίσεις"
    - "Γρήγορη καταγραφή και Complications στο Apple Watch, και καταγραφή με ένα πάτημα στο iPhone"
  options_label: "Επιλογές πλάνου Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "μία φορά"
  annual_name: "Ετήσιο"
  annual_terms: "ανά έτος"
