schema_description: "Ιδιωτικό ημερολόγιο φαρμάκου GLP-1 για δόσεις, σημεία ένεσης, βάρος, υπενθυμίσεις και ιστορικό."
app_store_badge_alt: "Λήψη του Dial από το App Store"

images:
  today:
    base: dial-web-today
    width: 1290
    height: 2160
    alt: "Οθόνη Σήμερα του Dial με την επόμενη υπενθύμιση, το εκτιμώμενο επίπεδο φαρμάκου και κουμπί καταγραφής δόσης"
  level:
    base: dial-web-level
    width: 1290
    height: 1620
    alt: "Οθόνη εκτιμώμενου επιπέδου του Dial με χρονοδιάγραμμα από καταγεγραμμένες δόσεις"
  log_dose:
    base: dial-web-log-dose
    width: 1290
    height: 1800
    alt: "Φόρμα δόσης Dial με πεδία φαρμάκου, ποσότητας, ώρας και σημείου ένεσης"
  history:
    base: dial-web-history
    width: 1290
    height: 2640
    alt: "Ιστορικό Dial με γραφήματα δόσης και βάρους στον χρόνο"
  side_effects:
    base: dial-web-side-effects
    width: 1290
    height: 2100
    alt: "Οθόνη τάσεων ανεπιθύμητων ενεργειών Dial Pro με εβδομαδιαία συχνότητα και σοβαρότητα από υπάρχουσες εγγραφές"
  report:
    base: dial-web-report
    width: 1836
    height: 2376
    alt: "Σελίδα της αναφοράς PDF του Dial Pro με ιστορικό δόσεων, βάρος στον χρόνο και ανεπιθύμητες ενέργειες για τον συνταγογράφο σας"
  watch_glance:
    base: dial-web-watch-glance
    width: 792
    height: 968
    alt: "Το Dial στο Apple Watch με δακτύλιο κύκλου που μετρά τις ημέρες έως την επόμενη δόση, την επόμενη υπενθύμιση και κουμπί καταγραφής"
  watch_logged:
    base: dial-web-watch-logged
    width: 792
    height: 968
    alt: "Το Dial στο Apple Watch επιβεβαιώνει καταγεγραμμένη δόση με σημάδι και δείχνει ποσότητα και σημείο ένεσης"

hero:
  availability: "Τώρα στο App Store"
  headline_lead: "Η ρουτίνα GLP-1 σας,"
  headline_accent: "γραμμένη."
  category: "Το Dial είναι ιδιωτικό ημερολόγιο φαρμάκου GLP-1 για iPhone και Apple Watch."
  detail: "Καταγράψτε δόσεις στο iPhone ή στο Apple Watch, δείτε εκτιμώμενο επίπεδο από τις δόσεις που καταγράφετε και κρατήστε τις βασικές εγγραφές στη συσκευή ή στην ιδιωτική βάση iCloud σας."
  secondary_cta: "Πώς λειτουργεί το Dial"
  platforms_label: "Πλατφόρμες και αποθήκευση Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Κέντρο ελέγχου και οθόνη κλειδώματος"
    - "Προαιρετική ιδιωτική αποθήκευση iCloud"
  legal: "Το βασικό ημερολόγιο είναι δωρεάν. Το Dial Pro προσθέτει γραφήματα, εξαγωγές, περισσότερα φάρμακα και υπενθυμίσεις και καταγραφή με ένα πάτημα στις συσκευές Apple. Το Dial είναι προσωπικό αρχείο. Δεν υπολογίζει δόσεις και δεν αντικαθιστά την καθοδήγηση του συνταγογράφου σας."

proof:
  label: "Γιατί Dial"
  points:
    - "iPhone και Apple Watch"
    - "Χωρίς λογαριασμούς, χωρίς ανάλυση χρήσης"
    - "Επιλογή Lifetime"
    - "Μοντελοποιημένο επίπεδο από τις δόσεις σας"

level:
  kicker: "Dial Pro · Εκτιμώμενο επίπεδο"
  heading: "Πιο καθαρή εικόνα των δόσεων που καταγράψατε."
  body: "Το Dial σχεδιάζει εκτιμώμενο επίπεδο φαρμάκου στο πέρασμα του χρόνου από τις καταγεγραμμένες δόσεις και τον χρόνο ημίσειας ζωής που δείχνει η εφαρμογή. Αλλάξτε το εύρος για να δείτε μία εβδομάδα, έναν μήνα ή έξι μήνες του δικού σας ιστορικού."
  boundary_lead: "Εκτίμηση, και το λέμε."
  boundary_body: "Το γράφημα μοντελοποιεί τυπική καμπύλη μείωσης από τις δόσεις που καταγράψατε. Δείχνει τα δικά σας μοτίβα ανάμεσα στις δόσεις. Είναι εκτίμηση, όχι μετρημένο επίπεδο αίματος ούτε πρόταση για την επόμενη δόση. Το Dial δεν υπολογίζει δόσεις. Η εφαρμογή εξηγεί ολόκληρη τη μέθοδο."

logging:
  kicker: "Γρήγορη καταγραφή"
  heading: "Καταγράψτε τη δόση και ό,τι τη συνοδεύει."
  body: "Σημειώστε φάρμακο, ποσότητα, ημερομηνία, ώρα, σημείο ένεσης και σημειώσεις σε εστιασμένη φόρμα. Οι πρόσφατες τιμές επιταχύνουν την επόμενη εγγραφή και κάθε πεδίο μένει για να το επιβεβαιώσετε. Το Dial λειτουργεί όποια ονομασία κι αν χρησιμοποιεί ο συνταγογράφος σας: Ozempic, Wegovy, Mounjaro ή Zepbound."
  checklist:
    - "Επεξεργαστείτε εγγραφή όταν κάτι αλλάζει"
    - "Κρατήστε τα σημεία ένεσης συνδεδεμένα με κάθε δόση"
    - "Κρατήστε τις εγγραφές βάρους δίπλα στη γραμμή χρόνου δόσεων"

history:
  kicker: "Dial Pro · Ιστορικό και τάσεις"
  heading: "Δείτε το μοτίβο σε όλο το αρχείο."
  body: "Οι λίστες δόσης, βάρους και ανεπιθύμητων ενεργειών μένουν δωρεάν. Το Dial Pro προσθέτει πλήρη γραφήματα δόσης και βάρους και τάσεις από τις εγγραφές ανεπιθύμητων ενεργειών που υπάρχουν ήδη."
  history_card_title: "Ιστορικό δόσης και βάρους"
  history_card_note: "Δείτε τις αλλαγές στο εύρος που επιλέγετε."
  side_effects_card_title: "Τάσεις ανεπιθύμητων ενεργειών"
  side_effects_card_note: "Δείτε συχνότητα και σοβαρότητα από υπάρχον ή εισαγμένο ιστορικό."

report:
  kicker: "Dial Pro · Αναφορά PDF"
  heading: "Πάρτε ολόκληρη την εικόνα στην επόμενη επίσκεψη."
  body: "Δημιουργήστε PDF με ιστορικό δόσεων, αλλαγές καταγεγραμμένης ποσότητας, σημεία ένεσης, τάση βάρους και μοτίβα ανεπιθύμητων ενεργειών. Το Dial το φτιάχνει στη συσκευή και το μοιράζεστε μόνο όταν αποφασίσετε, μέσω AirDrop, email ή εκτύπωσης."
  closing: "Ιδιωτικό τον υπόλοιπο χρόνο, και χρήσιμο τη στιγμή που το αρχείο πρέπει να φύγει από το τηλέφωνο."
  smallprint: "Η αναφορά συνοψίζει τις εγγραφές σας. Δεν είναι ιατρικός φάκελος ούτε σχέδιο θεραπείας."

watch:
  kicker: Apple Watch
  heading: "Καταγράψτε τη δόση από τον καρπό."
  body: "Η εφαρμογή ρολογιού δείχνει δακτύλιο κύκλου που μετρά αντίστροφα έως την επόμενη δόση και πότε πέφτει η επόμενη υπενθύμιση. Το Dial Pro μετατρέπει αυτή τη ματιά σε πλήρη καταγραφή: ρυθμίστε την ποσότητα με Digital Crown, επιλέξτε σημείο ένεσης και επιβεβαιώστε. Η εγγραφή συγχρονίζεται στο iPhone και μένει στις δύο συσκευές σας."
  checklist:
    - "Δακτύλιος κύκλου, κατάσταση δόσης και επόμενη υπενθύμιση με μια ματιά (δωρεάν)"
    - "Καταγραφή δόσης από τον καρπό με Digital Crown (Dial Pro)"
    - "Γραφικά στοιχεία εκτιμώμενου επιπέδου και επόμενης δόσης στο καντράν, και γρήγορη καταγραφή στο Smart Stack (Dial Pro)"
    - "Στο iPhone το Pro επιτρέπει καταγραφή με ένα πάτημα από το Κέντρο ελέγχου, το κουμπί ενέργειας, το Siri ή ζωντανή δραστηριότητα την ημέρα υπενθύμισης. Οι δωρεάν ενέργειες ανοίγουν τη φόρμα."

supporting:
  kicker: "Γύρω από τη ρουτίνα"
  heading: "Οι πρακτικές λεπτομέρειες μένουν κοντά."
  features:
    - title: "Απόθεμα"
      body: "Παρακολουθήστε πένες ή φιαλίδια με συγκέντρωση, φαρμακείο, ημερομηνία λήξης και αριθμό παρτίδας."
    - title: "Οι υπενθυμίσεις σας"
      body: "Δημιουργήστε ειδοποιήσεις ημερήσιες, εβδομαδιαίες ή κάθε N ημέρες γύρω από το πρόγραμμα που ορίζετε. Την ημέρα δόσης υπάρχει ενέργεια καταγραφής στην ειδοποίηση, και ζωντανή δραστηριότητα μπορεί να μείνει στην οθόνη κλειδώματος μέχρι να καταγράψετε."
    - title: "Φέρτε το ιστορικό μαζί σας"
      body: "Ανοίξτε συμβατή εξαγωγή από ημερολόγιο φαρμάκου με το Dial για να εισαγάγετε υπάρχουσες εγγραφές."

plans:
  kicker: "Δωρεάν και Dial Pro"
  heading: "Χρησιμοποιήστε το βασικό ημερολόγιο δωρεάν."
  body: "Προχωρήστε στο Dial Pro όταν θέλετε πληρέστερα γραφήματα, εξαγωγή ή ταχύτερη καταγραφή στις συσκευές Apple. Κάθε πλάνο Dial Pro περιλαμβάνει τις ίδιες λειτουργίες."
  free_name: "Δωρεάν"
  free_summary: "Πλήρες ημερολόγιο για ένα ενεργό φάρμακο."
  free_features:
    - "Καταγραφή δόσεων, σημείων ένεσης, βάρους, ανεπιθύμητων ενεργειών και φωτογραφιών προόδου"
    - "Ένα ενεργό φάρμακο και μία υπενθύμιση"
    - "Λίστες δόσης και βάρους, απόθεμα, εισαγωγή και η ματιά στο Apple Watch"
    - "Γραφικά στοιχεία αντίστροφης μέτρησης και υπενθυμίσεις που ανοίγουν τη φόρμα"
  pro_name: Dial Pro
  pro_summary: "Το εκτιμώμενο επίπεδο, πλήρη γραφήματα, εξαγωγή και γρήγορη καταγραφή."
  pro_features:
    - "Γράφημα εκτιμώμενου επιπέδου και γραφικό στοιχείο στην αρχική οθόνη"
    - "Πλήρη γραφήματα δόσης και βάρους, τάσεις ανεπιθύμητων ενεργειών και σύγκριση φωτογραφιών"
    - "Αναφορά PDF, εξαγωγή CSV, περισσότερα φάρμακα και περισσότερες υπενθυμίσεις"
    - "Γρήγορη καταγραφή και επιπλοκές στο Apple Watch, και καταγραφή με ένα πάτημα στο iPhone"
  options_label: "Επιλογές πλάνου Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "μία φορά"
  annual_name: "Ετήσιο"
  annual_terms: "ανά έτος"
  monthly_name: "Μηνιαίο"
  monthly_terms: "ανά μήνα"


privacy:
  kicker: "Απόρρητο"
  heading: "Σαφές τι μένει στη συσκευή σας."
  specs:
    - term: "Λογαριασμοί"
      detail: "Δεν υπάρχει λογαριασμός Dial. Ανοίξτε την εφαρμογή και αρχίστε να καταγράφετε."
    - term: "Ανάλυση χρήσης"
      detail: "Το Dial δεν εκτελεί ανάλυση χρήσης ούτε τηλεμετρία. Δεν μετράμε πώς το χρησιμοποιείτε."
    - term: "Οι διακομιστές μας"
      detail: "Η Zentsu δεν λειτουργεί διακομιστή που αποθηκεύει ή διαβάζει τις εγγραφές σας."
    - term: "Προαιρετικός συγχρονισμός"
      detail: "Ενεργοποιήστε το iCloud στην εφαρμογή και οι εγγραφές συγχρονίζονται μέσω της ιδιωτικής βάσης CloudKit στον δικό σας λογαριασμό Apple, όχι προς εμάς."
  body: "Οι εγγραφές φαρμάκου, δόσης, υπενθύμισης και αποθέματος μένουν στη συσκευή. Οι εγγραφές βάρους χρησιμοποιούν ξεχωριστή τοπική αποθήκευση, και η πρόσβαση στην Υγεία είναι προαιρετική και καλύπτει μόνο το σωματικό βάρος όταν δώσετε άδεια."
  policy_link: "Διαβάστε την πολιτική απορρήτου του Dial"
  policy_url: /el/dial/privacy/

availability:
  kicker: "Λήψη Dial"
  heading: "Τώρα στο App Store."
  body: "Το Dial είναι δωρεάν στη λήψη. Το βασικό ημερολόγιο λειτουργεί από την πρώτη καταγραφή. Το Dial Pro προσθέτει το γράφημα εκτιμώμενου επιπέδου, πλήρη γραφήματα, εξαγωγή PDF και γρήγορη καταγραφή από Apple Watch και iPhone."
  email_label: "Διεύθυνση email"
  email_placeholder: "σας@email.com"
  submit: "Λάβετε τα νέα εκδόσεων"
  signup_note: "Προαιρετικό. Σημειώσεις έκδοσης για νέες εκδόσεις, τίποτα άλλο. Χωρίς παρακολούθηση ανοίγματος ή συνδέσμων. Διαγραφή όποτε θέλετε."
  signup_privacy_link: "Λεπτομέρειες απορρήτου"
  signup_privacy_url: /privacy
  signup_help: "Χρειάζεστε βοήθεια;"
  signup_support_link: "Υποστήριξη Dial"
  signup_support_url: /el/dial/support/

