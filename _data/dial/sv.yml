hero:
  availability: "Nu i App Store"
  headline_lead: "Din GLP-1-journal."
  headline_accent: ""
  category: "Dial är en privat GLP-1-läkemedelsjournal för iPhone och Apple Watch."
  detail: "Registrera en dos på iPhone eller Apple Watch. Dial ritar en uppskattad nivå utifrån de doser du registrerar. Journalen stannar på enheten, eller i din privata iCloud-databas om du slår på synkronisering."
  free_line: Gratis att hämta. Det finns ingen gräns för hur många doser du kan logga.
  secondary_cta: "Så fungerar Dial"
  platforms_label: "Dial-plattformar och lagring"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Kontrollcenter och låsskärm"
    - "Valfri privat iCloud-lagring"
  legal: "Dial Pro lägger till diagram, export, flera läkemedel och påminnelser samt registrering med ett tryck på Apple-enheter. Dial är en personlig journal. Den räknar inte ut doser och ersätter inte råd från din förskrivare."

proof:
  label: "Varför Dial"
  points:
    - "iPhone och Apple Watch"
    - "Öppnas utan Dial-konto"
    - "Lifetime-köp"
    - "Uppskattad nivå från dina doser"

level:
  kicker: "Dial Pro · Uppskattad nivå"
  heading: "Diagrammet bygger på doserna du redan har registrerat."
  body: "Dial ritar en uppskattad läkemedelsnivå över tid från dina registrerade doser och halveringstiden appen visar. Byt intervall för att se en vecka, en månad eller sex månader av din egen historik."
  boundary_lead: "Vi kallar den en uppskattning."
  boundary_body: "Diagrammet modellerar en vanlig avklingningskurva från doserna du har registrerat. Det visar dina egna mönster mellan doser. Det är en uppskattning, inte en uppmätt blodnivå, och inte ett förslag på vad du ska ta härnäst. Dial beräknar inte doser. Appen förklarar hela metoden."

logging:
  kicker: "Snabb registrering"
  heading: "Läkemedel, mängd, injektionsställe och anteckningar i ett formulär."
  body: "Anteckna läkemedel, mängd, datum, tid, injektionsställe och anteckningar. Senaste värdena fyller i nästa post. Du bekräftar fortfarande varje fält. Dial känner semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid (Saxenda, Victoza), dulaglutid och exenatid under de varumärkes- och förpackningsnamn som används i Sverige, och tar ett eget läkemedel om det du har på recept inte finns i listan."
  checklist:
    - "Redigera en post när något ändras"
    - "Behåll injektionsställen kopplade till varje dos"
    - "Behåll viktposter bredvid dostidslinjen"

history:
  kicker: "Dial Pro · Historik och trender"
  heading: "Dos-, vikt- och biverkningsdiagram från dina poster."
  body: "Listor över dos, vikt och biverkningar är fortfarande gratis. Dial Pro lägger till fullständiga dos- och viktdiagram plus trender från biverkningsposterna som redan står i journalen."
  history_card_title: "Dos- och vikthistorik"
  history_card_note: "Granska ändringar i det intervall du väljer."
  side_effects_card_title: "Biverkningstrender"
  side_effects_card_note: "Granska frekvens och allvarlighetsgrad från befintlig eller importerad historik."

report:
  kicker: "Dial Pro · PDF-rapport"
  heading: "En PDF av dina poster till läkarbesöket."
  body: "Skapa en PDF med doshistorik, ändringar i registrerad mängd, injektionsställen, viktutveckling och biverkningsmönster. Dial bygger den på din enhet, och du delar den bara när du själv beslutar, via AirDrop, e-post eller utskrift."
  closing: "Privat till vardags. Användbar när journalen behöver lämna telefonen."
  smallprint: "Rapporten sammanfattar dina poster. Den är inte en patientjournal eller en behandlingsplan."

watch:
  kicker: Apple Watch
  heading: "Registrera dosen från handleden."
  body: "Apple Watch-appen visar en cykelring som räknar ner till nästa dos, och när nästa påminnelse kommer. Med Dial Pro registrerar du från den skärmen. Sätt mängden med Digital Crown, välj injektionsställe och bekräfta. Posten synkas till iPhone."
  checklist:
    - "Cykelring, dosstatus och nästa påminnelse i en blick (gratis)"
    - "Registrera en dos från handleden med Digital Crown (Dial Pro)"
    - "Widgetar för uppskattad nivå och nästa dos på urtavlan, plus snabb registrering i Smart Stack (Dial Pro)"
    - "På iPhone ger Pro registrering med ett tryck från Kontrollcenter, åtgärdsknappen, Siri eller en Live Activity på påminnelsedagen. Gratisåtgärder öppnar registreringsformuläret."

supporting:
  kicker: "Utöver dosen"
  heading: "Lager, påminnelser och import ligger i samma journal."
  features:
    - title: "Lager"
      body: "Håll reda på pennor eller injektionsflaskor med koncentration, apotek, utgångsdatum och satsnummer."
    - title: "Dina påminnelser"
      body: "Skapa notiser varje dag, varje vecka eller med valfritt antal dagar, efter schemat du sätter. På dosdagen kan du registrera från notisen, och en Live Activity kan stanna på låsskärmen tills du registrerar."
    - title: "Importera befintliga poster"
      body: "Öppna en kompatibel export från en läkemedelsjournal med Dial för att importera befintliga poster."

plans:
  kicker: "Gratis och Dial Pro"
  heading: "Använd kärnjournalen gratis."
  body: "Uppgradera till Pro för diagrammet för uppskattad nivå, export eller registrering med ett tryck på Apple Watch och iPhone. Varje Dial Pro-plan innehåller samma funktioner."
  free_name: "Gratis"
  free_summary: "En komplett journal för ett aktivt läkemedel."
  free_features:
    - "Registrera doser, injektionsställen, vikt, biverkningar och foton på framsteg"
    - "Ett aktivt läkemedel och en påminnelse"
    - "Dos- och viktlistor, lager, import och Apple Watch-översikten"
    - "Nedräkningswidgetar och påminnelser som öppnar registreringsformuläret"
  pro_name: Dial Pro
  pro_summary: "Den uppskattade nivån, fullständiga diagram, export och snabb registrering."
  pro_features:
    - "Diagram för uppskattad nivå och widget på hemskärmen"
    - "Fullständiga dos- och viktdiagram, biverkningstrender och bildjämförelse"
    - "PDF-rapport, CSV-export, flera läkemedel och flera påminnelser"
    - "Snabb registrering och Complications på Apple Watch, plus registrering med ett tryck på iPhone"
  options_label: "Dial Pro-planval"
  lifetime_name: "Lifetime"
  lifetime_terms: "en gång"
  annual_name: "Årsvis"
  annual_terms: "per år"
  monthly_name: "Månadsvis"
  monthly_terms: "per månad"

privacy:
  kicker: "Integritet"
  heading: "Posterna stannar på din enhet."
  specs:
    - term: "Konton"
      detail: "Det finns inget Dial-konto. Öppna appen och börja registrera."
    - term: "Användningsanalys"
      detail: "Dial kör ingen användningsanalys och ingen telemetri. Vi mäter inte hur du använder den."
    - term: "Våra servrar"
      detail: "Zentsu driver ingen server som lagrar eller läser dina poster."
    - term: "Valfri synkronisering"
      detail: "Slå på iCloud i appen så synkas poster via den privata CloudKit-databasen på ditt eget Apple-konto, inte till oss."
  body: "Läkemedel, dos, påminnelse och lager stannar på din enhet. Viktposter använder en separat lokal lagring, och åtkomst till Hälsa är valfri och täcker bara kroppsvikt när du ger tillstånd."
  policy_link: "Läs Dial-integritetspolicyn"
  policy_url: /sv/dial/privacy/

availability:
  kicker: "Hämta Dial"
  heading: "Nu i App Store."
  body: "Dial är gratis att hämta. Kärnjournalen fungerar från första registreringen. Dial Pro lägger till diagrammet för uppskattad nivå, fullständiga diagram, PDF-export och snabb registrering från Apple Watch och iPhone."
