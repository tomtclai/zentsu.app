hero:
  availability: "지금 App Store에서"
  headline_lead: "지난 투여를 기록으로 확인."
  headline_accent: ""
  category: "Dial은 위고비·마운자로 등 GLP-1 약의 투여를 기록하는 iPhone 앱입니다."
  quick_answer: "Dial은 오젬픽, 위고비, 리벨서스, 마운자로 등 GLP-1 주사와 알약, 처방된 바이알의 복제 세마글루타이드나 터제파타이드를 기록합니다. 항목마다 용량, 시각, 주사 부위, 체중, 부작용이 함께 남습니다. iPhone 기록은 무료이며 계정이 필요 없습니다. Dial Pro는 추정 수준 그래프, Apple Watch 기록, PDF 또는 CSV 내보내기를 더합니다."
  detail: "iPhone 투여 기록은 무료입니다. Dial Pro는 Apple Watch 기록, 차트, 진료용 PDF 내보내기를 제공합니다. 투약 기록은 본인의 iCloud와 선택적으로 동기화할 수 있습니다. 체중과 진행 사진은 기기에 저장됩니다."
  free_line: 무료로 받습니다. Dial 계정은 필요 없습니다. 투여 기록에는 한도가 없습니다.
  secondary_cta: "Dial 쓰는 법"
  qr_caption: "스캔하면 iPhone App Store에서 Dial이 열립니다."
  platforms_label: "Dial 플랫폼과 저장"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, 제어 센터, 잠금 화면"
    - "선택적 개인 iCloud 저장"
  legal: "개인 기록이며 의학적 조언이 아닙니다. Dial Pro는 Watch 기록, 그래프, 내보내기를 더합니다."

proof:
  label: "Dial을 쓰는 이유"
  points:
    - "Apple Watch의 주기 링과 다음 알림"
    - "Dial 계정 없이 열림"
    - "Lifetime, 한 번의 구매"
    - "용량 사이 추정 수준 (Dial Pro)"

level:
  kicker: "Dial Pro · 추정 수준"
  heading: "반감기를 기준으로, 용량과 용량 사이 추정 수준을 봅니다."
  body: "기록한 용량과 앱에 표시된 반감기로 오젬픽, 위고비, 마운자로, 제프바운드 같은 지원 주사제의 추정 수준을 그립니다. 리벨서스 같은 알약은 수준 차트가 없습니다. 먹는 약이 혈중에 도달하는 비율은 개인차가 너무 크기 때문입니다. 주사 기록은 일주일, 한 달, 6개월 범위로 볼 수 있습니다."
  boundary_lead: "추정치입니다. 추정이라고 표시합니다."
  boundary_body: "그래프는 기록한 세마글루타이드나 터제파타이드 용량으로 표준 감쇠 곡선을 그립니다. 용량과 용량 사이 내 패턴을 보여 줍니다. 추정치이며, 실측 혈중 농도가 아닙니다. 앱이 방법을 전부 설명합니다."

boundary:
  kicker: "Dial이 하지 않는 일"
  heading: "기록은 Dial이, 용량은 처방의가."
  body: "Dial은 용량을 계산하지 않고, 용량 변경을 권하지 않으며, 빠뜨린 용량 뒤에 무엇을 해야 할지 알려 주지 않습니다. 추정 수준은 기록한 용량을 바탕으로 한 인구 모델의 추정치이지, 측정값이 아닙니다. 복제 바이알용 단위 변환기는 입력한 mg와 mg/mL로만 계산하며 양을 제안하지 않습니다. 약에 관한 결정은 처방한 의사나 약사와 상의하세요."

logging:
  kicker: "빠른 기록"
  heading: "약, 용량, 주사 부위를 한 양식에 기록합니다."
  body: "약, 용량, 날짜, 시간, 메모를 남깁니다. 오젬픽, 위고비, 마운자로, 제프바운드 같은 주사는 부위도 기록하고, 리벨서스 같은 알약은 부위 없이 기록합니다. 세마글루타이드(오젬픽, 위고비, 리벨서스), 터제파타이드(마운자로), 리라글루타이드(삭센다, 빅토자), 둘라글루타이드(트루리시티), 엑세나타이드를 지역별 제품명과 함께 지원하고, 처방된 바이알의 복제 세마글루타이드나 터제파타이드도 기록합니다. 목록에 없는 약은 직접 추가하세요."
  checklist:
    - "달라지면 항목을 수정하세요"
    - "각 용량에 주사 부위를 함께 적으세요"
    - "용량 타임라인 옆에 체중을 기록하세요"

history:
  kicker: "Dial Pro · 이력과 추세"
  heading: "용량·체중·부작용 그래프를 살펴보세요."
  body: "용량, 체중, 부작용 목록은 무료입니다. Dial Pro가 그래프를 더합니다."
  history_card_title: "용량·체중 이력"
  history_card_note: "선택한 범위의 변화를 살펴보세요."
  side_effects_card_title: "부작용 추세"
  side_effects_card_note: "기존 또는 가져온 이력에서 빈도와 중증도를 살펴보세요."

report:
  kicker: "Dial Pro · PDF 보고서"
  heading: "진료용 PDF를 만듭니다."
  card_title: "진료용 PDF 보고서"
  body: "용량 이력, 기록된 양의 변화, 주사 부위, 체중 추세, 부작용 패턴이 담긴 PDF를 만드세요. Dial이 기기에서 만들고, AirDrop, 이메일, 인쇄로 직접 공유할 때만 나갑니다. 같은 이력을 CSV로도 내보낼 수 있습니다."
  closing: "평소에는 비공개로 두고, 진료실에서 보여줄 그 순간에만 꺼냅니다."
  smallprint: "보고서는 항목을 요약합니다. 진료 기록이나 치료 계획이 아닙니다."

watch:
  kicker: Apple Watch
  heading: "손목에서 용량을 기록하세요."
  body: "Apple Watch 앱은 다음 용량까지 세는 주기 링과 다음 알림 시각을 보여 줍니다. Dial Pro는 그 화면에서 기록합니다. Digital Crown으로 용량을 맞추고, 주사 부위를 고르고, 확인하세요. 항목은 iPhone과 동기화됩니다."
  checklist:
    - "주기 링, 용량 상태, 다음 알림을 한눈에 (무료)"
    - "Digital Crown으로 손목에서 용량 기록 (Dial Pro)"
    - "시계 화면의 추정 수준·다음 용량 위젯과 Smart Stack 빠른 기록 (Dial Pro)"
    - "iPhone에서 Pro는 제어 센터, 동작 버튼, Siri, 알림일의 Live Activity로 한 번 탭 기록을 켭니다. 무료 동작은 기록 양식을 엽니다."

supporting:
  kicker: "기록의 전부"
  heading: "이력, 보고서, 재고, 알림, 가져오기를 한곳에."
  features:
    - title: "재고"
      body: "펜, 바이알, 알약 병을 유효기간과 함께 관리합니다. 포장 라벨을 스캔해 정보를 채운 뒤 저장 전에 확인하세요."
    - title: "알림"
      body: "설정한 일정 주변에 매일, 매주, 또는 N일마다 알림을 만드세요. 용량일에는 알림에 기록 동작이 있고, Live Activity는 기록할 때까지 잠금 화면에 남을 수 있습니다."
    - title: "기존 기록 가져오기"
      body: "다른 약물 일기에서 내보낸 파일을 Dial에서 여세요."

