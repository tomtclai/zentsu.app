      detail: "앱을 열고 바로 기록을 시작하세요."
    - term: "사용 측정"
      detail: "Dial은 사용 방식을 측정하지 않습니다."
    - term: "우리 서버"
      detail: "Zentsu는 기록을 저장하거나 읽는 서버를 운영하지 않습니다."
