privacy:
  kicker: "개인정보"
  heading: "기록은 기기에 남습니다."
  specs:
    - term: "계정"
      detail: "Dial 계정은 없습니다. 앱을 열고 바로 기록을 시작하세요."
    - term: "사용 측정"
      detail: "Dial은 사용 방식을 측정하지 않습니다."
    - term: "우리 서버"
      detail: "Zentsu는 기록을 저장하거나 읽는 서버를 운영하지 않습니다."
    - term: "선택적 동기화"
      detail: "앱에서 iCloud를 켜면 기록은 내 Apple 계정의 비공개 CloudKit 데이터베이스를 통해 동기화되며, Zentsu로는 오지 않습니다."
  body: "약물, 용량, 알림, 재고 기록은 기기에 남습니다. 체중 항목은 별도 로컬 저장을 쓰고, 건강 접근은 선택이며 권한을 줄 때만 체중을 다룹니다."
  policy_link: "Dial 개인정보 처리방침 읽기"
  policy_url: /ko/dial/privacy/

availability:
  kicker: "Dial 다운로드"
  heading: "지금 App Store에서."
  body: "Dial은 무료로 받을 수 있습니다. 핵심 일기는 첫 기록부터 쓸 수 있습니다. Dial Pro는 추정 수준 그래프, 전체 그래프, PDF 내보내기, Apple Watch와 iPhone의 빠른 기록을 더합니다."

