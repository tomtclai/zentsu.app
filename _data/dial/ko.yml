hero:
  availability: "지금 App Store에서"
  headline_lead: "GLP-1 루틴을"
  headline_accent: "기록으로."
  category: "Dial은 iPhone과 Apple Watch를 위한 비공개 GLP-1 약물 일기입니다."
  detail: "iPhone 또는 Apple Watch에서 용량을 기록하고, 직접 남긴 용량으로 만든 추정 수준을 보며, 핵심 기록은 기기 또는 개인 iCloud 데이터베이스에 두세요."
  secondary_cta: "Dial 작동 방식"
  platforms_label: "Dial 플랫폼과 저장"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, 제어 센터, 잠금 화면"
    - "선택적 개인 iCloud 저장"
  legal: "핵심 일기는 무료입니다. Dial Pro는 그래프, 내보내기, 추가 약물과 알림, Apple 기기에서 한 번 탭으로 기록을 더합니다. Dial은 개인 기록입니다. 용량을 계산하지 않으며 처방의의 안내를 대체하지 않습니다."

proof:
  label: "Dial을 쓰는 이유"
  points:
    - "iPhone과 Apple Watch"
    - "앱을 열고 바로 기록합니다"
    - "Lifetime 옵션"
    - "기록한 용량으로 그린 추정 수준"

level:
  kicker: "Dial Pro · 추정 수준"
  heading: "기록한 용량을 더 분명히 봅니다."
  body: "Dial은 기록한 용량과 앱에 표시된 반감기로 시간에 따른 추정 약물 수준을 그립니다. 범위를 바꿔 내 기록의 일주일, 한 달, 여섯 달을 검토하세요."
  boundary_lead: "추정치입니다. 추정이라고 표시합니다."
  boundary_body: "그래프는 기록한 용량으로 표준 감쇠 곡선을 그립니다. 용량 사이 내 패턴을 보여 줍니다. 추정치이며, 추정이라고 표시합니다. 용량은 처방의가 정합니다. 앱이 방법을 전부 설명합니다."

logging:
  kicker: "빠른 기록"
  heading: "용량과 함께 적는 모든 것을 기록하세요."
  body: "짧은 입력 화면에 약물, 양, 날짜, 시각, 주사 부위, 메모를 적으세요. 최근 값으로 다음 입력이 빨라집니다. 각 필드는 직접 확인합니다. 처방의가 Ozempic, Wegovy, Mounjaro, Zepbound 중 무엇으로 부르든 Dial을 그대로 쓸 수 있습니다."
  checklist:
    - "달라지면 항목을 수정하세요"
    - "각 용량에 주사 부위를 연결해 두세요"
    - "용량 타임라인 옆에 체중을 기록하세요"

history:
  kicker: "Dial Pro · 이력과 추세"
  heading: "기록 전체의 패턴을 검토하세요."
  body: "용량, 체중, 부작용 목록은 무료로 남습니다. Dial Pro는 전체 용량·체중 그래프와 이미 기록에 있는 부작용 항목의 추세를 더합니다."
  history_card_title: "용량·체중 이력"
  history_card_note: "선택한 범위의 변화를 검토하세요."
  side_effects_card_title: "부작용 추세"
  side_effects_card_note: "기존 또는 가져온 이력에서 빈도와 중증도를 검토하세요."

report:
  kicker: "Dial Pro · PDF 보고서"
  heading: "다음 진료에 전체 그림을 가져가세요."
  body: "용량 이력, 기록된 양의 변화, 주사 부위, 체중 추세, 부작용 패턴이 담긴 PDF를 만드세요. Dial이 기기에서 만들고, AirDrop, 이메일, 인쇄로 직접 결정할 때만 공유합니다."
  closing: "나머지 시간은 비공개이며, 기록이 휴대폰을 떠나야 하는 그 순간에 쓸모가 있습니다."
  smallprint: "보고서는 항목을 요약합니다. 진료 기록이나 치료 계획이 아닙니다."

watch:
  kicker: Apple Watch
  heading: "손목에서 용량을 기록하세요."
  body: "Apple Watch 앱은 다음 용량까지 세는 주기 링과 다음 알림 시각을 보여 줍니다. Dial Pro는 그 한눈에 보기를 완전한 기록으로 바꿉니다. Digital Crown으로 양을 맞추고, 주사 부위를 고르고, 확인하세요. 항목은 iPhone과 동기화되어 두 기기에 남습니다."
  checklist:
    - "주기 링, 용량 상태, 다음 알림을 한눈에 (무료)"
    - "Digital Crown으로 손목에서 용량 기록 (Dial Pro)"
    - "시계 화면의 추정 수준·다음 용량 위젯과 Smart Stack 빠른 기록 (Dial Pro)"
    - "iPhone에서 Pro는 제어 센터, 동작 버튼, Siri, 알림일의 Live Activity로 한 번 탭 기록을 켭니다. 무료 동작은 기록 양식을 엽니다."

supporting:
  kicker: "기록 주변"
  heading: "실용적인 세부 사항도 가까이 둡니다."
  features:
    - title: "재고"
      body: "농도, 약국, 유효기간, 로트 번호와 함께 펜이나 바이알을 추적하세요."
    - title: "알림"
      body: "설정한 일정 주변에 매일, 매주, 또는 N일마다 알림을 만드세요. 용량일에는 알림에 기록 동작이 있고, Live Activity는 기록할 때까지 잠금 화면에 남을 수 있습니다."
    - title: "이력을 가져오세요"
      body: "기존 항목을 가져오려면 Dial에서 호환되는 약물 일기 내보내기를 여세요."

