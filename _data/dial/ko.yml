hero:
  availability: "지금 App Store에서"
  headline_lead: "GLP-1 기록을 남깁니다"
  headline_accent: ""
  category: "Dial은 iPhone과 Apple Watch를 위한 비공개 GLP-1 약물 일기입니다."
  detail: "iPhone 또는 Apple Watch에서 용량을 기록하세요. 그 기록으로 추정 수준을 그립니다. 핵심 기록은 기기 또는 개인 iCloud 데이터베이스에 남습니다."
  free_line: 무료로 다운로드할 수 있습니다. 투여 기록에는 한도가 없습니다.
  secondary_cta: "Dial 작동 방식"
  platforms_label: "Dial 플랫폼과 저장"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, 제어 센터, 잠금 화면"
    - "선택적 개인 iCloud 저장"
  legal: "Dial Pro는 그래프, 내보내기, 여러 약물과 알림, Apple 기기 한 번 탭 기록을 더합니다. Dial은 개인 기록입니다. 용량을 계산하지 않으며 처방의의 안내를 대체하지 않습니다."

proof:
  label: "Dial을 쓰는 이유"
  points:
    - "iPhone과 Apple Watch"
    - "Dial 계정 없이 엽니다"
    - "Lifetime 옵션"
    - "기록한 용량으로 그린 추정 수준"

level:
  kicker: "Dial Pro · 추정 수준"
  heading: "이미 기록한 용량으로 그래프를 그립니다."
  body: "Dial은 기록한 용량과 앱에 표시된 반감기로 시간에 따른 추정 약물 수준을 그립니다. 범위를 바꿔 일주일, 한 달, 여섯 달 기록을 보세요."
  boundary_lead: "추정치입니다. 추정이라고 표시합니다."
  boundary_body: "그래프는 기록한 용량으로 표준 감쇠 곡선을 그립니다. 용량과 용량 사이 내 패턴을 보여 줍니다. 추정치이며, 실측 혈중 농도가 아닙니다. 용량은 처방의가 정하고, Dial은 용량을 계산하지 않습니다. 앱이 방법을 전부 설명합니다."

logging:
  kicker: "빠른 기록"
  heading: "약, 용량, 주사 부위, 메모를 한 화면에 기록하세요."
  body: "약, 용량, 날짜, 시각, 주사 부위, 메모를 적으세요. 최근 값이 다음 입력에 채워집니다. 각 칸을 직접 확인합니다. Dial은 세마글루타이드(오젬픽, 위고비), 터제파타이드(마운자로), 리라글루타이드(삭센다, 빅토자), 둘라글루타이드(트루리시티), 엑세나타이드를 국내에서 쓰는 제품명으로 찾고, 목록에 없는 약은 직접 입력할 수 있습니다."
  checklist:
    - "달라지면 항목을 수정하세요"
    - "각 용량에 주사 부위를 함께 적으세요"
    - "용량 타임라인 옆에 체중을 기록하세요"

history:
  kicker: "Dial Pro · 이력과 추세"
  heading: "용량·체중·부작용 그래프를 살펴보세요."
  body: "용량, 체중, 부작용 목록은 무료입니다. Dial Pro는 전체 용량·체중 그래프와 이미 기록에 있는 부작용 항목의 추세를 더합니다."
  history_card_title: "용량·체중 이력"
  history_card_note: "선택한 범위의 변화를 살펴보세요."
  side_effects_card_title: "부작용 추세"
  side_effects_card_note: "기존 또는 가져온 이력에서 빈도와 중증도를 살펴보세요."

report:
  kicker: "Dial Pro · PDF 보고서"
  heading: "진료용 PDF를 만듭니다."
  body: "용량 이력, 기록된 양의 변화, 주사 부위, 체중 추세, 부작용 패턴이 담긴 PDF를 만드세요. Dial이 기기에서 만들고, AirDrop, 이메일, 인쇄로 직접 공유할 때만 나갑니다."
  closing: "평소에는 비공개로 두고, 진료실에서 보여줄 그 순간에만 꺼냅니다."
  smallprint: "보고서는 항목을 요약합니다. 진료 기록이나 치료 계획이 아닙니다."

watch:
  kicker: Apple Watch
  heading: "손목에서 용량을 기록하세요."
  body: "Apple Watch 앱은 다음 용량까지 세는 주기 링과 다음 알림 시각을 보여 줍니다. Dial Pro는 그 화면에서 기록합니다. Digital Crown으로 용량을 맞추고, 주사 부위를 고르고, 확인하세요. 항목은 iPhone과 동기화됩니다."
  checklist:
    - "주기 링, 용량 상태, 다음 알림을 한눈에 (무료)"
    - "Digital Crown으로 손목에서 용량 기록 (Dial Pro)"
    - "시계 화면의 추정 수준·다음 용량 위젯과 Smart Stack 빠른 기록 (Dial Pro)"
    - "iPhone에서 Pro는 제어 센터, 동작 버튼, Siri, 알림일의 Live Activity로 한 번 탭 기록을 켭니다. 무료 동작은 기록 양식을 엽니다."

supporting:
  kicker: "기록 주변"
  heading: "재고, 알림, 가져오기를 같은 기록에 둡니다."
  features:
    - title: "재고"
      body: "농도, 약국, 유효기간, 로트 번호와 함께 펜이나 바이알을 추적하세요."
    - title: "알림"
      body: "설정한 일정 주변에 매일, 매주, 또는 N일마다 알림을 만드세요. 용량일에는 알림에 기록 동작이 있고, Live Activity는 기록할 때까지 잠금 화면에 남을 수 있습니다."
    - title: "기존 기록 가져오기"
      body: "다른 약물 일기에서 내보낸 파일을 Dial에서 여세요."

