hero:
  availability: "Już w App Store"
  headline_lead: "Dziennik dawek GLP-1."
  headline_accent: ""
  category: "Dial to prywatny rejestr leków GLP-1 na iPhone’a i Apple Watch."
  detail: "Zapisują Państwo dawkę na iPhonie lub Apple Watch. Dial rysuje wykres szacowanego poziomu z tych wpisów. Zapisy zostają na urządzeniu albo, gdy włączą Państwo tę opcję, w prywatnej bazie iCloud."
  secondary_cta: "Jak działa Dial"
  platforms_label: "Platformy Dial i przechowywanie"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Centrum sterowania i ekran blokady"
    - "Opcjonalna prywatna baza iCloud"
  legal: "Podstawowy dziennik jest bezpłatny. Dial Pro dodaje wykresy, eksport, więcej leków i przypomnień oraz zapis jednym stuknięciem na urządzeniach Apple. Dial to osobisty dziennik. Nie oblicza dawek i nie zastępuje wskazówek lekarza prowadzącego."

proof:
  label: "Dlaczego Dial"
  points:
    - "iPhone i Apple Watch"
    - "Działa bez konta Dial"
    - "Opcja Lifetime"
    - "Szacowany poziom z Państwa dawek"

level:
  kicker: "Dial Pro · Szacowany poziom"
  heading: "Wykres korzysta z dawek, które Państwo już zapisali."
  body: "Dial rysuje wykres szacowanego poziomu leku w czasie. Opiera się na zapisanych dawkach i okresie półtrwania z aplikacji. Zmieniają Państwo zakres, żeby zobaczyć tydzień, miesiąc albo sześć miesięcy własnej historii."
  boundary_lead: "Oszacowanie. Tak to nazywamy."
  boundary_body: "Wykres modeluje standardową krzywą zaniku z zapisanych dawek. Pokazuje Państwa własne wzorce między dawkami. To oszacowanie, nie zmierzony poziom we krwi i nie wskazówka, co przyjąć dalej. Dial nie oblicza dawek. Aplikacja opisuje metodę w całości."

logging:
  kicker: "Szybki zapis"
  heading: "Lek, ilość, miejsce i notatki w jednym formularzu."
  body: "Zapisują Państwo lek, ilość, datę, godzinę, miejsce wstrzyknięcia i notatki. Ostatnie wartości wypełniają kolejny wpis. Każde pole i tak potwierdzają Państwo sami. Dial działa z Ozempic, Wegovy, Mounjaro i Zepbound."
  checklist:
    - "Edytują Państwo wpis, gdy coś się zmieni"
    - "Miejsca wstrzyknięć są przy każdej dawce"
    - "Wpisy wagi są obok osi czasu dawek"

history:
  kicker: "Dial Pro · Historia i trendy"
  heading: "Wykresy dawek, wagi i działań niepożądanych z Państwa wpisów."
  body: "Listy dawek, wagi i działań niepożądanych pozostają darmowe. Dial Pro dodaje pełne wykresy dawek i wagi oraz trendy z wpisów działań niepożądanych, które już są w zapisie."
  history_card_title: "Historia dawek i wagi"
  history_card_note: "Przeglądają Państwo zmiany w wybranym zakresie."
  side_effects_card_title: "Trendy działań niepożądanych"
  side_effects_card_note: "Przeglądają Państwo częstość i nasilenie z istniejącej lub zaimportowanej historii."

report:
  kicker: "Dial Pro · Raport PDF"
  heading: "PDF z Państwa wpisów na wizytę."
  body: "Tworzą Państwo PDF z historią dawek, zmianami zapisanej ilości, miejscami wstrzyknięć, trendem wagi i wzorcami działań niepożądanych. Dial składa go na urządzeniu. Udostępniają go Państwo tylko wtedy, gdy się zdecydują: AirDrop, e-mail albo druk."
  closing: "Na co dzień raport zostaje prywatny. Przydaje się w chwili, gdy zapis musi opuścić telefon."
  smallprint: "Raport streszcza wpisy. To nie jest dokumentacja medyczna ani plan leczenia."

watch:
  kicker: Apple Watch
  heading: "Zapis dawki z nadgarstka."
  body: "Aplikacja na zegarku pokazuje pierścień cyklu odliczający do następnej dawki i kiedy przypada następne przypomnienie. Dial Pro zapisuje z tego ekranu. Ustawiają Państwo ilość za pomocą Digital Crown, wybierają miejsce wstrzyknięcia i potwierdzają. Wpis synchronizuje się z iPhonem."
  checklist:
    - "Pierścień cyklu, status dawki i następne przypomnienie w jednym rzucie oka (za darmo)"
    - "Zapis dawki z nadgarstka z Digital Crown (Dial Pro)"
    - "Widżety szacowanego poziomu i następnej dawki na tarczy oraz szybki zapis w Smart Stack (Dial Pro)"
    - "Na iPhonie Dial Pro umożliwia zapis jednym stuknięciem z Centrum sterowania, przycisku czynności, Siri albo Live Activity w dniu przypomnienia. W darmowym planie te skróty otwierają formularz zapisu."

supporting:
  kicker: "Wokół rutyny"
  heading: "Zapas, przypomnienia i import w tym samym zapisie."
  features:
    - title: "Zapas"
      body: "Śledzą Państwo peny lub fiolki ze stężeniem, apteką, datą ważności i numerem serii."
    - title: "Państwa przypomnienia"
      body: "Tworzą Państwo powiadomienia codzienne, tygodniowe albo co N dni według harmonogramu, który ustawią. W dniu dawki na powiadomieniu jest działanie zapisu. Live Activity może zostać na ekranie blokady, aż zapiszą Państwo dawkę."
    - title: "Import istniejących wpisów"
      body: "W Dial otwierają Państwo zgodny eksport z dziennika leków, żeby zaimportować istniejące wpisy."

plans:
  kicker: "Za darmo i Dial Pro"
  heading: "Podstawowy rejestr za darmo."
  body: "Przechodzą Państwo na Pro, gdy chcą wykresu szacowanego poziomu, eksportu albo zapisu jednym stuknięciem na Apple Watch i iPhonie. Każdy plan Dial Pro ma te same funkcje."
  free_name: "Za darmo"
  free_summary: "Pełny dziennik dla jednego aktywnego leku."
  free_features:
    - "Zapis dawek, miejsc wstrzyknięć, wagi, działań niepożądanych i zdjęć postępów"
    - "Jeden aktywny lek i jedno przypomnienie"
    - "Listy dawek i wagi, zapas, import i przegląd Apple Watch"
    - "Widżety odliczania i przypomnienia otwierające formularz zapisu"
  pro_name: Dial Pro
  pro_summary: "Szacowany poziom, pełne wykresy, eksport i szybki zapis."
  pro_features:
    - "Wykres szacowanego poziomu i widżet na ekranie początkowym"
    - "Pełne wykresy dawek i wagi, trendy działań niepożądanych i porównanie zdjęć"
    - "Raport PDF, eksport CSV, kilka leków i kilka przypomnień"
    - "Szybki zapis i komplikacje na Apple Watch oraz zapis jednym stuknięciem na iPhonie"
  options_label: "Wybór planu Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "raz"
  annual_name: "Rocznie"
  annual_terms: "rocznie"
  monthly_name: "Miesięcznie"
  monthly_terms: "miesięcznie"

privacy:
  kicker: "Prywatność"
  heading: "Wpisy zostają na urządzeniu."
  specs:
    - term: "Konta"
      detail: "Nie ma konta Dial. Otwierają Państwo aplikację i zaczynają zapis."
    - term: "Analityka użycia"
      detail: "Dial nie prowadzi analityki użycia ani telemetrii. Nie mierzymy, jak Państwo z niego korzystają."
    - term: "Nasze serwery"
      detail: "Zentsu nie prowadzi serwera, który przechowuje lub czyta Państwa zapisy."
    - term: "Opcjonalna synchronizacja"
      detail: "Włączają Państwo iCloud w aplikacji, a zapisy synchronizują się przez prywatną bazę CloudKit na Państwa koncie Apple, nie do nas."
  body: "Lek, dawka, przypomnienie i zapas zostają na urządzeniu. Wpisy wagi mają osobny lokalny zapis. Dostęp do Zdrowia jest opcjonalny i obejmuje tylko masę ciała, gdy udzielą Państwo zgody."
  policy_link: "Polityka prywatności Dial"
  policy_url: /pl/dial/privacy/

availability:
  kicker: "Dial"
  heading: "Już w App Store."
  body: "Dial można pobrać za darmo. Podstawowy rejestr działa od pierwszego zapisu. Dial Pro dodaje wykres szacowanego poziomu, pełne wykresy, eksport PDF i szybki zapis z Apple Watch i iPhone’a."
