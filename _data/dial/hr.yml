  headline_lead: "Vodite GLP-1 dnevnik."
  headline_accent: ""
  category: "Dial je privatni GLP-1 dnevnik lijekova za iPhone i Apple Watch."
  detail: "Unesite dozu na iPhoneu ili Apple Watchu. Dial crta procijenjenu razinu iz tih unosa. Glavni zapisi ostaju na uređaju ili u privatnoj iCloud bazi, ako to uključite."
  free_line: Besplatno preuzimanje. Dnevnik doza nema ograničenje.
