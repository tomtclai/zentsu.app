hero:
  availability: "Sada u App Storeu"
  headline_lead: "Vaš GLP-1"
  headline_accent: "u zapisu."
  category: "Dial je privatni GLP-1 dnevnik lijekova za iPhone i Apple Watch."
  detail: "Unosite doze na iPhoneu ili Apple Watchu, vidite procijenjenu razinu iz doza koje vodite i držite glavne zapise na uređaju ili u privatnoj iCloud bazi."
  secondary_cta: "Kako Dial radi"
  platforms_label: "Platforme i pohrana Diala"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Kontrolni centar i zaključani zaslon"
    - "Neobavezna privatna iCloud pohrana"
  legal: "Osnovni dnevnik je besplatan. Dial Pro dodaje grafikone, izvoz, više lijekova i podsjetnika te unos jednim dodirom na Apple uređajima. Dial je osobni zapis. Ne izračunava doze i ne zamjenjuje upute propisivača."

proof:
  label: "Zašto Dial"
  points:
    - "iPhone i Apple Watch"
    - "Bez računa, bez analitike korištenja"
    - "Doživotna kupnja"
    - "Procijenjena razina iz vaših doza"

level:
  kicker: "Dial Pro · Procijenjena razina"
  heading: "Jasniji pogled na doze koje ste unijeli."
  body: "Dial crta procijenjenu razinu lijeka kroz vrijeme iz unesenih doza i poluživota prikazanog u aplikaciji. Promijenite raspon da pregledate tjedan, mjesec ili šest mjeseci vlastite povijesti."
  boundary_lead: "Procjena, i to kažemo."
  boundary_body: "Grafikon modelira standardnu krivulju opadanja iz doza koje ste unijeli. Pokazuje vaše obrasce između doza. Nije izmjerena razina u krvi ni prijedlog što uzeti sljedeće. Dial ne izračunava doze. Aplikacija metodu objašnjava u cijelosti."

logging:
  kicker: "Brzi unos"
  heading: "Unesite dozu i sve što ide uz nju."
  body: "Zapišite lijek, količinu, datum, vrijeme, mjesto injekcije i bilješke u usredotočenom obrascu. Nedavne vrijednosti ubrzavaju sljedeći unos, a svako polje ostaje vama za potvrdu. Dial radi bilo da propisivač to zove Ozempic, Wegovy, Mounjaro ili Zepbound."
  checklist:
    - "Uredite unos kad se nešto promijeni"
    - "Držite mjesta injekcije vezana uz svaku dozu"
    - "Držite unose težine uz vremensku crtu doza"

history:
  kicker: "Dial Pro · Povijest i trendovi"
  heading: "Pregledajte obrazac kroz cijeli zapis."
  body: "Popisi doze, težine i nuspojava ostaju besplatni. Dial Pro dodaje pune grafikone doze i težine plus trendove iz unosa nuspojava koji već stoje u zapisu."
  history_card_title: "Povijest doze i težine"
  history_card_note: "Pregledajte promjene u rasponu koji odaberete."
  side_effects_card_title: "Trendovi nuspojava"
  side_effects_card_note: "Pregledajte učestalost i ozbiljnost iz postojeće ili uvezene povijesti."

report:
  kicker: "Dial Pro · PDF izvješće"
  heading: "Ponesite cijelu sliku na sljedeći posjet."
  body: "Napravite PDF s poviješću doza, promjenama unesene količine, mjestima injekcije, trendom težine i obrascima nuspojava. Dial ga sastavlja na uređaju, a dijelite ga tek kad odlučite, AirDropom, e-poštom ili ispisom."
  closing: "Inače privatno, a korisno u trenutku kad zapis mora napustiti telefon."
  smallprint: "Izvješće sažima vaše unose. Nije medicinski karton ni plan liječenja."

watch:
  kicker: Apple Watch
  heading: "Unesite dozu sa zapešća."
  body: "Aplikacija na satu pokazuje prsten ciklusa koji odbrojava do sljedeće doze i kad pada sljedeći podsjetnik. Dial Pro od tog pogleda pravi puni unos: količinu postavite Digital Crownom, odaberite mjesto injekcije i potvrdite. Unos se sinkronizira na iPhone i ostaje između vaša dva uređaja."
  checklist:
    - "Prsten ciklusa, stanje doze i sljedeći podsjetnik na prvi pogled (besplatno)"
    - "Unos doze sa zapešća Digital Crownom (Dial Pro)"
    - "Widgeti procijenjene razine i sljedeće doze na brojčaniku te brzi unos u Pametnom stogu (Dial Pro)"
    - "Na iPhoneu Dial Pro omogućuje unos jednim dodirom iz Kontrolnog centra, tipke za radnju, Siri ili žive aktivnosti na dan podsjetnika. Besplatne radnje otvaraju obrazac."

supporting:
  kicker: "Oko rutine"
  heading: "Praktični detalji ostaju blizu."
  features:
    - title: "Zaliha"
      body: "Pratite olovke ili bočice s koncentracijom, ljekarnom, datumom isteka i brojem serije."
    - title: "Vaši podsjetnici"
      body: "Stvorite dnevne, tjedne ili svakih N dana obavijesti oko rasporeda koji postavite. Na dan doze na obavijesti je radnja unosa, a živa aktivnost može ostati na zaključanom zaslonu dok ne unesete."
    - title: "Ponesite povijest"
      body: "Uvezite postojeće unose iz kompatibilnog izvoza dnevnika lijekova u Dial."

