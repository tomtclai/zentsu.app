proof:
  label: "Zašto Dial"
  points:
    - "iPhone i Apple Watch"
    - "Otvara se bez Dial računa"
    - "Doživotna kupnja"
    - "Procijenjena razina iz vaših doza"

level:
  kicker: "Dial Pro · Procijenjena razina"
  heading: "Grafikon koristi doze koje ste već unijeli."
  body: "Dial crta procijenjenu razinu lijeka kroz vrijeme. Koristi unesene doze i poluživot prikazan u aplikaciji. Promijenite raspon i pregledajte tjedan, mjesec ili šest mjeseci vlastite povijesti."
  boundary_lead: "To je procjena. Tako i pišemo."
  boundary_body: "Grafikon modelira standardnu krivulju opadanja iz doza koje ste unijeli. Pokazuje vaše obrasce između doza. To je procjena, ne izmjerena razina u krvi. Ne predlaže sljedeću dozu. Dial ne izračunava doze. Aplikacija metodu objašnjava u cijelosti."

logging:
  kicker: "Brzi unos"
  heading: "Lijek, količina, mjesto i bilješke u jednom obrascu."
  body: "Zapišite lijek, količinu, datum, vrijeme, mjesto injekcije i bilješke. Nedavne vrijednosti popunjavaju sljedeći unos. Svako polje i dalje potvrđujete sami. Dial prepoznaje semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid, dulaglutid i eksenatid pod zaštićenim nazivima i nazivima pakiranja koji se koriste u Hrvatskoj, i prima vlastiti lijek ako propisanog nema na popisu."
  checklist:
    - "Uredite unos kad se nešto promijeni"
    - "Mjesta injekcije ostaju uz svaku dozu"
    - "Unosi težine stoje uz vremensku crtu doza"

history:
  kicker: "Dial Pro · Povijest i trendovi"
  heading: "Grafikoni doze, težine i nuspojava iz vaših unosa."
  body: "Popisi doze, težine i nuspojava ostaju besplatni. Dial Pro dodaje pune grafikone doze i težine te trendove iz unosa nuspojava koji već stoje u zapisu."
  history_card_title: "Povijest doze i težine"
  history_card_note: "Pregledajte promjene u rasponu koji odaberete."
  side_effects_card_title: "Trendovi nuspojava"
  side_effects_card_note: "Pregledajte učestalost i ozbiljnost iz postojeće ili uvezene povijesti."

report:
  kicker: "Dial Pro · PDF izvješće"
  heading: "PDF vaših unosa za posjet liječniku."
  body: "Napravite PDF s poviješću doza, promjenama unesene količine, mjestima injekcije, trendom težine i obrascima nuspojava. Dial ga sastavlja na uređaju. Dijelite ga tek kad odlučite, AirDropom, e-poštom ili ispisom."
  closing: "Ostaje privatno dok zapis ne treba napustiti telefon."
  smallprint: "Izvješće sažima vaše unose. Nije medicinski karton ni plan liječenja."

watch:
  kicker: Apple Watch
  heading: "Unesite dozu sa zapešća."
  body: "Aplikacija na satu pokazuje prsten ciklusa koji odbrojava do sljedeće doze i kad pada sljedeći podsjetnik. Dial Pro bilježi dozu s tog zaslona. Količinu postavite Digital Crownom, odaberite mjesto injekcije i potvrdite. Unos se sinkronizira s iPhoneom."
  checklist:
    - "Prsten ciklusa, stanje doze i sljedeći podsjetnik na prvi pogled (besplatno)"
    - "Unos doze sa zapešća Digital Crownom (Dial Pro)"
    - "Widgeti procijenjene razine i sljedeće doze na brojčaniku te brzi unos u Pametnom stogu (Dial Pro)"
    - "Na iPhoneu Dial Pro omogućuje unos jednim dodirom iz Kontrolnog centra, tipke za radnju, Siri ili Live Activity na dan podsjetnika. Besplatne radnje otvaraju obrazac."

supporting:
  kicker: "Uz rutinu"
  heading: "Zalihe, podsjetnici i uvoz stoje u istom zapisu."
  features:
    - title: "Zalihe"
      body: "Pratite olovke ili bočice s koncentracijom, ljekarnom, datumom isteka i brojem serije."
    - title: "Vaši podsjetnici"
      body: "Stvorite dnevne, tjedne ili svakih N dana obavijesti prema rasporedu koji postavite. Na dan doze obavijest nudi radnju unosa, a Live Activity može ostati na zaključanom zaslonu dok ne unesete."
    - title: "Uvezite postojeće unose"
      body: "Otvorite kompatibilan izvoz dnevnika lijekova u Dialu da uvezete postojeće unose."

