privacy:
  kicker: "Privatnost"
  heading: "Jasno što ostaje na uređaju."
  specs:
    - term: "Računi"
      detail: "Dial račun ne postoji. Otvorite aplikaciju i počnite unositi."
    - term: "Analitika korištenja"
      detail: "Dial ne pokreće analitiku korištenja ni telemetriju. Ne mjerimo kako je koristite."
    - term: "Naši poslužitelji"
      detail: "Zentsu ne vodi poslužitelj koji pohranjuje ili čita vaše zapise."
    - term: "Neobavezna sinkronizacija"
      detail: "Uključite iCloud u aplikaciji pa se zapisi sinkroniziraju preko privatne CloudKit baze na vašem Apple računu, ne prema nama."
  body: "Zapisi lijeka, doze, podsjetnika i zalihe ostaju na uređaju. Unosi težine koriste odvojenu lokalnu pohranu, a pristup Zdravlju je neobavezan i pokriva samo tjelesnu težinu kad date dopuštenje."
  policy_link: "Pročitajte pravila privatnosti Diala"
  policy_url: /hr/dial/privacy/

