  heading: "मूल डायरी मुफ्त में इस्तेमाल करें।"
  body: "अनुमानित स्तर ग्राफ़, निर्यात या Apple Watch और iPhone पर एक टैप से दर्ज करने के लिए Pro लें। हर Dial Pro योजना में वही सुविधाएँ हैं।"
  free_name: "मुफ्त"
  free_summary: "एक सक्रिय दवा का पूरा रिकॉर्ड।"
  free_features:
    - "खुराक, इंजेक्शन की जगह, वजन, दुष्प्रभाव और प्रगति फ़ोटो दर्ज करें"
    - "एक सक्रिय दवा और एक अनुस्मारक"
