privacy:
  kicker: "गोपनीयता"
  heading: "रिकॉर्ड डिवाइस पर रहते हैं।"
  specs:
    - term: "खाते"
      detail: "दर्ज करना शुरू करने के लिए Dial खाते की ज़रूरत नहीं।"
    - term: "उपयोग विश्लेषण"
      detail: "Dial उपयोग विश्लेषण या टेलीमेट्री नहीं लेता।"
    - term: "हमारे सर्वर"
      detail: "Zentsu कोई सर्वर नहीं चलाती जो आपके रिकॉर्ड संग्रहीत या पढ़े।"
    - term: "वैकल्पिक सिंक"
      detail: "iCloud चालू हो तो मुख्य रिकॉर्ड आपके Apple खाते की निजी CloudKit डेटाबेस इस्तेमाल करते हैं, हमारे सर्वर नहीं।"
  body: "मुख्य रिकॉर्ड डिवाइस पर रहते हैं। वजन प्रविष्टियाँ और प्रगति फ़ोटो अलग स्थानीय संग्रहण इस्तेमाल करती हैं।"
  policy_link: "Dial गोपनीयता नीति पढ़ें"
  policy_url: /hi/dial/privacy/

availability:
  kicker: "Dial डाउनलोड करें"
  heading: "अब App Store पर।"
  body: "Dial डाउनलोड करना मुफ्त है, खाता बनाने की ज़रूरत नहीं। Dial Pro अनुमानित स्तर ग्राफ़, पूरे इतिहास ग्राफ़, PDF और CSV निर्यात, और Apple Watch तथा iPhone से तेज़ दर्ज करना जोड़ता है।"

