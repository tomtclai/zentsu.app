hero:
  availability: "अब App Store पर"
  headline_lead: "हर खुराक का निजी रिकॉर्ड।"
  headline_accent: ""
  category: "Dial iPhone और Apple Watch के लिए GLP-1 दवा ट्रैकर है।"
  detail: "फोन या कलाई पर हर खुराक समय और इंजेक्शन की जगह के साथ दर्ज करें। Dial Pro खुराकों के बीच अनुमानित स्तर बनाता है, और डॉक्टर के लिए PDF तैयार करता है। रिकॉर्ड डिवाइस पर रहते हैं। iCloud चालू करें तो आपकी अपनी निजी iCloud डेटाबेस में भी।"
  free_line: "डाउनलोड मुफ्त है, खाता बनाने की ज़रूरत नहीं। खुराक लॉग की कोई सीमा नहीं है।"
  secondary_cta: "Dial कैसे काम करता है"
  qr_caption: "स्कैन करें, iPhone पर App Store में Dial खुल जाएगा।"
  platforms_label: "Dial प्लेटफ़ॉर्म और संग्रहण"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, नियंत्रण केंद्र और लॉक स्क्रीन"
    - "वैकल्पिक निजी iCloud संग्रहण"
  legal: "Dial एक निजी रिकॉर्ड है। यह खुराक की गणना नहीं करता, और डॉक्टर के निर्देश की जगह नहीं लेता। Dial Pro नीचे बताए अनुमानित स्तर ग्राफ़, पूरा इतिहास, निर्यात और तेज़ दर्ज करना जोड़ता है।"

