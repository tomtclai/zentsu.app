level:
  kicker: "Dial Pro · अनुमानित स्तर"
  heading: "दर्ज खुराकों का साफ चित्र।"
  body: "Dial आपकी दर्ज खुराकों और ऐप में दिखने वाले अर्ध-आयु मान से समय के साथ अनुमानित दवा स्तर बनाता है। अपनी इतिहास की एक सप्ताह, एक महीना या छह महीने देखने के लिए सीमा बदलें।"
  boundary_lead: "अनुमान, साफ़ कहा गया।"
  boundary_body: "ग्राफ़ आपकी दर्ज खुराकों से मानक क्षय वक्र मॉडल करता है। यह खुराकों के बीच आपके पैटर्न दिखाता है। यह मापा रक्त स्तर नहीं है और अगली खुराक का सुझाव नहीं है। Dial खुराक की गणना नहीं करता। ऐप विधि पूरी तरह समझाता है।"

logging:
  kicker: "तेज़ दर्ज करना"
  heading: "खुराक के साथ ज़रूरी बातें दर्ज करें।"
  body: "केंद्रित फॉर्म में दवा, मात्रा, तारीख, समय, इंजेक्शन स्थल और नोट लिखें। हाल के मान अगली प्रविष्टि तेज़ करते हैं, और हर क्षेत्र आपकी पुष्टि के लिए रहता है। Dial तब भी काम करता है जब निर्धारित करने वाले इसे Ozempic, Wegovy, Mounjaro या Zepbound कहें।"
  checklist:
    - "कुछ बदलने पर प्रविष्टि संपादित करें"
    - "हर खुराक से इंजेक्शन स्थल जुड़े रखें"
    - "खुराक समयरेखा के साथ वजन प्रविष्टियाँ रखें"

history:
  kicker: "Dial Pro · इतिहास और रुझान"
  heading: "पूरे रिकॉर्ड में पैटर्न देखें।"
  body: "खुराक, वजन और दुष्प्रभाव सूचियाँ मुफ्त रहती हैं। Dial Pro पूरे खुराक और वजन ग्राफ़ जोड़ता है, साथ ही रिकॉर्ड में पहले से मौजूद दुष्प्रभाव प्रविष्टियों के रुझान।"
  history_card_title: "खुराक और वजन इतिहास"
  history_card_note: "चुनी सीमा में बदलाव देखें।"
  side_effects_card_title: "दुष्प्रभाव रुझान"
  side_effects_card_note: "मौजूदा या आयातित इतिहास से आवृत्ति और गंभीरता देखें।"

report:
  kicker: "Dial Pro · PDF रिपोर्ट"
  heading: "अगली मुलाकात पर पूरी तस्वीर ले जाएँ।"
  body: "खुराक इतिहास, दर्ज मात्रा में बदलाव, इंजेक्शन स्थल, वजन रुझान और दुष्प्रभाव पैटर्न वाली PDF बनाएँ। Dial इसे डिवाइस पर बनाता है, और आप AirDrop, ईमेल या प्रिंट से तभी साझा करते हैं जब आप तय करें।"
  closing: "बाकी समय निजी। जब रिकॉर्ड फोन से बाहर जाए, तब काम आए।"
  smallprint: "रिपोर्ट आपकी प्रविष्टियाँ सारांशित करती है। यह चिकित्सा रिकॉर्ड या उपचार योजना नहीं है।"

watch:
  kicker: Apple Watch
  heading: "कलाई से खुराक दर्ज करें।"
  body: "वॉच ऐप अगली खुराक तक गिनती वाली चक्र रिंग और अगला अनुस्मारक दिखाता है। Dial Pro उस झलक को पूरी प्रविष्टि बनाता है: Digital Crown से मात्रा सेट करें, इंजेक्शन स्थल चुनें, पुष्टि करें। प्रविष्टि iPhone से सिंक होती है और दोनों डिवाइस के बीच रहती है।"
  checklist:
    - "चक्र रिंग, खुराक स्थिति और अगला अनुस्मारक एक नज़र में (मुफ्त)"
    - "Digital Crown से कलाई पर खुराक दर्ज करें (Dial Pro)"
    - "घड़ी के चेहरे पर अनुमानित स्तर और अगली खुराक विजेट, तथा Smart Stack में तेज़ दर्ज करना (Dial Pro)"
    - "iPhone पर Pro नियंत्रण केंद्र, एक्शन बटन, Siri या अनुस्मारक दिन की Live Activity से एक टैप दर्ज करना चालू करता है। मुफ्त क्रियाएँ फॉर्म खोलती हैं।"

supporting:
  kicker: "दिनचर्या के आसपास"
  heading: "व्यावहारिक विवरण पास रहते हैं।"
  features:
    - title: "भंडार"
      body: "सांद्रता, फ़ार्मेसी, समाप्ति तिथि और लॉट नंबर के साथ पेन या वायल ट्रैक करें।"
    - title: "आपके अनुस्मारक"
      body: "आपके सेट शेड्यूल के आसपास दैनिक, साप्ताहिक या हर-N-दिन सूचनाएँ बनाएँ। खुराक के दिन सूचना पर दर्ज करने की क्रिया होती है, और Live Activity लॉक स्क्रीन पर रह सकती है जब तक आप दर्ज न करें।"
    - title: "इतिहास साथ लाएँ"
      body: "मौजूदा प्रविष्टियाँ आयात करने के लिए Dial से दवा डायरी का संगत निर्यात खोलें।"

