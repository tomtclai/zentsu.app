hero:
  availability: "अब App Store पर"
  headline_lead: "निजी GLP-1 डायरी।"
  headline_accent: ""
  category: "Dial iPhone और Apple Watch पर खुराक का रिकॉर्ड रखता है।"
  detail: "iPhone या Apple Watch पर खुराक दर्ज करें, अपनी दर्ज खुराकों से बना अनुमानित स्तर देखें, और मुख्य रिकॉर्ड डिवाइस पर या अपनी निजी iCloud डेटाबेस में रखें।"
  secondary_cta: "Dial कैसे काम करता है"
  platforms_label: "Dial प्लेटफ़ॉर्म और संग्रहण"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, नियंत्रण केंद्र और लॉक स्क्रीन"
    - "वैकल्पिक निजी iCloud संग्रहण"
  legal: "मूल डायरी मुफ्त है। Dial Pro ग्राफ़, निर्यात, अधिक दवाएँ और अनुस्मारक तथा Apple डिवाइस पर एक टैप से दर्ज करना जोड़ता है। Dial व्यक्तिगत रिकॉर्ड है। यह खुराक की गणना नहीं करता और निर्धारित करने वाले के निर्देश का विकल्प नहीं है।"

