  detail: "iPhone या Apple Watch पर खुराक दर्ज करें। Dial उन प्रविष्टियों से अनुमानित स्तर बनाता है। मुख्य रिकॉर्ड डिवाइस पर रहते हैं। iCloud चालू करें तो आपकी निजी iCloud डेटाबेस में भी।"
