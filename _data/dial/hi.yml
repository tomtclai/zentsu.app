privacy:
  kicker: "गोपनीयता"
  heading: "साफ है कि डिवाइस पर क्या रहता है।"
  specs:
    - term: "खाते"
      detail: "कोई Dial खाता नहीं है। ऐप खोलें और दर्ज करना शुरू करें।"
    - term: "उपयोग विश्लेषण"
      detail: "Dial उपयोग विश्लेषण या टेलीमेट्री नहीं चलाता। हम नहीं मापते कि आप इसे कैसे इस्तेमाल करते हैं।"
    - term: "हमारे सर्वर"
      detail: "Zentsu कोई सर्वर नहीं चलाती जो आपके रिकॉर्ड संग्रहीत या पढ़े।"
    - term: "वैकल्पिक सिंक"
      detail: "ऐप में iCloud चालू करें तो रिकॉर्ड आपके Apple खाते की निजी CloudKit डेटाबेस से सिंक होते हैं, हमारे पास नहीं।"
  body: "दवा, खुराक, अनुस्मारक और भंडार डिवाइस पर रहते हैं। वजन प्रविष्टियाँ अलग स्थानीय संग्रहण इस्तेमाल करती हैं, और स्वास्थ्य पहुँच वैकल्पिक है तथा अनुमति देने पर केवल शरीर का वजन कवर करती है।"
  policy_link: "Dial गोपनीयता नीति पढ़ें"
  policy_url: /hi/dial/privacy/

