    - "वैकल्पिक निजी iCloud संग्रहण"
  legal: "Dial Pro ग्राफ़, निर्यात, एक से अधिक दवाएँ और अनुस्मारक तथा Apple डिवाइस पर एक टैप से दर्ज करना जोड़ता है। Dial निजी रिकॉर्ड है। यह खुराक की गणना नहीं करता, और डॉक्टर के निर्देश की जगह नहीं लेता।"

