level:
  kicker: "Dial Pro · अनुमानित स्तर"
  heading: "ग्राफ़ उन्हीं खुराकों से बनता है जो आप पहले दर्ज कर चुके हैं।"
  body: "Dial आपकी दर्ज खुराकों और ऐप में दिखने वाले अर्ध-आयु मान से समय के साथ अनुमानित दवा स्तर बनाता है। सीमा बदलकर अपने इतिहास का एक सप्ताह, एक महीना या छह महीने देखें।"
  boundary_lead: "यह अनुमान है, साफ़ कहा।"
  boundary_body: "ग्राफ़ आपकी दर्ज खुराकों से मानक क्षय वक्र बनाता है। यह खुराकों के बीच आपके पैटर्न दिखाता है। यह मापा रक्त स्तर नहीं है, और अगली खुराक का सुझाव नहीं है। Dial खुराक की गणना नहीं करता। ऐप में विधि पूरी तरह बताई गई है।"

logging:
  kicker: "तेज़ दर्ज करना"
  heading: "एक फॉर्म में दवा, मात्रा, जगह और नोट।"
  body: "दवा, मात्रा, तारीख, समय, इंजेक्शन की जगह और नोट लिखें। पिछले मान अगली प्रविष्टि में पहले से भर जाते हैं। हर फ़ील्ड की पुष्टि आप करते हैं। Dial Semaglutide (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound), liraglutide, dulaglutide और exenatide को आपके देश में चलने वाले ब्रांड और पैक के नामों के साथ जानता है, और आपकी दवा सूची में न हो तो कस्टम दवा स्वीकार करता है।"
  checklist:
    - "कुछ बदलने पर प्रविष्टि संपादित करें"
    - "हर खुराक के साथ इंजेक्शन की जगह दर्ज रखें"
    - "खुराक समयरेखा के साथ वजन प्रविष्टियाँ रखें"

history:
  kicker: "Dial Pro · इतिहास और रुझान"
  heading: "आपकी प्रविष्टियों से खुराक, वजन और दुष्प्रभाव ग्राफ़।"
  body: "खुराक, वजन और दुष्प्रभाव सूचियाँ मुफ्त रहती हैं। Dial Pro पूरे खुराक और वजन ग्राफ़ जोड़ता है, और रिकॉर्ड में पहले से मौजूद दुष्प्रभाव प्रविष्टियों के रुझान भी।"
  history_card_title: "खुराक और वजन इतिहास"
  history_card_note: "चुनी सीमा में बदलाव देखें।"
  side_effects_card_title: "दुष्प्रभाव रुझान"
  side_effects_card_note: "मौजूदा या आयातित इतिहास से आवृत्ति और गंभीरता देखें।"

report:
  kicker: "Dial Pro · PDF रिपोर्ट"
  heading: "डॉक्टर से मिलने के लिए प्रविष्टियों की PDF।"
  body: "खुराक इतिहास, दर्ज मात्रा में बदलाव, इंजेक्शन की जगह, वजन रुझान और दुष्प्रभाव पैटर्न वाली PDF बनाएँ। Dial इसे डिवाइस पर बनाता है। AirDrop, ईमेल या प्रिंट तभी जब आप बाँटें।"
  closing: "बाकी समय यह निजी रहता है। काम तब पड़ता है जब रिकॉर्ड फोन से बाहर जाना हो।"
  smallprint: "रिपोर्ट आपकी प्रविष्टियों का सार है। यह चिकित्सा रिकॉर्ड या उपचार योजना नहीं है।"

watch:
  kicker: Apple Watch
  heading: "कलाई से खुराक दर्ज करें।"
  body: "वॉच ऐप अगली खुराक तक की गिनती वाली रिंग और अगला अनुस्मारक दिखाता है। Dial Pro उसी स्क्रीन से दर्ज करता है। Digital Crown से मात्रा सेट करें, इंजेक्शन की जगह चुनें, पुष्टि करें। प्रविष्टि iPhone पर सिंक होती है।"
  checklist:
    - "गिनती की रिंग, खुराक स्थिति और अगला अनुस्मारक एक नज़र में (मुफ्त)"
    - "Digital Crown से कलाई पर खुराक दर्ज करें (Dial Pro)"
    - "घड़ी के चेहरे पर अनुमानित स्तर और अगली खुराक विजेट, तथा Smart Stack में तेज़ दर्ज करना (Dial Pro)"
    - "iPhone पर Dial Pro नियंत्रण केंद्र, एक्शन बटन, Siri या खुराक वाले दिन की Live Activity से एक टैप में दर्ज करना चालू करता है। मुफ्त क्रियाएँ फॉर्म खोलती हैं।"

supporting:
  kicker: "रोज़मर्रा के साथ"
  heading: "स्टॉक, अनुस्मारक और आयात एक ही रिकॉर्ड में रहते हैं।"
  features:
    - title: "स्टॉक"
      body: "सांद्रता, फ़ार्मेसी, समाप्ति तिथि और लॉट नंबर के साथ पेन या शीशी ट्रैक करें।"
    - title: "आपके अनुस्मारक"
      body: "आपके तय शेड्यूल के हिसाब से रोज़, साप्ताहिक या हर N दिन की सूचनाएँ बनाएँ। खुराक वाले दिन सूचना पर दर्ज करने की क्रिया होती है, और Live Activity लॉक स्क्रीन पर रह सकती है जब तक आप दर्ज न करें।"
    - title: "मौजूदा प्रविष्टियाँ आयात करें"
      body: "मौजूदा प्रविष्टियाँ लाने के लिए Dial में किसी दवा डायरी का संगत निर्यात खोलें।"

