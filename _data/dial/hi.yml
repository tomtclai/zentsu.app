privacy:
  kicker: "गोपनीयता"
  heading: "रिकॉर्ड डिवाइस पर रहते हैं।"
  specs:
    - term: "खाते"
      detail: "कोई Dial खाता नहीं है। ऐप खोलें और दर्ज करना शुरू करें।"
    - term: "उपयोग विश्लेषण"
      detail: "Dial उपयोग विश्लेषण या टेलीमेट्री नहीं चलाता। हम नहीं मापते कि आप इसे कैसे इस्तेमाल करते हैं।"
    - term: "हमारे सर्वर"
      detail: "Zentsu कोई सर्वर नहीं चलाती जो आपके रिकॉर्ड संग्रहीत या पढ़े।"
    - term: "वैकल्पिक सिंक"
      detail: "ऐप में iCloud चालू करें तो रिकॉर्ड आपके Apple खाते की निजी CloudKit डेटाबेस से सिंक होते हैं, हमारे पास नहीं।"
  body: "दवा, खुराक, अनुस्मारक और स्टॉक डिवाइस पर रहते हैं। वजन प्रविष्टियाँ अलग स्थानीय संग्रहण इस्तेमाल करती हैं। स्वास्थ्य पहुँच वैकल्पिक है, और अनुमति देने पर सिर्फ़ शरीर का वजन लेती है।"
  policy_link: "Dial गोपनीयता नीति पढ़ें"
  policy_url: /hi/dial/privacy/

availability:
  kicker: "Dial डाउनलोड करें"
  heading: "अब App Store पर।"
  body: "Dial डाउनलोड करना मुफ्त है। मूल डायरी पहली प्रविष्टि से काम करती है। Dial Pro अनुमानित स्तर ग्राफ़, पूरे ग्राफ़, PDF निर्यात और Apple Watch तथा iPhone से तेज़ दर्ज करना जोड़ता है।"
