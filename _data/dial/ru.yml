hero:
  availability: "Сейчас в App Store"
  headline_lead: "Дневник доз GLP-1."
  headline_accent: ""
  category: "Dial: личный дневник препаратов GLP-1 для iPhone и Apple Watch."
  detail: "Записывайте дозы на iPhone или Apple Watch, смотрите оценочный уровень (это оценка) по тем дозам, которые ведёте, и храните основные записи на устройстве или в своей частной базе iCloud."
  secondary_cta: "Как работает Dial"
  platforms_label: "Платформы и хранение Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Пункт управления и экран блокировки"
    - "Необязательное частное хранение iCloud"
  legal: "Основной дневник бесплатен. Dial Pro добавляет графики, экспорт, несколько препаратов и напоминаний и запись одним касанием на устройствах Apple. Dial является личной записью. Он не рассчитывает дозы и не заменяет указания лечащего врача."

proof:
  label: "Почему Dial"
  points:
    - "iPhone и Apple Watch"
    - "Без учётных записей, без аналитики использования"
    - "Вариант Lifetime"
    - "Оценочный уровень (оценка) по вашим дозам"

level:
  kicker: "Dial Pro · Оценочный уровень"
  heading: "Более ясная картина доз, которые вы записали."
  body: "Dial строит оценочный уровень препарата во времени по записанным дозам и периоду полувыведения в приложении. Смените диапазон, чтобы просмотреть неделю, месяц или шесть месяцев своей истории."
  boundary_lead: "Это оценка. Так и подписано."
  boundary_body: "График моделирует стандартную кривую снижения по записанным дозам. Он показывает ваши собственные закономерности между дозами. Это не измеренный уровень в крови и не совет, что принимать дальше. Dial не рассчитывает дозы. Приложение полностью объясняет метод."

logging:
  kicker: "Быстрая запись"
  heading: "Запишите дозу и всё, что к ней относится."
  body: "Укажите препарат, количество, дату, время, место инъекции и заметки в компактной форме. Недавние значения ускоряют следующую запись, и каждое поле остаётся на ваше подтверждение. Dial работает независимо от того, как лечащий врач называет препарат: Ozempic, Wegovy, Mounjaro или Zepbound."
  checklist:
    - "Править запись, когда что-то меняется"
    - "Места инъекций привязаны к каждой дозе"
    - "Записи веса рядом с историей доз"

history:
  kicker: "Dial Pro · История и тенденции"
  heading: "Просмотрите закономерность по всей записи."
  body: "Списки доз, веса и побочных эффектов остаются бесплатными. Dial Pro добавляет полные графики доз и веса. Дополнительно: тенденции из записей побочных эффектов, которые уже есть в записи."
  history_card_title: "История доз и веса"
  history_card_note: "Просмотрите изменения в выбранном диапазоне."
  side_effects_card_title: "Тенденции побочных эффектов"
  side_effects_card_note: "Просмотрите частоту и тяжесть из существующей или импортированной истории."

report:
  kicker: "Dial Pro · PDF-отчёт"
  heading: "Возьмите полную картину на следующий визит."
  body: "Создайте PDF с историей доз, изменениями записанного количества, местами инъекций, тенденцией веса и закономерностями побочных эффектов. Dial собирает его на устройстве, и вы делитесь им только когда решите, через AirDrop, почту или печать."
  closing: "В остальное время запись остаётся личной. Она нужна в тот момент, когда её надо передать с телефона."
  smallprint: "Отчёт суммирует ваши записи. Это не медицинская карта и не план лечения."

watch:
  kicker: Apple Watch
  heading: "Запишите дозу с запястья."
  body: "Приложение на часах показывает кольцо цикла, которое считает дни до следующей дозы, и когда сработает следующее напоминание. Dial Pro превращает этот обзор в полную запись: задайте количество с помощью Digital Crown, выберите место инъекции и подтвердите. Запись синхронизируется на iPhone и остаётся на обоих устройствах."
  checklist:
    - "Кольцо цикла, статус дозы и следующее напоминание с одного взгляда (бесплатно)"
    - "Запись дозы с запястья через Digital Crown (Dial Pro)"
    - "Виджеты оценочного уровня и следующей дозы на циферблате плюс быстрая запись в Smart Stack (Dial Pro)"
    - "На iPhone Dial Pro включает запись одним касанием из Пункта управления, кнопки действия, Siri или Live Activity в день напоминания. Бесплатные действия открывают форму."

supporting:
  kicker: "Дополнительно"
  heading: "Практические детали остаются рядом."
  features:
    - title: "Запас"
      body: "Ведите учёт ручек или флаконов с концентрацией, аптекой, сроком годности и номером партии."
    - title: "Ваши напоминания"
      body: "Создайте ежедневные, еженедельные или каждые N дней уведомления по расписанию, которое вы задаёте. В день дозы на уведомлении есть действие записи, а Live Activity может остаться на экране блокировки, пока не запишете."
    - title: "Возьмите историю с собой"
      body: "Откройте совместимый экспорт дневника препаратов в Dial, чтобы импортировать существующие записи."

plans:
  kicker: "Бесплатно и Dial Pro"
  heading: "Пользуйтесь основным дневником бесплатно."
  body: "Переходите на Dial Pro, когда нужны более подробные графики, экспорт или более быстрая запись на устройствах Apple. Каждый тариф Dial Pro включает те же функции."
  free_name: "Бесплатно"
  free_summary: "Полная запись для одного активного препарата."
  free_features:
    - "Запись доз, мест инъекций, веса, побочных эффектов и фото прогресса"
    - "Один активный препарат и одно напоминание"
    - "Списки доз и веса, запас, импорт и обзор на Apple Watch"
    - "Виджеты обратного отсчёта и напоминания, которые открывают форму"
  pro_name: Dial Pro
  pro_summary: "Оценочный уровень, полные графики, экспорт и быстрая запись."
  pro_features:
    - "График оценочного уровня и виджет на экране «Домой»"
    - "Полные графики доз и веса, тенденции побочных эффектов и сравнение фото"
    - "PDF-отчёт, экспорт CSV, несколько препаратов и несколько напоминаний"
    - "Быстрая запись и компликации на Apple Watch плюс запись одним касанием на iPhone"
  options_label: "Варианты тарифа Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "один раз"
  annual_name: "Годовой"
  annual_terms: "в год"
  monthly_name: "Месячный"
  monthly_terms: "в месяц"

privacy:
  kicker: "Конфиденциальность"
  heading: "Ясно, что остаётся на устройстве."
  specs:
    - term: "Учётные записи"
      detail: "Учётной записи Dial нет. Откройте приложение и начните записывать."
    - term: "Аналитика использования"
      detail: "Dial не ведёт аналитику использования и телеметрию. Мы не измеряем, как вы им пользуетесь."
    - term: "Наши серверы"
      detail: "У Zentsu нет сервера, который хранит или читает ваши записи."
    - term: "Необязательная синхронизация"
      detail: "Включите iCloud в приложении, и записи синхронизируются через частную базу CloudKit на вашем аккаунте Apple, а не через нас."
  body: "Записи препарата, дозы, напоминания и запаса остаются на устройстве. Записи веса используют отдельное локальное хранилище, а доступ к Здоровью необязателен и касается только массы тела, когда вы даёте разрешение."
  policy_link: "Читать политику конфиденциальности Dial"
  policy_url: /ru/dial/privacy/

availability:
  kicker: "Скачать Dial"
  heading: "Сейчас в App Store."
  body: "Dial бесплатен для скачивания. Основной дневник работает с первой записи. Dial Pro добавляет график оценочного уровня, полные графики, экспорт PDF и быструю запись с Apple Watch и iPhone."

