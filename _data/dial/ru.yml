hero:
  availability: "Сейчас в App Store"
  headline_lead: "Ведите дневник GLP-1."
  headline_accent: ""
  category: "На iPhone и Apple Watch. Записи остаются у вас."
  detail: "Запишите дозу на iPhone или Apple Watch. Dial строит оценочный уровень по этим записям. Основные данные остаются на устройстве или в вашем iCloud, если включить синхронизацию."
  secondary_cta: "Как работает Dial"
  platforms_label: "Где работает Dial и где хранятся данные"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Пункт управления и экран блокировки"
    - "Необязательная синхронизация через iCloud"
  legal: "Основной дневник бесплатен. Dial Pro добавляет графики, экспорт, несколько препаратов и напоминаний, плюс запись одним нажатием на устройствах Apple. Dial ведёт личный дневник. Он не рассчитывает дозы и не заменяет указания лечащего врача."

proof:
  label: "Почему Dial"
  points:
    - "iPhone и Apple Watch"
    - "Открывается без учётной записи Dial"
    - "Вариант Lifetime"
    - "Оценочный уровень по вашим дозам"

level:
  kicker: "Dial Pro · Оценочный уровень"
  heading: "График строится по уже записанным дозам."
  body: "Dial строит оценочный уровень препарата по записанным дозам и периоду полувыведения, указанному в приложении. Смените диапазон и посмотрите неделю, месяц или шесть месяцев своей истории."
  boundary_lead: "Это оценка. Так и подписано."
  boundary_body: "График моделирует стандартную кривую снижения по записанным дозам. Он показывает ваши собственные промежутки между дозами. Это не измеренный уровень в крови и не совет, что принимать дальше. Dial не рассчитывает дозы. Метод полностью описан в приложении."

logging:
  kicker: "Быстрая запись"
  heading: "Препарат, количество, место и заметки в одной форме."
  body: "Укажите препарат, количество, дату, время, место инъекции и заметки. Недавние значения подставляются в следующую запись. Каждое поле вы подтверждаете сами. Dial работает с Ozempic, Wegovy, Mounjaro и Zepbound."
  checklist:
    - "Запись можно изменить, если что-то поменялось"
    - "Места инъекций привязаны к каждой дозе"
    - "Записи веса рядом с историей доз"

history:
  kicker: "Dial Pro · История и тенденции"
  heading: "Графики доз, веса и побочных эффектов по вашим записям."
  body: "Списки доз, веса и побочных эффектов остаются бесплатными. Dial Pro добавляет полные графики доз и веса плюс динамику по уже внесённым записям побочных эффектов."
  history_card_title: "История доз и веса"
  history_card_note: "Просмотрите изменения в выбранном диапазоне."
  side_effects_card_title: "Тенденции побочных эффектов"
  side_effects_card_note: "Просмотрите частоту и тяжесть по уже имеющейся или импортированной истории."

report:
  kicker: "Dial Pro · PDF-отчёт"
  heading: "PDF ваших записей к приёму."
  body: "Сформируйте PDF с историей доз, изменениями записанного количества, местами инъекций, динамикой веса и побочных эффектов. Dial формирует его на устройстве, и вы делитесь им только когда решите: через AirDrop, почту или печать."
  closing: "В остальное время запись остаётся у вас. Она понадобится, когда нужно отправить её с телефона."
  smallprint: "Отчёт суммирует ваши записи. Это не медицинская карта и не план лечения."

watch:
  kicker: Apple Watch
  heading: "Запишите дозу с запястья."
  body: "Приложение на часах показывает кольцо обратного отсчёта до следующей дозы и время следующего напоминания. В Dial Pro дозу записывают с этого экрана. Задайте количество с помощью Digital Crown, выберите место инъекции и подтвердите. Запись синхронизируется на iPhone."
  checklist:
    - "Кольцо обратного отсчёта, статус дозы и следующее напоминание на одном экране (бесплатно)"
    - "Запись дозы с запястья через Digital Crown (Dial Pro)"
    - "Виджеты оценочного уровня и следующей дозы на циферблате плюс быстрая запись в Smart Stack (Dial Pro)"
    - "На iPhone Dial Pro включает запись одним нажатием из Пункта управления, кнопки действия, Siri или Live Activity в день напоминания. Бесплатные действия открывают форму."

supporting:
  kicker: "Ещё в дневнике"
  heading: "Запас, напоминания и импорт в том же дневнике."
  features:
    - title: "Запас"
      body: "Ведите учёт ручек или флаконов с концентрацией, аптекой, сроком годности и номером партии."
    - title: "Ваши напоминания"
      body: "Создайте ежедневные, еженедельные или повторяющиеся каждые N дней уведомления по расписанию, которое вы задаёте. В день дозы на уведомлении есть действие записи, а Live Activity может остаться на экране блокировки, пока не запишете."
    - title: "Импорт существующих записей"
      body: "Откройте в Dial совместимый файл экспорта из другого дневника препаратов, чтобы перенести уже существующие записи."

plans:
  kicker: "Бесплатно и Dial Pro"
  heading: "Пользуйтесь основным дневником бесплатно."
  body: "Переходите на Dial Pro ради графика оценочного уровня, экспорта или записи одним нажатием на Apple Watch и iPhone. В каждом тарифе Dial Pro одни и те же функции."
  free_name: "Бесплатно"
  free_summary: "Полный дневник для одного активного препарата."
  free_features:
    - "Запись доз, мест инъекций, веса, побочных эффектов и фото прогресса"
    - "Один активный препарат и одно напоминание"
    - "Списки доз и веса, запас, импорт и сводка на Apple Watch"
    - "Виджеты обратного отсчёта и напоминания, которые открывают форму"
  pro_name: Dial Pro
  pro_summary: "Оценочный уровень, полные графики, экспорт и быстрая запись."
  pro_features:
    - "График оценочного уровня и виджет на экране «Домой»"
    - "Полные графики доз и веса, тенденции побочных эффектов и сравнение фото"
    - "PDF-отчёт, экспорт CSV, несколько препаратов и несколько напоминаний"
    - "Быстрая запись и Complications на Apple Watch плюс запись одним нажатием на iPhone"
  options_label: "Варианты тарифа Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "один раз"
  annual_name: "Годовой"
  annual_terms: "в год"
  monthly_name: "Месячный"
  monthly_terms: "в месяц"

privacy:
  kicker: "Конфиденциальность"
  heading: "Записи остаются на устройстве."
  specs:
    - term: "Учётные записи"
      detail: "Учётной записи Dial нет. Откройте приложение и начните записывать."
    - term: "Аналитика использования"
      detail: "Dial не ведёт аналитику использования и телеметрию. Мы не измеряем, как вы им пользуетесь."
    - term: "Наши серверы"
      detail: "У Zentsu нет сервера, который хранит или читает ваши записи."
    - term: "Необязательная синхронизация"
      detail: "Включите iCloud в приложении, и записи синхронизируются через частную базу CloudKit на вашем аккаунте Apple, а не через нас."
  body: "Препарат, дозы, напоминания и запас хранятся локально. Записи веса используют отдельное локальное хранилище, а доступ к Здоровью необязателен и касается только массы тела, когда вы даёте разрешение."
  policy_link: "Читать политику конфиденциальности Dial"
  policy_url: /ru/dial/privacy/

availability:
  kicker: "Скачать Dial"
  heading: "Сейчас в App Store."
  body: "Dial бесплатен для скачивания. Основной дневник работает с первой записи. Dial Pro добавляет график оценочного уровня, полные графики, экспорт PDF и быструю запись с Apple Watch и iPhone."
