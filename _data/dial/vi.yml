    - "Một thuốc đang dùng và một lời nhắc"
    - "Danh sách liều và cân nặng, tồn kho, nhập và tổng quan Apple Watch"
    - "Widget đếm ngược và lời nhắc dẫn tới biểu mẫu"
  pro_name: Dial Pro
  pro_summary: "Mức ước tính, biểu đồ đầy đủ, xuất và ghi nhanh."
  pro_features:
    - "Biểu đồ mức ước tính và widget Màn hình chính"
    - "Biểu đồ liều và cân nặng đầy đủ, xu hướng tác dụng phụ và so sánh ảnh"
    - "Báo cáo PDF, xuất CSV, nhiều thuốc và nhiều lời nhắc"
    - "Ghi nhanh và Complications trên Apple Watch, kèm ghi một chạm trên iPhone"
  options_label: "Lựa chọn gói Dial Pro"
  lifetime_name: "Lifetime"
