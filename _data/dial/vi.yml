hero:
  availability: "Hiện có trên App Store"
  headline_lead: "Nhật ký GLP-1 của bạn."
  headline_accent: ""
  category: "Dial là nhật ký thuốc GLP-1 riêng tư cho iPhone và Apple Watch."
  detail: "Ghi một liều trên iPhone hoặc Apple Watch. Dial vẽ biểu đồ mức ước tính từ những mục đó. Nhật ký ở lại trên máy, hoặc trong cơ sở dữ liệu iCloud riêng nếu bạn bật đồng bộ."
  secondary_cta: "Dial hoạt động thế nào"
  platforms_label: "Nền tảng và lưu trữ Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Trung tâm điều khiển và màn hình khóa"
    - "Lưu trữ iCloud riêng, bật khi cần"
  legal: "Nhật ký cơ bản dùng miễn phí. Dial Pro thêm biểu đồ, xuất, nhiều thuốc và lời nhắc, cùng ghi một chạm trên thiết bị Apple. Dial là bản ghi cá nhân. Ứng dụng không tính liều và không thay thế hướng dẫn của bác sĩ."

proof:
  label: "Vì sao Dial"
  points:
    - "iPhone và Apple Watch"
    - "Mở mà không cần tài khoản Dial."
    - "Tùy chọn Lifetime"
    - "Mức ước tính từ liều của bạn"

level:
  kicker: "Dial Pro · Mức ước tính"
  heading: "Biểu đồ dựa trên các liều bạn đã ghi."
  body: "Dial vẽ biểu đồ mức thuốc ước tính theo thời gian, từ các liều đã ghi và thời gian bán hủy hiện trong ứng dụng. Chọn khoảng thời gian để xem lịch sử một tuần, một tháng hoặc sáu tháng của bạn."
  boundary_lead: "Đây là ước tính. Chúng tôi ghi rõ điều đó."
  boundary_body: "Biểu đồ vẽ đường cong suy giảm chuẩn từ các liều bạn đã ghi. Nó cho thấy xu hướng của bạn giữa các liều. Đó là ước tính, không phải mức máu đo được, cũng không phải gợi ý liều tiếp theo. Dial không tính liều. Ứng dụng giải thích đầy đủ cách ước tính."

logging:
  kicker: "Ghi nhanh"
  heading: "Thuốc, lượng, vị trí tiêm và ghi chú trong một biểu mẫu."
  body: "Ghi thuốc, lượng, ngày, giờ, vị trí tiêm và ghi chú. Mục tiếp theo nhớ giá trị vừa dùng. Bạn vẫn xác nhận từng trường. Dial dùng được với Ozempic, Wegovy, Mounjaro và Zepbound."
  checklist:
    - "Sửa mục khi có thay đổi"
    - "Mỗi liều gắn với một vị trí tiêm"
    - "Cân nặng nằm cạnh dòng thời gian liều"

history:
  kicker: "Dial Pro · Lịch sử và xu hướng"
  heading: "Biểu đồ liều, cân nặng và tác dụng phụ từ các mục của bạn."
  body: "Danh sách liều, cân nặng và tác dụng phụ vẫn miễn phí. Dial Pro thêm biểu đồ liều và cân nặng đầy đủ cùng xu hướng từ các mục tác dụng phụ đã có trong bản ghi."
  history_card_title: "Lịch sử liều và cân nặng"
  history_card_note: "Xem thay đổi trong khoảng bạn chọn."
  side_effects_card_title: "Xu hướng tác dụng phụ"
  side_effects_card_note: "Xem tần suất và mức độ từ lịch sử hiện có hoặc đã nhập."

report:
  kicker: "Dial Pro · Báo cáo PDF"
  heading: "Một PDF gồm các mục của bạn, mang đi khám."
  body: "Tạo PDF với lịch sử liều, thay đổi lượng đã ghi, vị trí tiêm, xu hướng cân nặng và xu hướng tác dụng phụ. Dial tạo file trên máy. Bạn chỉ chia sẻ khi muốn, qua AirDrop, email hoặc in."
  closing: "Ngày thường thì ở lại máy. Hữu ích khi bạn cần mang bản ghi đi khám."
  smallprint: "Báo cáo tóm tắt các mục của bạn. Không phải hồ sơ y tế hay kế hoạch điều trị."

watch:
  kicker: Apple Watch
  heading: "Ghi liều từ cổ tay."
  body: "Ứng dụng đồng hồ hiện vòng chu kỳ đếm đến liều tiếp theo, cùng thời điểm lời nhắc sắp tới. Dial Pro ghi từ màn đó. Đặt lượng bằng Digital Crown, chọn vị trí tiêm, xác nhận. Mục đồng bộ sang iPhone."
  checklist:
    - "Vòng chu kỳ, trạng thái liều và lời nhắc tiếp theo, nhìn thoáng qua (miễn phí)"
    - "Ghi liều từ cổ tay bằng Digital Crown (Dial Pro)"
    - "Widget mức ước tính và liều tiếp theo trên mặt đồng hồ, kèm ghi nhanh trong Smart Stack (Dial Pro)"
    - "Trên iPhone, Dial Pro cho phép ghi một chạm từ Trung tâm điều khiển, nút tác vụ, Siri hoặc Live Activity trong ngày lời nhắc. Bản miễn phí mở biểu mẫu ghi."

supporting:
  kicker: "Theo lịch của bạn"
  heading: "Tồn kho, lời nhắc và nhập ở chung một bản ghi."
  features:
    - title: "Tồn kho"
      body: "Theo dõi bút hoặc lọ với nồng độ, nhà thuốc, hạn dùng và số lô."
    - title: "Lời nhắc của bạn"
      body: "Tạo thông báo hàng ngày, hàng tuần hoặc mỗi N ngày theo lịch bạn đặt. Ngày liều có thao tác ghi trên thông báo, và Live Activity có thể nằm trên màn hình khóa đến khi bạn ghi."
    - title: "Nhập các mục có sẵn"
      body: "Mở bản xuất nhật ký thuốc tương thích với Dial để nhập các mục hiện có."

plans:
  kicker: "Miễn phí và Dial Pro"
  heading: "Dùng nhật ký cơ bản miễn phí."
  body: "Nâng cấp khi cần biểu đồ mức ước tính, xuất, hoặc ghi một chạm trên Apple Watch và iPhone. Mọi gói Dial Pro đều có cùng các tính năng."
  free_name: "Miễn phí"
