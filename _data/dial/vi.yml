  monthly_terms: "mỗi tháng"

privacy:
  kicker: "Quyền riêng tư"
  heading: "Bản ghi ở lại trên máy."
  specs:
    - term: "Tài khoản"
      detail: "Không có tài khoản Dial. Mở ứng dụng và bắt đầu ghi."
    - term: "Phân tích sử dụng"
      detail: "Dial không phân tích cách dùng và không gửi dữ liệu ngầm. Chúng tôi không theo dõi thao tác của bạn."
    - term: "Máy chủ của chúng tôi"
      detail: "Zentsu không vận hành máy chủ lưu hoặc đọc bản ghi của bạn."
    - term: "Đồng bộ tùy chọn"
      detail: "Bật iCloud trong ứng dụng thì bản ghi đồng bộ qua cơ sở dữ liệu CloudKit riêng trên Tài khoản Apple của bạn, không về chúng tôi."
  body: "Bản ghi thuốc, liều, lời nhắc và tồn kho ở lại trên máy. Mục cân nặng dùng kho lưu trữ cục bộ riêng, và quyền truy cập Sức khỏe là tùy chọn, chỉ gồm cân nặng cơ thể khi bạn cho phép."
  policy_link: "Đọc chính sách quyền riêng tư Dial"
  policy_url: /vi/dial/privacy/

availability:
  kicker: "Tải Dial"
  heading: "Hiện có trên App Store."
  body: "Tải Dial miễn phí. Nhật ký cơ bản chạy ngay từ mục ghi đầu tiên. Dial Pro thêm biểu đồ mức ước tính, biểu đồ đầy đủ, xuất PDF và ghi nhanh từ Apple Watch và iPhone."

