hero:
  availability: App Storeで公開中
  headline_lead: "GLP-1を記録に残す。"
  headline_accent: ""
  category: "Dialは、iPhoneとApple Watch向けの非公開のGLP-1記録です。"
  detail:
    iPhoneとApple Watchで投与を記録します。記録した投与から推定レベルを描きます。主な記録は端末に残ります。任意で、自分のiCloudにも残せます。
  free_line: 無料でダウンロードできます。投与の記録に上限はありません。
  secondary_cta: Dialの使い方
  platforms_label: Dialの対応機器と保存先
  platforms:
    - iPhone
    - Apple Watch
    - Siri、コントロールセンター、ロック画面
    - iCloudへの任意保存
  legal:
    Dial Proはグラフ、書き出し、複数の薬とリマインダー、iPhoneとApple Watchでのワンタップ記録を追加します。Dialは個人の記録です。医療機器ではありません。診断せず、用量を計算しません。処方医の指示の代わりにはなりません。

proof:
  label: Dialについて
  points:
    - iPhoneとApple Watch
    - Dialアカウントなしで使える
    - 買い切りの選択肢
    - 記録した投与からの推定レベル

level:
  kicker: Dial Pro · 推定レベル
  heading: 記録済みの投与からグラフを描く。
  body:
    Dialは、記録した投与とアプリに表示される半減期から、推定レベルを描きます。範囲を変えて、1週間、1か月、6か月の履歴を見直せます。
  boundary_lead: 推定レベルは推定です。実測ではありません。
  boundary_body:
    グラフは、記録した投与から標準的な減衰の目安を作ります。投与と投与のあいだの自分の推移を見るためのものです。血液の測定値の代わりでも、次に打つ量の提案でもありません。Dialは用量を計算しません。仕組みはアプリ内で説明します。

logging:
  kicker: すばやく記録
  heading: 薬、用量、注射部位、メモを残す。
  body:
    薬、用量、日付、時刻、注射部位、メモを残します。直近の値が次の入力欄に入ります。各欄は自分で確認します。Dialはセマグルチド（オゼンピック、ウゴービ）、チルゼパチド（マンジャロ、ゼップバウンド）、リラグルチド、デュラグルチド、エキセナチドを、日本で使われている販売名で記録でき、一覧にない薬は名前を入力して自分で追加できます。
  checklist:
    - 内容が変わったら記録を編集できる
    - 投与ごとに注射部位を残す
    - 体重の記録を投与の履歴の横に残す

history:
  kicker: Dial Pro · グラフと推移
  heading: 投与、体重、副作用のグラフ。
  body:
    投与、体重、副作用のリストは無料です。Dial Proは、投与と体重のグラフと、すでに記録した副作用からの推移を追加します。
  history_card_title: 投与と体重の履歴
  history_card_note: 選んだ期間の変化を見直す。
  side_effects_card_title: 副作用の推移
  side_effects_card_note: 既存または読み込んだ履歴から、頻度と強さを見直す。

report:
  kicker: Dial Pro · PDF要約
  heading: 診察向けのPDF。
  body:
    記録した投与、用量の変化、注射部位、体重の推移、副作用の推移をPDFにします。Dialは端末内で作り、AirDrop、メール、印刷で、自分で選んだときだけ共有します。
  closing:
    普段は端末に置いたままです。出すときだけ使います。
  smallprint: 要約は入力した記録のまとめです。診療録でも治療計画でもありません。

watch:
  kicker: Apple Watch
  heading: 手首から投与を記録する。
  body: >-
    Apple Watchアプリは、次の投与までのサイクルリングと、次のリマインダーを表示します。Dial Proは、その画面から投与を記録します。Digital Crownで用量を合わせ、注射部位を選び、確定します。記録はiPhoneに同期します。
  checklist:
    - サイクルリング、投与の状態、次のリマインダーを一目で見る（無料）
    - Digital Crownで手首から投与を記録（Dial Pro）
    - 文字盤の推定レベルと次の投与のウィジェット、スマートスタックからのクイック記録（Dial Pro）
    - iPhoneでは、Proがコントロールセンター、アクションボタン、Siri、リマインダー当日のLive Activityからのワンタップ記録を有効にします。無料の操作では、記録フォームが開きます。

supporting:
  kicker: 在庫と通知
  heading: 在庫、リマインダー、取り込み。
  features:
    - title: 在庫
      body: ペンやバイアルを、濃度、薬局、使用期限、ロット番号とともに残します。
    - title: 投与リマインダー
      body:
        毎日、毎週、またはN日ごとの通知を、自分で決めた間隔で作ります。投与の日は、通知から記録でき、Live Activityをロック画面に残して記録まで待てます。
    - title: 既存の記録の取り込み
      body: 対応する服薬記録の書き出しファイルをDialで開き、既存の記録を読み込みます。

plans:
  kicker: 無料とDial Pro
  heading: 基本の記録は無料で使う。
  body:
    推定レベル、書き出し、Apple WatchとiPhoneのワンタップ記録はProです。Dial Proのプランはどれも同じ機能です。
  free_name: 無料
  free_summary: 使用中の薬1つ分の記録。
  free_features:
    - 投与、注射部位、体重、副作用、経過の写真を記録
    - 使用中の薬1つとリマインダー1つ
    - 投与と体重のリスト、在庫、読み込み、Apple Watchの一目表示
    - カウントダウンウィジェットと、記録フォームを開くリマインダー
  pro_name: Dial Pro
  pro_summary: 推定レベル、グラフと推移、書き出し、クイック記録。
  pro_features:
    - 推定レベルのグラフとホーム画面のウィジェット
    - 投与と体重のグラフ、副作用の推移、写真の比較
    - PDF要約、CSV書き出し、複数の薬、複数のリマインダー
    - Apple Watchのクイック記録とコンプリケーション、iPhoneのワンタップ記録
  options_label: Dial Proのプラン
  lifetime_name: 買い切り
  lifetime_terms: 一度だけ
  annual_name: 年額
  annual_terms: 年ごと
  monthly_name: 月額
  monthly_terms: 月ごと

privacy:
  kicker: プライバシー
  heading: 記録は端末に残る。
  specs:
    - term: アカウント
      detail: Dialアカウントはありません。アプリを開いて記録を始めます。
    - term: 分析機能
      detail: 利用状況は計測しません。
    - term: 私たちのサーバ
      detail: Zentsuは、記録を保存したり読んだりするサーバを運営していません。
    - term: 任意の同期
      detail:
        アプリでiCloudと同期をオンにすると、記録は自分のApple AccountのプライベートCloudKitデータベースで同期します。Zentsuには来ません。
  body:
    薬、投与、リマインダー、在庫の記録は端末内に残ります。体重は別に端末へ保存します。ヘルスケアと同期は任意で、許可したときだけ体重を扱います。
  policy_link: Dialのプライバシーポリシーを読む
  policy_url: /ja/dial/privacy/

availability:
  kicker: Dialを入手
  heading: App Storeで公開中。
  body:
    Dialのダウンロードは無料です。基本の記録は最初の1件から使えます。Dial Proは推定レベルのグラフ、グラフと推移、PDF書き出し、Apple WatchとiPhoneからのクイック記録を追加します。
