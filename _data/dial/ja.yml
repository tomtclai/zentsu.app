hero:
  availability: App Storeで公開中
  headline_lead: 記録する。思い出す。
  headline_accent: 続ける。
  category: Dialは、iPhoneとApple Watch向けの非公開のGLP-1記録です。
  detail:
    iPhoneまたはApple WatchでGLP-1の投与を記録し、記録した投与から推定レベルを見ます。主な記録は端末内、または自分のプライベートなiCloudデータベースに残ります。
  secondary_cta: Dialの使い方
  platforms_label: Dialの対応と保存先
  platforms:
    - iPhone
    - Apple Watch
    - Siri、コントロールセンター、ロック画面
    - iCloudへの任意保存
  legal:
    基本の記録は無料です。Dial Proはグラフ、書き出し、複数の薬とリマインダー、Apple機器でのワンタップ記録を追加します。Dialは個人の記録です。医療機器ではありません。診断せず、用量を計算しません。処方した医師の案内の代わりにもなりません。

proof:
  label: Dialについて
  points:
    - iPhoneとApple Watch
    - アカウントも分析機能もない
    - 買い切りの選択肢
    - 記録した投与からの推定

level:
  kicker: Dial Pro · 推定レベル
  heading: 記録した投与を、見やすく並べる。
  body:
    Dialは、記録した投与とアプリに表示される半減期から、推定レベルを時間に沿って描きます。範囲を変えて、自分の履歴を1週間、1か月、6か月で見直せます。
  boundary_lead: 推定レベルは推定です。実測ではありません。
  boundary_body:
    グラフは、記録した投与から標準的な減衰の目安を作ります。投与と投与のあいだの自分の推移を見るためのものです。血液の測定値の代わりでも、次に打つ量の提案でもありません。Dialは用量を計算しません。方法はアプリ内で説明します。

logging:
  kicker: すばやく記録
  heading: 投与と、そのときの記録を残す。
  body:
    薬、用量、日付、時刻、注射部位、メモを、短いフォームに残します。直近の値で次の入力が速くなります。各欄は自分で確認します。処方した医師がOzempic、Wegovy、Mounjaro、Zepboundと呼ぶ場合でも、Dialはそのまま使えます。記録する名前は、日本での販売名（オゼンピック、ウゴービ、マンジャロ）でも構いません。
  checklist:
    - 内容が変わったらエントリを編集できる
    - 注射部位を各投与に付けて残す
    - 体重の記録を投与の時系列の横に残す

history:
  kicker: Dial Pro · グラフと推移
  heading: 記録全体の推移を見直す。
  body:
    投与、体重、副作用のリストは無料です。Dial Proは、投与と体重のグラフ全体と、すでに記録した副作用からの推移を追加します。
  history_card_title: 投与と体重の履歴
  history_card_note: 選んだ期間の変化を見直す。
  side_effects_card_title: 副作用の推移
  side_effects_card_note: 既存または読み込んだ履歴から、頻度と強さを見直す。

report:
  kicker: Dial Pro · PDF要約
  heading: 次の受診に、記録の要約を持っていく。
  body:
    記録した投与、用量の変化、注射部位、体重の推移、副作用の推移をPDFにします。Dialは端末内で作り、AirDrop、メール、印刷で、自分で選んだときだけ共有します。
  closing:
    普段は非公開のまま、記録を端末から出すそのときに使えます。
  smallprint: 要約は入力した記録のまとめです。診療録でも治療計画でもありません。

watch:
  kicker: Apple Watch
  heading: 手首から投与を記録する。
  body: >-
    Apple Watchアプリは、次の投与までのサイクルリングと、次のリマインダーを表示します。Dial Proなら、その画面から投与を記録できます。Digital Crownで用量を合わせ、注射部位を選び、確定します。エントリはiPhoneと同期し、2台のあいだに残ります。
  checklist:
    - サイクルリング、投与の状態、次のリマインダーを一目で見る（無料）
    - Digital Crownで手首から投与を記録（Dial Pro）
    - 文字盤の推定レベルと次の投与のウィジェット、スマートスタックからのクイック記録（Dial Pro）
    - iPhoneでは、Proがコントロールセンター、アクションボタン、Siri、リマインダー当日のライブアクティビティからのワンタップ記録を有効にします。無料の操作は記録フォームを開きます。

supporting:
  kicker: 記録のまわり
  heading: 在庫もリマインダーも、すぐそこに。
  features:
    - title: 在庫
      body: ペンやバイアルを、濃度、薬局、使用期限、ロット番号とともに残します。
    - title: 投与リマインダー
      body:
        毎日、毎週、またはN日ごとの通知を、自分で決めた間隔で作ります。投与の日は、通知に記録の操作があり、ライブアクティビティをロック画面に残して記録まで待てます。
    - title: 履歴を取り込む
      body: 対応する服薬記録の書き出しをDialで開き、既存のエントリを読み込みます。

plans:
  kicker: 無料とDial Pro
  heading: 基本の記録は無料で使う。
  body:
    より詳しいグラフ、書き出し、Apple機器での速い記録が欲しくなったらProにします。Dial Proのプランはどれも同じ機能です。
  free_name: 無料
  free_summary: 使用中の薬1つ分の記録。
  free_features:
    - 投与、注射部位、体重、副作用、経過の写真を記録
    - 使用中の薬1つとリマインダー1つ
    - 投与と体重のリスト、在庫、読み込み、Apple Watchの一目表示
    - カウントダウンウィジェットと、記録フォームを開くリマインダー
  pro_name: Dial Pro
  pro_summary: 推定レベル、グラフと推移、書き出し、クイック記録。
  pro_features:
    - 推定レベルのグラフとホーム画面のウィジェット
    - 投与と体重のグラフ全体、副作用の推移、写真の比較
    - PDF要約、CSV書き出し、複数の薬、複数のリマインダー
    - Apple Watchのクイック記録とコンプリケーション、iPhoneのワンタップ記録
  options_label: Dial Proのプラン
  lifetime_name: 買い切り
  lifetime_terms: 一度
  annual_name: 年額
  annual_terms: 年ごと
  monthly_name: 月額
  monthly_terms: 月ごと
  price_note:
    サブスクリプションは解約するまで更新されます。表示価格は米国価格です。購入前にApp Storeが現地価格を表示します。

privacy:
  kicker: プライバシー
  heading: 端末に残るものを、はっきり書く。
  specs:
    - term: アカウント
      detail: アプリを開いて記録を始めます。登録は不要です。
    - term: 分析機能
      detail: 使い方は測りません。
    - term: 私たちのサーバ
      detail: Zentsuは、記録を保存または読むサーバを運営していません。
    - term: 任意の同期
      detail:
        アプリでSync with iCloudをオンにすると、記録は自分のApple AccountのプライベートCloudKitデータベース経由で同期します。私たちには来ません。
  body:
    薬、投与、リマインダー、在庫の記録は端末内に残ります。体重は別のローカル保存です。ヘルスケアと同期は任意で、許可したときだけ体重を扱います。
  policy_link: Dialのプライバシーポリシーを読む
  policy_url: /ja/dial/privacy/

availability:
  kicker: Dialを入手
  heading: App Storeで公開中。
  body:
    Dialのダウンロードは無料です。基本の記録は最初の1件から使えます。Dial Proは推定レベルのグラフ、グラフと推移、PDF書き出し、Apple WatchとiPhoneからのクイック記録を追加します。
  email_label: メールアドレス
  email_placeholder: you@email.com
  submit: リリース案内を受け取る
  signup_note:
    任意です。新しいバージョンの案内だけです。開封やリンクの追跡はありません。いつでも解除できます。
  signup_privacy_link: プライバシーの詳細
  signup_privacy_url: /privacy
  signup_help: 困ったときは
  signup_support_link: Dialサポート
  signup_support_url: /ja/dial/support/
