hero:
  availability: Available now on the App Store
  headline_lead: "A private record of every dose."
  headline_accent: ""
  category: Dial is a GLP‑1 medication tracker for iPhone and Apple Watch.
  detail:
    Log each dose with the time and injection site, on your phone or your wrist. Dial Pro
    plots an estimated level between doses and builds a PDF for your prescriber. Records
    stay on the device, or in your own private iCloud database if you turn that on.
  free_line: Free to download, with no account to create. The dose log has no cap.
  secondary_cta: See how Dial works
  qr_caption: Scan to open Dial in the App Store on your iPhone.
  platforms_label: Dial platforms and storage
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Control Center, and Lock Screen
    - Optional private iCloud storage
  legal:
    Dial is a personal record. It does not calculate doses or replace guidance from
    your prescriber. Dial Pro adds the estimated-level chart, full history, exports,
    and quick logging described below.

proof:
  label: Why Dial
  points:
    - Cycle ring and next reminder on Apple Watch
    - Opens without a Dial account
    - Lifetime option, a single purchase
    - Estimated level between doses (Dial Pro)

level:
  kicker: Dial Pro · Estimated level
  heading: The chart uses the doses you already logged.
  body:
    Dial plots an estimated medication level over time from your recorded doses and
    the half-life value shown in the app. Change the range to review a week, month, or
    six months of your own history.
  boundary_lead: An estimate, and we say so.
  boundary_body:
    The chart models a standard decay curve from the doses you logged. It shows your
    own patterns between doses. It is an estimate, not a stand-in for a measured blood
    level, and not a suggestion of what to take next. Dial does not calculate doses.
    The app explains the method in full.

logging:
  kicker: Quick logging
  heading: Medication, amount, site, and notes in one form.
  body:
    Record medication, amount, date, time, injection site, and notes. Recent values
    fill the next entry. You still confirm every field. Dial knows semaglutide
    (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound), liraglutide, dulaglutide,
    and exenatide under the names used in your country, and takes a custom
    medication when yours is not listed.
  checklist:
    - Edit an entry when something changes
    - Keep injection sites attached to each dose
    - Keep weight entries alongside the dose timeline

history:
  kicker: Dial Pro · History and trends
  heading: Dose, weight, and side-effect charts from your entries.
  body:
    Dose, weight, and side-effect lists stay free. Dial Pro adds full dose and weight
    charts plus trends from the side-effect entries already in your record.
  history_card_title: Dose and weight history
  history_card_note: Review changes across the range you choose.
  side_effects_card_title: Side-effect trends
  side_effects_card_note: Review frequency and severity from existing or imported history.

report:
  kicker: Dial Pro · PDF report
  heading: A PDF of your entries for a clinic visit.
  body:
    Generate a PDF with your dose history, changes in recorded amount, injection sites,
    weight trend, and side-effect patterns. Dial builds it on your device, and you share
    it only when you decide to, by AirDrop, email, or print.
  closing:
    Private the rest of the time, and useful the one moment your record needs to leave
    your phone.
  smallprint: The report summarizes your entries. It is not a medical record or treatment plan.

watch:
  kicker: Apple Watch
  heading: Log the dose from your wrist.
  body: >-
    The watch app shows a cycle ring counting down to your next dose, and when the next
    reminder fires. Dial Pro logs from that screen. Set the amount with the Digital Crown,
    pick an injection site, and confirm. The entry syncs to your iPhone.
  checklist:
    - Cycle ring, dose status, and next reminder at a glance (free)
    - Log a dose from the wrist with the Digital Crown (Dial Pro)
    - Estimated-level and next-dose widgets on your watch face, plus Smart Stack quick
      logging (Dial Pro)
    - On iPhone, Pro enables one-tap logging from Control Center, the Action Button,
      Siri, or a reminder-day Live Activity. Free actions open the log form.

supporting:
  kicker: Around the routine
  heading: Inventory, reminders, and imports sit in the same record.
  features:
    - title: Supply inventory
      body: Track pens or vials with concentration, pharmacy, expiration date, and lot number.
    - title: Your reminders
      body:
        Create daily, weekly, or every-N-days notifications around the schedule you
        set. On dose day, a Log dose action sits on the notification, and a Live Activity
        can stay on the Lock Screen until you log.
    - title: Import existing entries
      body: Open a compatible medication-tracker export with Dial to import existing entries.

plans:
  kicker: Free and Dial Pro
  heading: Use the core tracker for free.
  body:
    Upgrade for the estimated-level chart, exports, or one-tap logging on Apple Watch
    and iPhone. Every Dial Pro plan includes the same features.
  free_name: Free
  free_summary: A complete record for one active medication.
  free_features:
    - Log doses, injection sites, weight, side effects, and progress photos
    - One active medication and one reminder
    - Dose and weight lists, inventory, imports, and the Apple Watch glance
    - Countdown widgets and reminders that open the log form
  pro_name: Dial Pro
  pro_summary: The estimated level, full charts, exports, and quick logging.
  pro_features:
    - Estimated-level chart and Home Screen level widget
    - Full dose and weight charts, side-effect trends, and photo comparison
    - PDF report, CSV export, multiple medications, and multiple reminders
    - Apple Watch quick-log and complications, plus one-tap iPhone logging
  options_label: Dial Pro plan choices
  lifetime_name: Lifetime
  lifetime_terms: once
  annual_name: Annual
  annual_terms: per year
  monthly_name: Monthly
  monthly_terms: per month

privacy:
  kicker: Privacy
  heading: Records stay on your device.
  specs:
    - term: Accounts
      detail: There is no Dial account. Open the app and start logging.
    - term: Analytics
      detail: Dial runs no usage analytics or telemetry. We measure nothing about how you use it.
    - term: Our servers
      detail: Zentsu operates no server that stores or reads your records.
    - term: Optional sync
      detail:
        Turn on iCloud in the app and records sync through the private CloudKit database
        on your own Apple Account, not to us.
  body:
    Medication, dose, reminder, and supply records stay on your device. Weight entries
    use a separate local store, and Apple Health access is optional, covering body weight
    only when you grant permission.
  policy_link: Read the Dial privacy policy
  policy_url: /dial/privacy/

availability:
  kicker: Get Dial
  heading: Available now on the App Store.
  body:
    Dial is free to download. The core tracker works from the first log. Dial Pro adds
    the estimated level chart, full charts, PDF export, and quick logging from Apple Watch
    and iPhone.
