hero:
  availability: "Teď v App Store"
  headline_lead: "Pište si dávky GLP-1."
  headline_accent: ""
  category: "Dial je soukromý deník léků GLP-1 pro iPhone a Apple Watch."
  detail: "Zaznamenejte dávku na iPhonu nebo Apple Watch. Dial z těch záznamů vykreslí odhadovanou hladinu. Záznamy zůstanou v zařízení, nebo v soukromé databázi iCloud, když iCloud zapnete."
  free_line: Ke stažení zdarma. Záznam dávek nemá limit.
  secondary_cta: "Jak Dial funguje"
  platforms_label: "Platformy Dial a úložiště"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Ovládací centrum a zámek obrazovky"
    - "Volitelné soukromé úložiště iCloud"
  legal: "Dial Pro přidává grafy, exporty, více léků a připomínek a záznam jedním klepnutím na zařízeních Apple. Dial je osobní záznam. Nepočítá dávky a nenahrazuje pokyny lékaře."

proof:
  label: "Proč Dial"
  points:
    - "iPhone a Apple Watch"
    - "Bez účtu Dial"
    - "Tarif Lifetime"
    - "Modelovaná hladina z vašich dávek"

level:
  kicker: "Dial Pro · Odhadovaná hladina"
  heading: "Graf bere dávky, které už máte zapsané."
  body: "Dial ze zaznamenaných dávek a z hodnoty poločasu v aplikaci vykreslí odhadovanou hladinu léku v čase. Rozsah přepnete na týden, měsíc nebo šest měsíců vlastní historie."
  boundary_lead: "Je to odhad. Tak ho i označujeme."
  boundary_body: "Graf modeluje standardní křivku poklesu z dávek, které jste zaznamenali. Ukazuje, jak u vás dávky v čase probíhají. Není to naměřená hladina v krvi ani návrh, co užít dál. Dial nepočítá dávky. Aplikace metodu vysvětluje celou."

logging:
  kicker: "Rychlý záznam"
  heading: "Lék, množství, místo vpichu a poznámky v jednom formuláři."
  body: "Zapište lék, množství, datum, čas, místo vpichu a poznámky. Poslední hodnoty předvyplní další záznam. Každé pole potvrzujete sami. Dial zná semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid, dulaglutid a exenatid pod obchodními názvy a názvy balení používanými v Česku a vezme si vlastní lék, pokud ten váš na seznamu není."
  checklist:
    - "Upravit záznam, když se něco změní"
    - "Místo vpichu u každé dávky"
    - "Záznamy hmotnosti vedle časové osy dávek"

history:
  kicker: "Dial Pro · Historie a trendy"
  heading: "Grafy dávek, hmotnosti a nežádoucích účinků z vašich záznamů."
  body: "Seznamy dávek, hmotnosti a nežádoucích účinků zůstávají zdarma. Dial Pro přidává úplné grafy dávek a hmotnosti a trendy z nežádoucích účinků, které už v záznamu jsou."
  history_card_title: "Historie dávek a hmotnosti"
  history_card_note: "Prohlédněte si změny v rozsahu, který zvolíte."
  side_effects_card_title: "Trendy nežádoucích účinků"
  side_effects_card_note: "Prohlédněte si četnost a závažnost z existující nebo importované historie."

report:
  kicker: "Dial Pro · PDF zpráva"
  heading: "PDF ze záznamů k návštěvě u lékaře."
  body: "Vytvořte PDF s historií dávek, změnami zaznamenaného množství, místy vpichu, vývojem hmotnosti a průběhem nežádoucích účinků. Dial ho sestaví na zařízení. Sdílíte ho, jen když se rozhodnete, přes AirDrop, e-mail nebo tisk."
  closing: "Jinak zůstane v telefonu. Hodí se ve chvíli, kdy záznam musíte vzít s sebou."
  smallprint: "Zpráva shrnuje vaše záznamy. Není to zdravotnická dokumentace ani léčebný plán."

watch:
  kicker: Apple Watch
  heading: "Zaznamenejte dávku na hodinkách."
  body: "Aplikace na hodinkách ukazuje kroužek cyklu, který odpočítává dny do další dávky, a kdy přijde příští připomínka. Z té obrazovky v Dial Pro dávku zapíšete. Množství nastavíte pomocí Digital Crown, zvolíte místo vpichu a potvrdíte. Záznam se přenese na iPhone."
  checklist:
    - "Kroužek cyklu, stav dávky a příští připomínka na pohled (zdarma)"
    - "Záznam dávky na hodinkách s Digital Crown (Dial Pro)"
    - "Widgety odhadované hladiny a příští dávky na ciferníku plus rychlý záznam ve Smart Stack (Dial Pro)"
    - "Na iPhonu Dial Pro zapne záznam jedním klepnutím z Ovládacího centra, akčního tlačítka, Siri nebo Live Activity v den připomínky. Ve verzi zdarma se otevře formulář záznamu."

supporting:
  kicker: "K běžnému chodu"
  heading: "Zásoby, připomínky i import patří do stejného záznamu."
  features:
    - title: "Zásoby"
      body: "Sledujte pera nebo lahvičky s koncentrací, lékárnou, datem expirace a číslem šarže."
    - title: "Vaše připomínky"
      body: "Vytvořte denní, týdenní nebo každých N dní oznámení podle plánu, který nastavíte. V den dávky z oznámení dávku rovnou zaznamenáte a Live Activity může zůstat na zámku obrazovky, dokud nezaznamenáte."
    - title: "Importujte existující záznamy"
      body: "Otevřete v Dial kompatibilní export z jiného deníku léků a naimportujte existující záznamy."

plans:
  kicker: "Zdarma a Dial Pro"
  heading: "Základní deník používejte zdarma."
  body: "Na Pro přejdete kvůli grafu odhadované hladiny, exportu nebo záznamu jedním klepnutím na Apple Watch a iPhonu. Každý tarif Dial Pro má stejné funkce."
  free_name: "Zdarma"
  free_summary: "Úplný záznam pro jeden aktivní lék."
  free_features:
    - "Záznam dávek, míst vpichu, hmotnosti, nežádoucích účinků a fotek pokroku"
    - "Jeden aktivní lék a jedna připomínka"
    - "Seznamy dávek a hmotnosti, zásoby, importy a přehled na Apple Watch"
    - "Widgety odpočtu a připomínky, které otevřou formulář záznamu"
  pro_name: Dial Pro
  pro_summary: "Odhadovaná hladina, úplné grafy, exporty a rychlý záznam."
  pro_features:
    - "Graf odhadované hladiny a widget na ploše"
    - "Úplné grafy dávek a hmotnosti, trendy nežádoucích účinků a porovnání fotek"
    - "PDF zpráva, export CSV, více léků a více připomínek"
    - "Rychlý záznam a komplikace na Apple Watch plus záznam jedním klepnutím na iPhonu"
  options_label: "Volby tarifu Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "jednou"
  annual_name: "Roční"
  annual_terms: "za rok"
  monthly_name: "Měsíční"
  monthly_terms: "za měsíc"

privacy:
  kicker: "Soukromí"
  heading: "Záznamy zůstanou v zařízení."
  specs:
    - term: "Účty"
      detail: "Účet Dial neexistuje. Otevřete aplikaci a začněte zaznamenávat."
    - term: "Analytika"
      detail: "Dial nespouští analytiku používání ani telemetrii. Neměříme, jak aplikaci používáte."
    - term: "Naše servery"
      detail: "Zentsu neprovozuje žádný server, který by ukládal nebo četl vaše záznamy."
    - term: "Volitelná synchronizace"
      detail: "Zapněte iCloud v aplikaci a záznamy se synchronizují přes soukromou databázi CloudKit na vašem Apple Account, ne k nám."
  body: "Záznamy léků, dávek, připomínek a zásob zůstanou v zařízení. Záznamy hmotnosti používají samostatné místní úložiště. Přístup ke Zdraví je volitelný a týká se jen tělesné hmotnosti, když oprávnění udělíte."
  policy_link: "Přečíst zásady ochrany osobních údajů Dial"
  policy_url: /cs/dial/privacy/

availability:
  kicker: "Stáhnout Dial"
  heading: "Teď v App Store."
  body: "Dial je ke stažení zdarma. Základní deník funguje od prvního záznamu. Dial Pro přidává graf odhadované hladiny, úplné grafy, export PDF a rychlý záznam z Apple Watch a iPhonu."
