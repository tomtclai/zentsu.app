hero:
  availability: "Nå i App Store"
  headline_lead: "Privat oversikt over hver dose."
  headline_accent: ""
  category: "Dial er en GLP-1-legemiddeloversikt for iPhone og Apple Watch."
  detail: "Før hver dose med tid og injeksjonssted, på telefonen eller håndleddet. Dial Pro tegner et estimert nivå mellom dosene og lager en PDF til legen din. Postene blir liggende på enheten, eller i din egen private iCloud-database hvis du slår det på."
  free_line: Gratis å laste ned, uten konto. Doseloggen har ingen grense.
  secondary_cta: "Slik fungerer Dial"
  qr_caption: "Skann for å åpne Dial i App Store på iPhone."
  platforms_label: "Dial-plattformer og lagring"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Kontrollsenter og låseskjerm"
    - "Valgfri privat iCloud-lagring"
  legal: "Dial er et personlig notat. Den beregner ikke doser og erstatter ikke råd fra legen din. Dial Pro legger til grafen for estimert nivå, full historikk, eksport og rask føring, som beskrevet under."

proof:
  label: "Hvorfor Dial"
  points:
    - "Syklusring og neste påminnelse på Apple Watch"
    - "Åpner uten Dial-konto"
    - "Lifetime-valg, ett kjøp"
    - "Estimert nivå mellom doser (Dial Pro)"

level:
  kicker: "Dial Pro · Estimert nivå"
  heading: "Se et estimert nivå mellom dosene, ut fra halveringstiden."
  body: "Dial tegner et estimert legemiddelnivå over tid ut fra dosene du har ført og halveringstiden appen viser. Velg uke, måned eller seks måneder for å se din egen historikk."
  boundary_lead: "Vi kaller det et anslag."
  boundary_body: "Grafen følger en vanlig nedbrytningskurve ut fra dosene du har ført. Den viser dine egne mønstre mellom doser. Det er et anslag, ikke et målt blodnivå, og ikke et forslag til hva du skal ta neste gang. Dial beregner ikke doser. Appen forklarer hele metoden."

logging:
  kicker: "Rask føring"
  heading: "Før legemiddel, dose og injeksjonssted i ett skjema."
  body: "Før legemiddel, mengde, dato, tid, injeksjonssted og notater. De siste verdiene fyller neste post. Du bekrefter likevel hvert felt. Dial kjenner semaglutid (Ozempic, Wegovy), tirzepatid (Mounjaro), liraglutid (Saxenda, Victoza), dulaglutid og eksenatid under de merke- og pakningsnavnene som brukes i Norge, og tar et eget legemiddel hvis det du har på resept ikke står på listen."
  checklist:
    - "Rediger en post når noe endrer seg"
    - "Injeksjonsstedet følger hver dose"
    - "Vektføringene ligger ved siden av dosene"

history:
  kicker: "Dial Pro · Historikk og trender"
  heading: "Grafer for dose, vekt og bivirkninger fra føringene dine."
  body: "Lister over dose, vekt og bivirkninger er fortsatt gratis. Dial Pro legger til grafene."
  history_card_title: "Dose- og vekthistorikk"
  history_card_note: "Se endringer i perioden du velger."
  side_effects_card_title: "Bivirkningstrender"
  side_effects_card_note: "Se hyppighet og alvorlighetsgrad fra eksisterende eller importert historikk."

report:
  kicker: "Dial Pro · PDF-rapport"
  heading: "En PDF av føringene dine til neste time."
  card_title: "PDF-rapport til legebesøket"
  body: "Lag en PDF med dosehistorikk, endringer i ført mengde, injeksjonssteder, vektutvikling og bivirkningsmønstre. Dial bygger den på enheten, og du deler den bare når du selv bestemmer, via AirDrop, e-post eller utskrift. Den samme historikken eksporteres som CSV."
  closing: "Ellers blir den på telefonen. Nyttig den ene gangen journalen skal ut."
  smallprint: "Rapporten oppsummerer postene dine. Den er ikke en pasientjournal eller en behandlingsplan."

watch:
  kicker: Apple Watch
  heading: "Før dosen fra håndleddet."
  body: "Apple Watch-appen viser en ring som teller ned til neste dose, og tidspunktet for neste påminnelse. Med Dial Pro fører du dosen derfra. Sett mengden med Digital Crown, velg injeksjonssted og bekreft. Posten synkroniseres til iPhone."
  checklist:
    - "Ring, dosestatus og neste påminnelse i ett blikk (gratis)"
    - "Før en dose fra håndleddet med Digital Crown (Dial Pro)"
    - "Widgeter for estimert nivå og neste dose på urskiven, pluss rask føring i Smart Stack (Dial Pro)"
    - "På iPhone kan du med Pro føre med ett trykk fra Kontrollsenter, handlingsknappen, Siri eller en Live Activity på påminnelsesdagen. Uten Pro åpner de samme handlingene føringsskjemaet."

supporting:
  kicker: "Alt i oversikten"
  heading: "Historikk, rapport, lager, påminnelser og import på ett sted."
  features:
    - title: "Lagerbeholdning"
      body: "Hold styr på penner eller hetteglass med konsentrasjon, apotek, utløpsdato og batchnummer."
    - title: "Påminnelsene dine"
      body: "Sett varsler hver dag, hver uke eller hver n-te dag, etter planen din. På dosedagen kan du føre rett fra varselet, og en Live Activity kan ligge på låseskjermen til du har ført."
    - title: "Importer eksisterende føringer"
      body: "Åpne en kompatibel eksportfil i Dial for å hente inn eksisterende føringer."

plans:
  kicker: "Gratis og Dial Pro"
  heading: "Bruk kjerneoverblikket gratis."
  body: "Dial Pro legger til grafen for estimert nivå, de fulle historikkgrafene, eksport og rask føring på Apple Watch og iPhone. Alle Dial Pro-planene har de samme funksjonene."
  free_name: "Gratis"
  free_summary: "Gratis for ett aktivt legemiddel, uten tak på doseloggen."
  free_features:
    - "Før doser, injeksjonssteder, vekt, bivirkninger og fremgangsbilder"
    - "Ett aktivt legemiddel og én påminnelse"
    - "Dose- og vektlister, lager, import og Apple Watch-oversikten"
    - "Nedtellingswidgeter og påminnelser som åpner føringsskjemaet"
  pro_name: Dial Pro
  pro_summary: "Se nivået mellom dosene, graf over hele historikken, og før fra håndleddet."
  cta_caption: "Last ned gratis, og velg en plan i appen."
  pro_features:
    - "Graf for estimert nivå og widget på Hjem-skjermen"
    - "Fulle dose- og vektgrafer, bivirkningstrender og bildesammenligning"
    - "PDF-rapport, CSV-eksport, flere legemidler og flere påminnelser"
    - "Rask føring og Complications på Apple Watch, pluss føring med ett trykk på iPhone"
  options_label: "Dial Pro-varianter"
  lifetime_name: Lifetime
  lifetime_terms: "én gang"
  annual_name: "Årlig"
  annual_terms: "per år"
  monthly_name: "Månedlig"
  monthly_terms: "per måned"

privacy:
  kicker: "Personvern"
  heading: "Føringene blir på enheten."
  specs:
    - term: "Kontoer"
      detail: "Du trenger ingen Dial-konto for å begynne å føre."
    - term: "Bruksanalyse"
      detail: "Dial samler ingen bruksanalyse eller telemetri."
    - term: "Serverne våre"
      detail: "Zentsu driver ingen server som lagrer eller leser postene dine."
    - term: "Valgfri synkronisering"
      detail: "Med iCloud bruker kjernepostene den private CloudKit-databasen på din Apple-konto, ikke serverne våre."
  body: "Kjernepostene blir liggende på enheten. Vektføringer og fremgangsbilder bruker et separat, kun lokalt lager."
  policy_link: "Les Dial-personvernerklæringen"
  policy_url: /no/dial/privacy/

availability:
  kicker: "Last ned Dial"
  heading: "Nå i App Store."
  body: "Dial er gratis å laste ned, uten konto. Dial Pro legger til grafen for estimert nivå, de fulle historikkgrafene, PDF- og CSV-eksport og rask føring fra Apple Watch og iPhone."

