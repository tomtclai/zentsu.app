hero:
  availability: Já disponível na App Store
  headline_lead: "Um registro privado de cada dose."
  headline_accent: ""
  category: O Dial é um registro de medicamentos GLP-1 para iPhone e Apple Watch.
  detail:
    Registre cada dose com o horário e o local de injeção, no telefone ou no pulso. O
    Dial Pro traça um nível estimado entre as doses e monta um PDF para quem prescreve.
    Os registros ficam no aparelho, ou no seu banco de dados privado do iCloud se você
    ligar essa opção.
  free_line: Grátis para baixar, sem conta para criar. O registro de doses não tem limite.
  secondary_cta: Veja como o Dial funciona
  qr_caption: Escaneie para abrir o Dial na App Store no seu iPhone.
  platforms_label: Plataformas e armazenamento do Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Central de Controle e Tela Bloqueada
    - Armazenamento privado opcional no iCloud
  legal:
    O Dial é um registro pessoal. Não calcula doses nem substitui a orientação de quem
    prescreve. O Dial Pro adiciona o gráfico de nível estimado, o histórico completo,
    as exportações e o registro rápido descritos abaixo.

proof:
  label: Por que o Dial
  points:
    - Anel de ciclo e próximo lembrete no Apple Watch
    - Abre sem uma conta Dial
    - Opção Lifetime, uma única compra
    - Nível estimado entre as doses (Dial Pro)

level:
  kicker: Dial Pro · Nível estimado
  heading: Veja um nível estimado entre as doses, segundo a meia-vida.
  body:
    O Dial traça um nível estimado do medicamento ao longo do tempo a partir das doses
    registradas e do valor de meia-vida mostrado no app. Mude o intervalo para revisar
    uma semana, um mês ou seis meses do seu próprio histórico.
  boundary_lead: É uma estimativa, e o app deixa isso claro.
  boundary_body:
    O gráfico modela uma curva de decaimento padrão a partir das doses que você registrou.
    Serve para notar os seus próprios padrões entre as doses, não para substituir um
    nível medido no sangue nem para sugerir o que tomar em seguida. O Dial não calcula
    doses. O app explica o método por completo.

logging:
  kicker: Registro rápido
  heading: Registre o medicamento, a dose e o local de injeção em um só formulário.
  body:
    Anote medicamento, quantidade, data, hora, local de injeção e notas. Os valores
    recentes preenchem a próxima entrada. Você confirma cada campo. Dial conhece
    semaglutida (Ozempic, Wegovy), tirzepatida (Mounjaro, Zepbound), liraglutida,
    dulaglutida e exenatida com as marcas e embalagens vendidas no Brasil, e aceita
    um medicamento personalizado se o seu não estiver na lista.
  checklist:
    - Edite uma entrada quando algo mudar
    - Mantenha o local de injeção junto de cada dose
    - Mantenha as entradas de peso ao lado da linha do tempo das doses

history:
  kicker: Dial Pro · Histórico e tendências
  heading: Gráficos de dose, peso e efeitos colaterais.
  body: As listas de doses, peso e efeitos colaterais continuam grátis. O Dial Pro adiciona os gráficos.
  history_card_title: Histórico de doses e peso
  history_card_note: Revise as mudanças no intervalo que você escolher.
  side_effects_card_title: Tendências de efeitos colaterais
  side_effects_card_note: Revise frequência e gravidade do histórico existente ou importado.

report:
  kicker: Dial Pro · Relatório em PDF
  heading: Um PDF para a consulta.
  card_title: Relatório em PDF para a consulta
  body:
    Gere um PDF com o histórico de doses, as mudanças na quantidade registrada, os
    locais de injeção, a tendência de peso e os padrões de efeitos colaterais. O Dial
    gera o PDF no dispositivo, e você compartilha só quando decide, por AirDrop, e-mail ou
    impressão. O mesmo histórico também sai como CSV.
  closing:
    Fica no telefone. Sai só quando você precisa mostrar o registro.
  smallprint: O relatório resume as suas entradas. Não é um prontuário médico nem um plano de tratamento.

watch:
  kicker: Apple Watch
  heading: Registre a dose pelo pulso.
  body: >-
    O app do relógio mostra um anel de ciclo que conta os dias até a próxima dose e
    indica quando chega o próximo lembrete. O Dial Pro registra nessa tela. Ajuste a quantidade com
    a Digital Crown, escolha um local de injeção e confirme. A entrada sincroniza com
    o iPhone.
  checklist:
    - Anel de ciclo, estado da dose e próximo lembrete de relance (grátis)
    - Registre uma dose pelo pulso com a Digital Crown (Dial Pro)
    - Widgets de nível estimado e de próxima dose no mostrador, mais registro rápido
      na Pilha Inteligente (Dial Pro)
    - No iPhone, o Pro habilita o registro em um toque pela Central de Controle, o
      Botão de Ação, a Siri ou uma Atividade ao Vivo no dia do lembrete. As ações grátis
      abrem o formulário.

supporting:
  kicker: Tudo no registro
  heading: Histórico, relatório, estoque, lembretes e importações, no mesmo lugar.
  features:
    - title: Estoque
      body: Acompanhe canetas ou frascos com concentração, farmácia, data de validade e número de lote.
    - title: Seus lembretes
      body:
        Crie notificações diárias, semanais ou a cada N dias no horário que você definir.
        No dia da dose, a notificação inclui uma ação para registrar, e uma Atividade
        ao Vivo pode ficar na Tela Bloqueada até você registrar.
    - title: Importar registros existentes
      body: Abra no Dial a exportação de um app de acompanhamento de medicamentos compatível para importar as entradas existentes.

plans:
  kicker: Grátis e Dial Pro
  heading: Use o registro básico de graça.
  body:
    O Dial Pro adiciona o gráfico de nível estimado, os gráficos do histórico, as
    exportações e o registro rápido no Apple Watch e no iPhone. Todos os planos do
    Dial Pro incluem as mesmas funções.
  free_name: Grátis
  free_summary: Grátis para um medicamento ativo, sem limite no registro de doses.
  free_features:
    - Registre doses, locais de injeção, peso, efeitos colaterais e fotos de progresso
    - Um medicamento ativo e um lembrete
    - Listas de doses e peso, estoque, importações e o resumo no Apple Watch
    - Widgets de contagem regressiva e lembretes que abrem o formulário
  pro_name: Dial Pro
  pro_summary: Veja o nível entre as doses, o histórico em gráficos e registre pelo pulso.
  cta_caption: Baixe de graça e escolha um plano no app.
  pro_features:
    - Gráfico de nível estimado e widget de nível na tela de início
    - Gráficos completos de doses e peso, tendências de efeitos colaterais e comparação de fotos
    - Relatório em PDF, exportação CSV, vários medicamentos e vários lembretes
    - Registro rápido e complicações no Apple Watch, mais registro em um toque no iPhone
  options_label: Opções do plano Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: uma vez
  annual_name: Anual
  annual_terms: por ano
  monthly_name: Mensal
  monthly_terms: por mês

privacy:
  kicker: Privacidade
  heading: Os registros ficam no aparelho.
  specs:
    - term: Contas
      detail: Não precisa de uma conta Dial para começar a registrar.
    - term: Análises
      detail: O Dial não coleta análises de uso nem telemetria.
    - term: Nossos servidores
      detail: A Zentsu não opera nenhum servidor que armazene ou leia os seus registros.
    - term: Sincronização opcional
      detail:
        Com o iCloud ligado, os registros principais usam o banco de dados privado do
        CloudKit da sua conta Apple, não os nossos servidores.
  body:
    Os registros principais ficam no aparelho. As entradas de peso e as fotos de progresso
    usam um armazenamento local separado.
  policy_link: Ler a política de privacidade do Dial
  policy_url: /pt/dial/privacy/

availability:
  kicker: Obter o Dial
  heading: Já disponível na App Store.
  body:
    O Dial é grátis para baixar, sem conta para criar. O Dial Pro adiciona o gráfico de
    nível estimado, os gráficos do histórico, a exportação em PDF e CSV, e o registro
    rápido pelo Apple Watch e pelo iPhone.

trademarks:
  Ozempic, Wegovy, Mounjaro, and Zepbound are trademarks of their respective owners.
  Zentsu is not affiliated with any pharmaceutical company.
