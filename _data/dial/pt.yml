hero:
  availability: Já disponível na App Store
  headline_lead: 'Sua rotina de GLP-1,'
  headline_accent: anotada.
  category: O Dial é um registro privado de medicamentos GLP-1 para iPhone e Apple Watch.
  detail:
    Registre doses no iPhone ou no Apple Watch, veja um nível estimado a partir das
    doses que você anota e mantenha os registros principais no dispositivo ou no banco
    de dados privado do iCloud.
  secondary_cta: Veja como o Dial funciona
  platforms_label: Plataformas e armazenamento do Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Central de Controle e Tela Bloqueada
    - Armazenamento privado opcional no iCloud
  legal:
    O registro básico é grátis. O Dial Pro adiciona gráficos, exportações, vários medicamentos
    e lembretes, e o registro em um toque nos dispositivos Apple. O Dial é um registro
    pessoal. Não calcula doses nem substitui a orientação de quem prescreve.

proof:
  label: Por que o Dial
  points:
    - iPhone e Apple Watch
    - Sem conta Dial e sem análises de uso
    - Opção Lifetime
    - Nível modelado a partir das suas doses

level:
  kicker: Dial Pro · Nível estimado
  heading: Uma vista mais clara das doses que você registrou.
  body:
    O Dial traça um nível estimado do medicamento ao longo do tempo a partir das doses
    registradas e do valor de meia-vida mostrado no app. Mude o intervalo para revisar
    uma semana, um mês ou seis meses do seu próprio histórico.
  boundary_lead: Uma estimativa, e dizemos isso com clareza.
  boundary_body:
    O gráfico modela uma curva de decaimento padrão a partir das doses que você registrou.
    Serve para notar os seus próprios padrões entre as doses, não para substituir um
    nível medido no sangue nem para sugerir o que tomar em seguida. O Dial não calcula
    doses. O app explica o método por completo.

logging:
  kicker: Registro rápido
  heading: Registre a dose e tudo o que vai com ela.
  body:
    Anote medicamento, quantidade, data, hora, local de injeção e notas em um formulário
    focado. Seus valores recentes tornam a próxima entrada mais rápida, e cada campo
    continua sob a sua confirmação. O Dial funciona com Ozempic, Wegovy, Mounjaro ou
    Zepbound, seja qual for o nome que quem prescreve use.
  checklist:
    - Edite uma entrada quando algo mudar
    - Mantenha o local de injeção junto de cada dose
    - Mantenha as entradas de peso ao lado da linha do tempo das doses

history:
  kicker: Dial Pro · Histórico e tendências
  heading: Revise o padrão em todo o registro.
  body:
    As listas de doses, peso e efeitos colaterais continuam grátis. O Dial Pro adiciona
    os gráficos completos de doses e peso, mais as tendências dos efeitos colaterais
    que já estão no registro.
  history_card_title: Histórico de doses e peso
  history_card_note: Revise as mudanças no intervalo que você escolher.
  side_effects_card_title: Tendências de efeitos colaterais
  side_effects_card_note: Revise frequência e gravidade do histórico existente ou importado.

report:
  kicker: Dial Pro · Relatório em PDF
  heading: Leve o panorama completo à próxima consulta.
  body:
    Gere um PDF com o histórico de doses, as mudanças na quantidade registrada, os
    locais de injeção, a tendência de peso e os padrões de efeitos colaterais. O Dial
    gera no dispositivo, e você compartilha só quando decide, por AirDrop, e-mail ou
    impressão.
  closing:
    Privado no restante do tempo, e útil no momento em que o registro precisa sair do
    telefone.
  smallprint: O relatório resume as suas entradas. Não é um prontuário médico nem um plano de tratamento.

watch:
  kicker: Apple Watch
  heading: Registre a dose pelo pulso.
  body: >-
    O app do relógio mostra um anel de ciclo que conta até a próxima dose e quando
    chega o próximo lembrete. O Dial Pro transforma esse olhar em um registro completo:
    ajuste a quantidade com a Digital Crown, escolha um local de injeção e confirme.
    A entrada sincroniza com o iPhone e fica entre os dois dispositivos.
  checklist:
    - Anel de ciclo, estado da dose e próximo lembrete de relance (grátis)
    - Registre uma dose pelo pulso com a Digital Crown (Dial Pro)
    - Widgets de nível estimado e de próxima dose no mostrador, mais registro rápido
      na Pilha Inteligente (Dial Pro)
    - No iPhone, o Pro habilita o registro em um toque pela Central de Controle, o
      Botão de Ação, a Siri ou uma Atividade ao Vivo no dia do lembrete. As ações grátis
      abrem o formulário.

supporting:
  kicker: Em torno da rotina
  heading: Os detalhes práticos ficam por perto.
  features:
    - title: Estoque
      body: Acompanhe canetas ou frascos com concentração, farmácia, data de validade e número de lote.
    - title: Seus lembretes
      body:
        Crie notificações diárias, semanais ou a cada N dias no horário que você definir.
        No dia da dose, a notificação inclui uma ação para registrar, e uma Atividade
        ao Vivo pode ficar na Tela Bloqueada até você registrar.
    - title: Traga o histórico
      body: Abra no Dial a exportação de um app de acompanhamento de medicamentos compatível para importar as entradas existentes.

plans:
  kicker: Grátis e Dial Pro
  heading: Use o registro básico de graça.
  body:
    Passe para o Pro quando quiser gráficos mais completos, exportações ou registro mais
    rápido nos dispositivos Apple. Todos os planos do Dial Pro incluem as mesmas funções.
  free_name: Grátis
  free_summary: Um registro completo para um medicamento ativo.
  free_features:
    - Registre doses, locais de injeção, peso, efeitos colaterais e fotos de progresso
    - Um medicamento ativo e um lembrete
    - Listas de doses e peso, estoque, importações e o resumo no Apple Watch
    - Widgets de contagem regressiva e lembretes que abrem o formulário
  pro_name: Dial Pro
  pro_summary: O nível estimado, os gráficos completos, as exportações e o registro rápido.
  pro_features:
    - Gráfico de nível estimado e widget de nível na tela de início
    - Gráficos completos de doses e peso, tendências de efeitos colaterais e comparação de fotos
    - Relatório em PDF, exportação CSV, vários medicamentos e vários lembretes
    - Registro rápido e complicações no Apple Watch, mais registro em um toque no iPhone
  options_label: Opções do plano Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: uma vez
  annual_name: Anual
  annual_terms: por ano
  monthly_name: Mensal
  monthly_terms: por mês


privacy:
  kicker: Privacidade
  heading: Clareza sobre o que fica no dispositivo.
  specs:
    - term: Contas
      detail: Não existe uma conta Dial. Abra o app e comece a registrar.
    - term: Análises
      detail: O Dial não executa análises de uso nem telemetria. Não medimos nada sobre como você o usa.
    - term: Nossos servidores
      detail: A Zentsu não opera nenhum servidor que armazene ou leia os seus registros.
    - term: Sincronização opcional
      detail:
        Ative o iCloud no app e os registros sincronizam pelo banco de dados privado
        do CloudKit da sua própria conta Apple, não conosco.
  body:
    Medicamento, dose, lembrete e estoque ficam no dispositivo. As entradas de peso
    usam um armazenamento local separado, e o acesso ao app Saúde é opcional, limitado ao
    peso corporal quando você concede permissão.
  policy_link: Ler a política de privacidade do Dial
  policy_url: /pt/dial/privacy/

availability:
  kicker: Obter o Dial
  heading: Já disponível na App Store.
  body:
    O Dial é grátis para baixar. O registro básico funciona desde o primeiro registro.
    O Dial Pro adiciona o gráfico de nível estimado, os gráficos completos, a exportação
    em PDF e o registro rápido pelo Apple Watch e pelo iPhone.
  email_label: Endereço de e-mail
  email_placeholder: seu@email.com
  submit: Receber novidades
  signup_note:
    Opcional. Notas de versão, nada mais. Sem rastreamento de aberturas ou cliques.
    Cancele quando quiser.
  signup_privacy_link: Detalhes de privacidade
  signup_privacy_url: /privacy
  signup_help: Precisa de ajuda?
  signup_support_link: Suporte do Dial
  signup_support_url: /pt/dial/support/
