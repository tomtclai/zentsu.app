hero:
  availability: "Kini di App Store"
  headline_lead: "Rekod dos GLP-1."
  headline_accent: ""
  category: "Dial ialah diari ubat GLP-1 peribadi untuk iPhone dan Apple Watch."
  detail: "Rekod dos pada iPhone atau Apple Watch. Dial memaparkan tahap anggaran daripada entri itu. Rekod kekal pada peranti, atau dalam pangkalan data iCloud peribadi anda jika anda hidupkan pilihan itu."
  free_line: Muat turun percuma. Log dos tiada had.
  secondary_cta: "Cara Dial berfungsi"
  platforms_label: "Platform dan storan Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Pusat Kawalan dan Skrin Kunci"
    - "Storan iCloud peribadi pilihan"
  legal: "Dial Pro menambah graf, eksport, lebih banyak ubat dan peringatan, serta rekod satu ketikan pada peranti Apple. Dial ialah rekod peribadi. Ia tidak mengira dos dan tidak menggantikan arahan pemberi preskripsi."

proof:
  label: "Mengapa Dial"
  points:
    - "iPhone dan Apple Watch"
    - "Buka tanpa akaun Dial"
    - "Pilihan Lifetime"
    - "Tahap dimodelkan daripada dos anda"

level:
  kicker: "Dial Pro · Tahap anggaran"
  heading: "Carta berasaskan dos yang sudah anda rekod."
  body: "Dial memaparkan tahap ubat anggaran mengikut garis masa, daripada dos yang direkod dan separuh hayat yang tertera dalam aplikasi. Tukar julat untuk melihat sejarah anda sendiri selama seminggu, sebulan atau enam bulan."
  boundary_lead: "Ini anggaran. Kami nyatakan dengan jelas."
  boundary_body: "Carta memodelkan lengkung penurunan piawai daripada dos yang anda rekod. Yang kelihatan ialah corak anda sendiri antara dos. Ini anggaran, bukan tahap darah yang diukur, dan bukan cadangan dos seterusnya. Dial tidak mengira dos. Aplikasi menjelaskan kaedahnya sepenuhnya."

logging:
  kicker: "Rekod pantas"
  heading: "Ubat, jumlah, tapak dan nota dalam satu borang."
  body: "Rekod ubat, jumlah, tarikh, masa, tapak suntikan dan nota. Nilai terkini mengisi entri seterusnya. Anda masih sahkan setiap medan. Dial mengenali Semaglutide (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound), liraglutide, dulaglutide dan exenatide mengikut nama jenama dan kemasan yang digunakan di negara anda, dan menerima ubat tersuai jika preskripsi anda tiada dalam senarai."
  checklist:
    - "Edit entri apabila sesuatu berubah"
    - "Simpan tapak suntikan pada setiap dos"
    - "Simpan entri berat di sisi garis masa dos"

history:
  kicker: "Dial Pro · Sejarah dan tren"
  heading: "Carta dos, berat dan kesan sampingan daripada entri anda."
  body: "Senarai dos, berat dan kesan sampingan kekal percuma. Dial Pro menambah carta dos dan berat penuh serta tren daripada entri kesan sampingan yang sudah ada dalam rekod."
  history_card_title: "Sejarah dos dan berat"
  history_card_note: "Tinjau perubahan dalam julat yang anda pilih."
  side_effects_card_title: "Tren kesan sampingan"
  side_effects_card_note: "Tinjau kekerapan dan keterukan daripada sejarah sedia ada atau diimport."

report:
  kicker: "Dial Pro · Laporan PDF"
  heading: "PDF entri anda untuk lawatan klinik."
  body: "Hasilkan PDF dengan sejarah dos, perubahan jumlah yang direkod, tapak suntikan, tren berat dan corak kesan sampingan. Dial hasilkannya pada peranti. Anda kongsikan hanya jika anda mahu, melalui AirDrop, e-mel atau cetakan."
  closing: "Selebihnya kekal peribadi. Berguna apabila rekod perlu dibawa keluar dari telefon."
  smallprint: "Laporan merumuskan entri anda. Ia bukan rekod perubatan atau rancangan rawatan."

watch:
  kicker: Apple Watch
  heading: "Rekod dos dari pergelangan."
  body: "Aplikasi jam menunjukkan cincin kitaran yang mengira undur ke dos seterusnya, dan bila peringatan seterusnya muncul. Dial Pro merekod dari skrin itu. Tetapkan jumlah dengan Digital Crown, pilih tapak suntikan, lalu sahkan. Entri disegerakkan ke iPhone."
  checklist:
    - "Cincin kitaran, status dos dan peringatan seterusnya sepintas lalu (percuma)"
    - "Rekod dos dari pergelangan dengan Digital Crown (Dial Pro)"
    - "Widget tahap anggaran dan dos seterusnya pada muka jam, serta rekod pantas dalam Smart Stack (Dial Pro)"
    - "Pada iPhone, Pro membolehkan rekod satu ketikan dari Pusat Kawalan, butang tindakan, Siri atau Live Activity pada hari peringatan. Tindakan percuma membuka borang."

supporting:
  kicker: "Ikut jadual anda"
  heading: "Stok, peringatan dan import ada dalam rekod yang sama."
  features:
    - title: "Stok"
      body: "Jejaki pen atau vial dengan kepekatan, farmasi, tarikh luput dan nombor lot."
    - title: "Peringatan anda"
      body: "Cipta pemberitahuan harian, mingguan atau setiap N hari mengikut jadual yang anda tetapkan. Pada hari dos, tindakan rekod ada pada pemberitahuan, dan Live Activity boleh kekal pada Skrin Kunci sehingga anda merekod."
    - title: "Import entri sedia ada"
      body: "Buka fail eksport diari ubat yang serasi dengan Dial untuk import entri sedia ada."

plans:
  kicker: "Percuma dan Dial Pro"
  heading: "Gunakan diari teras secara percuma."
  body: "Naik taraf untuk carta tahap anggaran, eksport atau rekod satu ketikan pada Apple Watch dan iPhone. Setiap pelan Dial Pro merangkumi ciri yang sama."
  free_name: "Percuma"
  free_summary: "Rekod lengkap untuk satu ubat aktif."
  free_features:
    - "Rekod dos, tapak suntikan, berat, kesan sampingan dan foto perkembangan"
    - "Satu ubat aktif dan satu peringatan"
    - "Senarai dos dan berat, inventori, import dan tinjauan Apple Watch"
    - "Widget kira undur dan peringatan yang membuka borang"
  pro_name: Dial Pro
  pro_summary: "Tahap anggaran, carta penuh, eksport dan rekod satu ketikan."
  pro_features:
    - "Carta tahap anggaran dan widget Skrin Utama"
    - "Carta dos dan berat penuh, tren kesan sampingan dan perbandingan foto"
    - "Laporan PDF, eksport CSV, pelbagai ubat dan pelbagai peringatan"
    - "Rekod pantas dan komplikasi pada Apple Watch, serta rekod satu ketikan pada iPhone"
  options_label: "Pilihan pelan Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "sekali"
  annual_name: "Tahunan"
  annual_terms: "setahun"
  monthly_name: "Bulanan"
  monthly_terms: "sebulan"

privacy:
  kicker: "Privasi"
  heading: "Rekod kekal pada peranti anda."
  specs:
    - term: "Akaun"
      detail: "Tiada akaun Dial. Buka aplikasi dan mula merekod."
    - term: "Analitik penggunaan"
      detail: "Dial tidak menjalankan analitik penggunaan atau telemetri. Kami tidak mengukur cara anda menggunakannya."
    - term: "Pelayan kami"
      detail: "Zentsu tidak mengendalikan pelayan yang menyimpan atau membaca rekod anda."
    - term: "Penyegerakan pilihan"
      detail: "Hidupkan iCloud dalam aplikasi dan rekod disegerakkan melalui pangkalan data CloudKit peribadi pada Akaun Apple anda sendiri, bukan kepada kami."
  body: "Rekod ubat, dos, peringatan dan bekalan kekal pada peranti. Entri berat menggunakan storan setempat berasingan, dan akses ke Kesihatan adalah pilihan serta hanya merangkumi berat badan apabila anda memberi kebenaran."
  policy_link: "Baca dasar privasi Dial"
  policy_url: /ms/dial/privacy/

availability:
  kicker: "Muat turun Dial"
  heading: "Kini di App Store."
  body: "Dial percuma untuk dimuat turun. Diari teras berfungsi dari rekod pertama. Dial Pro menambah carta tahap anggaran, carta penuh, eksport PDF dan rekod pantas dari Apple Watch dan iPhone."
