hero:
  availability: Ya disponible en el App Store
  headline_lead: "Tu diario de GLP-1."
  headline_accent: ""
  category: Dial es una app privada de seguimiento de medicamentos GLP-1 para iPhone y Apple Watch.
  detail:
    Registra una dosis en el iPhone o en el Apple Watch. Dial traza un nivel estimado
    a partir de esas entradas. Tus registros se quedan en el dispositivo
    o en tu iCloud privado.
  secondary_cta: Mira cómo funciona Dial
  platforms_label: Plataformas y almacenamiento de Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Centro de Control y pantalla de bloqueo
    - Almacenamiento privado opcional en iCloud
  legal:
    El registro básico es gratis. Dial Pro agrega gráficos, exportaciones, varios medicamentos
    y recordatorios, y registro en un toque en tus dispositivos Apple. Dial es un registro
    personal. No calcula dosis ni reemplaza la orientación de tu médico.

proof:
  label: Por qué Dial
  points:
    - iPhone y Apple Watch
    - Se abre sin cuenta de Dial
    - Opción Lifetime
    - Nivel modelado a partir de tus dosis

level:
  kicker: Dial Pro · Nivel estimado
  heading: El gráfico usa las dosis que ya registraste.
  body:
    Dial traza un nivel estimado del medicamento a lo largo del tiempo a partir de las
    dosis que registraste y de la vida media que aparece en la app. Cambia el rango
    para revisar una semana, un mes o seis meses de tu propio historial.
  boundary_lead: Es una estimación, y lo decimos con claridad.
  boundary_body:
    El gráfico modela una curva de disminución estándar a partir de las dosis que registraste.
    Sirve para que notes tus propios patrones entre dosis, no para sustituir un nivel medido
    en sangre ni para sugerir qué tomar a continuación. Dial no calcula dosis. La app explica
    el método completo.

logging:
  kicker: Registro rápido
  heading: Medicamento, cantidad, sitio de inyección y notas.
  body:
    Anota medicamento, cantidad, fecha, hora, sitio de inyección y notas. Los valores
    recientes rellenan la siguiente entrada. Tú confirmas cada campo. Dial funciona
    con Ozempic, Wegovy, Mounjaro y Zepbound.
  checklist:
    - Edita una entrada cuando algo cambie
    - Anota el sitio de inyección en cada dosis
    - Guarda el peso en la misma línea de tiempo que las dosis

history:
  kicker: Dial Pro · Historial y tendencias
  heading: Gráficos de dosis, peso y efectos secundarios.
  body:
    Las listas de dosis, peso y efectos secundarios son gratis. Dial Pro agrega los gráficos
    completos de dosis y peso, más las tendencias de los efectos secundarios que ya están
    en tu registro.
  history_card_title: Historial de dosis y peso
  history_card_note: Revisa los cambios en el rango que elijas.
  side_effects_card_title: Tendencias de efectos secundarios
  side_effects_card_note: Revisa la frecuencia y la gravedad en tu historial existente o importado.

report:
  kicker: Dial Pro · Informe en PDF
  heading: Un PDF para la consulta.
  body:
    Genera un PDF con tu historial de dosis, los cambios en la cantidad registrada, los
    sitios de inyección, la tendencia de tu peso y los patrones de tus efectos secundarios.
    Dial lo genera en tu dispositivo y tú lo compartes solo cuando lo decides, por AirDrop,
    correo electrónico o impresión.
  closing:
    Se queda en privado el resto del tiempo. Solo sale del teléfono cuando lo necesitas.
  smallprint: El informe resume tus entradas. No es un expediente médico ni un plan de tratamiento.

watch:
  kicker: Apple Watch
  heading: Registra la dosis desde tu muñeca.
  body: >-
    La app del reloj muestra un anillo de ciclo que cuenta los días hasta tu próxima dosis
    y cuándo llega el próximo recordatorio. Con Dial Pro registras desde esa pantalla. Ajusta
    la cantidad con la Digital Crown, elige un sitio de inyección y confirma. La entrada
    se sincroniza con tu iPhone.
  checklist:
    - Anillo de ciclo, estado de la dosis y próximo recordatorio de un vistazo (gratis)
    - Registra una dosis desde la muñeca con la Digital Crown (Dial Pro)
    - Widgets de nivel estimado y de próxima dosis en la carátula del reloj, más registro
      rápido en la pila inteligente (Dial Pro)
    - En el iPhone, Pro habilita el registro en un toque desde el Centro de Control, el
      botón de acción, Siri o una Live Activity el día del recordatorio. Las acciones
      gratuitas abren el formulario de registro.

supporting:
  kicker: El resto de la rutina
  heading: Inventario, recordatorios e importación.
  features:
    - title: Inventario de suministros
      body:
        Controla plumas o viales con concentración, farmacia, fecha de vencimiento y
        número de lote.
    - title: Tus recordatorios
      body:
        Crea notificaciones diarias, semanales o cada N días con el horario que definas.
        El día de la dosis, la notificación incluye una acción para registrar la dosis, y
        una Live Activity puede permanecer en la pantalla de bloqueo hasta que registres.
    - title: Importar entradas existentes
      body:
        Abre en Dial la exportación de otra app de seguimiento compatible para importar
        tus entradas.

plans:
  kicker: Gratis y Dial Pro
  heading: Usa el registro básico gratis.
  body:
    Pasa a Pro por el gráfico de nivel estimado, las exportaciones o el registro de
    un toque en Apple Watch e iPhone. Todos los planes de Dial Pro incluyen las mismas
    funciones.
  free_name: Gratis
  free_summary: Un registro completo para un medicamento activo.
  free_features:
    - Registra dosis, sitios de inyección, peso, efectos secundarios y fotos de progreso
    - Un medicamento activo y un recordatorio
    - Listas de dosis y peso, inventario, importaciones y el vistazo en Apple Watch
    - Widgets de cuenta regresiva y recordatorios que abren el formulario de registro
  pro_name: Dial Pro
  pro_summary: El nivel estimado, los gráficos completos, las exportaciones y el registro rápido.
  pro_features:
    - Gráfico de nivel estimado y widget de nivel en la pantalla de inicio
    - Gráficos completos de dosis y peso, tendencias de efectos secundarios y comparación de fotos
    - Informe en PDF, exportación a CSV, varios medicamentos y varios recordatorios
    - Registro rápido y complicaciones en Apple Watch, más registro en un toque en el iPhone
  options_label: Opciones del plan Dial Pro
  lifetime_name: Lifetime
  lifetime_terms: una vez
  annual_name: Anual
  annual_terms: al año
  monthly_name: Mensual
  monthly_terms: al mes

privacy:
  kicker: Privacidad
  heading: Los registros se quedan en el dispositivo.
  specs:
    - term: Cuentas
      detail: No existe una cuenta de Dial. Abre la app y empieza a registrar.
    - term: Análisis de uso
      detail:
        Dial no ejecuta análisis de uso ni telemetría. No medimos nada sobre cómo la
        usas.
    - term: Nuestros servidores
      detail: Zentsu no opera ningún servidor que almacene o lea tus registros.
    - term: Sincronización opcional
      detail:
        Activa iCloud en la app y tus registros se sincronizan por la base de datos privada
        de CloudKit de tu propia cuenta de Apple, no con nosotros.
  body:
    Los registros de medicamentos, dosis, recordatorios y suministros permanecen en tu
    dispositivo. Las entradas de peso usan un almacenamiento local aparte. El acceso a
    Salud es opcional y, si lo autorizas, solo cubre el peso corporal.
  policy_link: Lee la política de privacidad de Dial
  policy_url: /es/dial/privacy/

availability:
  kicker: Obtén Dial
  heading: Ya disponible en el App Store.
  body:
    Dial es gratis para descargar. El registro básico funciona desde el primer registro.
    Dial Pro agrega el gráfico de nivel estimado, los gráficos completos, la exportación
    en PDF y el registro rápido desde el Apple Watch y el iPhone.
