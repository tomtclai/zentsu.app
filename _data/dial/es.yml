hero:
  availability: Ya disponible en el App Store
  headline_lead: "Tu registro de dosis, a la mano."
  headline_accent: ""
  category: "Dial lleva tu registro de Ozempic, Mounjaro y otros GLP-1 en el iPhone."
  quick_answer: "Dial registra inyecciones y tabletas de GLP-1, incluidas Ozempic, Wegovy, Rybelsus, Mounjaro, Zepbound y semaglutida o tirzepatida compuesta con receta. Cada entrada guarda la dosis, la hora, el sitio de inyección, el peso y los efectos secundarios. El registro en el iPhone es gratis y no pide cuenta. Dial Pro agrega la gráfica de nivel estimado, el registro en Apple Watch y la exportación a PDF o CSV."
  detail: "Anota tus dosis gratis en el iPhone. Dial Pro agrega registro en Apple Watch, gráficas y un PDF para tu médico. Los registros de medicación pueden usar tu propio iCloud. El peso y las fotos de progreso se guardan en el dispositivo."
  free_line: Descárgala gratis, sin cuenta que crear. El registro de dosis no tiene tope.
  secondary_cta: Mira cómo funciona Dial
  qr_caption: Escanea para abrir Dial en el App Store en tu iPhone.
  platforms_label: Plataformas y almacenamiento de Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Centro de Control y pantalla de bloqueo
    - Almacenamiento privado opcional en iCloud
  legal:
    Dial es un registro personal, no consejo médico. Dial Pro agrega el registro en Apple
    Watch, las gráficas y las exportaciones.

proof:
  label: Por qué Dial
  points:
    - Anillo de ciclo y próximo recordatorio en Apple Watch
    - Se abre sin una cuenta de Dial
    - Opción Lifetime, una sola compra
    - Nivel estimado entre dosis (Dial Pro)

level:
  kicker: Dial Pro · Nivel estimado
  heading: Mira un nivel estimado entre dosis, según la vida media.
  body: "Dial traza un nivel estimado con tus dosis registradas y la vida media indicada en la app, para inyectables compatibles como Ozempic, Wegovy, Mounjaro y Zepbound. Los comprimidos como Rybelsus no tienen gráfica de nivel: la absorción oral varía demasiado entre personas. Revisa una semana, un mes o seis meses de inyecciones."
  boundary_lead: Es una estimación, y lo decimos con claridad.
  boundary_body:
    El gráfico modela una curva de disminución estándar a partir de las dosis de semaglutida
    o tirzepatida que registraste. Muestra tus propios patrones entre dosis. Es una estimación,
    no un sustituto de un nivel medido en sangre. La app explica el método completo.

boundary:
  kicker: Lo que Dial no hace
  heading: Dial lleva el registro. Tu médico define la dosis.
  body: "Dial no calcula dosis, no recomienda cambiar la dosis ni te dice qué hacer si se te pasó una. El nivel estimado es una estimación de un modelo de población a partir de las dosis que registraste, no una medición. El conversor de unidades para frascos de medicamento compuesto hace aritmética con los mg y mg/mL que ingresas y no sugiere ninguna cantidad. Consulta con tu médico o farmacéutico cualquier decisión sobre tu medicamento."

logging:
  kicker: Registro rápido
  heading: "Anota cuándo te aplicaste la dosis."
  body: "Registra medicamento, cantidad, fecha, hora y notas. En inyecciones como Ozempic, Wegovy, Mounjaro y Zepbound también anotas el sitio. Los comprimidos como Rybelsus se registran sin sitio. Dial incluye semaglutida, tirzepatida, orforglipron, liraglutida, dulaglutida y exenatida con las marcas de tu país, además de semaglutida o tirzepatida compuesta con receta desde un frasco. Agrega un medicamento personalizado si no aparece."
  checklist:
    - Edita una entrada cuando algo cambie
    - Anota el sitio de inyección en cada dosis
    - Guarda el peso en la misma línea de tiempo que las dosis

history:
  kicker: Dial Pro · Historial y tendencias
  heading: Gráficos de dosis, peso y efectos secundarios.
  body: Las listas de dosis, peso y efectos secundarios siguen gratis. Dial Pro agrega los gráficos.
  history_card_title: Historial de dosis y peso
  history_card_note: Revisa los cambios en el rango que elijas.
  side_effects_card_title: Tendencias de efectos secundarios
  side_effects_card_note: Revisa la frecuencia y la gravedad en tu historial existente o importado.

report:
  kicker: Dial Pro · Informe en PDF
  heading: Un PDF para la consulta.
  card_title: Informe en PDF para la consulta
  body:
    Genera un PDF con tu historial de dosis, los cambios en la cantidad registrada, los
    sitios de inyección, la tendencia de tu peso y los patrones de tus efectos secundarios.
    Dial lo genera en tu dispositivo y tú lo compartes solo cuando lo decides, por AirDrop,
    correo electrónico o impresión. El mismo historial se exporta como CSV.
  closing:
    Se queda en privado el resto del tiempo. Solo sale del teléfono cuando lo necesitas.
  smallprint: El informe resume tus entradas. No es un expediente médico ni un plan de tratamiento.

watch:
  kicker: Apple Watch
  heading: Registra la dosis desde tu muñeca.
  body: >-
    La app del reloj muestra un anillo de ciclo que cuenta los días hasta tu próxima dosis
    y cuándo llega el próximo recordatorio. Con Dial Pro registras desde esa pantalla. Ajusta
    la cantidad con la Digital Crown, elige un sitio de inyección y confirma. La entrada
    se sincroniza con tu iPhone.
  checklist:
    - Anillo de ciclo, estado de la dosis y próximo recordatorio de un vistazo (gratis)
    - Registra una dosis desde la muñeca con la Digital Crown (Dial Pro)
    - Widgets de nivel estimado y de próxima dosis en la carátula del reloj, más registro
      rápido en la pila inteligente (Dial Pro)
    - En el iPhone, Pro habilita el registro en un toque desde el Centro de Control, el
      botón de acción, Siri o una Live Activity el día del recordatorio. Las acciones
      gratuitas abren el formulario de registro.

supporting:
  kicker: Todo en el registro
  heading: Historial, informe, inventario, recordatorios e importaciones, en un solo sitio.
  features:
    - title: Inventario de suministros
      body: "Lleva el control de plumas, frascos y envases de comprimidos con su caducidad. Escanea la etiqueta del empaque y revisa los datos antes de guardar."
    - title: Tus recordatorios
      body:
        Crea notificaciones diarias, semanales o cada N días con el horario que definas.
        El día de la dosis, la notificación incluye una acción para registrar la dosis, y
        una Live Activity puede permanecer en la pantalla de bloqueo hasta que registres.
    - title: Importar entradas existentes
      body:
        Abre en Dial la exportación de otra app de seguimiento compatible para importar
        tus entradas.

plans:
  kicker: Gratis y Dial Pro
  heading: Usa el registro básico gratis.
  body:
    Dial Pro agrega el gráfico de nivel estimado, los gráficos del historial, las
    exportaciones y el registro rápido en Apple Watch e iPhone. Todos los planes de
    Dial Pro incluyen las mismas funciones.
  free_name: Gratis
  free_summary: Gratis para un medicamento activo, sin tope en el registro de dosis.
  free_features:
    - Registra dosis, sitios de inyección, peso, efectos secundarios y fotos de progreso
    - Un medicamento activo y un recordatorio
    - Listas de dosis y peso, inventario, importaciones y el vistazo en Apple Watch
    - Widgets de cuenta regresiva y recordatorios que abren el formulario de registro
  pro_name: Dial Pro
  pro_summary: Mira el nivel entre dosis, el historial en gráficos y registra desde la muñeca.
  cta_caption: Descárgala gratis y elige un plan dentro de la app.
  pro_features:
    - Gráfico de nivel estimado y widget de nivel en la pantalla de inicio
    - Gráficos completos de dosis y peso, tendencias de efectos secundarios y comparación de fotos
    - Informe en PDF, exportación a CSV, varios medicamentos y varios recordatorios
    - Registro rápido y complicaciones en Apple Watch, más registro en un toque en el iPhone
  options_label: Opciones del plan Dial Pro
  lifetime_name: "De por vida"
  lifetime_terms: una vez
  annual_name: Anual
  annual_terms: al año
  monthly_name: Mensual
  monthly_terms: al mes

privacy:
  kicker: Privacidad
  heading: Los registros se quedan en el dispositivo.
  specs:
    - term: Cuentas
      detail: No hace falta una cuenta de Dial para empezar a registrar.
    - term: Análisis de uso
      detail: Dial no recopila analítica de uso ni telemetría.
    - term: Nuestros servidores
      detail: Zentsu no opera ningún servidor que almacene o lea tus registros.
    - term: Sincronización opcional
      detail:
        Con iCloud activado, los registros principales usan la base de datos privada de
        CloudKit de tu cuenta de Apple, no nuestros servidores.
  body: "Si activas iCloud, los registros de medicamentos, dosis, recordatorios e inventario pueden sincronizarse en tu cuenta de Apple. El peso se guarda en local, con Salud de Apple como opción. Los archivos de las fotos de progreso se quedan en el dispositivo."
  policy_link: Lee la política de privacidad de Dial
  policy_url: /es/dial/privacy/

availability:
  kicker: Obtén Dial
  heading: Ya disponible en el App Store.
  body:
    Dial es gratis para descargar, sin cuenta que crear. Dial Pro agrega el gráfico de
    nivel estimado, los gráficos del historial, la exportación a PDF y CSV, y el registro
    rápido desde Apple Watch e iPhone.

trademarks:
  Ozempic, Wegovy, Mounjaro y Zepbound son marcas de sus respectivos fabricantes.
  Zentsu no está afiliado a ninguna empresa farmacéutica.
