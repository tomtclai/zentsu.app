hero:
  availability: "Acum în App Store"
  headline_lead: "O evidență privată a fiecărei doze."
  headline_accent: ""
  category: "Dial este o evidență de medicamente GLP-1 pentru iPhone și Apple Watch."
  detail: "Notează fiecare doză cu ora și locul de injecție, pe telefon sau de la încheietură. Dial Pro construiește un nivel estimat între doze și pregătește un PDF pentru medicul tău. Înregistrările rămân pe dispozitiv, sau în baza ta de date iCloud privată dacă o activezi."
  free_line: Descărcare gratuită, fără un cont de creat. Evidența dozelor nu are limită.
  secondary_cta: "Vezi cum funcționează Dial"
  qr_caption: "Scanează ca să deschizi Dial în App Store pe iPhone."
  platforms_label: "Platformele și stocarea Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Centrul de control și ecranul de blocare"
    - "Stocare iCloud privată opțională"
  legal: "Dial este o evidență personală. Nu calculează doze și nu înlocuiește indicațiile medicului tău. Dial Pro adaugă graficul nivelului estimat, istoricul complet, exporturile și înregistrarea rapidă descrise mai jos."

proof:
  label: "De ce Dial"
  points:
    - "Inel de ciclu și următoarea reamintire pe Apple Watch"
    - "Se deschide fără un cont Dial"
    - "Opțiune Lifetime, o singură achiziție"
    - "Nivel estimat între doze (Dial Pro)"

level:
  kicker: "Dial Pro · Nivel estimat"
  heading: "Vezi un nivel estimat între doze, după timpul de înjumătățire."
  body: "Dial construiește un nivel estimat al medicamentului din dozele înregistrate și din timpul de înjumătățire afișat în aplicație. Schimbați intervalul ca să vedeți o săptămână, o lună sau șase luni din propriul istoric."
  boundary_lead: "Este o estimare. O spunem deschis."
  boundary_body: "Graficul construiește o curbă standard de scădere din dozele pe care le-ați înregistrat. Arată propriile intervale dintre doze. Este o estimare, nu un nivel măsurat în sânge. Nu este o sugestie despre ce să luați în continuare. Dial nu calculează doze. Aplicația explică metoda în detaliu."

logging:
  kicker: "Înregistrare rapidă"
  heading: "Notează medicamentul, doza și locul de injecție într-un singur formular."
  body: "Notați medicamentul, cantitatea, data, ora, locul de injecție și notele. Valorile recente completează următoarea înregistrare. Confirmați fiecare câmp. Dial recunoaște semaglutidă (Ozempic, Wegovy, Rybelsus), tirzepatidă (Mounjaro), liraglutidă (Saxenda, Victoza), dulaglutidă (Trulicity) și exenatidă sub denumirile de marcă și de cutie folosite în România, și acceptă un medicament personalizat dacă rețeta dumneavoastră nu este în listă."
  checklist:
    - "Editați o înregistrare când se schimbă ceva"
    - "Păstrați locul de injecție la fiecare doză"
    - "Păstrați înregistrările de greutate lângă istoricul dozelor"

history:
  kicker: "Dial Pro · Istoric și tendințe"
  heading: "Grafice de doză, greutate și efecte secundare din înregistrări."
  body: "Listele de doză, greutate și efecte secundare rămân gratuite. Dial Pro adaugă graficele."
  history_card_title: "Istoric de doză și greutate"
  history_card_note: "Vedeți modificările din intervalul ales."
  side_effects_card_title: "Tendințe ale efectelor secundare"
  side_effects_card_note: "Vedeți frecvența și severitatea din istoricul existent sau importat."

report:
  kicker: "Dial Pro · Raport PDF"
  heading: "Un PDF al înregistrărilor, pentru consultație."
  card_title: "Raport PDF pentru consultație"
  body: "Generează un PDF cu istoricul dozelor, modificările cantității înregistrate, locurile de injecție, tendința greutății și evoluția efectelor secundare. Dial îl construiește pe dispozitiv și îl trimiți doar când decizi tu, prin AirDrop, e-mail sau imprimare. Același istoric se exportă ca CSV."
  closing: "Rămâne privat. Îl scoateți de pe telefon doar când aveți nevoie."
  smallprint: "Raportul rezumă înregistrările. Nu este un dosar medical și nici un plan de tratament."

watch:
  kicker: Apple Watch
  heading: "Înregistrați doza de la încheietură."
  body: "Aplicația de pe ceas arată un inel de ciclu care numără zilele până la următoarea doză și când sosește următoarea reamintire. Dial Pro înregistrează de pe acel ecran. Setați cantitatea cu Digital Crown, alegeți locul de injecție și confirmați. Înregistrarea se sincronizează pe iPhone."
  checklist:
    - "Inel de ciclu, starea dozei și următoarea reamintire dintr-o privire (gratuit)"
    - "Înregistrați o doză de la încheietură cu Digital Crown (Dial Pro)"
    - "Widgeturi de nivel estimat și doză următoare pe cadran, plus înregistrare rapidă în Smart Stack (Dial Pro)"
    - "Pe iPhone, Pro activează înregistrarea cu o atingere din Centrul de control, butonul de acțiune, Siri sau o Live Activity în ziua reamintirii. Acțiunile gratuite deschid formularul."

supporting:
  kicker: "Totul în evidență"
  heading: "Istoric, raport, stoc, reamintiri și importuri, în același loc."
  features:
    - title: "Stoc"
      body: "Urmăriți pixurile injectoare sau flacoanele, cu concentrație, farmacie, data expirării și numărul lotului."
    - title: "Reamintirile dumneavoastră"
      body: "Creați notificări zilnice, săptămânale sau la fiecare N zile în jurul programului pe care îl setați. În ziua dozei, o acțiune de înregistrare apare pe notificare, iar o Live Activity poate rămâne pe ecranul de blocare până înregistrați."
    - title: "Importați istoricul"
      body: "Deschideți în Dial un export compatibil dintr-un jurnal de medicamente, ca să importați înregistrările existente."

plans:
  kicker: "Gratuit și Dial Pro"
  heading: "Folosește evidența de bază gratuit."
  body: "Dial Pro adaugă graficul nivelului estimat, graficele de istoric, exporturile și înregistrarea rapidă pe Apple Watch și iPhone. Fiecare plan Dial Pro include aceleași funcții."
  free_name: "Gratuit"
  free_summary: "Gratuit pentru un medicament activ, fără limită la evidența dozelor."
  free_features:
    - "Înregistrați doze, locuri de injecție, greutate, efecte secundare și fotografii de progres"
    - "Un medicament activ și o reamintire"
    - "Liste de doză și greutate, stoc, importuri și rezumatul de pe Apple Watch"
    - "Widgeturi de numărătoare inversă și reamintiri care deschid formularul"
  pro_name: Dial Pro
  pro_summary: "Vezi nivelul între doze, tot istoricul în grafice și notează de la încheietură."
  cta_caption: "Descarcă gratuit, apoi alege un plan din aplicație."
  pro_features:
    - "Graficul nivelului estimat și widget pe ecranul de pornire"
    - "Grafice complete de doză și greutate, tendințe ale efectelor secundare și compararea fotografiilor"
    - "Raport PDF, export CSV, mai multe medicamente și mai multe reamintiri"
    - "Înregistrare rapidă și Complications pe Apple Watch, plus înregistrare cu o atingere pe iPhone"
  options_label: "Opțiuni ale planului Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "o dată"
  annual_name: "Anual"
  annual_terms: "pe an"
  monthly_name: "Lunar"
  monthly_terms: "pe lună"

privacy:
  kicker: "Confidențialitate"
  heading: "Înregistrările rămân pe dispozitiv."
  specs:
    - term: "Conturi"
      detail: "Nu e nevoie de un cont Dial ca să începi să notezi."
    - term: "Analiză de utilizare"
      detail: "Dial nu colectează analiză de utilizare și nici telemetrie."
    - term: "Serverele noastre"
      detail: "Zentsu nu operează niciun server care stochează sau citește înregistrările dumneavoastră."
    - term: "Sincronizare opțională"
      detail: "Cu iCloud pornit, înregistrările de bază folosesc baza CloudKit privată a contului tău Apple, nu serverele noastre."
  body: "Înregistrările de bază rămân pe dispozitiv. Înregistrările de greutate și fotografiile de progres folosesc un depozit local separat."
  policy_link: "Citiți politica de confidențialitate Dial"
  policy_url: /ro/dial/privacy/

availability:
  kicker: "Descărcați Dial"
  heading: "Acum în App Store."
  body: "Dial se descarcă gratuit, fără un cont de creat. Dial Pro adaugă graficul nivelului estimat, graficele de istoric, exportul PDF și CSV, și înregistrarea rapidă de pe Apple Watch și iPhone."

trademarks: "Ozempic, Wegovy, Mounjaro, and Zepbound are trademarks of their respective owners. Zentsu is not affiliated with any pharmaceutical company."
