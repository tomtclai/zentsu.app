hero:
  availability: Ya disponible en el App Store
  headline_lead: "Tu historial de GLP-1 para la consulta."
  headline_accent: ""
  category: "Dial es tu diario de Ozempic, Wegovy y otros GLP-1 en el iPhone."
  detail: "Guarda cada dosis gratis en el iPhone y consulta dónde te pinchaste la última vez. Dial Pro añade registro desde Apple Watch, gráficas y un informe PDF para la consulta. La medicación puede sincronizarse con tu iCloud. El peso y las fotos se quedan en el dispositivo."
  free_line: "Descarga gratis, sin cuenta. Un medicamento y un recordatorio, con dosis ilimitadas."
  secondary_cta: Consulta cómo funciona Dial
  qr_caption: Escanea para abrir Dial en el App Store en tu iPhone.
  platforms_label: Plataformas y almacenamiento de Dial
  platforms:
    - iPhone
    - Apple Watch
    - Siri, Centro de control y pantalla de bloqueo
    - Almacenamiento privado opcional en iCloud
  legal: "Dial es un registro personal, no un producto sanitario. Dial no calcula dosis ni sustituye el consejo de tu médico. Dial Pro añade registro desde el reloj, gráficas y exportaciones."

proof:
  label: Por qué Dial
  points:
    - Anillo de ciclo y próximo recordatorio en Apple Watch
    - Se abre sin una cuenta de Dial
    - Compra de por vida, un único pago
    - Nivel estimado entre dosis (Dial Pro)

level:
  kicker: Dial Pro · Nivel estimado
  heading: Mira un nivel estimado entre dosis, según la vida media.
  body: "Consulta una semana, un mes o seis meses de nivel estimado para inyectables y unidades de dosis compatibles. La curva usa tus registros y la semivida indicada en la app. Los comprimidos no tienen gráfica: la proporción que llega a la sangre varía demasiado entre personas."
  boundary_lead: Es una estimación, y lo decimos con claridad.
  boundary_body:
    La gráfica modela una curva de disminución estándar a partir de las dosis que registraste.
    Sirve para que notes tus propios patrones entre dosis, no para sustituir un nivel medido
    en sangre ni para sugerir qué tomar a continuación. Dial no calcula dosis. La app explica
    el método completo.

logging:
  kicker: Registro rápido
  heading: "Cada inyección con su zona."
  body: "Anota medicamento, cantidad, fecha, hora y una nota. Las inyecciones guardan la zona para consultar dónde te pinchaste. Los comprimidos como Rybelsus se registran sin zona. El catálogo incluye semaglutida, tirzepatida, orforglipron, liraglutida, dulaglutida y exenatida. Añade tu medicamento si falta."
  checklist:
    - Edita una entrada cuando algo cambie
    - Anota la zona de inyección en cada dosis
    - Guarda el peso en la misma línea de tiempo que las dosis

history:
  kicker: Dial Pro · Historial y tendencias
  heading: Gráficos de dosis, peso y efectos secundarios.
  body: "Las listas de dosis, peso y efectos secundarios siguen siendo gratuitas. Dial Pro añade gráficas para revisar el historial entre consultas."
  history_card_title: Historial de dosis y peso
  history_card_note: Revisa los cambios en el rango que elijas.
  side_effects_card_title: Tendencias de efectos secundarios
  side_effects_card_note: Revisa la frecuencia y la gravedad en tu historial existente o importado.

report:
  kicker: Dial Pro · Informe en PDF
  heading: "Lleva el historial a tu próxima cita."
  card_title: Informe en PDF para la consulta
  body: "Dial Pro prepara un PDF con las dosis, las zonas de inyección, la evolución del peso y los efectos secundarios. Se genera en tu dispositivo. Tú decides si lo compartes con tu médico por AirDrop, correo o impresión. También puedes exportar un CSV para una hoja de cálculo."
  closing:
    Se queda en privado el resto del tiempo. Solo sale del teléfono cuando lo necesitas.
  smallprint: El informe resume tus entradas. No es una historia clínica ni un plan de tratamiento.

watch:
  kicker: Apple Watch
  heading: Registra la dosis desde tu muñeca.
  body: "Consulta gratis el anillo de ciclo y el próximo recordatorio en el reloj. Con Dial Pro puedes registrar una dosis, ajustar la cantidad con la Digital Crown y confirmar. En las inyecciones eliges también la zona. El registro se sincroniza con el iPhone."
  checklist:
    - Anillo de ciclo, estado de la dosis y próximo recordatorio de un vistazo (gratis)
    - Registra una dosis desde la muñeca con la Digital Crown (Dial Pro)
    - Widgets de nivel estimado y de próxima dosis en la esfera del reloj, más registro
      rápido en la pila inteligente (Dial Pro)
    - En el iPhone, Pro habilita el registro en un toque desde el Centro de control, el
      botón de acción, Siri o una Live Activity el día del recordatorio. Las acciones
      gratuitas abren el formulario de registro.

supporting:
  kicker: Todo en el registro
  heading: Historial, informe, inventario, recordatorios e importaciones, en un solo sitio.
  features:
    - title: Inventario de suministros
      body: "Controla plumas, viales y botes de comprimidos con su caducidad. Escanea la etiqueta del envase y comprueba los datos antes de guardar."
    - title: Tus recordatorios
      body:
        Crea notificaciones diarias, semanales o cada N días con el horario que definas.
        El día de la dosis, la notificación incluye una acción para registrar la dosis, y
        una Live Activity puede permanecer en la pantalla de bloqueo hasta que registres.
    - title: Importar entradas existentes
      body:
        Abre en Dial la exportación de otra app de seguimiento compatible para importar
        tus entradas.

plans:
  kicker: Gratis y Dial Pro
  heading: Usa el registro básico gratis.
  body: "El registro en el iPhone es gratuito. Dial Pro añade registro desde el reloj, gráficas, PDF y CSV. Todas las opciones de compra de Dial Pro incluyen las mismas funciones."
  free_name: Gratis
  free_summary: Gratis para un medicamento activo, sin tope en el registro de dosis.
  free_features:
    - Registra dosis, zonas de inyección, peso, efectos secundarios y fotos de progreso
    - Un medicamento activo y un recordatorio
    - Listas de dosis y peso, inventario, importaciones y el vistazo en Apple Watch
    - Widgets de cuenta regresiva y recordatorios que abren el formulario de registro
  pro_name: Dial Pro
  pro_summary: Mira el nivel entre dosis, el historial en gráficas y registra desde la muñeca.
  cta_caption: "Descarga gratis y elige un plan dentro de la app."
  pro_features:
    - Gráfico de nivel estimado y widget de nivel en la pantalla de inicio
    - Gráficos completos de dosis y peso, tendencias de efectos secundarios y comparación de fotos
    - Informe en PDF, exportación a CSV, varios medicamentos y varios recordatorios
    - Registro rápido y complicaciones en Apple Watch, más registro en un toque en el iPhone
  options_label: Opciones del plan Dial Pro
  lifetime_name: "De por vida"
  lifetime_terms: una vez
  annual_name: Anual
  annual_terms: al año
  monthly_name: Mensual
  monthly_terms: al mes

privacy:
  kicker: Privacidad
  heading: Los registros se quedan en el dispositivo.
  specs:
    - term: Cuentas
      detail: No hace falta una cuenta de Dial para empezar a registrar.
    - term: Análisis de uso
      detail: Dial no recopila analítica de uso ni telemetría.
    - term: Nuestros servidores
      detail: Zentsu no opera ningún servidor que almacene o lea tus registros.
    - term: Sincronización opcional
      detail:
        Con iCloud activado, los registros principales usan la base de datos privada de
        CloudKit de tu cuenta de Apple, no nuestros servidores.
  body: "Puedes activar iCloud para sincronizar medicamentos, dosis, recordatorios e inventario en tu propia cuenta de Apple. El peso se guarda en local, con Salud de Apple como opción. Los archivos de las fotos de progreso permanecen en el dispositivo."
  policy_link: Lee la política de privacidad de Dial
  policy_url: /es/dial/privacy/

availability:
  kicker: Obtén Dial
  heading: Ya disponible en el App Store.
  body: "Descarga Dial gratis. Empieza a guardar tus dosis en el iPhone y elige Dial Pro si necesitas gráficas, exportación a PDF o CSV y registro rápido desde Apple Watch e iPhone."

trademarks:
  Ozempic, Wegovy, Mounjaro y Zepbound son marcas de sus respectivos fabricantes.
  Zentsu no está afiliado a ninguna empresa farmacéutica.
