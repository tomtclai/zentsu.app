  monthly_terms: "на місяць"

privacy:
  kicker: "Конфіденційність"
  heading: "Записи лишаються на пристрої."
  specs:
    - term: "Облікові записи"
      detail: "Щоб почати записи, обліковий запис Dial не потрібен."
    - term: "Аналітика використання"
      detail: "Dial не збирає аналітику використання і телеметрію."
    - term: "Наші сервери"
      detail: "Zentsu не має сервера, який зберігає чи читає ваші записи."
    - term: "Необов’язкова синхронізація"
      detail: "Якщо увімкнути iCloud, основні записи йдуть у приватну базу CloudKit на вашому обліковому записі Apple, не на наші сервери."
  body: "Основні записи лишаються на пристрої. Записи ваги і фото прогресу лежать в окремому локальному сховищі."
  policy_link: "Читати політику конфіденційності Dial"
  policy_url: /uk/dial/privacy/

availability:
  kicker: "Завантажити Dial"
  heading: "Зараз в App Store."
  body: "Dial завантажується безплатно, обліковий запис створювати не потрібно. Dial Pro додає графік оціненого рівня, повні графіки історії, експорт PDF і CSV і швидкий запис з Apple Watch і iPhone."

