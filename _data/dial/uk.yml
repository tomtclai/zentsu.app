hero:
  availability: "Зараз в App Store"
  headline_lead: "Ведіть журнал GLP-1."
  headline_accent: ""
  category: "Dial веде приватний журнал препаратів GLP-1 на iPhone і Apple Watch."
  detail: "Запишіть дозу на iPhone або Apple Watch. Dial будує з цих записів графік оціненого рівня. Основні записи лишаються на пристрої або у вашій приватній базі iCloud, якщо ви увімкнете синхронізацію."
  secondary_cta: "Як працює Dial"
  platforms_label: "Платформи і зберігання Dial"
  platforms:
    - iPhone
    - Apple Watch
    - "Siri, Центр керування і екран блокування"
    - "Необов’язкове приватне зберігання iCloud"
  legal: "Базовий журнал безплатний. Dial Pro додає графіки, експорт, кілька препаратів і нагадувань та запис одним дотиком на пристроях Apple. Dial є особистим журналом. Він не розраховує дози і не замінює вказівки лікаря, який призначає препарат."

proof:
  label: "Чому Dial"
  points:
    - "iPhone і Apple Watch"
    - "Відкривається без облікового запису Dial"
    - "Варіант Lifetime"
    - "Оцінений рівень з ваших доз"

level:
  kicker: "Dial Pro · Оцінений рівень"
  heading: "Графік будується з доз, які ви вже записали."
  body: "Dial будує графік оціненого рівня препарату з записаних доз і з періоду напіввиведення, вказаного в застосунку. Змініть діапазон і перегляньте тиждень, місяць або шість місяців власної історії."
  boundary_lead: "Оцінка, не вимірювання."
  boundary_body: "Графік моделює стандартну криву з доз, які ви записали. Він показує ваші власні проміжки між дозами. Це не виміряний рівень у крові і не підказка, що вводити далі. Dial не розраховує дози. Застосунок повністю пояснює метод."

logging:
  kicker: "Швидкий запис"
  heading: "Препарат, кількість, місце і нотатки в одній формі."
  body: "Зазначте препарат, кількість, дату, час, місце ін’єкції і нотатки. Нещодавні значення підставляються в наступний запис. Кожне поле ви підтверджуєте самі. Dial працює з Ozempic, Wegovy, Mounjaro і Zepbound."
  checklist:
    - "Редагувати запис, коли щось змінюється"
    - "Зберігати місце ін’єкції при кожній дозі"
    - "Тримати записи ваги поруч із графіком доз"

history:
  kicker: "Dial Pro · Історія і тенденції"
  heading: "Графіки доз, ваги і побічних ефектів з ваших записів."
  body: "Списки доз, ваги і побічних ефектів лишаються безплатними. Dial Pro додає повні графіки доз і ваги плюс тенденції з записів побічних ефектів, які вже є в журналі."
  history_card_title: "Історія доз і ваги"
  history_card_note: "Перегляньте зміни в обраному діапазоні."
  side_effects_card_title: "Тенденції побічних ефектів"
  side_effects_card_note: "Перегляньте частоту і тяжкість з наявної або імпортованої історії."

report:
  kicker: "Dial Pro · PDF-звіт"
  heading: "PDF ваших записів на прийом."
  body: "Створіть PDF з історією доз, змінами записаної кількості, місцями ін’єкцій, динамікою ваги і перебігом побічних ефектів. Dial формує його на пристрої, і ви ділитеся ним лише коли вирішите: AirDrop, пошта або друк."
  closing: "В інший час записи лишаються у вас. Знадобляться тоді, коли їх треба передати з телефону."
  smallprint: "Звіт підсумовує ваші записи. Це не медична картка і не план лікування."

watch:
  kicker: Apple Watch
  heading: "Запишіть дозу із зап’ястя."
  body: "Застосунок на годиннику показує кільце циклу, яке рахує дні до наступної дози, і коли спрацює наступне нагадування. Dial Pro записує з цього екрана. Задайте кількість за допомогою Digital Crown, оберіть місце ін’єкції і підтвердьте. Запис синхронізується з iPhone."
  checklist:
    - "Кільце циклу, стан дози і наступне нагадування з одного погляду (безплатно)"
    - "Запис дози із зап’ястя через Digital Crown (Dial Pro)"
    - "Віджети оціненого рівня і наступної дози на циферблаті плюс швидкий запис у Smart Stack (Dial Pro)"
    - "На iPhone Dial Pro вмикає запис одним дотиком із Центру керування, кнопки дії, Siri або Live Activity у день нагадування. Безплатні дії відкривають форму."

supporting:
  kicker: "Ще в журналі"
  heading: "Запас, нагадування і імпорт у тому самому журналі."
  features:
    - title: "Запас"
      body: "Ведіть облік ручок або флаконів з концентрацією, аптекою, терміном придатності і номером партії."
    - title: "Ваші нагадування"
      body: "Створіть щоденні, щотижневі або кожні N днів сповіщення за розкладом, який задаєте. У день дози на сповіщенні є дія запису, а Live Activity може лишитися на екрані блокування, доки не запишете."
    - title: "Імпорт наявних записів"
      body: "Відкрийте в Dial сумісний файл експорту журналу препаратів, щоб імпортувати наявні записи."

plans:
  kicker: "Безплатно і Dial Pro"
  heading: "Користуйтеся основним журналом безплатно."
  body: "Переходьте на Dial Pro, якщо потрібні графік оціненого рівня, експорт або запис одним дотиком на Apple Watch і iPhone. Кожен тариф Dial Pro містить ті самі функції."
  free_name: "Безплатно"
  free_summary: "Повний запис для одного активного препарату."
  free_features:
    - "Запис доз, місць ін’єкцій, ваги, побічних ефектів і фото прогресу"
    - "Один активний препарат і одне нагадування"
    - "Списки доз і ваги, запас, імпорт і огляд на Apple Watch"
    - "Віджети зворотного відліку і нагадування, які відкривають форму"
  pro_name: Dial Pro
  pro_summary: "Оцінений рівень, повні графіки, експорт і швидкий запис."
  pro_features:
    - "Графік оціненого рівня і віджет на початковому екрані"
    - "Повні графіки доз і ваги, тенденції побічних ефектів і порівняння фото"
    - "PDF-звіт, експорт CSV, кілька препаратів і кілька нагадувань"
    - "Швидкий запис і Complications на Apple Watch плюс запис одним дотиком на iPhone"
  options_label: "Варіанти тарифу Dial Pro"
  lifetime_name: "Lifetime"
  lifetime_terms: "один раз"
  annual_name: "Річний"
  annual_terms: "на рік"
  monthly_name: "Місячний"
  monthly_terms: "на місяць"

privacy:
  kicker: "Конфіденційність"
  heading: "Записи лишаються на пристрої."
  specs:
    - term: "Облікові записи"
      detail: "Облікового запису Dial немає. Відкрийте застосунок і почніть записувати."
    - term: "Аналітика використання"
      detail: "Dial не веде аналітику використання і телеметрію. Ми не вимірюємо, як ви ним користуєтеся."
    - term: "Наші сервери"
      detail: "Zentsu не має сервера, який зберігає чи читає ваші записи."
    - term: "Необов’язкова синхронізація"
      detail: "Увімкніть iCloud у застосунку, і записи синхронізуються через приватну базу CloudKit на вашому обліковому записі Apple, а не на наші сервери."
  body: "Записи препарату, дози, нагадування і запасу лишаються на пристрої. Записи ваги використовують окреме локальне сховище, а доступ до Здоров’я необов’язковий і стосується лише маси тіла, коли ви даєте дозвіл."
  policy_link: "Читати політику конфіденційності Dial"
  policy_url: /uk/dial/privacy/

availability:
  kicker: "Завантажити Dial"
  heading: "Зараз в App Store."
  body: "Dial безплатний для завантаження. Основний журнал працює з першого запису. Dial Pro додає графік оціненого рівня, повні графіки, експорт PDF і швидкий запис з Apple Watch і iPhone."
