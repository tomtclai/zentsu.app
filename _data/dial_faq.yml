en:
  items:
  - q: What is Dial?
    a: Dial is a GLP-1 medication tracker for iPhone and Apple Watch. It is free to
      download. Dial Pro adds charts, exports, and quick logging.
  - q: Which medications does Dial support?
    a: Dial supports semaglutide, tirzepatide, orforglipron, liraglutide, dulaglutide,
      and exenatide under the local names used in your country, including tablets
      such as Rybelsus. Add a custom entry when yours is not listed.
  - q: Does Dial calculate doses?
    a: Dial does not calculate or suggest the next dose. It records what you log and
      can plot an estimated level from those entries for supported injectables. Tablets
      have no level curve. The optional unit converter only does arithmetic on the
      mg and mg/mL values you enter.
  - q: Where are my records stored?
    a: Records stay on your device. iCloud is optional and uses your own private CloudKit
      database when you turn it on. Zentsu runs no server that stores your records.
  - q: What happens if I switch phones?
    a: With iCloud turned on in Dial, medication, dose, reminder, and supply records
      follow your Apple Account to the new phone. Weight entries and progress photos
      stay on the device they were logged on. Export the PDF or CSV to keep a copy
      of that history.
  - q: What does Dial Pro cost?
    type: pricing
    a: ''
  - q: Does Dial work on Apple Watch?
    a: The watch app shows a cycle ring and your next reminder for free. Dial Pro
      adds logging from the wrist, plus level and quick-log complications.
  - q: Can I export my data?
    a: Dial Pro includes a PDF report and CSV export. Share either by AirDrop, email,
      or print when you choose.
