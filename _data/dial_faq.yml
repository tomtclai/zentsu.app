# Per-locale FAQ strings for the Dial page.
# Eight items per locale. The cost question (index 6) has an empty answer;
# the template fills prices from dial_prices.yml.
# Apple Watch stays in Latin script.

en:
  items:
    - q: "What is Dial?"
      a: "Dial is a GLP-1 medication tracker for iPhone and Apple Watch. It is free to download. Dial Pro adds charts, exports, and quick logging."
    - q: "Which medications does Dial support?"
      a: "Dial supports semaglutide, tirzepatide, liraglutide, dulaglutide, and exenatide under the local names used in your country, plus a custom entry when yours is not listed."
    - q: "Does Dial calculate doses?"
      a: "It does not. Dial records what you log and plots an estimate from those entries. The estimate is not a measured level and not a suggestion of what to take next."
    - q: "Where are my records stored?"
      a: "Records stay on your device. iCloud is optional and uses your own private CloudKit database when you turn it on. Zentsu runs no server that stores your records."
    - q: "What happens if I switch phones?"
      a: "With iCloud turned on in Dial, medication, dose, reminder, and supply records follow your Apple Account to the new phone. Weight entries and progress photos stay on the device they were logged on. Export the PDF or CSV to keep a copy of that history."
    - q: "What does Dial Pro cost?"
      a: ""
    - q: "Does Dial work on Apple Watch?"
      a: "The watch app shows a cycle ring and your next reminder for free. Dial Pro adds logging from the wrist, plus level and quick-log complications."
    - q: "Can I export my data?"
      a: "Dial Pro includes a PDF report and CSV export. Share either by AirDrop, email, or print when you choose."

de:
  items:
    - q: "Was ist Dial?"
      a: "Dial ist ein GLP-1-Medikamententracker für iPhone und Apple Watch. Du kannst ihn kostenlos laden. Dial Pro ergänzt Diagramme, Exporte und schnelles Erfassen."
    - q: "Welche Medikamente unterstützt Dial?"
      a: "Dial unterstützt Semaglutid, Tirzepatid, Liraglutid, Dulaglutid und Exenatid unter den Namen, die in deinem Land üblich sind, und einen eigenen Eintrag, wenn deins nicht gelistet ist."
    - q: "Berechnet Dial Dosen?"
      a: "Nein. Dial speichert, was du erfasst, und zeichnet daraus eine Schätzung. Die Schätzung ist kein gemessener Spiegel und kein Vorschlag, was du als Nächstes nimmst."
    - q: "Wo werden meine Einträge gespeichert?"
      a: "Die Einträge bleiben auf deinem Gerät. iCloud ist optional und nutzt deine private CloudKit-Datenbank, wenn du sie einschaltest. Zentsu betreibt keinen Server, der deine Einträge speichert."
    - q: "Was passiert, wenn ich das Telefon wechsle?"
      a: "Mit iCloud in Dial folgen Medikament, Dosis, Erinnerung und Bestand deinem Apple-Account auf das neue Telefon. Gewichtseinträge und Fortschrittsfotos bleiben auf dem Gerät, auf dem du sie erfasst hast. Exportiere PDF oder CSV, um eine Kopie dieses Verlaufs zu behalten."
    - q: "Was kostet Dial Pro?"
      a: ""
    - q: "Funktioniert Dial auf der Apple Watch?"
      a: "Die Watch-App zeigt kostenlos einen Zyklusring und die nächste Erinnerung. Dial Pro ergänzt das Erfassen vom Handgelenk sowie Komplikationen für Spiegel und schnelles Erfassen."
    - q: "Kann ich meine Daten exportieren?"
      a: "Dial Pro enthält einen PDF-Bericht und CSV-Export. Teile beides per AirDrop, E-Mail oder Ausdruck, wenn du das willst."

fr:
