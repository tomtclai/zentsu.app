  - q: 我的紀錄存在哪裡？
    a: 紀錄留在裝置上。iCloud 可選，開啟後使用你自己的私人 CloudKit 資料庫。Zentsu 沒有存放紀錄的伺服器。
  - q: 換手機會怎樣？
