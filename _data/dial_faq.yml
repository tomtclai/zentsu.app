      알약에는 수준 곡선이 없습니다. 선택적 단위 변환기는 입력한 mg과 mg/mL 값으로만 산술합니다.
  - q: 기록은 어디에 저장되나요?
    a: 기록은 기기에 남습니다. iCloud는 선택이며, 켜면 본인 비공개 CloudKit 데이터베이스를 씁니다. Zentsu는 기록을 두는
      서버를 운영하지 않습니다.
  - q: 휴대폰을 바꾸면 어떻게 되나요?
    a: Dial에서 iCloud를 켜 두면 약물, 용량, 알림, 재고가 Apple 계정과 함께 새 휴대폰으로 갑니다. 체중과 경과 사진은 기록한
      기기에 남습니다. PDF나 CSV로 그 이력을 복사해 두세요.
  - q: Dial Pro는 얼마인가요?
    type: pricing
    a: ''
  - q: Dial은 Apple Watch에서 사용할 수 있나요?
    a: 워치 앱은 주기 링과 다음 알림을 무료로 보여 줍니다. Dial Pro는 손목에서 기록하기와 수준·빠른 기록 컴플리케이션을 더합니다。
  - q: 데이터를 내보낼 수 있나요?
    a: Dial Pro에는 PDF 보고서와 CSV 내보내기가 있습니다. AirDrop, 이메일, 인쇄로 원할 때 공유합니다.
zh:
  items:
  - q: Dial 是什么？
    a: Dial 是面向 iPhone 和 Apple Watch 的 GLP-1 用药记录。下载免费。Dial Pro 增加图表、导出和快速记录。
  - q: Dial 支持哪些药物？
    a: 支持司美格鲁肽、替尔泊肽、orforglipron、利拉鲁肽、度拉糖肽、艾塞那肽，按所在地区常用名称收录，也包括瑞倍适等片剂。列表里没有的药可以自己输入。
  - q: Dial 会计算剂量吗？
    a: Dial 不会计算剂量，也不建议下一剂。它保存你记下的内容，并可为支持的注射剂据此画出估计水平。片剂没有水平曲线。可选单位换算器只对你输入的 mg 和 mg/mL 做算术。
  - q: 我的记录存在哪里？
    a: 记录留在设备上。iCloud 可选，打开后使用你自己的私人 CloudKit 数据库。Zentsu 没有存放记录的服务器。
  - q: 换手机会怎样？
    a: 在 Dial 里打开 iCloud 后，药物、剂量、提醒和库存会随 Apple 账户到新手机。体重和进展照片留在记下它们的那台设备上。导出 PDF 或
      CSV 可另存一份。
  - q: Dial Pro 多少钱？
    type: pricing
    a: ''
  - q: Dial 可以在 Apple Watch 上用吗？
    a: 手表应用免费显示周期环和下次提醒。Dial Pro 增加从手腕记录，以及水平和快速记录复杂功能。
  - q: 能导出数据吗？
    a: Dial Pro 含 PDF 报告和 CSV 导出。可用 AirDrop、邮件或打印，由你决定何时分享。
zh-hant:
  items:
