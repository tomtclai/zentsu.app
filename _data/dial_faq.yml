    - q: "Qu'est-ce que Dial ?"
      a: "Dial est un suivi de médicaments GLP-1 pour iPhone et Apple Watch. Le téléchargement est gratuit. Dial Pro ajoute les graphiques, les exports et l'enregistrement rapide."
    - q: "Quels médicaments Dial prend-il en charge ?"
      a: "Dial prend en charge le sémaglutide, le tirzépatide, le liraglutide, le dulaglutide et l'exénatide sous les noms utilisés dans ton pays, plus une entrée personnalisée si le tien n'est pas dans la liste."
    - q: "Est-ce que Dial calcule les doses ?"
      a: "Non. Dial enregistre ce que tu notes et trace une estimation à partir de ces saisies. L'estimation n'est pas un taux mesuré, ni une suggestion de la prochaine prise."
    - q: "Où sont stockés mes relevés ?"
      a: "Les relevés restent sur ton appareil. iCloud est facultatif et utilise ta propre base CloudKit privée quand tu l'actives. Zentsu n'exploite aucun serveur qui stocke tes relevés."
    - q: "Que se passe-t-il si je change de téléphone ?"
      a: "Avec iCloud activé dans Dial, médicaments, doses, rappels et stocks suivent ton compte Apple sur le nouveau téléphone. Les saisies de poids et les photos d'évolution restent sur l'appareil où tu les as notées. Exporte le PDF ou le CSV pour garder une copie de cet historique."
    - q: "Combien coûte Dial Pro ?"
      a: ""
    - q: "Dial fonctionne-t-il sur Apple Watch ?"
      a: "L'app montre un anneau de cycle et le prochain rappel, gratuitement. Dial Pro ajoute l'enregistrement depuis le poignet, plus des complications de niveau et d'enregistrement rapide."
    - q: "Puis-je exporter mes données ?"
      a: "Dial Pro inclut un rapport PDF et un export CSV. Partage l'un ou l'autre par AirDrop, e-mail ou impression, quand tu le choisis."

