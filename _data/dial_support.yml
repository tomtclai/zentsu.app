  records_p: "Dial dapat menyimpan catatan obat di basis data CloudKit pribadi yang terhubung ke Akun Apple Anda. Pastikan kedua perangkat memakai Akun Apple yang sama, iCloud menyala, dan Sync with iCloud menyala di pengaturan Dial. Entri berat tetap lokal di setiap perangkat."
  health_name: "Kesehatan"
  health_p: "Akses berat tubuh bersifat opsional. Anda dapat meninjau atau mencabutnya di app Kesehatan di bawah profil, App, Dial. Dial tidak membaca atau menulis kategori data Kesehatan lain."
  privacy_h: "Privasi dan informasi medis"
  privacy_before: "Baca"
  privacy_link: "kebijakan privasi Dial"
  privacy_after: "untuk rincian penyimpanan. Dial adalah alat buku harian, bukan alat kesehatan, dan dukungan tidak menjawab pertanyaan tentang obat, dosis, efek samping, atau pengobatan. Untuk arahan medis, hubungi pemberi resep."
