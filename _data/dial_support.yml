  privacy_url: "/hr/dial/privacy/"

hu:
  h1: "Támogatás"
  overview_link: "Többet a Dialról"
  overview_rest: "vagy használja az alábbi útmutatót."
  email_lead: "A Dialhoz segítséget ide írjon:"
  email_body: "Adja meg az iPhone-modellt, az iOS-verziót, a Dial-verziót és a problémához vezető lépéseket. Ne küldjön olyan gyógyszer- vagy egészségügyi adatot, amelyet nem akar megosztani."
  notifications_h: "Értesítések"
  notifications_p: "A Dial emlékeztetők választható helyi értesítések. Ha egy emlékeztető nem jelenik meg, nyissa meg a Beállításokat iPhone-on, válassza az Appok, Dial, Értesítések lehetőséget, és ellenőrizze, hogy az értesítések engedélyezve vannak-e. Az ütemezéseket a Dialban bármikor szerkesztheti vagy kikapcsolhatja."
  records_h: "Bejegyzések Apple-készülékeken"
  records_p: "A Dial a gyógyszerbejegyzéseket az Apple-fiókjához kötött privát CloudKit-adatbázisban tárolhatja. Ellenőrizze, hogy mindkét készülék ugyanazt az Apple-fiókot használja, az iCloud be van kapcsolva, és a Dial beállításaiban a Sync with iCloud be van kapcsolva. A testsúlybejegyzések minden készüléken helyiek maradnak."
  health_name: "Egészség"
  health_p: "A testsúlyhoz való hozzáférés választható. Az Egészség appban a profil, Appok, Dial alatt ellenőrizheti vagy visszavonhatja. A Dial nem olvas és nem ír más adatkategóriákat az Egészségben."
  privacy_h: "Adatvédelem és orvosi információ"
  privacy_before: "Olvassa el"
  privacy_link: "a Dial adatvédelmi szabályzatát"
  privacy_after: "a tárolás részleteiért. A Dial naplóeszköz, nem orvostechnikai eszköz, és a támogatás nem válaszol gyógyszerre, adagolásra, mellékhatásra vagy kezelésre vonatkozó kérdésekre. Orvosi útmutatásért forduljon a felíróhoz."
  overview_url: "/hu/dial/"
  privacy_url: "/hu/dial/privacy/"

id:
