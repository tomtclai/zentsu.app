  email_lead: "Bantuan Dial dikirim ke"
  email_body: "Sertakan model iPhone, versi iOS, versi Dial, dan langkah yang menyebabkan masalah. Jangan sertakan rincian obat atau kesehatan yang tidak ingin Anda bagikan."
  notifications_h: "Notifikasi"
  notifications_p: "Pengingat Dial adalah notifikasi lokal opsional. Jika pengingat tidak muncul, buka Pengaturan di iPhone, pilih App, Dial, Notifikasi, dan pastikan notifikasi diizinkan. Anda dapat menyunting atau mematikan jadwal di Dial kapan saja."
