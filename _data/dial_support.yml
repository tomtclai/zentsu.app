  overview_link: "Dial에 대해 더 보기"
  overview_rest: "또는 아래 안내를 사용하세요."
  email_lead: "Dial 도움은 다음으로 보내세요"
  email_body: "iPhone 모델, iOS 버전, Dial 버전, 문제가 발생한 단계를 적어 주세요. 공유하고 싶지 않은 약물이나 건강 세부 정보는 넣지 마세요."
  notifications_h: "알림"
  notifications_p: "Dial 알림은 선택적 로컬 알림입니다. 알림이 울리지 않으면 iPhone 설정에서 앱, Dial, 알림을 열고 알림이 허용됐는지 확인하세요. Dial에서 일정을 언제든 수정하거나 끌 수 있습니다."
  records_h: "Apple 기기의 기록"
  records_p: "Dial은 Apple 계정에 연결된 비공개 CloudKit 데이터베이스에 약물 기록을 둘 수 있습니다. 두 기기가 같은 Apple 계정을 쓰고, iCloud가 켜져 있으며, Dial 설정에서 Sync with iCloud가 켜져 있는지 확인하세요. 체중 항목은 각 기기에 로컬로 남습니다."
  health_name: "건강"
  health_p: "체중 접근은 선택입니다. 건강의 프로필, 앱, Dial에서 검토하거나 철회할 수 있습니다. Dial은 건강의 다른 데이터 범주를 읽거나 쓰지 않습니다."
  privacy_h: "개인정보와 의료 정보"
  privacy_before: "저장 세부 사항은"
  privacy_link: "Dial 개인정보 처리방침을"
  privacy_after: "읽으세요. Dial은 일기 도구이며 의료기기가 아닙니다. 지원은 약물, 용량, 부작용, 치료 질문에 답하지 않습니다. 의학적 안내는 처방의에게 문의하세요."
  overview_url: "/ko/dial/"
  privacy_url: "/ko/dial/privacy/"

ms:
