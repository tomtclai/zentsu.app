cs:
  h1: "Podpora"
  overview_link: "Více o Dial"
  overview_rest: "nebo použijte pokyny níže."
  email_lead: "S žádostí o pomoc k Dial pište na"
  email_body: "Uveďte model iPhonu, verzi iOS, verzi Dial a kroky, které k problému vedly. Neposílejte údaje o lécích ani zdraví, které nechcete sdílet."
  notifications_h: "Oznámení"
  notifications_p: "Připomínky Dial jsou volitelná místní oznámení. Pokud připomínka nespustí, otevřete Nastavení na iPhonu, zvolte Aplikace, Dial, Oznámení a ověřte, že jsou oznámení povolena. Plány můžete v Dial kdykoli upravit nebo vypnout."
  records_h: "Záznamy na vašich zařízeních Apple"
  records_p: "Dial může ukládat záznamy léků v soukromé databázi CloudKit připojené k vašemu Apple Account. Ověřte, že obě zařízení používají stejný Apple Account, mají zapnuté iCloud a mají Sync with iCloud zapnuté v nastavení Dial. Záznamy hmotnosti zůstávají místní na každém zařízení."
  health_name: "Zdraví"
  health_p: "Přístup k tělesné hmotnosti je volitelný. Můžete ho zkontrolovat nebo odebrat v aplikaci Zdraví pod profilem, Aplikace, Dial. Dial nečte ani nezapisuje jiné kategorie dat ve Zdraví."
  privacy_h: "Soukromí a lékařské informace"
  privacy_before: "Přečtěte si"
  privacy_link: "zásady ochrany osobních údajů Dial"
  privacy_after: "kvůli podrobnostem o ukládání. Dial je nástroj k záznamu, není zdravotnický prostředek a podpora neodpovídá na otázky o lécích, dávkování, nežádoucích účincích ani léčbě. O lékařské vedení se obraťte na předepisující osobu."
  overview_url: "/cs/dial/"
  privacy_url: "/cs/dial/privacy/"

da:
  h1: "Support"
  overview_link: "Mere om Dial"
  overview_rest: "eller brug vejledningen nedenfor."
  email_lead: "Hjælp til Dial sendes på e-mail til"
  email_body: "Angiv iPhone-model, iOS-version, Dial-version og de trin, der førte til problemet. Medtag ikke lægemiddel- eller helbredsoplysninger, du ikke vil dele."
  notifications_h: "Meddelelser"
  notifications_p: "Dial-påmindelser er valgfrie lokale meddelelser. Hvis en påmindelse ikke udløses, skal du åbne Indstillinger på iPhone, vælge Apps, Dial, Meddelelser og bekræfte, at meddelelser er tilladt. Du kan redigere eller slå planer fra i Dial når som helst."
  records_h: "Poster på dine Apple-enheder"
  records_p: "Dial kan gemme lægemiddelposter i den private CloudKit-database knyttet til din Apple-konto. Bekræft, at begge enheder bruger samme Apple-konto, har iCloud slået til, og har Sync with iCloud slået til i Dial-indstillinger. Vægtposter forbliver lokale på hver enhed."
  health_name: "Sundhed"
  health_p: "Adgang til kropsvægt er valgfri. Du kan gennemgå eller tilbagekalde den i appen Sundhed under profil, Apps, Dial. Dial læser eller skriver ikke andre datakategorier i Sundhed."
  privacy_h: "Privatliv og medicinske oplysninger"
  privacy_before: "Læs"
  privacy_link: "Dial-privatlivspolitikken"
  privacy_after: "for lagringsdetaljer. Dial er et journalværktøj, ikke et medicinsk udstyr, og support svarer ikke på spørgsmål om medicin, dosis, bivirkninger eller behandling. Kontakt den ordinerende læge for medicinsk vejledning."
  overview_url: "/da/dial/"
  privacy_url: "/da/dial/privacy/"

he:
  h1: "תמיכה"
  overview_link: "עוד על Dial"
  overview_rest: "או השתמשו בהנחיות למטה."
  email_lead: "לעזרה ב-Dial שלחו דוא״ל אל"
  email_body: "ציינו דגם iPhone, גרסת iOS, גרסת Dial והשלבים שהובילו לבעיה. אל תצרפו פרטי תרופה או בריאות שאינכם רוצים לשתף."
  notifications_h: "התראות"
  notifications_p: "תזכורות Dial הן התראות מקומיות אופציונליות. אם תזכורת לא נשלחת, פתחו הגדרות ב-iPhone, בחרו יישומים, Dial, התראות, וודאו שההתראות מותרות. אפשר לערוך או לכבות לוחות זמנים ב-Dial בכל עת."
  records_h: "רשומות במכשירי Apple"
  records_p: "Dial יכול לשמור רשומות תרופות במסד הנתונים הפרטי של CloudKit המחובר לחשבון Apple שלכם. ודאו ששני המכשירים משתמשים באותו חשבון Apple, ש-iCloud פועל, וש-Sync with iCloud פועל בהגדרות Dial. רשומות משקל נשארות מקומיות בכל מכשיר."
  health_name: "בריאות"
  health_p: "גישה למשקל גוף היא אופציונלית. אפשר לבדוק או לבטל אותה ביישום בריאות תחת פרופיל, יישומים, Dial. Dial לא קורא ולא כותב קטגוריות נתונים אחרות בבריאות."
  privacy_h: "פרטיות ומידע רפואי"
  privacy_before: "קראו את"
  privacy_link: "מדיניות הפרטיות של Dial"
  privacy_after: "לפרטי האחסון. Dial הוא כלי רישום, לא מכשיר רפואי, והתמיכה לא עונה על שאלות על תרופות, מינון, תופעות לוואי או טיפול. פנו למי שרשם לכם להנחיה רפואית."
  overview_url: "/he/dial/"
  privacy_url: "/he/dial/privacy/"

sv:
  h1: "Support"
  overview_link: "Mer om Dial"
  overview_rest: "eller använd anvisningarna nedan."
  email_lead: "Hjälp med Dial skickas till"
  email_body: "Ange iPhone-modell, iOS-version, Dial-version och stegen som ledde till problemet. Ta inte med läkemedels- eller hälsouppgifter du inte vill dela."
  notifications_h: "Notiser"
  notifications_p: "Dial-påminnelser är valfria lokala notiser. Om en påminnelse inte utlöses, öppna Inställningar på iPhone, välj Appar, Dial, Notiser och kontrollera att notiser är tillåtna. Du kan redigera eller stänga av scheman i Dial när som helst."
  records_h: "Poster på dina Apple-enheter"
  records_p: "Dial kan spara läkemedelsposter i den privata CloudKit-databasen kopplad till ditt Apple-konto. Kontrollera att båda enheterna använder samma Apple-konto, har iCloud påslaget och har Sync with iCloud påslaget i Dial-inställningarna. Viktposter förblir lokala på varje enhet."
  health_name: "Hälsa"
  health_p: "Åtkomst till kroppsvikt är valfri. Du kan granska eller återkalla den i appen Hälsa under profil, Appar, Dial. Dial läser eller skriver inga andra datakategorier i Hälsa."
  privacy_h: "Integritet och medicinsk information"
  privacy_before: "Läs"
  privacy_link: "Dials integritetspolicy"
  privacy_after: "för lagringsdetaljer. Dial är ett journalverktyg, inte en medicinteknisk produkt, och supporten svarar inte på frågor om läkemedel, dosering, biverkningar eller behandling. Kontakta den som förskriver för medicinsk vägledning."
  overview_url: "/sv/dial/"
  privacy_url: "/sv/dial/privacy/"

"no":
  h1: "Støtte"
  overview_link: "Mer om Dial"
  overview_rest: "eller bruk veiledningen nedenfor."
  email_lead: "For hjelp med Dial, send e-post til"
  email_body: "Oppgi iPhone-modell, iOS-versjon, Dial-versjon og trinnene som førte til problemet. Ikke ta med legemiddel- eller helseopplysninger du ikke vil dele."
  notifications_h: "Varsler"
  notifications_p: "Dial-påminnelser er valgfrie lokale varsler. Hvis en påminnelse ikke utløses, åpne Innstillinger på iPhone, velg Apper, Dial, Varsler og bekreft at varsler er tillatt. Du kan redigere eller slå av planer i Dial når som helst."
  records_h: "Poster på Apple-enhetene dine"
  records_p: "Dial kan lagre legemiddelposter i den private CloudKit-databasen knyttet til Apple-kontoen din. Bekreft at begge enhetene bruker samme Apple-konto, har iCloud slått på, og har Sync with iCloud slått på i Dial-innstillingene. Vektposter forblir lokale på hver enhet."
  health_name: "Helse"
  health_p: "Tilgang til kroppsvekt er valgfri. Du kan se gjennom eller trekke den tilbake i appen Helse under profil, Apper, Dial. Dial leser eller skriver ingen andre datakategorier i Helse."
  privacy_h: "Personvern og medisinsk informasjon"
  privacy_before: "Les"
  privacy_link: "Dial-personvernerklæringen"
  privacy_after: "for lagringsdetaljer. Dial er et journalverktøy, ikke et medisinsk utstyr, og støtten svarer ikke på spørsmål om legemidler, dosering, bivirkninger eller behandling. Kontakt forskriveren din for medisinsk veiledning."
  overview_url: "/no/dial/"
  privacy_url: "/no/dial/privacy/"

pl:
  h1: "Wsparcie"
  overview_link: "Więcej o Dial"
  overview_rest: "albo skorzystają Państwo z instrukcji poniżej."
  email_lead: "Pomoc do Dial:"
  email_body: "Podają Państwo model iPhone’a, wersję iOS, wersję Dial i kroki, które doprowadziły do problemu. Nie dołączają danych o lekach ani zdrowiu, których nie chcą Państwo udostępniać."
  notifications_h: "Powiadomienia"
  notifications_p: "Przypomnienia Dial to opcjonalne lokalne powiadomienia. Jeśli przypomnienie nie zadziała, otwierają Państwo Ustawienia na iPhonie, wybierają Aplikacje, Dial, Powiadomienia i sprawdzają, czy powiadomienia są włączone. Harmonogramy można w Dial w każdej chwili edytować lub wyłączyć."
  records_h: "Zapisy na urządzeniach Apple"
  records_p: "Dial może przechowywać zapisy leków w prywatnej bazie CloudKit powiązanej z Państwa kontem Apple. Prosimy sprawdzić, że oba urządzenia używają tego samego konta Apple, mają włączone iCloud i mają Sync with iCloud włączone w ustawieniach Dial. Zapisy wagi pozostają lokalne na każdym urządzeniu."
  health_name: "Zdrowie"
  health_p: "Dostęp do masy ciała jest opcjonalny. Można go sprawdzić lub cofnąć w aplikacji Zdrowie pod profilem, Aplikacje, Dial. Dial nie czyta ani nie zapisuje innych kategorii danych w Zdrowiu."
  privacy_h: "Prywatność i informacje medyczne"
  privacy_before: "Proszę przeczytać"
  privacy_link: "politykę prywatności Dial"
  privacy_after: "w sprawie przechowywania. Dial jest narzędziem zapisu, nie wyrobem medycznym, a wsparcie nie odpowiada na pytania o leki, dawkowanie, działania niepożądane ani leczenie. Wskazówki medyczne: osoba przepisująca."
  overview_url: "/pl/dial/"
  privacy_url: "/pl/dial/privacy/"

fi:
  h1: "Tuki"
  overview_link: "Lisätietoja Dialista"
  overview_rest: "tai käytä ohjeita alla."
  email_lead: "Dial-tukea varten lähetä sähköpostia osoitteeseen"
  email_body: "Ilmoita iPhone-malli, iOS-versio, Dial-versio ja vaiheet, jotka johtivat ongelmaan. Älä liitä lääke- tai terveystietoja, joita et halua jakaa."
  notifications_h: "Ilmoitukset"
  notifications_p: "Dial-muistutukset ovat valinnaisia paikallisia ilmoituksia. Jos muistutus ei laukea, avaa Asetukset iPhonessa, valitse Apit, Dial, Ilmoitukset ja varmista, että ilmoitukset on sallittu. Voit muokata tai poistaa aikatauluja käytöstä Dialissa milloin tahansa."
  records_h: "Merkinnät Apple-laitteillasi"
  records_p: "Dial voi tallentaa lääkemerkinnät yksityiseen CloudKit-tietokantaan, joka on sidottu Apple-tiliisi. Varmista, että molemmat laitteet käyttävät samaa Apple-tiliä, iCloud on päällä ja Sync with iCloud on päällä Dialin asetuksissa. Painomerkinnät pysyvät paikallisina kullakin laitteella."
  health_name: "Terveys"
  health_p: "Pääsy kehonpainoon on valinnainen. Voit tarkistaa tai perua sen Terveys-sovelluksessa kohdasta profiili, Apit, Dial. Dial ei lue eikä kirjoita muita tietoluokkia Terveyteen."
  privacy_h: "Tietosuoja ja lääketieteelliset tiedot"
  privacy_before: "Lue"
  privacy_link: "Dialin tietosuojakäytäntö"
  privacy_after: "saadaksesi tallennuksen tiedot. Dial on päiväkirjatyökalu, ei lääkinnällinen laite, eikä tuki vastaa kysymyksiin lääkkeistä, annostuksesta, haittavaikutuksista tai hoidosta. Lääketieteellistä ohjausta varten ota yhteyttä määrääjään."
  overview_url: "/fi/dial/"
  privacy_url: "/fi/dial/privacy/"

ar:
  h1: "الدعم"
  overview_link: "المزيد عن Dial"
  overview_rest: "أو استخدموا الإرشادات أدناه."
  email_lead: "للمساعدة في Dial راسلوا"
  email_body: "اذكروا طراز iPhone وإصدار iOS وإصدار Dial والخطوات التي أدت إلى المشكلة. لا ترفقوا تفاصيل دواء أو صحة لا تريدون مشاركتها."
  notifications_h: "الإشعارات"
  notifications_p: "تذكيرات Dial إشعارات محلية اختيارية. إذا لم يُرسل تذكير، افتحوا الإعدادات على iPhone، واختاروا التطبيقات، Dial، الإشعارات، وتأكدوا أن الإشعارات مسموحة. يمكن تعديل الجداول أو إيقافها في Dial في أي وقت."
  records_h: "السجلات على أجهزة Apple"
  records_p: "يمكن لـ Dial حفظ سجلات الأدوية في قاعدة CloudKit الخاصة المرتبطة بحساب Apple لديكم. تأكدوا أن الجهازين يستخدمان نفس حساب Apple، وأن iCloud يعمل، وأن Sync with iCloud يعمل في إعدادات Dial. سجلات الوزن تبقى محلية على كل جهاز."
  health_name: "صحتي"
  health_p: "الوصول إلى وزن الجسم اختياري. يمكن مراجعته أو إلغاؤه في تطبيق صحتي تحت الملف الشخصي، التطبيقات، Dial. لا يقرأ Dial ولا يكتب فئات بيانات أخرى في صحتي."
  privacy_h: "الخصوصية والمعلومات الطبية"
  privacy_before: "اقرأوا"
  privacy_link: "سياسة خصوصية Dial"
  privacy_after: "لتفاصيل التخزين. Dial أداة سجل، ليس جهازاً طبياً، والدعم لا يجيب على أسئلة عن الأدوية أو الجرعات أو الآثار الجانبية أو العلاج. للتوجيه الطبي راجعوا من وصف الدواء."
  overview_url: "/ar/dial/"
  privacy_url: "/ar/dial/privacy/"

ca:
  h1: "Assistència"
  overview_link: "Més sobre Dial"
  overview_rest: "o faci servir les instruccions de sota."
  email_lead: "Per a ajuda amb Dial escrigui a"
  email_body: "Indiqui el model d’iPhone, la versió d’iOS, la versió de Dial i els passos que van portar al problema. No inclogui detalls de medicació o salut que no vulgui compartir."
  notifications_h: "Notificacions"
  notifications_p: "Els recordatoris de Dial són notificacions locals opcionals. Si un recordatori no s’activa, obri Configuració a l’iPhone, triï Apps, Dial, Notificacions i comprovi que les notificacions estan permeses. Pot editar o desactivar horaris a Dial en qualsevol moment."
  records_h: "Registres als seus dispositius Apple"
  records_p: "Dial pot desar registres de medicació a la base privada CloudKit vinculada al seu compte d’Apple. Comprovi que tots dos dispositius fan servir el mateix compte d’Apple, tenen iCloud activat i tenen Sync with iCloud activat a la configuració de Dial. Les entrades de pes resten locals a cada dispositiu."
  health_name: "Salut"
  health_p: "L’accés al pes corporal és opcional. El pot revisar o revocar a l’app Salut sota perfil, Apps, Dial. Dial no llegeix ni escriu altres categories de dades a Salut."
  privacy_h: "Privadesa i informació mèdica"
  privacy_before: "Llegeixi"
  privacy_link: "la política de privadesa de Dial"
  privacy_after: "per als detalls d’emmagatzematge. Dial és una eina de diari, no un producte sanitari, i l’assistència no respon preguntes sobre medicaments, dosificació, efectes secundaris ni tractament. Per a orientació mèdica adreci’s a qui prescriu."
  overview_url: "/ca/dial/"
  privacy_url: "/ca/dial/privacy/"

el:
  h1: "Υποστήριξη"
  overview_link: "Περισσότερα για το Dial"
  overview_rest: "ή χρησιμοποιήστε τις οδηγίες παρακάτω."
  email_lead: "Για βοήθεια με το Dial στείλτε μήνυμα στο"
  email_body: "Αναφέρετε μοντέλο iPhone, έκδοση iOS, έκδοση Dial και τα βήματα που οδήγησαν στο πρόβλημα. Μην επισυνάπτετε στοιχεία φαρμάκου ή υγείας που δεν θέλετε να μοιραστείτε."
  notifications_h: "Ειδοποιήσεις"
  notifications_p: "Οι υπενθυμίσεις Dial είναι προαιρετικές τοπικές ειδοποιήσεις. Αν μια υπενθύμιση δεν ενεργοποιηθεί, ανοίξτε Ρυθμίσεις στο iPhone, επιλέξτε Εφαρμογές, Dial, Ειδοποιήσεις και επιβεβαιώστε ότι επιτρέπονται. Μπορείτε να επεξεργαστείτε ή να απενεργοποιήσετε προγράμματα στο Dial οποτεδήποτε."
  records_h: "Εγγραφές στις συσκευές Apple"
  records_p: "Το Dial μπορεί να αποθηκεύει εγγραφές φαρμάκων στην ιδιωτική βάση CloudKit που συνδέεται με τον λογαριασμό Apple σας. Επιβεβαιώστε ότι και οι δύο συσκευές χρησιμοποιούν τον ίδιο λογαριασμό Apple, έχουν ενεργό iCloud και έχουν Sync with iCloud ενεργό στις ρυθμίσεις Dial. Οι εγγραφές βάρους μένουν τοπικές σε κάθε συσκευή."
  health_name: "Υγεία"
  health_p: "Η πρόσβαση στο σωματικό βάρος είναι προαιρετική. Μπορείτε να την ελέγξετε ή να την ανακαλέσετε στην εφαρμογή Υγεία, στο προφίλ, Εφαρμογές, Dial. Το Dial δεν διαβάζει ούτε γράφει άλλες κατηγορίες δεδομένων στην Υγεία."
  privacy_h: "Απόρρητο και ιατρικές πληροφορίες"
  privacy_before: "Διαβάστε"
  privacy_link: "την πολιτική απορρήτου του Dial"
  privacy_after: "για λεπτομέρειες αποθήκευσης. Το Dial είναι εργαλείο ημερολογίου, όχι ιατροτεχνολογικό προϊόν, και η υποστήριξη δεν απαντά σε ερωτήσεις για φάρμακα, δοσολογία, ανεπιθύμητες ενέργειες ή θεραπεία. Για ιατρική καθοδήγηση απευθυνθείτε στον συνταγογράφο σας."
  overview_url: "/el/dial/"
  privacy_url: "/el/dial/privacy/"

hi:
  h1: "सहायता"
  overview_link: "Dial के बारे में और जानें"
  overview_rest: "या नीचे दी गई सहायता का उपयोग करें।"
  email_lead: "Dial सहायता के लिए ईमेल करें"
  email_body: "iPhone मॉडल, iOS संस्करण, Dial संस्करण और समस्या तक ले जाने वाले चरण बताएँ। जो दवा या स्वास्थ्य विवरण आप साझा नहीं करना चाहते, न भेजें।"
  notifications_h: "सूचनाएँ"
  notifications_p: "Dial अनुस्मारक वैकल्पिक स्थानीय सूचनाएँ हैं। यदि कोई अनुस्मारक न चले, iPhone पर सेटिंग खोलें, ऐप्स, Dial, सूचनाएँ चुनें और पुष्टि करें कि सूचनाएँ अनुमत हैं। आप Dial में शेड्यूल कभी भी संपादित या बंद कर सकते हैं।"
  records_h: "आपके Apple डिवाइस पर रिकॉर्ड"
  records_p: "Dial आपके Apple खाते से जुड़ी निजी CloudKit डेटाबेस में दवा रिकॉर्ड रख सकता है। पुष्टि करें कि दोनों डिवाइस एक ही Apple खाता इस्तेमाल करते हैं, iCloud चालू है, और Dial सेटिंग में Sync with iCloud चालू है। वजन प्रविष्टियाँ प्रत्येक डिवाइस पर स्थानीय रहती हैं।"
  health_name: "स्वास्थ्य"
  health_p: "शरीर के वजन की पहुँच वैकल्पिक है। आप इसे स्वास्थ्य ऐप में प्रोफ़ाइल, ऐप्स, Dial के तहत देख या वापस ले सकते हैं। Dial स्वास्थ्य की अन्य डेटा श्रेणियाँ नहीं पढ़ता या लिखता।"
  privacy_h: "गोपनीयता और चिकित्सा जानकारी"
  privacy_before: "पढ़ें"
  privacy_link: "Dial गोपनीयता नीति"
  privacy_after: "संग्रहण विवरण के लिए। Dial डायरी उपकरण है, चिकित्सा उपकरण नहीं, और सहायता दवा, खुराक, दुष्प्रभाव या उपचार के प्रश्नों का उत्तर नहीं देती। चिकित्सा मार्गदर्शन के लिए अपने निर्धारित करने वाले से संपर्क करें।"
  overview_url: "/hi/dial/"
  privacy_url: "/hi/dial/privacy/"

hr:
