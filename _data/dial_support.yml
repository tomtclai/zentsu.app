  privacy_url: "/ms/dial/privacy/"

ro:
  h1: "Asistență"
  overview_link: "Mai multe despre Dial"
  overview_rest: "sau folosiți îndrumările de mai jos."
  email_lead: "Pentru ajutor cu Dial, scrieți la"
  email_body: "Includeți modelul iPhone, versiunea iOS, versiunea Dial și pașii care au dus la problemă. Nu includeți date de medicament sau de sănătate pe care nu doriți să le partajați."
  notifications_h: "Notificări"
  notifications_p: "Reamintirile Dial sunt notificări locale opționale. Dacă o reamintire nu se declanșează, deschideți Configurări pe iPhone, alegeți Aplicații, Dial, Notificări și confirmați că notificările sunt permise. Puteți edita sau dezactiva programele în Dial oricând."
  records_h: "Înregistrări pe dispozitivele Apple"
  records_p: "Dial poate stoca înregistrări de medicamente în baza CloudKit privată legată de contul Apple. Confirmați că ambele dispozitive folosesc același cont Apple, au iCloud pornit și au Sync with iCloud pornit în setările Dial. Înregistrările de greutate rămân locale pe fiecare dispozitiv."
  health_name: "Sănătate"
  health_p: "Accesul la greutatea corporală este opțional. Îl puteți revizui sau revoca în aplicația Sănătate, la profil, Aplicații, Dial. Dial nu citește și nu scrie alte categorii de date din Sănătate."
  privacy_h: "Confidențialitate și informații medicale"
  privacy_before: "Citiți"
  privacy_link: "politica de confidențialitate Dial"
  privacy_after: "pentru detaliile de stocare. Dial este un instrument de jurnal, nu un dispozitiv medical, iar asistența nu răspunde la întrebări despre medicamente, dozare, efecte secundare sau tratament. Pentru îndrumare medicală adresați-vă medicului care prescrie."
  overview_url: "/ro/dial/"
  privacy_url: "/ro/dial/privacy/"

ru:
  h1: "Поддержка"
  overview_link: "Подробнее о Dial"
  overview_rest: "или воспользуйтесь инструкциями ниже."
  email_lead: "По вопросам Dial пишите на"
  email_body: "Укажите модель iPhone, версию iOS, версию Dial и шаги, которые привели к проблеме. Не прикладывайте сведения о препаратах или здоровье, которыми не хотите делиться."
  notifications_h: "Уведомления"
  notifications_p: "Напоминания Dial: необязательные локальные уведомления. Если напоминание не срабатывает, откройте Настройки на iPhone, выберите Приложения, Dial, Уведомления и убедитесь, что уведомления разрешены. Расписания в Dial можно править или отключать в любой момент."
  records_h: "Записи на устройствах Apple"
  records_p: "Dial может хранить записи препаратов в частной базе CloudKit, привязанной к вашему аккаунту Apple. Убедитесь, что оба устройства используют один аккаунт Apple, iCloud включён, и Sync with iCloud включён в настройках Dial. Записи веса остаются локальными на каждом устройстве."
  health_name: "Здоровье"
  health_p: "Доступ к массе тела необязателен. Его можно проверить или отозвать в приложении Здоровье в профиле, Приложения, Dial. Dial не читает и не пишет другие категории данных в Здоровье."
  privacy_h: "Конфиденциальность и медицинская информация"
  privacy_before: "Прочитайте"
  privacy_link: "политику конфиденциальности Dial"
  privacy_after: "о хранении. Dial является инструментом дневника, не медицинским изделием, и поддержка не отвечает на вопросы о препаратах, дозировке, побочных эффектах или лечении. За медицинской консультацией обратитесь к лечащему врачу."
  overview_url: "/ru/dial/"
  privacy_url: "/ru/dial/privacy/"

sk:
  h1: "Podpora"
  overview_link: "Viac o Dial"
  overview_rest: "alebo použite pokyny nižšie."
  email_lead: "Pomoc s Dial píšte na"
  email_body: "Uveďte model iPhonu, verziu iOS, verziu Dial a kroky, ktoré viedli k problému. Neposielajte údaje o liekoch ani zdraví, ktoré nechcete zdieľať."
  notifications_h: "Oznámenia"
  notifications_p: "Pripomienky Dial sú voliteľné miestne oznámenia. Ak sa pripomienka nespustí, otvorte Nastavenia na iPhone, zvoľte Aplikácie, Dial, Oznámenia a overte, že sú oznámenia povolené. Plány môžete v Dial kedykoľvek upraviť alebo vypnúť."
  records_h: "Záznamy na zariadeniach Apple"
  records_p: "Dial môže ukladať záznamy liekov v súkromnej databáze CloudKit pripojenej k vášmu Apple Account. Overte, že obe zariadenia používajú ten istý Apple Account, majú zapnuté iCloud a majú Sync with iCloud zapnuté v nastaveniach Dial. Záznamy hmotnosti ostávajú miestne na každom zariadení."
  health_name: "Zdravie"
  health_p: "Prístup k telesnej hmotnosti je voliteľný. Môžete ho skontrolovať alebo odobrať v aplikácii Zdravie pod profilom, Aplikácie, Dial. Dial nečíta ani nezapisuje iné kategórie dát v Zdraví."
  privacy_h: "Súkromie a lekárske informácie"
  privacy_before: "Prečítajte si"
  privacy_link: "zásady ochrany osobných údajov Dial"
  privacy_after: "kvôli podrobnostiam o ukladaní. Dial je nástroj denníka, nie zdravotnícka pomôcka a podpora neodpovedá na otázky o liekoch, dávkovaní, nežiaducich účinkoch ani liečbe. O lekárske usmernenie sa obráťte na predpisujúcu osobu."
  overview_url: "/sk/dial/"
  privacy_url: "/sk/dial/privacy/"

th:
  h1: "การสนับสนุน"
  overview_link: "เพิ่มเติมเกี่ยวกับ Dial"
  overview_rest: "หรือใช้คำแนะนำด้านล่าง"
  email_lead: "ความช่วยเหลือเรื่อง Dial ส่งไปที่"
  email_body: "ระบุรุ่น iPhone เวอร์ชัน iOS เวอร์ชัน Dial และขั้นตอนที่นำไปสู่ปัญหา อย่าใส่รายละเอียดยาหรือสุขภาพที่คุณไม่ต้องการแชร์"
  notifications_h: "การแจ้งเตือน"
  notifications_p: "การเตือนของ Dial เป็นการแจ้งเตือนในเครื่องแบบเลือกได้ หากการเตือนไม่ทำงาน ให้เปิดการตั้งค่าบน iPhone เลือกแอป Dial การแจ้งเตือน แล้วยืนยันว่าอนุญาตการแจ้งเตือน คุณแก้หรือปิดตารางใน Dial ได้ทุกเมื่อ"
  records_h: "บันทึกบนอุปกรณ์ Apple"
  records_p: "Dial เก็บบันทึกยาในฐาน CloudKit ส่วนตัวที่ผูกกับบัญชี Apple ของคุณได้ ยืนยันว่าอุปกรณ์ทั้งสองใช้บัญชี Apple เดียวกัน เปิด iCloud อยู่ และเปิด Sync with iCloud ในการตั้งค่า Dial รายการน้ำหนักยังคงอยู่ในเครื่องแต่ละเครื่อง"
  health_name: "สุขภาพ"
  health_p: "การเข้าถึงน้ำหนักตัวเป็นทางเลือก คุณตรวจหรือเพิกถอนได้ในแอปสุขภาพ ภายใต้โปรไฟล์ แอป Dial หรือที่ตั้งค่า &gt; สุขภาพ Dial ไม่อ่านหรือเขียนหมวดข้อมูลอื่นในสุขภาพ"
  privacy_h: "ความเป็นส่วนตัวและข้อมูลทางการแพทย์"
  privacy_before: "อ่าน"
  privacy_link: "นโยบายความเป็นส่วนตัวของ Dial"
  privacy_after: "สำหรับรายละเอียดการจัดเก็บ Dial เป็นเครื่องมือสมุดบันทึก ไม่ใช่อุปกรณ์การแพทย์ และการสนับสนุนไม่ตอบคำถามเรื่องยา ขนาดยา ผลข้างเคียง หรือการรักษา สำหรับคำแนะนำทางการแพทย์ให้ติดต่อผู้สั่งยา"
  overview_url: "/th/dial/"
  privacy_url: "/th/dial/privacy/"

tr:
  h1: "Destek"
  overview_link: "Dial hakkında daha fazla"
  overview_rest: "veya aşağıdaki yönergeleri kullanın."
  email_lead: "Dial yardımı için yazın"
  email_body: "iPhone modelini, iOS sürümünü, Dial sürümünü ve soruna yol açan adımları belirtin. Paylaşmak istemediğiniz ilaç veya sağlık ayrıntılarını eklemeyin."
  notifications_h: "Bildirimler"
  notifications_p: "Dial anımsatıcıları isteğe bağlı yerel bildirimlerdir. Bir anımsatıcı çalışmazsa iPhone'da Ayarlar'ı açın, Uygulamalar, Dial, Bildirimler'i seçin ve bildirimlerin izinli olduğunu doğrulayın. Programları Dial içinde istediğiniz zaman düzenleyebilir veya kapatabilirsiniz."
  records_h: "Apple aygıtlarındaki kayıtlar"
  records_p: "Dial, ilaç kayıtlarını Apple hesabınıza bağlı özel CloudKit veritabanında saklayabilir. Her iki aygıtın aynı Apple hesabını kullandığını, iCloud'un açık olduğunu ve Dial Ayarlarında Sync with iCloud'un açık olduğunu doğrulayın. Kilo girdileri her aygıtta yerel kalır."
  health_name: "Sağlık"
  health_p: "Vücut ağırlığına erişim isteğe bağlıdır. Sağlık uygulamasında profil, Uygulamalar, Dial altında inceleyebilir veya geri alabilirsiniz. Dial Sağlık'taki diğer veri kategorilerini okumaz veya yazmaz."
  privacy_h: "Gizlilik ve tıbbi bilgi"
  privacy_before: "Depolama ayrıntıları için"
  privacy_link: "Dial gizlilik politikasını"
  privacy_after: "okuyun. Dial bir günlük aracıdır, tıbbi cihaz değildir ve destek ilaç, doz, yan etki veya tedavi sorularına yanıt vermez. Tıbbi yönlendirme için hekiminize başvurun."
  overview_url: "/tr/dial/"
  privacy_url: "/tr/dial/privacy/"

uk:
  h1: "Підтримка"
  overview_link: "Більше про Dial"
  overview_rest: "або скористайтеся вказівками нижче."
  email_lead: "Допомогу щодо Dial пишіть на"
  email_body: "Вкажіть модель iPhone, версію iOS, версію Dial і кроки, що призвели до проблеми. Не додавайте відомості про препарати чи здоров’я, якими не хочете ділитися."
  notifications_h: "Сповіщення"
  notifications_p: "Нагадування Dial є необов’язковими локальними сповіщеннями. Якщо нагадування не спрацьовує, відкрийте Параметри на iPhone, виберіть Програми, Dial, Сповіщення і переконайтеся, що сповіщення дозволені. Розклади в Dial можна змінювати або вимикати будь-коли."
  records_h: "Записи на пристроях Apple"
  records_p: "Dial може зберігати записи препаратів у приватній базі CloudKit, прив’язаній до вашого облікового запису Apple. Переконайтеся, що обидва пристрої використовують той самий обліковий запис Apple, iCloud увімкнено, і Sync with iCloud увімкнено в параметрах Dial. Записи ваги лишаються локальними на кожному пристрої."
  health_name: "Здоров’я"
  health_p: "Доступ до маси тіла необов’язковий. Його можна перевірити або відкликати в застосунку Здоров’я в профілі, Програми, Dial. Dial не читає і не записує інших категорій даних у Здоров’ї."
  privacy_h: "Конфіденційність і медична інформація"
  privacy_before: "Прочитайте"
  privacy_link: "політику конфіденційності Dial"
  privacy_after: "про зберігання. Dial є інструментом щоденника, не медичним виробом, і підтримка не відповідає на запитання про препарати, дозування, побічні ефекти чи лікування. За медичною консультацією зверніться до лікаря."
  overview_url: "/uk/dial/"
  privacy_url: "/uk/dial/privacy/"

vi:
  h1: "Hỗ trợ"
  overview_link: "Thêm về Dial"
  overview_rest: "hoặc dùng hướng dẫn bên dưới."
  email_lead: "Trợ giúp Dial gửi tới"
  email_body: "Ghi mẫu iPhone, phiên bản iOS, phiên bản Dial và các bước dẫn đến sự cố. Đừng kèm chi tiết thuốc hoặc sức khỏe bạn không muốn chia sẻ."
  notifications_h: "Thông báo"
  notifications_p: "Lời nhắc Dial là thông báo trên máy, tùy chọn. Nếu lời nhắc không hiện, mở Cài đặt trên iPhone, chọn Ứng dụng, Dial, Thông báo và xác nhận thông báo được phép. Bạn có thể sửa hoặc tắt lịch trong Dial bất cứ lúc nào."
  records_h: "Bản ghi trên thiết bị Apple"
  records_p: "Dial có thể lưu bản ghi thuốc trong cơ sở dữ liệu CloudKit riêng gắn với Tài khoản Apple của bạn. Xác nhận cả hai thiết bị dùng cùng Tài khoản Apple, iCloud đang bật, và Sync with iCloud đang bật trong cài đặt Dial. Mục cân nặng vẫn chỉ ở trên từng thiết bị."
  health_name: "Sức khoẻ"
  health_p: "Quyền truy cập cân nặng cơ thể là tùy chọn. Bạn có thể xem hoặc thu hồi trong ứng dụng Sức khoẻ dưới hồ sơ, Ứng dụng, Dial. Dial không đọc hay ghi danh mục dữ liệu Sức khoẻ khác."
  privacy_h: "Quyền riêng tư và thông tin y tế"
  privacy_before: "Đọc"
  privacy_link: "chính sách quyền riêng tư Dial"
  privacy_after: "về lưu trữ. Dial là công cụ nhật ký, không phải thiết bị y tế, và hỗ trợ không trả lời câu hỏi về thuốc, liều, tác dụng phụ hay điều trị. Để hướng dẫn y tế, liên hệ bác sĩ kê đơn."
  overview_url: "/vi/dial/"
  privacy_url: "/vi/dial/privacy/"

zh:
  h1: "支持"
  overview_link: "了解 Dial"
  overview_rest: "或使用下面的说明。"
  email_lead: "Dial 使用问题请发至"
  email_body: "请写明 iPhone 型号、iOS 版本、Dial 版本以及导致问题的步骤。不要附上您不想分享的药物或健康细节。"
  notifications_h: "通知"
  notifications_p: "Dial 提醒是可选的本地通知。如果提醒未触发，请在 iPhone 上打开设置，依次进入应用、Dial、通知，并确认已允许通知。可随时在 Dial 中编辑或关闭计划。"
  records_h: "Apple 设备上的记录"
  records_p: "Dial 可将药物记录保存在绑定到您 Apple 账户的私人 CloudKit 数据库中。请确认两台设备使用同一 Apple 账户、已打开 iCloud，并在 Dial 设置中打开了 Sync with iCloud。体重条目在每台设备上保持本地。"
  health_name: "健康"
  health_p: "体重访问可选。可在健康应用的个人资料、应用、Dial 下查看或撤销。Dial 不读取或写入健康中的其他数据类别。"
  privacy_h: "隐私与医疗信息"
  privacy_before: "阅读"
  privacy_link: "Dial 隐私政策"
  privacy_after: "以了解存储细节。Dial 是日记工具，不是医疗器械，支持不回答关于药物、剂量、副作用或治疗的问题。医疗指导请联系医生。"
  overview_url: "/zh/dial/"
  privacy_url: "/zh/dial/privacy/"

zh-hant:
  h1: "支援"
  overview_link: "更多關於 Dial"
  overview_rest: "或使用下面的說明。"
  email_lead: "Dial 協助請寄至"
  email_body: "請寫明 iPhone 機型、iOS 版本、Dial 版本以及導致問題的步驟。不要附上你不想分享的藥物或健康細節。"
  notifications_h: "通知"
  notifications_p: "Dial 提醒是可選的本機通知。如果提醒未觸發，請在 iPhone 上打開設定，選擇 App、Dial、通知，並確認已允許通知。可隨時在 Dial 中編輯或關閉計畫。"
  records_h: "Apple 裝置上的紀錄"
  records_p: "Dial 可將藥物紀錄儲存在綁定到你 Apple 帳號的私人 CloudKit 資料庫中。請確認兩台裝置使用同一 Apple 帳號、已打開 iCloud，並在 Dial 設定中打開了 Sync with iCloud。體重項目在每台裝置上保持本機。"
  health_name: "健康"
  health_p: "體重存取可選。可在健康 App 的個人檔案、App、Dial 下查看或撤銷。Dial 不讀取或寫入健康中的其他資料類別。"
  privacy_h: "隱私與醫療資訊"
  privacy_before: "閱讀"
  privacy_link: "Dial 隱私權政策"
  privacy_after: "以了解儲存細節。Dial 是日記工具，不是醫療器材，支援不回答關於藥物、劑量、副作用或治療的問題。醫療指導請聯絡醫生。"
  overview_url: "/zh-hant/dial/"
  privacy_url: "/zh-hant/dial/privacy/"
