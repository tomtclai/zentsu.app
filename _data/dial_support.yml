  records_p: "Dial može spremati zapise lijekova u privatnu CloudKit bazu povezanu s vašim Apple računom. Potvrdite da oba uređaja koriste isti Apple račun, imaju uključen iCloud i imaju Sync with iCloud uključeno u postavkama Diala. Unosi težine ostaju lokalni na svakom uređaju."
  health_name: "Zdravlje"
  health_p: "Pristup tjelesnoj težini je neobavezan. Možete ga pregledati ili opozvati u aplikaciji Zdravlje pod profilom, Aplikacije, Dial. Dial ne čita niti piše druge kategorije podataka u Zdravlju."
  privacy_h: "Privatnost i medicinske informacije"
