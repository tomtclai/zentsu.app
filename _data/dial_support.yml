  privacy_after: "za pojedinosti o pohrani. Dial je alat dnevnika, nije medicinski proizvod, a podrška ne odgovara na pitanja o lijekovima, doziranju, nuspojavama ili liječenju. Za medicinsko vodstvo obratite se propisivaču."
