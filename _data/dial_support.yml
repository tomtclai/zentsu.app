  health_name: "Kesihatan"
  health_p: "Akses berat badan adalah pilihan. Anda boleh semak atau tarik balik dalam app Kesihatan di bawah profil, App, Dial. Dial tidak membaca atau menulis kategori data Kesihatan lain."
