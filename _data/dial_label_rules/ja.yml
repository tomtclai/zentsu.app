        text: 次回投与までの期間が2日間（48時間）以上であれば、気づいた時点で直ちに投与し、その後はあらかじめ定めた曜日に投与する。2日間（48時間）未満であれば投与せず、次のあらかじめ定めた曜日に投与する。
        section: （7.3）
      change_day:
        text: 定めた曜日を変更する必要がある場合は、前回投与から少なくとも3日間（72時間）以上の間隔を空ける。
        section: （7.3）
      rotation:
        text: 皮下注射は腹部、大腿、上腕に行う。注射箇所は毎回変更し、少なくとも前回の注射箇所より2～3cm離す。
        section: （14.2.1）
      storage:
        text: 凍結を避け、2～8℃に保存する（有効期間24ヵ月）。個装箱などで遮光し、凍結を避けて冷蔵庫（2～8℃）に保管する。室温で保管する場合の記載はない。
        section: （貯法・有効期間、20.）
      site_reaction:
        text: 「全身障害及び投与部位状態」の行の「1～5%未満」の列に「注射部位反応」。同じ列に疲労、無力症、早期満腹。
        section: （11.2）
