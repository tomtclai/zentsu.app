  - name: マンジャロ皮下注アテオス（チルゼパチド）
    source_url: https://www.pmda.go.jp/PmdaSearch/iyakuDetail/530471_2499422G1024_1_11
    source_revised: 2026年9月改訂（第11版）
    rules:
      missed_dose:
        text: 次回投与までの期間が3日間（72時間）以上であれば、気づいた時点で直ちに投与し、その後はあらかじめ定めた曜日に投与する。3日間（72時間）未満であれば投与せず、次のあらかじめ定めた曜日に投与する。
        section: （7.2）
      change_day:
        text: 曜日を変更する必要がある場合は、前回投与から少なくとも3日間（72時間）以上の間隔を空ける。
        section: （7.2）
      rotation:
        text: 皮下注射は腹部、大腿部又は上腕部に行う。同じ部位の中で注射する場合、毎回注射する場所を変更する。
        section: （14.2）
      storage:
        text: 2～8℃で保存する（有効期間24ヵ月）。凍結を避けて遮光し、凍結した場合は使用しない。室温で保存する場合は、30℃を超えない場所で外箱から出さずに保存し、21日以内に使用する。
        section: （貯法・有効期間、20.1、20.2）
      site_reaction:
        text: 「注射部位」の行の「1～5%未満」の列に「注射部位反応(紅斑、そう痒感、疼痛、腫脹等)」。
        section: （11.2）
