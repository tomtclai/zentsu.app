products:
  - name: 猛健樂筆 Mounjaro KwikPen（衛部藥輸字第028800號）
    source_url: https://mcp.fda.gov.tw/im_detail_1/%E8%A1%9B%E9%83%A8%E8%97%A5%E8%BC%B8%E5%AD%97%E7%AC%AC028800%E8%99%9F
    source_revised: 第5版，2026年9月23日更新，2026年11月24日查閱
    rules:
      missed_dose:
        text: 錯過一劑時，在漏打後 4 天（96 小時）內盡快注射。已超過 4 天，就跳過這一劑，下一劑在原本預定的日期注射。兩種情況都回到原本每週一次的時程。
        section: （第 3.1 節「用法用量」，第 14 節「病人使用須知」再寫一次）
      change_day:
        text: 有必要時可以更改每週注射的日期，條件是兩劑之間至少間隔 3 天（72 小時）。
        section: （第 3.1 節「用法用量」）
      storage:
        text: 效期依外包裝標示。存放在 2°C 至 8°C 的冰箱。多劑量注射筆 KwikPen 可放在最高 30°C 的室溫下，最長 30 天。不可冷凍，結凍過就不要使用。放在原包裝盒中避光。
        section: （第 13.2 節「效期」、第 13.3 節「儲存條件」）
      site_reaction:
        text: 第 8.2 節表 3（體重控制試驗 1 和試驗 2）列出「注射部位反應」，MOUNJARO 各劑量組為 6% 至 8%，安慰劑組為 2%。註腳說明這一項包括注射部位瘀青、紅斑、搔癢、疼痛、紅疹等術語。同一節的「注射部位反應」一段寫到，第二型糖尿病的安慰劑對照試驗中，MOUNJARO 組通報 3.2%，安慰劑組 0.4%。
        section: （第 8.2 節「臨床試驗經驗」表 3 與「注射部位反應」一段）
