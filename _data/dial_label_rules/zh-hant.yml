  - name: 週纖達單劑量預充填注射筆 Wegovy（衛部菌疫輸字第001219號）
    source_url: https://mcp.fda.gov.tw/im_detail_1/%E8%A1%9B%E9%83%A8%E8%8F%8C%E7%96%AB%E8%BC%B8%E5%AD%97%E7%AC%AC001219%E8%99%9F
    source_revised: 第14版，2026年5月5日更新，2026年11月19日查閱
    rules:
      missed_dose:
        text: 錯過一劑時，在 5 天內盡快注射。超過 5 天就跳過，依原訂時程注射下一劑，之後回到每週一次的時程。同一段另有一句，談的是錯過更多劑量後重新開始時的起始劑量。
        section: （第 3.1 節「用法用量」中的「錯過劑量」）
      change_day:
        text: 必要時可以變更每週注射的日期，但兩次注射至少間隔 3 天（超過 72 小時）。選定新的注射日之後，繼續每週注射一次。
        section: （第 3.1 節「用法用量」中的「給藥方式」）
