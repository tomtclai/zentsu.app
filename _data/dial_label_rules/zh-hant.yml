  - name: 週纖達單劑量預充填注射筆 Wegovy（衛部菌疫輸字第001219號）
    source_url: https://mcp.fda.gov.tw/im_detail_1/%E8%A1%9B%E9%83%A8%E8%8F%8C%E7%96%AB%E8%BC%B8%E5%AD%97%E7%AC%AC001219%E8%99%9F
    source_revised: 第14版，2026年5月5日更新，2026年11月24日查閱
    rules:
      missed_dose:
        text: 錯過一劑時，在 5 天內盡快注射。超過 5 天就跳過，依原訂時程注射下一劑，之後回到每週一次的時程。同一段另有一句，談的是錯過更多劑量後重新開始時的起始劑量。
        section: （第 3.1 節「用法用量」中的「錯過劑量」）
      change_day:
        text: 必要時可以變更每週注射的日期，但兩次注射至少間隔 3 天（超過 72 小時）。選定新的注射日之後，繼續每週注射一次。
        section: （第 3.1 節「用法用量」中的「給藥方式」）
      storage:
        text: 效期 2 年。冰箱冷藏（2°C 至 8°C），避免接觸冷卻元件。可以不冷藏，在不超過 30°C 的溫度下避光保存，最長 28 天。注射筆照到光、存放溫度超過 30°C、離開冰箱超過 28 天或冷凍過，就丟棄。不可冷凍，也不可使用冷凍過的藥。放在原外盒中避光。
        section: （第 13.2 節「效期」、第 13.3 節「儲存條件」、第 13.4 節「儲存注意事項」）
      site_reaction:
        text: 第 8.1 節表 3 把「注射部位反應」列為常見（1/100 以上、未達 1/10），歸在「全身性異常及施用部位症狀」。同一節的特定不良反應說明寫到，臨床試驗中週纖達組有 1.4%、安慰劑組有 1.0% 發生注射部位反應，包括注射部位搔癢、紅斑、發炎、硬結和刺激。
        section: （第 8.1 節「臨床重要副作用/不良反應」表 3 與「特定不良反應之說明」）
  - name: 週纖達諾特筆 Wegovy FlexTouch（衛部菌疫輸字第001225號）
    source_url: https://mcp.fda.gov.tw/im_detail_1/%E8%A1%9B%E9%83%A8%E8%8F%8C%E7%96%AB%E8%BC%B8%E5%AD%97%E7%AC%AC001225%E8%99%9F
    source_revised: 第16版，2026年9月22日更新，2026年11月24日查閱
    rules:
      missed_dose:
        text: 錯過一劑時，在 5 天內盡快注射。超過 5 天就跳過，依原訂時程注射下一劑，之後回到每週一次的時程。同一段另有一句，談的是錯過更多劑量後重新開始時的起始劑量。
        section: （第 3.1 節「用法用量」中的「錯過劑量」）
      change_day:
        text: 必要時可以變更每週注射的日期，但兩次注射至少間隔 3 天（超過 72 小時）。選定新的注射日之後，繼續每週注射一次。
        section: （第 3.1 節「用法用量」中的「給藥方式」）
      storage:
        text: 效期 3 年。初次使用前冰箱冷藏（2°C 至 8°C），避免接觸冷卻元件。初次使用後，使用中的保存期限為 6 週，存放在 30°C 以下或冰箱冷藏（2°C 至 8°C）。不可冷凍，也不可使用冷凍過的藥。使用後套回筆蓋避光。每次注射後取下針頭，存放時不裝針頭。
        section: （第 13.2 節「效期」、第 13.3 節「儲存條件」、第 13.4 節「儲存注意事項」）
      site_reaction:
        text: 第 8.1 節表 3 把「注射部位反應」列為常見（1/100 以上、未達 1/10），歸在「全身性異常及施用部位症狀」。同一節的特定不良反應說明寫到，臨床試驗中週纖達組有 1.4%、安慰劑組有 1.0% 發生注射部位反應，包括注射部位搔癢、紅斑、發炎、硬結和刺激。
        section: （第 8.1 節「臨床重要副作用/不良反應」表 3 與「特定不良反應之說明」）
  - name: 胰妥讚注射劑 Ozempic（衛部菌疫輸字第001107號）
    source_url: https://mcp.fda.gov.tw/im_detail_1/%E8%A1%9B%E9%83%A8%E8%8F%8C%E7%96%AB%E8%BC%B8%E5%AD%97%E7%AC%AC001107%E8%99%9F
    source_revised: 第12版，2026年1月28日更新，2026年11月24日查閱
    rules:
      missed_dose:
        text: 錯過一劑時，在 5 天內盡快注射。超過 5 天就跳過，依原訂時程注射下一劑，之後回到每週一次的時程。
        section: （第 3.1 節「用法用量」）
      change_day:
        text: 必要時可以改變每週注射的日期，但兩次注射之間至少相隔 3 天（超過 72 小時）。選定新的注射日之後，繼續每週注射一次。
        section: （第 3.1 節「用法用量」中的「改變注射日」）
      storage:
        text: 初次使用前的效期 3 年，使用中的保存期限 6 週。初次使用前冰箱冷藏（2°C 至 8°C），避免接觸冷卻元件。初次使用後存放在 30°C 以下或冰箱冷藏（2°C 至 8°C）。不可冷凍，冷凍過就不要使用。套著注射筆蓋避光。每次注射後取下針頭，存放時不裝針頭。
        section: （第 13.2 節「效期」、第 13.3 節「儲存條件」、第 13.4 節「儲存注意事項」、第 14 節「病人使用須知」）
      site_reaction:
        text: 第 8.1 節表 1 把「注射部位反應」列為少見（1/1,000 以上、未達 1/100），歸在「一般不適及投與部位症狀」。同一節的特定不良反應說明寫到，兩個劑量組通報注射部位反應（例如注射部位皮疹、紅斑）的比例為 0.6% 和 0.5%，症狀通常很輕微。
        section: （第 8.1 節「臨床重要副作用/不良反應」表 1 與「特定不良反應之說明」）
