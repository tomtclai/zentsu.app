products:
  - name: 위고비프리필드펜 (세마글루티드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202301384
    source_revised: 2026년 10월 7일 변경, 2026년 11월 24일 열람
    rules:
      missed_dose:
        text: "투여를 잊은 날로부터 5일 이내면 가능한 빨리 투여하고, 5일을 넘겼으면 잊은 투여는 건너뛰고 정기적으로 예정된 일자에 투여한다고 적혀 있습니다. 두 경우 모두 본래의 주 1회 용량으로 투여를 재개할 수 있다고 덧붙입니다."
        section: (용법·용량, 투여를 잊은 경우)
      change_day:
        text: "직전 투여와 다음 투여의 간격이 최소 3일(72시간 초과)이면 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 투여방법)
      rotation:
        text: "복부, 대퇴부 또는 상완부에 피하주사합니다. '주사 부위는 바뀔 수 있다'"
        section: (용법·용량, 투여방법)
      storage:
        text: "처음 사용하기 전에는 냉장(2℃-8℃) 보관하고, 냉각제로부터 멀리 두며, 얼지 않도록 한다고 적혀 있습니다. 처음 개봉한 뒤에는 30℃ 이하 또는 냉장(2℃-8℃)에서 최대 6주 동안 보관할 수 있고, 빛을 막기 위해 펜 뚜껑을 닫아 둡니다. 얼었을 경우 사용하지 않는다고 덧붙입니다."
        section: (11. 보관 및 취급상의 주의사항, 10. 적용상의 주의)
      site_reaction:
        text: "'주사 부위 반응'을 흔하게(1/100 이상, 1/10 미만) 나타나는 약물이상반응으로 적고, 여러 용어를 묶은 그룹화된 대표 용어라고 표시합니다. 빈도는 제3a상 임상시험 풀에 근거한다고 적혀 있습니다."
        section: (3. 이상사례, 표 3)
  - name: 오젬픽프리필드펜 (세마글루티드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202201737
    source_revised: 2026년 10월 7일 변경, 2026년 11월 24일 열람
    rules:
      missed_dose:
        text: "투여 예정일로부터 5일 이내면 가능한 빨리 투여하고, 5일을 넘겼으면 놓친 용량은 건너뛰고 다음 용량을 정기적으로 예정된 날에 투여한다고 적혀 있습니다."
        section: (용법·용량, 투여를 잊은 경우)
      change_day:
        text: "직전 투여와 다음 투여의 간격이 최소 3일 이상(72시간 초과)이면 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 투여 요일을 변경하고자 하는 경우)
      rotation:
        text: "복부, 대퇴부, 상완부에 피하주사합니다. '주사 부위는 용량 조절 없이 바뀔 수 있다'"
        section: (용법·용량, 투여방법)
      storage:
        text: "냉장(2℃-8℃) 보관하고, 냉각제로부터 멀리 두며, 얼지 않도록 한다고 적혀 있습니다. 처음 개봉한 뒤에는 30℃ 이하 또는 냉장(2℃-8℃)에서 최대 6주 동안 보관할 수 있고, 빛을 막기 위해 펜 뚜껑을 닫아 둡니다. 얼었을 경우 사용하지 않는다고 덧붙입니다."
        section: (12. 보관 및 취급상의 주의 사항, 11. 적용상의 주의)
      site_reaction:
        text: "'주사 부위 반응'을 흔하지 않게(1/1,000 이상, 1/100 미만) 나타나는 약물이상반응으로 적습니다. 주사 부위 반응(예: 주사 부위 발진, 홍반)은 0.5 mg과 1 mg 투여 환자에서 각각 0.6%와 0.5% 보고되었고, 대체로 경증이었다고 적혀 있습니다."
        section: (4. 이상사례, 표 1과 ⑦ 주사 부위 반응)
  - name: 마운자로퀵펜주 (터제파타이드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202502333
    source_revised: 2026년 4월 30일 변경, 2026년 11월 24일 열람
    rules:
      missed_dose:
        text: "누락된 투여 이후 4일(96시간) 이내면 가능한 한 빨리 투여하고, 4일이 넘게 지났으면 누락된 투여를 건너뛰고 정해진 날짜에 다음 투여분을 투여한다고 적혀 있습니다. 어느 경우든 이후 주 1회 투여 일정을 다시 이어갈 수 있다고 덧붙입니다."
        section: (용법·용량, 1. 용량)
      change_day:
        text: "두 투여일 사이의 시간이 최소 3일(72시간) 이상이면 주간 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 1. 용량)
      rotation:
        text: "복부, 대퇴부에 피하주사하고, 상완부 뒤쪽은 다른 사람이 주사합니다. '매 투여 시마다 주사 부위를 바꿔가며 투여한다'"
        section: (용법·용량, 4. 투여 방법)
      storage:
        text: "2~8°C에 냉장 보관한다고 적혀 있습니다. 처음 개봉한 뒤에는 냉장하지 않고 30℃를 넘지 않는 실온에서 30일까지 보관할 수 있고, 처음 개봉하고 30일이 지나면 폐기합니다. 냉동하지 않고, 냉동된 경우 사용하지 않으며, 빛을 막기 위해 원래의 상자에 담아 보관합니다."
        section: (11. 보관 및 취급상의 주의사항)
      site_reaction:
        text: "제2형 당뇨병 임상시험 자료에서 '주사 부위 반응'을 흔하게 나타나는 이상반응으로 적습니다. 위약 대조 3상 시험에서 위약 0.4%, 이 약 3.2%였고, 가장 흔한 징후와 증상은 홍반과 가려움증, 최대 중증도는 경증(90%) 또는 중등증(10%)이었으며 중대한 주사 부위 반응은 없었다고 적혀 있습니다. 비만 또는 과체중 임상시험 표에서는 이 약 7.95%(2,806명 중 223명), 위약 1.84%(1,250명 중 23명)입니다."
        section: (4. 약물이상반응)
