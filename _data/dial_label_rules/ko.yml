products:
  - name: 위고비프리필드펜 (세마글루티드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202301384
    source_revised: 2026년 10월 7일 변경, 2026년 11월 19일 열람
    rules:
      missed_dose:
        text: "투여를 잊은 날로부터 5일 이내면 가능한 빨리 투여하고, 5일을 넘겼으면 잊은 투여는 건너뛰고 정기적으로 예정된 일자에 투여한다고 적혀 있습니다. 두 경우 모두 본래의 주 1회 용량으로 투여를 재개할 수 있다고 덧붙입니다."
        section: (용법·용량, 투여를 잊은 경우)
      change_day:
        text: "직전 투여와 다음 투여의 간격이 최소 3일(72시간 초과)이면 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 투여방법)
      rotation:
        text: "복부, 대퇴부 또는 상완부에 피하주사합니다. '주사 부위는 바뀔 수 있다'"
        section: (용법·용량, 투여방법)
  - name: 오젬픽프리필드펜 (세마글루티드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202201737
    source_revised: 2026년 10월 7일 변경, 2026년 11월 19일 열람
    rules:
      missed_dose:
        text: "투여 예정일로부터 5일 이내면 가능한 빨리 투여하고, 5일을 넘겼으면 놓친 용량은 건너뛰고 다음 용량을 정기적으로 예정된 날에 투여한다고 적혀 있습니다."
        section: (용법·용량, 투여를 잊은 경우)
      change_day:
        text: "직전 투여와 다음 투여의 간격이 최소 3일 이상(72시간 초과)이면 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 투여 요일을 변경하고자 하는 경우)
      rotation:
        text: "복부, 대퇴부, 상완부에 피하주사합니다. '주사 부위는 용량 조절 없이 바뀔 수 있다'"
        section: (용법·용량, 투여방법)
  - name: 마운자로퀵펜주 (터제파타이드)
    source_url: https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=202502333
    source_revised: 2026년 4월 30일 변경, 2026년 11월 19일 열람
    rules:
      missed_dose:
        text: "누락된 투여 이후 4일(96시간) 이내면 가능한 한 빨리 투여하고, 4일이 넘게 지났으면 누락된 투여를 건너뛰고 정해진 날짜에 다음 투여분을 투여한다고 적혀 있습니다. 어느 경우든 이후 주 1회 투여 일정을 다시 이어갈 수 있다고 덧붙입니다."
        section: (용법·용량, 1. 용량)
      change_day:
        text: "두 투여일 사이의 시간이 최소 3일(72시간) 이상이면 주간 투여 요일을 바꿀 수 있고, 새 요일을 정한 뒤에는 주 1회 투여를 계속한다고 적혀 있습니다."
        section: (용법·용량, 1. 용량)
      rotation:
        text: "복부, 대퇴부에 피하주사하고, 상완부 뒤쪽은 다른 사람이 주사합니다. '매 투여 시마다 주사 부위를 바꿔가며 투여한다'"
        section: (용법·용량, 4. 투여 방법)
