# Primary App Store territory for each Dial marketing page, plus the
# customer-facing price note. A page default is not the visitor's Apple
# Account storefront. Edit this file when adding a locale or regional page.
# Amounts come from live ASC via `npm run sync:dial-prices`.

en:
  territory: USA
  note: "Subscriptions renew until canceled. Prices are from the U.S. App Store. Your Apple Account region determines checkout prices."

