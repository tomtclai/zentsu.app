# Dial record-keeping guides. `byline` holds the visible author and date
# labels for each guide language. `links` lists the guides the Dial footer
# shows for that page language; languages without a list fall back to `en`.

en:
  byline:
    by: By
    published: Published
    reviewed: Reviewed against the labels
    date_format: '%B %-d, %Y'
  sources:
    after_name: '. '
    between: ', '
    end: '.'
  links:
    - url: /dial/printable-dose-log/
      title: Printable dose log
    - url: /dial/injection-site-rotation/
      title: Injection-site rotation chart

